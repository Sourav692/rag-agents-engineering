<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
  <title id="t">Cosine, dot product and Euclidean distance on one pair of vectors</title>
  <desc id="d">A question vector of length 1 at 30 degrees and a chunk vector at 60 degrees, drawn at length 1 and stretched to length 1.5. The angle between them is the same at both lengths, so cosine stays 0.866. The dot product is the length of the chunk's projection onto the question, 0.866 at length 1 and 1.299 at length 1.5. Euclidean distance is the gap between the two tips, 0.518 at length 1 and 0.807 at length 1.5.</desc>
  <defs>
    <marker id="h-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#060e15"/></marker>
    <marker id="h-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b434b"/></marker>
  </defs>
  <rect width="760" height="400" fill="#e5eaef"/>
  <g font-family="Hanken Grotesk, ui-sans-serif, system-ui, sans-serif">
    <!-- axes -->
    <path d="M60 360 H350 M60 360 V60" stroke="#a1a9af" stroke-width="1"/>
    <!-- the question's line, extended, so both projections land on it -->
    <path d="M233.2 260 L311.1 215" stroke="#a1a9af" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- angle -->
    <path d="M112 330 A60 60 0 0 0 90 308" fill="none" stroke="#3b434b" stroke-width="1.5"/>
    <text x="118" y="316" font-size="15" fill="#182027">θ</text>
    <!-- projections: the dot product -->
    <path d="M160 186.8 L210 273.4" stroke="#970d63" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M210 100.2 L285 230.1" stroke="#970d63" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M60 360 L285 230.1" stroke="#970d63" stroke-width="6" stroke-opacity="0.28"/>
    <circle cx="210" cy="273.4" r="4" fill="#970d63"/>
    <circle cx="285" cy="230.1" r="4" fill="#970d63"/>
    <!-- Euclidean gaps -->
    <path d="M233.2 260 L160 186.8" stroke="#182027" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <path d="M233.2 260 L210 100.2" stroke="#182027" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <!-- vectors -->
    <path d="M60 360 L209 101.9" stroke="#3b434b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#h-mut)"/>
    <path d="M60 360 L159 188.5" stroke="#3b434b" stroke-width="2.5" marker-end="url(#h-mut)"/>
    <path d="M60 360 L231.5 261" stroke="#060e15" stroke-width="3" marker-end="url(#h-ink)"/>
    <text x="242" y="268" font-size="15" font-weight="600" fill="#060e15">question</text>
    <text x="104" y="180" font-size="15" fill="#182027">chunk</text>
    <text x="152" y="92" font-size="15" fill="#182027">chunk × 1.5</text>
    <text x="216" y="300" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#970d63">0.866</text>
    <text x="292" y="250" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#970d63">1.299</text>
    <text x="60" y="384" font-size="13" fill="#3b434b">origin</text>
    <!-- key -->
    <g transform="translate(400 70)">
      <text x="0" y="0" font-size="17" font-weight="600" fill="#060e15">Length 1, then length 1.5</text>
      <text x="0" y="44" font-size="15" font-weight="600" fill="#060e15">Cosine: the angle θ only</text>
      <text x="0" y="66" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#182027">0.866, then 0.866</text>
      <text x="0" y="110" font-size="15" font-weight="600" fill="#970d63">Dot: the projection onto the question</text>
      <text x="0" y="132" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#182027">0.866, then 1.299</text>
      <text x="0" y="176" font-size="15" font-weight="600" fill="#060e15">Euclidean: the gap between the tips</text>
      <text x="0" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#182027">0.518, then 0.807</text>
      <text x="0" y="246" font-size="14" fill="#3b434b">Stretching the chunk raises its dot product</text>
      <text x="0" y="266" font-size="14" fill="#3b434b">and pushes it further away by distance.</text>
      <text x="0" y="286" font-size="14" fill="#3b434b">Cosine does not move.</text>
    </g>
  </g>
</svg>
