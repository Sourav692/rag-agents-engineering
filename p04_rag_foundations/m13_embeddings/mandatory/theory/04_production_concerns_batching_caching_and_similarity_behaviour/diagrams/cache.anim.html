<!-- Animated version of the Embedding cache flowchart in ../README.md, used by index.html.
     The figures are the cache check on the page: 12 of 12 chunks sent on the first run, 0 of 12 on the second.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-cache-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The embedding cache, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 260" role="img" aria-labelledby="anim-cache-title anim-cache-desc">
      <title id="anim-cache-title">The embedding cache, a miss and then a hit</title>
      <desc id="anim-cache-desc">A chunk’s text becomes a key, the namespace plus a sha256 hash of the text. The first time, the key is not in the store, so the embedding model is called and billed, and the vector is written under the key. The second time, the same text gives the same key, the store has it, and the vector comes back without a model call. For the 12 Larkspur chunks, the first run sends 12 of 12 to the model and the second sends 0 of 12.</desc>
      <defs>
        <marker id="ah-cache" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1 n-6"><rect class="box" x="24" y="40" width="130" height="44"/><text class="label" x="89" y="62">Chunk text</text></g>
      <g class="n-2"><rect class="box" x="200" y="40" width="150" height="44"/><text class="label" x="275" y="62">Key</text></g>
      <g class="n-3 n-7">
        <path class="box" d="M460 30 L524 62 L460 94 L396 62 Z"/>
        <text class="small" x="460" y="62">In the store?</text>
      </g>
      <g class="n-7"><rect class="box" x="650" y="40" width="126" height="44"/><text class="label" x="713" y="62">Vector</text></g>
      <g class="n-4"><rect class="box" x="385" y="160" width="150" height="44"/><text class="label" x="460" y="182">Embedding model</text></g>
      <g class="n-5"><rect class="box" x="610" y="160" width="150" height="44"/><text class="label" x="685" y="182">Write to store</text></g>

      <path class="edge e-2 e-6" d="M154 62 H197" marker-end="url(#ah-cache)"/>
      <path class="edge e-3 e-6" d="M350 62 H393" marker-end="url(#ah-cache)"/>
      <path class="edge e-7" d="M524 62 H647" marker-end="url(#ah-cache)"/>
      <text class="small" x="586" y="50">yes</text>
      <path class="edge e-3 e-4" d="M460 94 V157" marker-end="url(#ah-cache)"/>
      <text class="small" x="478" y="126">no</text>
      <path class="edge e-5" d="M535 182 H607" marker-end="url(#ah-cache)"/>
      <path class="edge e-5" d="M713 160 V87" marker-end="url(#ah-cache)"/>

      <g class="in-2"><text class="fig" x="275" y="104">3-small:1536:</text><text class="fig" x="275" y="122">+ sha256(text)</text></g>
      <g class="in-4"><text class="small" x="460" y="224">billed</text></g>
      <g class="in-5"><text class="fig" x="685" y="224">run 1: 12 of 12 sent</text></g>
      <g class="in-7"><text class="fig" x="586" y="114">run 2: 0 of 12 sent</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-cache-cap">
    <li><button type="button" data-tok="24,40">Text</button><span>A chunk arrives for the first time.</span></li>
    <li><button type="button" data-tok="200,40">Key</button><span>Its key is the namespace, here the model and dimensions, followed by a sha256 hash of the text.</span></li>
    <li><button type="button" data-tok="396,30">Miss</button><span>The store has no such key.</span></li>
    <li><button type="button" data-tok="385,160">Embed</button><span>The embedding model is called, and the call is billed.</span></li>
    <li><button type="button" data-tok="610,160">Write</button><span>The vector is written under the key and returned. The first run over the 12 handbook chunks sends all 12 to the model.</span></li>
    <li><button type="button" data-tok="24,40">Again</button><span>The same text arrives again, from a re-run or an unchanged chunk.</span></li>
    <li><button type="button" data-tok="650,40">Hit</button><span>The same text gives the same key, so the vector comes back from the store. The second run sends 0 of 12.</span></li>
  </ol>
</figure>
