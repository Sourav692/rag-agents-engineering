<!-- Animated version of the Mental model flowchart in ../README.md, used by index-animated.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-lifecycle-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The RAG lifecycle, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-lifecycle-title anim-lifecycle-desc">
      <title id="anim-lifecycle-title">The RAG lifecycle</title>
      <desc id="anim-lifecycle-desc">Indexing phase: load, split, embed and store the handbook once. Query phase: a question retrieves the two nearest chunks from the index, they are added to the prompt, and the model answers with sources.</desc>
      <defs>
        <marker id="ah-lc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Indexing phase: once, offline</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">Query phase: every question</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- indexing -->
      <g class="n-1"><rect class="box" x="40" y="48" width="130" height="44"/><text class="label" x="105" y="70">Load</text></g>
      <g class="n-2"><rect class="box" x="225" y="48" width="130" height="44"/><text class="label" x="290" y="70">Split</text></g>
      <g class="n-3"><rect class="box" x="410" y="48" width="130" height="44"/><text class="label" x="475" y="70">Embed</text></g>
      <g class="n-4">
        <path class="box" d="M600 50 a80 10 0 0 0 160 0 v94 a80 10 0 0 1 -160 0 z"/>
        <ellipse class="box" cx="680" cy="50" rx="80" ry="10"/>
        <text class="label" x="680" y="80">Store</text>
      </g>
      <path class="edge e-2" d="M170 70 H222" marker-end="url(#ah-lc)"/>
      <path class="edge e-3" d="M355 70 H407" marker-end="url(#ah-lc)"/>
      <path class="edge e-4" d="M540 70 H597" marker-end="url(#ah-lc)"/>

      <g class="in-1">
        <rect class="doc" x="95" y="104" width="20" height="26"/>
        <path class="line" d="M99 112 H111 M99 118 H111 M99 124 H107"/>
        <text class="small" x="105" y="146">handbook</text>
      </g>
      <g class="in-2">
        <rect class="chunk" x="266" y="104" width="48" height="6"/><rect class="chunk" x="266" y="114" width="48" height="6"/>
        <rect class="chunk" x="266" y="124" width="48" height="6"/><rect class="chunk" x="266" y="134" width="48" height="6"/>
        <text class="small" x="290" y="152">chunks</text>
      </g>
      <g class="in-3">
        <circle class="vec" cx="445" cy="118" r="5"/><circle class="vec" cx="465" cy="118" r="5"/>
        <circle class="vec" cx="485" cy="118" r="5"/><circle class="vec" cx="505" cy="118" r="5"/>
        <text class="small" x="475" y="146">vectors</text>
      </g>
      <g class="in-4">
        <circle class="vec" cx="635" cy="104" r="5"/><circle class="vec" cx="665" cy="104" r="5"/>
        <circle class="vec" cx="695" cy="104" r="5"/><circle class="vec" cx="725" cy="104" r="5"/>
        <circle class="vec" cx="635" cy="124" r="5"/><circle class="vec" cx="665" cy="124" r="5"/>
        <circle class="vec" cx="695" cy="124" r="5"/><circle class="vec" cx="725" cy="124" r="5"/>
      </g>

      <!-- the index is the one thing the two phases share -->
      <path class="edge dashed e-6" d="M680 154 C680 176 254 176 254 225" marker-end="url(#ah-lc)"/>
      <text class="small" x="470" y="196">nearest neighbours</text>

      <!-- query -->
      <g class="n-5"><rect class="box" x="24" y="228" width="120" height="44"/><text class="label" x="84" y="250">Question</text></g>
      <g class="n-6"><rect class="box" x="184" y="228" width="140" height="44"/><text class="label" x="254" y="250">Retrieve top-k</text></g>
      <g class="n-7"><rect class="box" x="364" y="228" width="140" height="44"/><text class="label" x="434" y="250">Augment prompt</text></g>
      <g class="n-8"><rect class="box" x="544" y="228" width="120" height="44"/><text class="label" x="604" y="250">Generate</text></g>
      <g class="n-8"><rect class="box" x="694" y="228" width="90" height="44"/><text class="label" x="739" y="250">Answer</text></g>
      <path class="edge e-6" d="M144 250 H181" marker-end="url(#ah-lc)"/>
      <path class="edge e-7" d="M324 250 H361" marker-end="url(#ah-lc)"/>
      <path class="edge e-8" d="M504 250 H541" marker-end="url(#ah-lc)"/>
      <path class="edge e-8" d="M664 250 H691" marker-end="url(#ah-lc)"/>

      <g class="in-5">
        <rect class="doc" x="24" y="288" width="120" height="40"/>
        <text class="small" x="84" y="302">export my data</text>
        <text class="small" x="84" y="318">after I cancel?</text>
      </g>
      <g class="in-6">
        <circle class="hit" cx="665" cy="104" r="5"/><circle class="hit" cx="695" cy="124" r="5"/>
      </g>
      <g class="mv-6" style="--from: translate(430px, -180px)">
        <rect class="hit" x="230" y="292" width="48" height="8"/><rect class="hit" x="230" y="306" width="48" height="8"/>
        <text class="small" x="254" y="330">k = 2 chunks</text>
      </g>
      <g class="in-7">
        <rect class="doc" x="394" y="286" width="80" height="44"/>
        <path class="line" d="M402 296 H466"/>
        <path class="hit-line" d="M402 308 H458 M402 318 H462"/>
      </g>
      <g class="in-8">
        <rect class="doc" x="694" y="286" width="90" height="44"/>
        <path class="line" d="M702 298 H776 M702 308 H760"/>
        <text class="fig" x="739" y="321">[1] [2]</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-lifecycle-cap">
    <li><button type="button">Load</button><span>The loader reads the handbook into Documents.</span></li>
    <li><button type="button">Split</button><span>The splitter cuts each Document into chunks.</span></li>
    <li><button type="button">Embed</button><span>Each chunk becomes a vector.</span></li>
    <li><button type="button">Store</button><span>The vectors go into the index. Indexing ends here, and runs again only when the documents change.</span></li>
    <li><button type="button">Question</button><span>A customer asks “Can I export my data after I cancel my plan?”</span></li>
    <li><button type="button">Retrieve</button><span>The retriever scores every chunk in the index and returns the k = 2 nearest.</span></li>
    <li><button type="button">Augment</button><span>The two chunks and the question become one prompt.</span></li>
    <li><button type="button">Generate</button><span>The model answers from those chunks and cites them.</span></li>
  </ol>
</figure>
