<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     No figures: the steps show which prompt patterns each LLM step of a RAG pipeline is built from, on one Larkspur question.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-prompt-steps-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Every LLM step is a prompt, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 272" role="img" aria-labelledby="anim-prompt-steps-title anim-prompt-steps-desc">
      <title id="anim-prompt-steps-title">Every LLM step in a RAG pipeline is a prompt</title>
      <desc id="anim-prompt-steps-desc">A Larkspur customer asks whether a refund is possible after 45 days. A rewrite prompt built from a template and examples turns it into a search query. The retriever returns handbook chunks; it is the one step with no prompt. A few-shot grading prompt labels each chunk yes or no. A generation prompt with a persona and a reasoning cue answers from the chunks graded yes, with a citation.</desc>
      <defs>
        <marker id="ah-ps" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">LLM steps are prompts; retrieval is not</text>
      <rect class="lane" x="8" y="28" width="784" height="236"/>

      <g class="n-1"><rect class="box" x="20" y="56" width="110" height="48"/><text class="label" x="75" y="80">Question</text></g>
      <g class="n-2"><rect class="box" x="152" y="56" width="110" height="48"/><text class="label" x="207" y="80">Rewrite</text></g>
      <g class="n-3"><rect class="box" x="284" y="56" width="110" height="48"/><text class="label" x="339" y="80">Retrieve</text></g>
      <g class="n-4"><rect class="box" x="416" y="56" width="110" height="48"/><text class="label" x="471" y="80">Grade</text></g>
      <g class="n-5"><rect class="box" x="548" y="56" width="110" height="48"/><text class="label" x="603" y="80">Generate</text></g>
      <g class="n-6"><rect class="box" x="680" y="56" width="104" height="48"/><text class="label" x="732" y="80">Answer</text></g>
      <path class="edge e-2 in-2" d="M130 80 H149" marker-end="url(#ah-ps)"/>
      <path class="edge e-3 in-3" d="M262 80 H281" marker-end="url(#ah-ps)"/>
      <path class="edge e-4 in-4" d="M394 80 H413" marker-end="url(#ah-ps)"/>
      <path class="edge e-5 in-5" d="M526 80 H545" marker-end="url(#ah-ps)"/>
      <path class="edge e-6 in-6" d="M658 80 H677" marker-end="url(#ah-ps)"/>

      <!-- the patterns each prompt is built from -->
      <g class="in-2"><text class="small" x="207" y="124">template</text><text class="small" x="207" y="142">+ few-shot</text></g>
      <g class="in-3"><text class="small" x="339" y="124">no prompt</text></g>
      <g class="in-4"><text class="small" x="471" y="124">few-shot</text><text class="small" x="471" y="142">yes or no</text></g>
      <g class="in-5"><text class="small" x="603" y="124">persona</text><text class="small" x="603" y="142">+ reasoning cue</text></g>

      <!-- what each step produces -->
      <g class="in-1">
        <rect class="doc" x="20" y="176" width="110" height="52"/>
        <text class="small" x="75" y="194">refund after</text>
        <text class="small" x="75" y="212">45 days?</text>
      </g>
      <g class="in-2">
        <rect class="doc" x="152" y="176" width="110" height="52"/>
        <text class="small" x="207" y="194">refund policy</text>
        <text class="small" x="207" y="212">after day 30</text>
      </g>
      <g class="mv-3" style="--from: translate(0px, -60px)">
        <rect class="chunk" x="309" y="182" width="60" height="8"/>
        <rect class="chunk" x="309" y="198" width="60" height="8"/>
        <rect class="chunk" x="309" y="214" width="60" height="8"/>
        <text class="small" x="339" y="244">chunks</text>
      </g>
      <g class="in-4">
        <rect class="hit" x="441" y="182" width="60" height="8"/>
        <rect class="hit" x="441" y="198" width="60" height="8"/>
        <rect class="chunk" x="441" y="214" width="60" height="8"/>
        <text class="fig" x="519" y="186">yes</text>
        <text class="fig" x="519" y="202">yes</text>
        <text class="fig" x="519" y="218">no</text>
      </g>
      <g class="in-5">
        <rect class="doc" x="563" y="176" width="80" height="52"/>
        <path class="line" d="M571 188 H635"/>
        <path class="hit-line" d="M571 202 H627 M571 214 H631"/>
      </g>
      <g class="in-6">
        <rect class="doc" x="680" y="176" width="104" height="52"/>
        <path class="line" d="M690 192 H774 M690 204 H758"/>
        <text class="fig" x="732" y="218">[1] [2]</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-prompt-steps-cap">
    <li><button type="button" data-tok="20,56">Question</button><span>A customer asks “Can I get a refund after 45 days?”</span></li>
    <li><button type="button" data-tok="152,56">Rewrite</button><span>A template prompt with worked examples turns the question into a search query.</span></li>
    <li><button type="button" data-tok="284,56">Retrieve</button><span>The retriever returns handbook chunks. This is the one step with no prompt.</span></li>
    <li><button type="button" data-tok="416,56">Grade</button><span>A few-shot prompt labels each chunk yes or no: does it help answer the question?</span></li>
    <li><button type="button" data-tok="548,56">Generate</button><span>A support-agent persona and a reasoning cue answer from the chunks graded yes.</span></li>
    <li><button type="button" data-tok="680,56">Answer</button><span>The answer cites the chunks it used. Three of the four steps between question and answer were prompts.</span></li>
  </ol>
</figure>
