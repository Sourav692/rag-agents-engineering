<!-- Animated version of the Frame sampling flowchart in ../README.md, used by index.html.
     The figures are the frame sampling lab's own: a 90-second recording at 30 fps, sampled every 3 s, sent at detail low.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the steps in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-frames-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Frame sampling pipeline, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-frames-title anim-frames-desc">
      <title id="anim-frames-title">Frame sampling for gpt-4o</title>
      <desc id="anim-frames-desc">A 90-second recording at 30 fps has 2,700 frames. Sampling every 3 seconds keeps every 90th frame, 30 in all, and each is encoded as a base64 JPEG. In parallel the soundtrack is written to an mp3 and transcribed by whisper-1. One user message carries the 30 image parts and the transcript to gpt-4o, which writes the summary; at detail low the frames cost 2,550 tokens.</desc>
      <defs>
        <marker id="ah-frames" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="160" y="20">Pictures: frames</text>
      <rect class="lane" x="150" y="28" width="310" height="136"/>
      <text class="lane-label" x="160" y="200">Sound: transcript</text>
      <rect class="lane" x="150" y="208" width="310" height="136"/>

      <!-- the recording -->
      <g class="n-1">
        <rect class="box" x="16" y="152" width="110" height="56"/>
        <text class="label" x="71" y="172">Recording</text>
        <text class="small" x="71" y="192">90 s, 30 fps</text>
      </g>
      <g class="in-1"><text class="fig" x="71" y="226">2,700 frames</text></g>

      <!-- frames lane -->
      <path class="edge e-2 in-2" d="M126 168 C145 168 145 70 163 70" marker-end="url(#ah-frames)"/>
      <g class="n-2"><rect class="box" x="166" y="48" width="120" height="44"/><text class="label" x="226" y="70">Sample</text></g>
      <g class="in-2">
        <rect class="chunk" x="176" y="104" width="10" height="14"/><rect class="chunk" x="192" y="104" width="10" height="14"/>
        <rect class="chunk" x="208" y="104" width="10" height="14"/><rect class="chunk" x="224" y="104" width="10" height="14"/>
        <rect class="chunk" x="240" y="104" width="10" height="14"/><rect class="chunk" x="256" y="104" width="10" height="14"/>
        <text class="fig" x="226" y="140">every 90th: 30</text>
      </g>
      <path class="edge e-3 in-3" d="M286 70 H323" marker-end="url(#ah-frames)"/>
      <g class="n-3"><rect class="box" x="326" y="48" width="120" height="44"/><text class="label" x="386" y="70">Encode</text></g>
      <g class="in-3">
        <path class="line" d="M346 110 H426 M346 120 H418 M346 130 H422"/>
        <text class="small" x="386" y="150">JPEG, then base64</text>
      </g>

      <!-- sound lane -->
      <path class="edge e-4 in-4" d="M126 192 C145 192 145 250 163 250" marker-end="url(#ah-frames)"/>
      <g class="n-4"><rect class="box" x="166" y="228" width="120" height="44"/><text class="label" x="226" y="250">Audio</text></g>
      <g class="in-4"><text class="small" x="226" y="292">mp3 at 32k</text></g>
      <path class="edge e-5 in-5" d="M286 250 H323" marker-end="url(#ah-frames)"/>
      <g class="n-5"><rect class="box" x="326" y="228" width="120" height="44"/><text class="label" x="386" y="250">whisper-1</text></g>
      <g class="in-5">
        <path class="line" d="M346 290 H426 M346 300 H410 M346 310 H420"/>
        <text class="small" x="386" y="330">transcript text</text>
      </g>

      <!-- one message -->
      <path class="edge e-6 in-6" d="M446 70 C470 70 470 120 493 120" marker-end="url(#ah-frames)"/>
      <path class="edge e-6 in-6" d="M446 250 C470 250 470 220 493 220" marker-end="url(#ah-frames)"/>
      <g class="n-6">
        <rect class="box" x="496" y="96" width="130" height="160"/>
        <text class="label" x="561" y="114">User message</text>
      </g>
      <g class="in-6">
        <rect class="hit" x="508" y="134" width="14" height="12"/><rect class="hit" x="526" y="134" width="14" height="12"/>
        <rect class="hit" x="544" y="134" width="14" height="12"/><rect class="hit" x="562" y="134" width="14" height="12"/>
        <rect class="hit" x="580" y="134" width="14" height="12"/><rect class="hit" x="598" y="134" width="14" height="12"/>
        <text class="small" x="561" y="166">30 image parts</text>
        <path class="line" d="M512 196 H610 M512 206 H600 M512 216 H606"/>
        <text class="small" x="561" y="238">transcript</text>
      </g>

      <!-- model and summary -->
      <path class="edge e-7 in-7" d="M626 176 H655" marker-end="url(#ah-frames)"/>
      <g class="n-7"><rect class="box" x="658" y="154" width="120" height="44"/><text class="label" x="718" y="176">gpt-4o</text></g>
      <g class="in-7">
        <path class="edge e-7" d="M718 198 V229" marker-end="url(#ah-frames)"/>
        <rect class="doc" x="668" y="232" width="100" height="52"/>
        <path class="line" d="M678 246 H758 M678 256 H748"/>
        <text class="small" x="718" y="272">summary</text>
        <text class="fig" x="718" y="306">2,550 tokens</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-frames-cap">
    <li><button type="button">Recording</button><span>The Larkspur walkthrough runs 90 s at 30 fps: 2,700 frames.</span></li>
    <li><button type="button">Sample</button><span><code>frames_to_skip = int(30 * 3) = 90</code>, so every 90th frame is read: 30 frames.</span></li>
    <li><button type="button">Encode</button><span>Each frame is written as a JPEG and turned into a base64 string.</span></li>
    <li><button type="button">Audio</button><span>moviepy writes the soundtrack to an mp3 at a 32k bitrate.</span></li>
    <li><button type="button">Transcribe</button><span><code>whisper-1</code> turns the mp3 into transcript text.</span></li>
    <li><button type="button">Message</button><span>One user message carries 30 image parts at low detail and the transcript.</span></li>
    <li><button type="button">Summary</button><span>gpt-4o answers from pictures and words together. The frames cost 30 × 85 = 2,550 tokens.</span></li>
  </ol>
</figure>
