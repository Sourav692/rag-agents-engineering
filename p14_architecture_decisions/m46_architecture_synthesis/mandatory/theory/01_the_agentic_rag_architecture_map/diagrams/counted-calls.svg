<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" role="img" aria-labelledby="t d">
<title id="t">Model calls per question, as the course’s labs counted them</title>
<desc id="d">Each architecture’s model calls per question on a log scale from 1 to 20, grouped by family, as counted by earlier module labs on Larkspur questions. Plain RAG makes 1 call. Query rewrite, router and plan and execute make 2; swarm 2 to 3; ReAct 2 to 4; supervisor 3 to 5; decomposition 5; hierarchy 5 to 7; CRAG 4 to 7, plus a web search; grade, rewrite, retry 4 to 10; Self-RAG 7 to 20. The graph plus vector chain makes 2. Collapsed-tree RAPTOR and GraphRAG were not counted.</desc>
<style>
.bg{fill:#e5eaef} .fam{font:600 15px "Hanken Grotesk",system-ui,sans-serif;fill:#060e15} .lab{font:500 14px "Hanken Grotesk",system-ui,sans-serif;fill:#182027}
.mod{font:13px "IBM Plex Mono",ui-monospace,monospace;fill:#3b434b} .fig{font:13px "IBM Plex Mono",ui-monospace,monospace;fill:#182027}
.tick{font:13px "IBM Plex Mono",ui-monospace,monospace;fill:#3b434b} .axis{font:500 13px "Hanken Grotesk",system-ui,sans-serif;fill:#3b434b}
.grid{stroke:#a1a9af;stroke-width:1} .rng{stroke:#060e15;stroke-width:3} .dot{fill:#060e15}
.rng.hit{stroke:#970d63} .dot.hit{fill:#970d63} .fig.hit{fill:#970d63;font-weight:500}
</style>
<rect class="bg" width="800" height="630"/>
<text class="axis" x="24" y="28">Model calls per question, log scale, from each module’s lab or notebook code.</text>
<text class="axis" x="24" y="48">Not counted in a lab: collapsed-tree RAPTOR (M42), GraphRAG (M44).</text>
<line class="grid" x1="300.0" y1="60" x2="300.0" y2="580"/><text class="tick" x="300.0" y="600" text-anchor="middle">1</text><line class="grid" x1="390.2" y1="60" x2="390.2" y2="580"/><text class="tick" x="390.2" y="600" text-anchor="middle">2</text><line class="grid" x1="509.5" y1="60" x2="509.5" y2="580"/><text class="tick" x="509.5" y="600" text-anchor="middle">5</text><line class="grid" x1="599.8" y1="60" x2="599.8" y2="580"/><text class="tick" x="599.8" y="600" text-anchor="middle">10</text><line class="grid" x1="690.0" y1="60" x2="690.0" y2="580"/><text class="tick" x="690.0" y="600" text-anchor="middle">20</text>
<text class="fam" x="24" y="82">Entry-level</text>
<text class="lab" x="40" y="109">Plain RAG</text><text class="mod" x="282" y="109" text-anchor="end">M11</text>
