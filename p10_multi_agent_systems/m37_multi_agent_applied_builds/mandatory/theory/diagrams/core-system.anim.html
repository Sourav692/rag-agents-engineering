<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The figures are the notebooks' own: hotel_common.py indexes 4 compliance rules and retrieve returns the top 2.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-core-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The hotel core system, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 880 360" role="img" aria-labelledby="anim-core-title anim-core-desc">
      <title id="anim-core-title">The hotel core system</title>
      <desc id="anim-core-desc">A guest message reaches the coordinator, which forwards it to the compliance checker first. The checker retrieves 2 of the hotel’s 4 rules and a generate step writes a verdict, COMPLIANT or VIOLATION, tagged compliance. Back at the coordinator the loop guard drops the checker from the names it routes on, and the coordinator names the reservation agent, which reads and books through SQL tools. Code then checks the reservations table. A reply that names no agent ends the turn.</desc>
      <defs>
        <marker id="ah-core" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="40" width="140" height="52"/><text class="label" x="90" y="66">Guest message</text></g>
      <path class="edge e-2" d="M160 66 H217" marker-end="url(#ah-core)"/>

      <g class="n-2 n-5"><rect class="box" x="220" y="40" width="140" height="52"/><text class="label" x="290" y="66">Coordinator</text></g>
      <path class="edge e-2" d="M360 66 H467" marker-end="url(#ah-core)"/>
      <text class="small" x="414" y="52">check first</text>

      <g class="n-3"><rect class="box" x="470" y="40" width="160" height="52"/><text class="label" x="550" y="66">Compliance checker</text></g>
      <path class="edge e-3" d="M630 66 H687" marker-end="url(#ah-core)"/>

      <g class="n-3"><rect class="box" x="690" y="40" width="180" height="52"/><text class="label" x="780" y="58">retrieve</text><text class="small" x="780" y="78">2 of 4 rules</text></g>
      <path class="edge e-4" d="M780 92 V147" marker-end="url(#ah-core)"/>

      <g class="n-4"><rect class="box" x="690" y="150" width="180" height="60"/><text class="label" x="780" y="170">Verdict</text><text class="small" x="780" y="192">COMPLIANT or VIOLATION</text></g>
      <text class="small in-4" x="780" y="232">tagged compliance</text>

      <path class="edge e-5" d="M690 180 H320 V95" marker-end="url(#ah-core)"/>
      <text class="small in-5" x="470" y="136">loop guard drops the checker</text>

      <path class="edge e-6" d="M260 92 V267" marker-end="url(#ah-core)"/>
      <text class="small" x="330" y="236">names the agent</text>
      <path class="edge dashed" d="M235 92 C235 190 85 180 85 267" marker-end="url(#ah-core)"/>
      <text class="small" x="120" y="150">names no one</text>

      <g class="n-6"><rect class="box" x="180" y="270" width="160" height="52"/><text class="label" x="260" y="296">Reservation agent</text></g>
      <path class="edge e-6" d="M340 288 H467" marker-end="url(#ah-core)"/>
      <path class="edge e-6" d="M470 306 H343" marker-end="url(#ah-core)"/>
      <g class="n-6"><rect class="box" x="470" y="270" width="160" height="52"/><text class="label" x="550" y="296">SQL tools</text></g>
      <text class="small in-6" x="550" y="342">run_query reads, book_room writes</text>

      <path class="edge e-7" d="M180 296 H153" marker-end="url(#ah-core)"/>
      <g class="n-7"><rect class="box" x="20" y="270" width="130" height="52"/><text class="label" x="85" y="296">Reply</text></g>
      <text class="small in-7" x="85" y="342">code counts the new row</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-core-cap">
    <li><button type="button" data-tok="20,40">Guest</button><span>A guest message arrives on the guest’s own thread.</span></li>
    <li><button type="button" data-tok="220,40">Check first</button><span>The coordinator names compliance_checker, as its COMPLIANCE_FIRST guideline asks for every new request.</span></li>
    <li><button type="button" data-tok="470,40">Retrieve</button><span>The checker calls retrieve, which returns the 2 most relevant of the hotel’s 4 rules.</span></li>
    <li><button type="button" data-tok="690,150">Verdict</button><span>A generate step writes COMPLIANT or VIOLATION from those rules only, tagged so code can find it.</span></li>
    <li><button type="button" data-tok="220,40">Guard</button><span>Back at the coordinator, the loop guard drops the checker, so the reply can only forward onward.</span></li>
    <li><button type="button" data-tok="180,270">Book</button><span>The reservation agent reads through a read-only connection and books through one parameterised tool.</span></li>
    <li><button type="button" data-tok="20,270">Verify</button><span>The reply goes to the guest, and code checks the reservations table, not the wording.</span></li>
  </ol>
</figure>
