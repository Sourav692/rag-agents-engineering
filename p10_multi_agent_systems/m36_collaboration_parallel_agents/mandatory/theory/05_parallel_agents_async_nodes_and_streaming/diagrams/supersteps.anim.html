<!-- Animated version of the Map-reduce / async flowchart in ../README.md, used by index.html.
     The times are the lab's own (interactive/parallel-subquestions-lab.html): rewrite as its own node, list edge, no cap,
     checked against LangGraph 1.2.18. Classes and data attributes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-supersteps-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Supersteps, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 880 420" role="img" aria-labelledby="anim-supersteps-title anim-supersteps-desc">
      <title id="anim-supersteps-title">Four sub-questions in four supersteps</title>
      <desc id="anim-supersteps-desc">Superstep 1: plan runs from 0 to 0.4 seconds. Superstep 2: refund_window, refund_timing, export and rewrite run together; it ends at 1.6 seconds when export finishes, so credits waits 0.7 seconds after rewrite. Superstep 3: credits runs from 1.6 to 2.6 seconds. Superstep 4: the list edge lets synth run once with all four sub-answers, from 2.6 to 3.4 seconds.</desc>
      <defs>
        <marker id="ah-ss" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="730" y="114">superstep 1</text>
      <text class="lane-label" x="730" y="204">superstep 2</text>
      <text class="lane-label" x="730" y="294">superstep 3</text>
      <text class="lane-label" x="730" y="384">superstep 4</text>

      <rect class="doc" x="320" y="14" width="160" height="36"/>
      <text class="small" x="400" y="32">Compound question</text>
      <path class="edge e-1" d="M400 50 V81" marker-end="url(#ah-ss)"/>

      <g class="n-1"><rect class="box" x="340" y="84" width="120" height="52"/><text class="label" x="400" y="102">plan</text></g>
      <text class="fig in-1" x="400" y="122">0 to 0.4 s</text>

      <path class="edge e-2" d="M400 136 C400 156 110 150 110 169" marker-end="url(#ah-ss)"/>
      <path class="edge e-2" d="M400 136 C400 156 280 150 280 169" marker-end="url(#ah-ss)"/>
      <path class="edge e-2" d="M400 136 C400 156 450 150 450 169" marker-end="url(#ah-ss)"/>
      <path class="edge e-2" d="M400 136 C400 156 620 150 620 169" marker-end="url(#ah-ss)"/>

      <g class="n-2"><rect class="box" x="40" y="172" width="140" height="52"/><text class="label" x="110" y="190">refund_window</text></g>
      <g class="n-2"><rect class="box" x="210" y="172" width="140" height="52"/><text class="label" x="280" y="190">refund_timing</text></g>
      <g class="n-2 n-3"><rect class="box" x="380" y="172" width="140" height="52"/><text class="label" x="450" y="190">export</text></g>
      <g class="n-2"><rect class="box" x="550" y="172" width="140" height="52"/><text class="label" x="620" y="190">rewrite</text></g>
      <g class="in-2">
        <text class="fig" x="110" y="210">0.4 to 1.4 s</text>
        <text class="fig" x="280" y="210">0.4 to 1.2 s</text>
        <text class="fig" x="450" y="210">0.4 to 1.6 s</text>
        <text class="fig" x="620" y="210">0.4 to 0.9 s</text>
      </g>

      <path class="edge e-3 e-4" d="M620 224 V259" marker-end="url(#ah-ss)"/>
      <text class="small in-3" x="690" y="242">waits 0.7 s</text>
      <g class="n-4"><rect class="box" x="550" y="262" width="140" height="52"/><text class="label" x="620" y="280">credits</text></g>
      <text class="fig in-4" x="620" y="300">1.6 to 2.6 s</text>

      <path class="edge e-5" d="M110 224 C110 310 370 320 380 349" marker-end="url(#ah-ss)"/>
      <path class="edge e-5" d="M280 224 C280 300 392 320 394 349" marker-end="url(#ah-ss)"/>
      <path class="edge e-5" d="M450 224 C450 300 408 320 406 349" marker-end="url(#ah-ss)"/>
      <path class="edge e-5" d="M620 314 C620 336 432 330 422 349" marker-end="url(#ah-ss)"/>
      <text class="small in-5" x="560" y="378">list edge: all four in</text>

      <g class="n-6"><rect class="box" x="340" y="352" width="120" height="52"/><text class="label" x="400" y="370">synth</text></g>
      <text class="fig in-6" x="400" y="390">2.6 to 3.4 s</text>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-supersteps-cap">
    <li><button type="button">Plan</button><span>Superstep 1: plan splits the question into four sub-questions, 0 to 0.4 s.</span></li>
    <li><button type="button">Fan out</button><span>Superstep 2: four edges out of plan start all four nodes at once. updates streams each one as it finishes, refund_timing first at 1.2 s.</span></li>
    <li><button type="button">Barrier</button><span>rewrite is done at 0.9 s, but superstep 2 ends only when export finishes at 1.6 s, so credits waits 0.7 s.</span></li>
    <li><button type="button">Credits</button><span>Superstep 3: credits answers the rewritten outage question, 1.6 to 2.6 s.</span></li>
    <li><button type="button">Join</button><span>The list edge opens only when all four sub-answers are in. Separate edges would have run synth once already, in superstep 3, with three.</span></li>
    <li><button type="button">Answer</button><span>Superstep 4: synth writes the reply from four sub-answers, 2.6 to 3.4 s, against 5.7 s one at a time.</span></li>
  </ol>
</figure>
