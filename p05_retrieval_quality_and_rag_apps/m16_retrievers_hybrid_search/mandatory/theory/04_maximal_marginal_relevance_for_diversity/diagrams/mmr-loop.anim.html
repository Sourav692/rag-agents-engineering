<!-- Animated version of the MMR λ flowchart in ../README.md, used by index.html.
     The embedding space is a sketch: positions are placed by hand, so the figure quotes no similarities.
     k = 3 and fetch_k = 10 are the values 01a_retrievers.ipynb uses. Classes and data attributes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-mmr-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The MMR selection loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 340" role="img" aria-labelledby="anim-mmr-title anim-mmr-desc">
      <title id="anim-mmr-title">MMR picks k = 3 of fetch_k = 10 candidates</title>
      <desc id="anim-mmr-desc">A sketch of an embedding space with a query and ten candidate chunks. Four candidates sit in a tight cluster next to the query. MMR takes the nearest one first, penalises the rest of its cluster as redundant, then picks a relevant chunk on another topic and a third from a further group. Plain similarity search would have returned three chunks from the tight cluster.</desc>

      <text class="lane-label" x="16" y="20">Embedding space, sketched</text>
      <rect class="lane" x="8" y="28" width="470" height="300"/>
      <text class="lane-label" x="508" y="20">Returned, k = 3</text>
      <rect class="lane" x="500" y="28" width="292" height="300"/>

      <!-- query -->
      <rect class="doc" x="226" y="172" width="64" height="26"/>
      <text class="small" x="258" y="185">query</text>

      <!-- fetch_k = 10 candidates -->
      <g class="in-1">
        <circle class="vec" cx="312" cy="160" r="6"/><circle class="vec" cx="322" cy="176" r="6"/>
        <circle class="vec" cx="328" cy="146" r="6"/><circle class="vec" cx="338" cy="164" r="6"/>
        <circle class="vec" cx="214" cy="250" r="6"/><circle class="vec" cx="196" cy="268" r="6"/>
        <circle class="vec" cx="176" cy="112" r="6"/><circle class="vec" cx="156" cy="98" r="6"/>
        <circle class="vec" cx="408" cy="276" r="6"/><circle class="vec" cx="92" cy="214" r="6"/>
        <text class="small" x="400" y="60">10 nearest candidates</text>
      </g>

      <!-- pick 1 -->
      <g class="in-2"><circle class="hit" cx="312" cy="160" r="8"/><text class="fig" x="298" y="146">1</text></g>
      <!-- redundancy penalty on the rest of the cluster -->
      <g class="in-3">
        <ellipse class="edge dashed" cx="326" cy="161" rx="30" ry="29"/>
        <text class="small" x="372" y="112">redundant with 1</text>
      </g>
      <!-- pick 2 and 3 -->
      <g class="in-4"><circle class="hit" cx="214" cy="250" r="8"/><text class="fig" x="232" y="240">2</text></g>
      <g class="in-5"><circle class="hit" cx="176" cy="112" r="8"/><text class="fig" x="194" y="102">3</text></g>

      <!-- returned list -->
      <g class="in-2 n-2"><rect class="box" x="520" y="52" width="252" height="44"/><text class="label" x="646" y="74">1: nearest chunk</text></g>
      <g class="in-4 n-4"><rect class="box" x="520" y="110" width="252" height="44"/><text class="label" x="646" y="132">2: a new topic</text></g>
      <g class="in-5 n-5"><rect class="box" x="520" y="168" width="252" height="44"/><text class="label" x="646" y="190">3: another topic</text></g>
      <g class="in-6">
        <text class="small" x="646" y="248">Plain similarity, k = 3:</text>
        <text class="small" x="646" y="270">1 and two of its near-copies</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-mmr-cap">
    <li><button type="button">Fetch</button><span>The store returns the fetch_k chunks nearest the query. 01a asks for 10.</span></li>
    <li><button type="button">First pick</button><span>MMR always takes the most similar chunk first, whatever λ is.</span></li>
    <li><button type="button">Penalise</button><span>Each other candidate scores λ × its similarity to the query minus (1 - λ) × its highest similarity to a chunk already picked. Near-copies of pick 1 drop.</span></li>
    <li><button type="button">Second pick</button><span>The top scorer is a relevant chunk on a different topic.</span></li>
    <li><button type="button">Third pick</button><span>Rescore against both picks and take the best again. At k = 3 it stops.</span></li>
    <li><button type="button">Compare</button><span>Plain similarity search would have returned pick 1 and two of its near-copies.</span></li>
  </ol>
</figure>
