<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Hanken Grotesk, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Relevant segment extraction: the best segment</title>
  <desc id="d">Five chunks with values -0.2, -0.2, 0.4, 0.8 and -0.1 after the 0.2 penalty is subtracted. The best segment is chunks 2 to 3, whose values sum to 1.2; adding chunk 4 would lower the sum, and chunks 0 and 1 are negative.</desc>
  <rect width="800" height="340" rx="14" fill="#e5eaef"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#060e15">Chunk value = relevance minus 0.2; segment value = sum of its chunks</text>
  <line x1="120" y1="220" x2="700" y2="220" stroke="#060e15" stroke-width="1.2"/>
  <rect x="160" y="220" width="80" height="30" fill="#3b434b"/>
  <text x="200" y="270" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">-0.2</text>
  <text x="200" y="300" font-size="13" text-anchor="middle" fill="#3b434b">chunk 0</text>
  <rect x="270" y="220" width="80" height="30" fill="#3b434b"/>
  <text x="310" y="270" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">-0.2</text>
  <text x="310" y="300" font-size="13" text-anchor="middle" fill="#3b434b">chunk 1</text>
  <rect x="380" y="160" width="80" height="60" fill="#970d63"/>
  <text x="420" y="150" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">+0.4</text>
  <text x="420" y="300" font-size="13" text-anchor="middle" fill="#3b434b">chunk 2</text>
  <rect x="490" y="100" width="80" height="120" fill="#970d63"/>
  <text x="530" y="90" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">+0.8</text>
  <text x="530" y="300" font-size="13" text-anchor="middle" fill="#3b434b">chunk 3</text>
  <rect x="600" y="220" width="80" height="15" fill="#3b434b"/>
  <text x="640" y="255" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">-0.1</text>
  <text x="640" y="300" font-size="13" text-anchor="middle" fill="#3b434b">chunk 4</text>
  <path d="M380 76 V66 H570 V76" fill="none" stroke="#970d63" stroke-width="1.5"/>
  <text x="475" y="56" font-size="14" font-weight="600" text-anchor="middle" fill="#970d63">best segment: chunks 2 to 3, value 0.4 + 0.8 = 1.2</text>
  <text x="28" y="328" font-size="13" fill="#3b434b">The worked example from the 06a notebook. Positive chunks pull a segment up, negative ones pull it down.</text>
</svg>
