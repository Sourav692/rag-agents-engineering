<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Hanken Grotesk, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Context enrichment window</title>
  <desc id="d">The retriever returns one chunk; the window adds the chunk before and after it and joins the three, removing the repeated overlap at each join. With 400-character chunks and 200 characters of overlap the window is 800 characters, twice the retrieved chunk. With 250-character chunks and 20 characters of overlap it is 710 characters, almost three times the chunk.</desc>
  <rect width="800" height="420" rx="14" fill="#e5eaef"/>
  <text x="28" y="36" font-size="17" font-weight="700" fill="#060e15">Retrieve one chunk, send it with its neighbours</text>
  <text x="28" y="64" font-size="14" font-weight="700" fill="#060e15">chunk_size=400, chunk_overlap=200, num_neighbors=1</text>
  <rect x="130" y="78" width="320" height="24" rx="5" fill="#182027"/>
  <text x="140" y="95" font-size="13" font-weight="600" fill="#f2f5f8">chunk i-1</text>
  <rect x="290" y="108" width="320" height="24" rx="5" fill="#970d63"/>
  <text x="300" y="125" font-size="13" font-weight="600" fill="#f2f5f8">chunk i: retrieved</text>
  <rect x="450" y="138" width="320" height="24" rx="5" fill="#182027"/>
  <text x="460" y="155" font-size="13" font-weight="600" fill="#f2f5f8">chunk i+1</text>
  <rect x="130" y="174" width="640" height="26" rx="5" fill="#f0ccdc" stroke="#970d63" stroke-width="1.5"/>
  <text x="140" y="192" font-size="13" font-weight="600" fill="#060e15">window sent to the model</text>
  <text x="760" y="192" text-anchor="end" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">800 chars</text>
  <line x1="28" y1="228" x2="772" y2="228" stroke="#a1a9af"/>
  <text x="28" y="250" font-size="14" font-weight="700" fill="#060e15">chunk_size=250, chunk_overlap=20 (the AI-history example)</text>
  <rect x="130" y="262" width="200" height="24" rx="5" fill="#182027"/>
  <text x="140" y="279" font-size="13" font-weight="600" fill="#f2f5f8">chunk i-1</text>
  <rect x="314" y="292" width="200" height="24" rx="5" fill="#970d63"/>
  <text x="324" y="309" font-size="13" font-weight="600" fill="#f2f5f8">chunk i: retrieved</text>
  <rect x="498" y="322" width="200" height="24" rx="5" fill="#182027"/>
  <text x="508" y="339" font-size="13" font-weight="600" fill="#f2f5f8">chunk i+1</text>
  <rect x="130" y="358" width="568" height="26" rx="5" fill="#f0ccdc" stroke="#970d63" stroke-width="1.5"/>
  <text x="140" y="376" font-size="13" font-weight="600" fill="#060e15">window sent to the model</text>
  <text x="688" y="376" text-anchor="end" font-size="13" font-family="IBM Plex Mono, ui-monospace, monospace" fill="#060e15">710 chars</text>
  <text x="28" y="404" font-size="13" fill="#3b434b">Positions to scale, from the 05a splitter. Each join drops chunk_overlap characters so the repeated text appears once.</text>
</svg>
