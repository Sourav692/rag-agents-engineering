<!-- Animated version of the late-interaction flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Numbers: vidore/colSmol-256M on the three lab pages, question 1. -->
<figure class="anim sheet" aria-labelledby="anim-maxsim-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Late interaction scoring, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 360" role="img" aria-labelledby="anim-maxsim-title anim-maxsim-desc">
      <title id="anim-maxsim-title">Late interaction: MaxSim over page patches</title>
      <desc id="anim-maxsim-desc">A page image becomes 1,139 patch vectors. The question becomes 24 token vectors. Each token keeps its best match among the patches; the token availability scores 0.75 on page 1. The 24 maxima sum to 15.95 for page 1, against 9.74 for page 2 and 6.82 for page 3, so page 1 ranks first.</desc>
      <defs>
        <marker id="ah-maxsim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- the page -->
      <g class="n-1">
        <rect class="box" x="30" y="24" width="150" height="196"/>
        <path class="line" d="M44 42 H150 M44 54 H164 M44 70 H164 M44 82 H130"/>
        <rect class="chunk" x="60" y="150" width="20" height="50"/><rect class="chunk" x="92" y="170" width="20" height="30"/><rect class="chunk" x="124" y="155" width="20" height="45"/>
        <text class="small" x="105" y="238">page 1</text>
      </g>
      <g class="in-2">
        <path class="line" d="M55 24 V220 M80 24 V220 M105 24 V220 M130 24 V220 M155 24 V220 M30 52 H180 M30 80 H180 M30 108 H180 M30 136 H180 M30 164 H180 M30 192 H180"/>
        <text class="small" x="105" y="256">1,139 patch vectors</text>
      </g>

      <!-- the question and its tokens -->
      <g class="n-3 in-3"><rect class="box" x="200" y="296" width="460" height="44"/><text class="label" x="430" y="318">Which month missed the 99.95% availability target?</text></g>
      <g class="n-4 in-4">
        <rect class="box" x="230" y="230" width="62" height="32"/><text class="small" x="261" y="246">month</text>
        <rect class="box" x="300" y="230" width="66" height="32"/><text class="small" x="333" y="246">missed</text>
        <rect class="box" x="374" y="230" width="34" height="32"/><text class="small" x="391" y="246">%</text>
        <rect class="box" x="416" y="230" width="98" height="32"/><text class="small" x="465" y="246">availability</text>
        <rect class="box" x="522" y="230" width="60" height="32"/><text class="small" x="552" y="246">target</text>
        <rect class="box" x="590" y="230" width="40" height="32"/><text class="small" x="610" y="246">+19</text>
      </g>
      <path class="edge e-4 in-4" d="M430 296 V265" marker-end="url(#ah-maxsim)"/>

      <!-- one token finds its best patch -->
      <path class="edge dashed e-5 in-5" d="M465 230 C465 140 260 120 158 128" marker-end="url(#ah-maxsim)"/>
      <rect class="hit mv-5" style="--from: translate(300px, 110px)" x="130" y="108" width="25" height="28"/>
      <text class="fig in-5" x="236" y="100">max 0.75</text>

      <!-- sum and rank -->
      <g class="n-6 in-6">
        <rect class="box" x="664" y="220" width="124" height="52"/>
        <text class="small" x="726" y="236">sum of 24</text>
        <text class="fig" x="726" y="258">15.95</text>
      </g>
      <path class="edge e-6 in-6" d="M630 246 H661" marker-end="url(#ah-maxsim)"/>
      <g class="in-7">
        <circle class="hit" cx="668" cy="120" r="5"/><text class="fig" x="732" y="120">page 1 15.95</text>
        <text class="fig" x="732" y="146">page 2 9.74</text>
        <text class="fig" x="732" y="172">page 3 6.82</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-maxsim-cap">
    <li><button type="button">Page</button><span>Indexing starts from the rendered page image, not from extracted text.</span></li>
    <li><button type="button">Patches</button><span>The model turns the page into 1,139 vectors of 128 dimensions, one per patch or token.</span></li>
    <li><button type="button">Question</button><span>A customer asks “Which month missed the 99.95% availability target?”</span></li>
    <li><button type="button">Tokens</button><span>The question becomes 24 vectors: its 14 tokens and 10 tokens the processor appends.</span></li>
    <li><button type="button">Match</button><span>Each token keeps its best patch. “availability” scores 0.75 on page 1 and 0.25 on the other two.</span></li>
    <li><button type="button">Sum</button><span>The 24 maxima add up to the page score, 15.95 for page 1.</span></li>
    <li><button type="button">Rank</button><span>Page 1 leads page 2 by 6.21. Its image, chart included, goes to the model.</span></li>
  </ol>
</figure>
