<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram.
     Figures are real: the all-MiniLM-L6-v2 cache entry (commit 1110a243, 90,868,376-byte weights), 13 tokens for the question, 384 numbers out. -->
<figure class="anim sheet" aria-labelledby="anim-hubdemo-cap">
  <div class="anim__canvas" tabindex="0" aria-label="From the Hub to a demo, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-hubdemo-title anim-hubdemo-desc">
      <title id="anim-hubdemo-title">From the Hub to a demo</title>
      <desc id="anim-hubdemo-desc">Once per machine: the first call downloads all-MiniLM-L6-v2 from the Hub into the local cache, and the app loads it into memory. Every click: a question typed in the browser fires a Gradio event, the tokenizer turns it into 13 token ids, the model turns them into numbers, and pooling returns a vector of 384 numbers to the page.</desc>
      <defs>
        <marker id="ah-hubdemo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Once per machine</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">Every click</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- once -->
      <g class="n-1">
        <path class="box" d="M60 50 a70 10 0 0 0 140 0 v34 a70 10 0 0 1 -140 0 z"/>
        <ellipse class="box" cx="130" cy="50" rx="70" ry="10"/>
        <text class="label" x="130" y="74">Hub repo</text>
      </g>
      <g class="n-2">
        <path class="box" d="M330 50 a70 10 0 0 0 140 0 v34 a70 10 0 0 1 -140 0 z"/>
        <ellipse class="box" cx="400" cy="50" rx="70" ry="10"/>
        <text class="label" x="400" y="74">Local cache</text>
      </g>
      <g class="n-3"><rect class="box" x="600" y="48" width="150" height="44"/><text class="label" x="675" y="70">Load into memory</text></g>
      <path class="edge e-2 in-2" d="M200 70 H327" marker-end="url(#ah-hubdemo)"/>
      <text class="small in-2" x="264" y="58">first call</text>
      <path class="edge e-3 in-3" d="M470 70 H597" marker-end="url(#ah-hubdemo)"/>

      <g class="in-1">
        <text class="fig" x="130" y="118">commit 1110a243</text>
        <text class="small" x="130" y="140">all-MiniLM-L6-v2</text>
      </g>
      <g class="mv-2" style="--from: translate(-270px, 0px)">
        <rect class="doc" x="372" y="104" width="56" height="30"/>
        <path class="line" d="M380 114 H420 M380 122 H412"/>
        <text class="fig" x="400" y="150">90,868,376 bytes</text>
      </g>
      <g class="in-3">
        <circle class="vec" cx="670" cy="118" r="5"/><circle class="vec" cx="690" cy="118" r="5"/>
        <circle class="vec" cx="710" cy="118" r="5"/><circle class="vec" cx="730" cy="118" r="5"/>
        <text class="small" x="700" y="144">no network after this</text>
      </g>

      <!-- the loaded weights are what the model step uses on every click -->
      <path class="edge dashed e-7 in-3" d="M612 92 V225" marker-end="url(#ah-hubdemo)"/>
      <text class="small in-3" x="578" y="186">weights</text>

      <!-- every click -->
      <g class="n-4"><rect class="box" x="24" y="228" width="120" height="44"/><text class="label" x="84" y="250">Question</text></g>
      <g class="n-5"><rect class="box" x="184" y="228" width="120" height="44"/><text class="label" x="244" y="250">Gradio event</text></g>
      <g class="n-6"><rect class="box" x="344" y="228" width="120" height="44"/><text class="label" x="404" y="250">Tokenizer</text></g>
      <g class="n-7"><rect class="box" x="540" y="228" width="120" height="44"/><text class="label" x="600" y="250">Model</text></g>
      <g class="n-8"><rect class="box" x="694" y="228" width="90" height="44"/><text class="label" x="739" y="250">Output</text></g>
      <path class="edge e-5 in-5" d="M144 250 H181" marker-end="url(#ah-hubdemo)"/>
      <path class="edge e-6 in-6" d="M304 250 H341" marker-end="url(#ah-hubdemo)"/>
      <path class="edge e-7 in-7" d="M464 250 H537" marker-end="url(#ah-hubdemo)"/>
      <path class="edge e-8 in-8" d="M660 250 H691" marker-end="url(#ah-hubdemo)"/>

      <g class="in-4">
        <rect class="doc" x="24" y="288" width="120" height="44"/>
        <text class="small" x="84" y="302">export my data</text>
        <text class="small" x="84" y="318">after I cancel?</text>
      </g>
      <g class="in-5">
        <text class="fig" x="244" y="304">click(fn,</text>
        <text class="fig" x="244" y="322">inputs, outputs)</text>
      </g>
      <g class="in-6">
        <text class="fig" x="404" y="304">13 token ids</text>
        <text class="small" x="404" y="322">[CLS] can i … [SEP]</text>
      </g>
      <g class="in-7">
        <circle class="vec" cx="570" cy="304" r="5"/><circle class="vec" cx="590" cy="304" r="5"/>
        <circle class="vec" cx="610" cy="304" r="5"/><circle class="vec" cx="630" cy="304" r="5"/>
        <text class="small" x="600" y="324">one row per token</text>
      </g>
      <g class="in-8">
        <rect class="hit" x="704" y="294" width="70" height="8"/>
        <text class="fig" x="739" y="320">384 numbers</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-hubdemo-cap">
    <li><button type="button">Hub</button><span>The model lives on the Hub as <code>sentence-transformers/all-MiniLM-L6-v2</code>, at commit <code>1110a243</code>.</span></li>
    <li><button type="button">Download</button><span>The first call copies its files into the local cache: 90,868,376 bytes of weights plus the tokenizer.</span></li>
    <li><button type="button">Load</button><span>The app loads the model from disk once, at startup. Nothing after this needs the network.</span></li>
    <li><button type="button">Question</button><span>The support lead types “Can I export my data after I cancel my plan?” into the demo.</span></li>
    <li><button type="button">Event</button><span>The button’s <code>click</code> event calls the Python function with the textbox’s value.</span></li>
    <li><button type="button">Tokenize</button><span>The tokenizer turns the question into 13 ids, counting <code>[CLS]</code> and <code>[SEP]</code>.</span></li>
    <li><button type="button">Model</button><span>The loaded model turns each id into a row of 384 numbers.</span></li>
    <li><button type="button">Output</button><span>Mean pooling and normalising leave one vector of 384 numbers, which the page shows.</span></li>
  </ol>
</figure>
