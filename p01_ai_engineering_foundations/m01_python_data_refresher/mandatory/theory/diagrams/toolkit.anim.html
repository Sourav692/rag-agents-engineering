<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-toolkit-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The toolkit in one pipeline, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-toolkit-title anim-toolkit-desc">
      <title id="anim-toolkit-title">The M01 toolkit in one small RAG run</title>
      <desc id="anim-toolkit-desc">Tables in: pandas reads twelve handbook chunks from a CSV file into a DataFrame and cleans it, then asyncio sends the twelve embedding calls together. Vectors out: the vectors become one NumPy array of shape 12 by 384, one matrix product scores every chunk against a question and the top two are kept, and the run’s results go into a SQLite table.</desc>
      <defs>
        <marker id="ah-tk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Tables in: pandas and asyncio</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">Vectors out: NumPy and SQL</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- tables in -->
      <g class="n-1"><rect class="box" x="40" y="48" width="180" height="44"/><text class="label" x="130" y="70">pd.read_csv</text></g>
      <g class="n-2"><rect class="box" x="310" y="48" width="180" height="44"/><text class="label" x="400" y="70">DataFrame</text></g>
      <g class="n-3"><rect class="box" x="580" y="48" width="180" height="44"/><text class="label" x="670" y="70">asyncio.gather</text></g>
      <path class="edge e-2" d="M220 70 H307" marker-end="url(#ah-tk)"/>
      <path class="edge e-3" d="M490 70 H577" marker-end="url(#ah-tk)"/>

      <g class="in-1">
        <rect class="doc" x="120" y="104" width="20" height="26"/>
        <path class="line" d="M124 112 H136 M124 118 H136 M124 124 H132"/>
        <text class="small" x="130" y="146">chunks.csv</text>
      </g>
      <g class="in-2">
        <rect class="chunk" x="364" y="104" width="20" height="6"/><rect class="chunk" x="388" y="104" width="48" height="6"/>
        <rect class="chunk" x="364" y="114" width="20" height="6"/><rect class="chunk" x="388" y="114" width="48" height="6"/>
        <rect class="chunk" x="364" y="124" width="20" height="6"/><rect class="chunk" x="388" y="124" width="48" height="6"/>
        <text class="small" x="400" y="146">id, text: 12 rows</text>
      </g>
      <g class="in-3">
        <rect class="chunk" x="630" y="104" width="70" height="5"/>
        <rect class="chunk" x="630" y="113" width="46" height="5"/>
        <rect class="chunk" x="630" y="122" width="88" height="5"/>
        <rect class="chunk" x="630" y="131" width="58" height="5"/>
        <text class="small" x="670" y="150">12 calls in flight</text>
      </g>

      <!-- the vectors cross from one phase to the other -->
      <path class="edge dashed e-4" d="M670 154 C670 182 130 176 130 225" marker-end="url(#ah-tk)"/>
      <text class="small" x="440" y="198">vectors</text>

      <!-- vectors out -->
      <g class="n-4"><rect class="box" x="40" y="228" width="180" height="44"/><text class="label" x="130" y="250">NumPy array</text></g>
      <g class="n-5"><rect class="box" x="310" y="228" width="180" height="44"/><text class="label" x="400" y="250">scores = E @ q</text></g>
      <g class="n-6">
        <path class="box" d="M590 230 a80 10 0 0 0 160 0 v94 a80 10 0 0 1 -160 0 z"/>
        <ellipse class="box" cx="670" cy="230" rx="80" ry="10"/>
        <text class="label" x="670" y="258">SQLite</text>
      </g>
      <path class="edge e-5" d="M220 250 H307" marker-end="url(#ah-tk)"/>
      <path class="edge e-6" d="M490 250 H587" marker-end="url(#ah-tk)"/>

      <g class="in-4">
        <circle class="vec" cx="100" cy="290" r="4"/><circle class="vec" cx="115" cy="290" r="4"/><circle class="vec" cx="130" cy="290" r="4"/><circle class="vec" cx="145" cy="290" r="4"/><circle class="vec" cx="160" cy="290" r="4"/>
        <circle class="vec" cx="100" cy="303" r="4"/><circle class="vec" cx="115" cy="303" r="4"/><circle class="vec" cx="130" cy="303" r="4"/><circle class="vec" cx="145" cy="303" r="4"/><circle class="vec" cx="160" cy="303" r="4"/>
        <text class="fig" x="130" y="326">shape (12, 384)</text>
      </g>
      <g class="in-5">
        <rect class="hit" x="376" y="288" width="48" height="8"/><rect class="hit" x="376" y="302" width="48" height="8"/>
        <text class="small" x="400" y="326">top k = 2 ids</text>
      </g>
      <g class="in-6">
        <path class="line" d="M640 284 H700 M640 296 H700"/>
        <path class="hit-line" d="M640 308 H700"/>
        <text class="small" x="670" y="326">runs table</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-toolkit-cap">
    <li><button type="button">Load</button><span><code>pd.read_csv</code> reads twelve handbook chunks, one row each.</span></li>
    <li><button type="button">Clean</button><span>The DataFrame drops empty rows and keeps the <code>id</code> and <code>text</code> columns.</span></li>
    <li><button type="button">Embed</button><span><code>asyncio.gather</code> sends the twelve embedding calls together instead of one after another.</span></li>
    <li><button type="button">Stack</button><span>The twelve vectors become one NumPy array of shape (12, 384).</span></li>
    <li><button type="button">Score</button><span>One matrix product scores every chunk against the question, and <code>argsort</code> keeps the top two.</span></li>
    <li><button type="button">Record</button><span>The run’s results go into a SQLite table, where <code>GROUP BY</code> gives the baseline row.</span></li>
  </ol>
</figure>
