<!-- Animated version of the Semaphore(2) Gantt chart in ../README.md, used by index.html.
     The schedule is the asyncio lab's at a limit of 2, the same as real asyncio.gather with asyncio.Semaphore(2) on a virtual clock.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the clock marker sits on the time axis at each step. -->
<figure class="anim sheet" aria-labelledby="anim-semaphore-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Eight calls through a semaphore of two, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 340" role="img" aria-labelledby="anim-semaphore-title anim-semaphore-desc">
      <title id="anim-semaphore-title">Eight calls through asyncio.Semaphore(2)</title>
      <desc id="anim-semaphore-desc">Eight model calls start together under asyncio.gather, but a semaphore of two lets only two run at once. Each time a call returns, the next queued call is sent. The last call, server size, returns at 5.6 seconds, against 11.0 seconds for the same calls one at a time.</desc>
      <text class="lane-label" x="16" y="20">Calls in flight, two at a time</text>
      <text class="small" x="206" y="44" style="text-anchor: end">Refund time</text>
      <g class="in-1"><rect class="chunk" x="220.0" y="36" width="110.4" height="16"/><text class="fig" x="352.4" y="44">1.2</text></g>
      <text class="small" x="206" y="76" style="text-anchor: end">Annual billing</text>
      <g class="in-1"><rect class="chunk" x="220.0" y="68" width="73.6" height="16"/><text class="fig" x="315.6" y="76">0.8</text></g>
      <text class="small" x="206" y="108" style="text-anchor: end">Server down</text>
      <path class="line in-1" d="M220 108 H293.6"/>
      <g class="in-2"><rect class="chunk" x="293.6" y="100" width="239.2" height="16"/><text class="fig" x="554.8" y="108">3.4</text></g>
      <text class="small" x="206" y="140" style="text-anchor: end">Export after cancel</text>
      <path class="line in-1" d="M220 140 H330.4"/>
      <g class="in-3"><rect class="chunk" x="330.4" y="132" width="92.0" height="16"/><text class="fig" x="444.4" y="140">2.2</text></g>
      <text class="small" x="206" y="172" style="text-anchor: end">Support speed</text>
      <path class="line in-1" d="M220 172 H422.4"/>
      <g class="in-4"><rect class="chunk" x="422.4" y="164" width="138.0" height="16"/><text class="fig" x="582.4" y="172">3.7</text></g>
      <text class="small" x="206" y="204" style="text-anchor: end">Reboot and IP</text>
      <path class="line in-1" d="M220 204 H532.8"/>
      <g class="in-5"><rect class="chunk" x="532.8" y="196" width="82.8" height="16"/><text class="fig" x="637.6" y="204">4.3</text></g>
      <text class="small" x="206" y="236" style="text-anchor: end">Server size</text>
      <path class="line in-1" d="M220 236 H560.4"/>
      <g class="in-6"><rect class="hit" x="560.4" y="228" width="174.8" height="16"/><text class="fig" x="757.2" y="236">5.6</text></g>
      <text class="small" x="206" y="268" style="text-anchor: end">Promo credits</text>
      <path class="line in-1" d="M220 268 H615.6"/>
      <g class="in-7"><rect class="chunk" x="615.6" y="260" width="101.2" height="16"/><text class="fig" x="738.8" y="268">5.4</text></g>
      <path class="edge" d="M220 300 H772"/>
      <path class="edge" d="M220 300 V306"/><text class="fig" x="220" y="320">0 s</text>
      <path class="edge" d="M312 300 V306"/><text class="fig" x="312" y="320">1 s</text>
      <path class="edge" d="M404 300 V306"/><text class="fig" x="404" y="320">2 s</text>
      <path class="edge" d="M496 300 V306"/><text class="fig" x="496" y="320">3 s</text>
      <path class="edge" d="M588 300 V306"/><text class="fig" x="588" y="320">4 s</text>
      <path class="edge" d="M680 300 V306"/><text class="fig" x="680" y="320">5 s</text>
      <path class="edge" d="M772 300 V306"/><text class="fig" x="772" y="320">6 s</text>
      <g class="in-8"><path class="hit-line" d="M735.2 28 V300"/><text class="fig" x="735.2" y="20">wall 5.6 s</text></g>
      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-semaphore-cap">
    <li><button type="button" data-tok="220.0,300">Start</button><span>gather creates eight tasks. The semaphore lets two in: refund time and annual billing are sent; six wait.</span></li>
    <li><button type="button" data-tok="293.6,300">0.8 s</button><span>Annual billing returns and frees a slot. Server down, the slowest call, is sent.</span></li>
    <li><button type="button" data-tok="330.4,300">1.2 s</button><span>Refund time returns. Export after cancel takes its slot.</span></li>
    <li><button type="button" data-tok="422.4,300">2.2 s</button><span>Export after cancel returns. Support speed is sent.</span></li>
    <li><button type="button" data-tok="532.8,300">3.4 s</button><span>Server down returns after 2.6 s in flight. Reboot and IP is sent.</span></li>
    <li><button type="button" data-tok="560.4,300">3.7 s</button><span>Support speed returns. Server size is sent; it will end last.</span></li>
    <li><button type="button" data-tok="615.6,300">4.3 s</button><span>Reboot and IP returns. Promo credits, the last in the queue, is sent after waiting 4.3 s.</span></li>
    <li><button type="button" data-tok="735.2,300">5.6 s</button><span>Server size returns and gather hands back all eight answers: 5.6 s, against 11.0 s one at a time.</span></li>
  </ol>
</figure>
