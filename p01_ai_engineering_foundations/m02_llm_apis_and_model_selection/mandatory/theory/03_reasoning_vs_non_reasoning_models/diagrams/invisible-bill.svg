<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One o4-mini call: what you read and what you pay for</title>
  <desc id="d">Bars to scale for one o4-mini call on the first problem of lesson 2.4, with 700 reasoning tokens (the lab’s medium setting) at the notebook’s prices. Tokens: 38 prompt, 700 reasoning, 3 visible answer. Cost: $0.000042 for the prompt, $0.003080 for reasoning, $0.000013 for the answer, $0.003135 in all. An estimate from the prompt and the reply text gives $0.000055, 57 times less than the bill.</desc>
  <rect width="800" height="330" fill="#e5eaef"/>
  <rect width="800" height="2" fill="#060e15"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#060e15">One o4-mini call: what you read and what you pay for</text>
  <text x="28" y="60" font-size="13" fill="#3b434b">Lesson 2.4’s first problem, 700 reasoning tokens (the lab’s medium setting), the notebook’s prices</text>

  <text x="60" y="98" font-size="14" font-weight="600" fill="#060e15">Tokens</text>
  <rect x="60" y="106" width="35.9" height="36" fill="#a1a9af"/>
  <rect x="95.9" y="106" width="661.3" height="36" fill="#f0ccdc" stroke="#970d63" stroke-width="1"/>
  <rect x="757.2" y="106" width="2.8" height="36" fill="#060e15"/>
  <text x="426" y="129" font-size="14" text-anchor="middle" fill="#060e15">reasoning: 700, never returned</text>
  <text x="60" y="162" font-size="13" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, monospace">prompt 38</text>
  <text x="760" y="162" font-size="13" text-anchor="end" fill="#060e15" font-family="'IBM Plex Mono', ui-monospace, monospace">answer 3</text>

  <text x="60" y="206" font-size="14" font-weight="600" fill="#060e15">Cost of the call</text>
  <rect x="60" y="214" width="9.3" height="36" fill="#a1a9af"/>
  <rect x="69.3" y="214" width="687.7" height="36" fill="#f0ccdc" stroke="#970d63" stroke-width="1"/>
  <rect x="757.1" y="214" width="2.9" height="36" fill="#060e15"/>
  <text x="413" y="237" font-size="14" text-anchor="middle" fill="#060e15">reasoning: $0.003080, 98% of the bill</text>
  <text x="60" y="270" font-size="13" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, monospace">prompt $0.000042</text>
  <text x="760" y="270" font-size="13" text-anchor="end" fill="#060e15" font-family="'IBM Plex Mono', ui-monospace, monospace">answer $0.000013</text>

  <text x="60" y="308" font-size="14" fill="#060e15">Priced from the prompt and the reply text: $0.000055. Billed: $0.003135, <tspan fill="#970d63" font-weight="700">57 times more</tspan>.</text>
</svg>
