<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     One turn of the 34.3 capstone agent on the Larkspur example: ids in, four namespaces preloaded, a fact upserted, an episode appended.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the turn marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-memturn-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One turn of a memory agent, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-memturn-title anim-memturn-desc">
      <title id="anim-memturn-title">One turn of a memory agent</title>
      <desc id="anim-memturn-desc">A request arrives with a thread id and trusted context. The agent preloads four store namespaces: session, procedures, semantic facts and episodes. The model answers and may upsert a fact under a stable key. After the answer a graph node appends an episode and prunes old ones. On the next visit a new thread reads the same namespaces again.</desc>
      <defs>
        <marker id="ah-memturn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">One turn</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">The store</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- the turn -->
      <g class="n-1 n-7"><rect class="box" x="24" y="56" width="120" height="44"/><text class="label" x="84" y="78">Request</text></g>
      <g class="n-2"><rect class="box" x="184" y="56" width="120" height="44"/><text class="label" x="244" y="78">Read</text></g>
      <g class="n-3 n-4"><rect class="box" x="344" y="56" width="120" height="44"/><text class="label" x="404" y="78">Model</text></g>
      <g class="n-5"><rect class="box" x="504" y="56" width="120" height="44"/><text class="label" x="564" y="78">Answer</text></g>
      <g class="n-6"><rect class="box" x="664" y="56" width="120" height="44"/><text class="label" x="724" y="78">Record</text></g>
      <path class="edge e-2" d="M144 78 H181" marker-end="url(#ah-memturn)"/>
      <path class="edge e-3" d="M304 78 H341" marker-end="url(#ah-memturn)"/>
      <path class="edge e-5" d="M464 78 H501" marker-end="url(#ah-memturn)"/>
      <path class="edge e-6" d="M624 78 H661" marker-end="url(#ah-memturn)"/>

      <g class="in-1"><text class="small" x="84" y="124">thread_id + context</text></g>
      <g class="in-3"><text class="small" x="404" y="124">system prompt</text></g>
      <g class="in-6"><text class="small" x="724" y="124">append, prune</text></g>

      <!-- reads: every namespace into the agent node -->
      <path class="edge dashed e-2 e-7" d="M110 236 C110 180 214 160 214 103" marker-end="url(#ah-memturn)"/>
      <path class="edge dashed e-2 e-7" d="M298 236 C298 180 234 160 234 103" marker-end="url(#ah-memturn)"/>
      <path class="edge dashed e-2 e-7" d="M494 236 C494 170 254 170 254 103" marker-end="url(#ah-memturn)"/>
      <path class="edge dashed e-2 e-7" d="M694 236 C694 160 274 180 274 103" marker-end="url(#ah-memturn)"/>
      <!-- writes -->
      <path class="edge e-4" d="M434 100 C434 150 470 180 470 233" marker-end="url(#ah-memturn)"/>
      <path class="edge e-6" d="M724 100 C724 150 716 190 716 233" marker-end="url(#ah-memturn)"/>

      <!-- namespaces -->
      <g class="n-2"><rect class="box" x="24" y="236" width="172" height="88"/>
        <text class="fig" x="110" y="256">session, visit</text><text class="small" x="110" y="278">app writes, TTL</text></g>
      <g class="n-2"><rect class="box" x="212" y="236" width="172" height="88"/>
        <text class="fig" x="298" y="256">procedures, agent</text><text class="small" x="298" y="278">human approves</text></g>
      <g class="n-2 n-4"><rect class="box" x="400" y="236" width="188" height="88"/>
        <text class="fig" x="494" y="256">semantic, user</text><text class="small" x="494" y="278">model upserts by key</text></g>
      <g class="n-2 n-6"><rect class="box" x="604" y="236" width="180" height="88"/>
        <text class="fig" x="694" y="256">episodic, user</text><text class="small" x="694" y="278">node appends</text></g>

      <!-- items already in each namespace -->
      <rect class="chunk" x="86" y="296" width="48" height="8"/>
      <rect class="chunk" x="274" y="296" width="48" height="8"/>
      <rect class="chunk" x="444" y="296" width="44" height="8"/><rect class="chunk" x="496" y="296" width="44" height="8"/>
      <rect class="chunk" x="620" y="296" width="44" height="8"/><rect class="chunk" x="672" y="296" width="44" height="8"/>
      <g class="in-4"><rect class="hit" x="548" y="296" width="28" height="8"/></g>
      <g class="in-6"><rect class="hit" x="724" y="296" width="44" height="8"/></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-memturn-cap">
    <li><button type="button" data-tok="84,44">Request</button><span>Dana opens a new chat. The server puts the thread id in config and her user, session and agent ids in context.</span></li>
    <li><button type="button" data-tok="244,44">Read</button><span>The agent node preloads four namespaces: this visit’s session item, the approved procedures, her facts and her newest episodes.</span></li>
    <li><button type="button" data-tok="404,44">Model</button><span>The model answers with all of that in its system prompt.</span></li>
    <li><button type="button" data-tok="562,300">Save fact</button><span>She mentions something durable, so the model calls save_user_fact and upserts it under a stable key.</span></li>
    <li><button type="button" data-tok="564,44">Answer</button><span>The final answer goes back to Dana.</span></li>
    <li><button type="button" data-tok="746,300">Record</button><span>A graph node summarises the turn, code checks it was a task, and the episode is appended; the oldest past three are pruned.</span></li>
    <li><button type="button" data-tok="84,44">Next visit</button><span>Days later a new thread starts empty, and the read step loads the same namespaces again.</span></li>
  </ol>
</figure>
