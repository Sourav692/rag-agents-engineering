# Copy for the forwarddeployedprep.com AI Engineering tracks (integration plan task UX-02).
#
# One entry per curriculum.yaml part. scripts/export_site_curriculum.py puts it into the site's
# track and section fields; everything else comes from curriculum.yaml, the theory pages and
# docs/fde-site-slugs.yaml. Short lines in the site's register, British spelling.
#
# forWhom, exitCompetencies -> the track; whyItMatters, outcomes, exercise, interviewRelevance ->
# its one section. The section's assessment and doneWhen are the same for every course track.
aifound:
  forWhom: Engineers new to LLM APIs; others skim and take the interview questions
  exitCompetencies:
    - Call commercial and open models from code and choose between them on cost, latency and quality
    - Explain when fine-tuning beats retrieval and what it costs
  whyItMatters: Every later part calls a model, handles its data and pays for its tokens.
  outcomes: Use Python data tools, call provider APIs, run Hugging Face models, judge fine-tuning
  exercise: Call one question through two providers and compare cost, latency and answer
  interviewRelevance: Model choice, cost and fine-tuning questions
prompting:
  forWhom: All technical paths
  exitCompetencies:
    - Write prompts that return structured, checkable output across models
    - Choose a prompt pattern for a task and test it on more than one model
  whyItMatters: Every LLM step in a RAG pipeline is a prompt, and most quality problems start there.
  outcomes: Apply the core prompt patterns, reasoning prompts and multimodal prompts
  exercise: Run one task through three prompt patterns and two models, and compare the results
  interviewRelevance: Prompt design and structured output questions
frameworks:
  forWhom: All technical paths
  exitCompetencies:
    - Build a chain in LCEL and a stateful graph in LangGraph
    - Add persistence, human approval and streaming to a graph
  whyItMatters: The later parts build every pipeline and agent in LangChain and LangGraph.
  outcomes: Compose models, prompts and parsers in LCEL; build LangGraph state, routing, checkpoints and interrupts
  exercise: Turn a chain into a LangGraph graph with a checkpoint and a human approval step
  interviewRelevance: Framework selection and state management questions
found:
  forWhom: All technical paths
  exitCompetencies:
    - Explain the four stages of a RAG pipeline and where each one fails
    - Build a baseline and measure every later change against it
  whyItMatters: RAG is the most-asked applied pattern, and every later change needs a baseline to beat.
  outcomes: Explain why retrieval exists, build a first pipeline, measure a baseline
  exercise: Build the baseline pipeline over the Larkspur handbook and record recall at k
  interviewRelevance: RAG design and debugging questions
ingest:
  forWhom: All technical paths
  exitCompetencies:
    - Design metadata, chunking and embedding for a messy corpus and justify each choice
    - Choose a vector store and keep its index in step with the source documents
  whyItMatters: Retrieval can only return what ingestion indexed, and most RAG failures start here.
  outcomes: Load and describe documents, chunk them, embed them, store and update the index
  exercise: Index a mixed folder of PDFs, pages and tables, then compare two chunking strategies
  interviewRelevance: Chunking, embedding and vector store questions
retrieval:
  forWhom: All technical paths
  exitCompetencies:
    - Combine keyword and vector search and fuse their rankings
    - Pick query transformation and reranking from a measured failure
  whyItMatters: The model answers from the top-k, so getting the right chunks there decides answer quality.
  outcomes: Use hybrid search and fusion, transform and route queries, rerank and compress results
  exercise: Take one failing question set and fix it with hybrid search, a query rewrite or a reranker
  interviewRelevance: Retrieval quality and debugging questions
apps:
  forWhom: All technical paths
  exitCompetencies:
    - Ship a RAG system that cites its sources per claim
    - Retrieve over tables, JSON and images as well as text
  whyItMatters: A demo answers questions; a product shows its sources, handles structured data and runs end to end.
  outcomes: Build complete RAG systems with citations, structured data, images and LlamaIndex
  exercise: Add per-claim citations to a RAG system and check each one against its source
  interviewRelevance: End-to-end RAG design questions
agents:
  forWhom: All technical paths
  exitCompetencies:
    - Build the agent loop by hand and with create_agent, with limits on every run
    - Choose between a fixed workflow and an agent for a task
  whyItMatters: Agentic RAG in the next part is built from exactly these loops, tools and patterns.
  outcomes: Build the agent loop and tools, ReAct agents, the five workflow patterns, planning and human approval
  exercise: Build one task as a workflow and as a ReAct agent, and compare calls, cost and failures
  interviewRelevance: Agent design and workflow-versus-agent questions
agentic_rag:
  forWhom: All technical paths
  exitCompetencies:
    - Add grading, rewriting and fallback to a retrieval pipeline
    - Decide when self-correction is worth its extra calls
  whyItMatters: Retrieval that checks and corrects itself is how production RAG handles the questions a baseline gets wrong.
  outcomes: Grade and rewrite, build CRAG and Self-RAG, route by query type, use RAG as an agent tool
  exercise: Add a relevance grader and a web fallback to the baseline, and measure what changes
  interviewRelevance: Agentic RAG and reliability questions
memory:
  forWhom: All technical paths
  exitCompetencies:
    - Give an agent short-term and long-term memory with a clear write and forget policy
    - Choose a multi-agent architecture only when one agent is not enough
  whyItMatters: Memory is retrieval over the agent's own history, and multi-agent systems are where coordination fails.
  outcomes: Build conversation and long-term memory, supervisors, swarms, parallel agents and deep agents
  exercise: Add cross-session memory to an agent, then split it into a supervisor and two workers
  interviewRelevance: Memory and multi-agent design questions
protocols:
  forWhom: All technical paths
  exitCompetencies:
    - Expose tools and retrieval as an MCP server and call it from a client
    - Explain what A2A adds when agents call other agents
  whyItMatters: Standard protocols let one retrieval service or agent serve many clients without custom glue.
  outcomes: Build MCP servers and clients, serve RAG over MCP, connect agents with A2A
  exercise: Wrap the course's retriever as an MCP server and call it from an agent
  interviewRelevance: MCP and agent interoperability questions
graph:
  forWhom: Engineers who want depth beyond flat-chunk retrieval
  exitCompetencies:
    - Pick a hierarchical or graph index for questions flat chunks cannot answer
  whyItMatters: Questions that span a whole corpus or follow relations need structure that flat chunks lack.
  outcomes: Build summary trees, memory-augmented retrieval, knowledge graphs and GraphRAG
  exercise: Answer a whole-corpus question with a summary tree and compare it with flat retrieval
  interviewRelevance: Advanced retrieval architecture questions
capstone:
  forWhom: Engineers preparing a portfolio project or a design round
  exitCompetencies:
    - Choose a RAG architecture for a real problem and defend the choice
  whyItMatters: Interviews ask you to pick a design and defend it, not to list every technique.
  outcomes: Compare the agentic RAG architectures side by side and choose one for a problem
  exercise: Choose an architecture for a real problem, build it and write up the trade-offs
  interviewRelevance: Design round questions
