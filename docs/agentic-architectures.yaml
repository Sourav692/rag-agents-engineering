# Patterns the course teaches that the upstream catalogue does not list. modules: curriculum.yaml module keys.
course_only:
- {area: Prompt-level reasoning, patterns: 'Zero- and few-shot chain-of-thought, self-consistency, least-to-most, ReAct prompting', repo: '02', modules: [prompting]}
- {area: LangGraph control primitives, patterns: 'Conditional routing, Command objects, subgraphs, retries, cycles, checkpointing, interrupt-based HITL patterns', repo: '04', modules: [lgcore, lgruntime]}
- {area: Workflow patterns, patterns: 'Prompt chaining, routing, parallelization, orchestrator–worker, evaluator–optimizer', repo: '06', modules: [workflows]}
- {area: Multi-agent topologies, patterns: 'Network, agents-as-tools (tool-calling supervisor), hierarchical teams, handoffs, swarm', repo: '08', modules: [multiagent]}
- {area: Async multi-agent, patterns: 'Send map-reduce, async nodes, streaming', repo: '08', modules: [collab]}
- {area: Deep agents, patterns: 'Orchestrator with sub-agents, skills, long-term memory and an execution backend', repo: '08', modules: [multiagentapps]}
- {area: Conversation & persistent memory, patterns: 'Buffer/window/summary memory, checkpointed threads, cross-thread store, procedural memory', repo: '08', modules: [convmemory, ltmemory]}
- {area: Human-in-the-loop middleware, patterns: 'Approval through LangChain 1.x middleware and interrupts', repo: '06', modules: [react]}
- {area: Planning variants, patterns: 'Deep-research planner, reflective dynamic planning', repo: '06', modules: [planning]}
- {area: RAG-specific agent patterns, patterns: 'Multi-knowledge-base router RAG, RAG as an agent tool, Reliable RAG, retrieval feedback loop', repo: '09', modules: [adaptive, ragtool, reliability]}
- {area: Agent protocols, patterns: 'MCP servers and clients, remote MCP servers, RAG over MCP, A2A agent-to-agent calls, cross-framework interop', repo: '10', modules: [mcpfound, mcpbuild, mcpapps, a2a]}
# In the upstream repo but not in the course: engineering extras, not architectures.
upstream_only:
- {name: Benchmark harness, detail: Per-task leaderboard comparing all architectures on the same tasks}
- {name: Deterministic-picker pattern, detail: One documented technique reused across architectures to make outputs reproducible}
- {name: Packaged library, detail: 'Architectures as an installable package with provider switching, evaluators, tracing and a UI'}
housekeeping:
- '`docs/patterns/all-agentic-architectures-overview.md` in repo 06 (archived here under `docs/source/06/patterns/`) is a copy of an older upstream README. It lists only the first 17 architectures (#1–#17), although #18–#35 are all taught. Repo 06 is archived, so that copy stays as provenance; this page is the current list.'
