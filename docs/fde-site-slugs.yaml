# Frozen ids for the forwarddeployedprep.com AI Engineering topic (integration plan task PM-02).
#
# The site's progress keys (fd:v1:learn:...) and URLs are built from these slugs, so a published
# slug never changes, even when a title in curriculum.yaml does. Rename a part, module or lesson
# there and keep its slug here; tests/test_course.py fails until every module and lesson has one.
#
# tracks:  curriculum.yaml part key -> site track slug, display code and its one section's slug.
#          llm-and-retrieval (T5) and agentic-systems (T9) are existing site tracks, reused.
#          Codes are display labels in the site's Learn order (T0 to T19 across all groups), so
#          they may change when the site reorders tracks; slugs never do.
# modules: curriculum.yaml module key -> site module slug, and lesson title -> lesson slug.
#          Five slugs belong to retired site modules and pass to their successors: lgcore,
#          lifecycle, chunking, hybrid and ltmemory. `overview` and `interview` are the slugs of the two
#          pages split from the module README; notebook-only lessons get a slug too, for when they get a page.
#          The site keys lessons by slug alone, so every lesson slug here is unique across the whole site.
