<!-- Animated version of the Mental model sequence diagram in ../README.md, used by index.html.
     Message names and the answer's location are the ones recorded from a2a-sdk 0.3.26 in the M41 lab (handbook agent).
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-handshake-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The A2A exchange, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 356" role="img" aria-labelledby="anim-handshake-title anim-handshake-desc">
      <title id="anim-handshake-title">One A2A exchange, from discovery to reply</title>
      <desc id="anim-handshake-desc">The support desk agent fetches the handbook agent’s Agent Card, then sends message/send. The A2A server calls the AgentExecutor, which publishes a Task in submitted and then working, runs the handbook graph, and publishes completed. The server returns the Task with the answer in status.message.</desc>
      <defs>
        <marker id="ah-handshake" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <path class="lane" d="M100 60 V346"/>
      <path class="lane" d="M300 60 V346"/>
      <path class="lane" d="M500 60 V346"/>
      <path class="lane" d="M700 60 V346"/>

      <g class="n-1 n-2 n-6"><rect class="box" x="20" y="14" width="160" height="46"/><text class="label" x="100" y="37">Support desk agent</text></g>
      <g class="n-1 n-2 n-3 n-5 n-6"><rect class="box" x="220" y="14" width="160" height="46"/><text class="label" x="300" y="37">A2A server</text></g>
      <g class="n-2 n-3 n-4 n-5"><rect class="box" x="420" y="14" width="160" height="46"/><text class="label" x="500" y="37">AgentExecutor</text></g>
      <g class="n-4"><rect class="box" x="620" y="14" width="160" height="46"/><text class="label" x="700" y="37">Handbook graph</text></g>

      <g class="in-1">
        <text class="fig" x="200" y="84">GET agent-card.json</text>
        <path class="edge e-1" d="M100 96 H297" marker-end="url(#ah-handshake)"/>
        <text class="small" x="200" y="114">Agent Card</text>
        <path class="edge dashed e-1" d="M300 126 H103" marker-end="url(#ah-handshake)"/>
      </g>

      <g class="in-2">
        <text class="fig" x="200" y="152">message/send</text>
        <path class="edge e-2" d="M100 164 H297" marker-end="url(#ah-handshake)"/>
        <text class="fig" x="400" y="174">execute()</text>
        <path class="edge e-2" d="M300 186 H497" marker-end="url(#ah-handshake)"/>
      </g>

      <g class="in-3">
        <text class="small" x="400" y="204">Task: submitted, working</text>
        <path class="edge dashed e-3" d="M500 216 H303" marker-end="url(#ah-handshake)"/>
      </g>

      <g class="in-4">
        <text class="fig" x="600" y="236">invoke(question)</text>
        <path class="edge e-4" d="M500 248 H697" marker-end="url(#ah-handshake)"/>
        <text class="small" x="600" y="264">answer</text>
        <path class="edge dashed e-4" d="M700 276 H503" marker-end="url(#ah-handshake)"/>
      </g>

      <g class="in-5">
        <text class="small" x="400" y="294">status-update: completed</text>
        <path class="edge dashed e-5" d="M500 306 H303" marker-end="url(#ah-handshake)"/>
      </g>

      <g class="in-6">
        <text class="small" x="200" y="324">Task, answer in status.message</text>
        <path class="edge dashed e-6" d="M300 336 H103" marker-end="url(#ah-handshake)"/>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-handshake-cap">
    <li><button type="button" data-tok="110,126">Discover</button><span>The caller knows one base URL. It fetches the Agent Card and reads the skills and the streaming flag.</span></li>
    <li><button type="button" data-tok="490,186">Send</button><span>It posts message/send with the question. The server hands the request to the AgentExecutor.</span></li>
    <li><button type="button" data-tok="310,216">Working</button><span>The executor publishes a Task in submitted, then a working update, before any model runs.</span></li>
    <li><button type="button" data-tok="510,276">Graph</button><span>The executor invokes the handbook graph. The server never sees which framework built it.</span></li>
    <li><button type="button" data-tok="310,306">Completed</button><span>The executor publishes completed, with the answer as the status message.</span></li>
    <li><button type="button" data-tok="110,336">Reply</button><span>The caller gets the Task back, with the answer in status.message.</span></li>
  </ol>
</figure>
