<!-- Animated version of the RAG over MCP flowchart in ../README.md, used by index.html.
     Settings are the 06 server's own: chunks of 4,096 characters with 409 of overlap, retrieve(query, n=5), Chroma's default squared L2 distance.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-ragmcp-cap">
  <div class="anim__canvas" tabindex="0" aria-label="RAG over MCP, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-ragmcp-title anim-ragmcp-desc">
      <title id="anim-ragmcp-title">RAG over MCP</title>
      <desc id="anim-ragmcp-desc">The 06 server ingests a PDF once: it splits the text into chunks of 4,096 characters with 409 of overlap, embeds them and stores them in Chroma. Later a user asks the host a question, the model calls the retrieve tool with n = 5, the server finds the five nearest chunks by squared L2 distance, reports 1 minus the distance as “similarity_score”, and returns one JSON result that the model answers from.</desc>
      <defs>
        <marker id="ah-ragmcp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Host: the model and the MCP client</text>
      <rect class="lane" x="8" y="28" width="784" height="124"/>
      <text class="lane-label" x="16" y="200">06 server, over stdio</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- host -->
      <g class="n-2"><rect class="box" x="30" y="60" width="130" height="44"/><text class="label" x="95" y="82">Question</text></g>
      <g class="n-3 n-6"><rect class="box" x="300" y="60" width="150" height="44"/><text class="label" x="375" y="82">Model</text></g>
      <g class="n-7"><rect class="box" x="630" y="60" width="130" height="44"/><text class="label" x="695" y="82">Answer</text></g>
      <path class="edge e-2 in-2" d="M160 82 H297" marker-end="url(#ah-ragmcp)"/>
      <path class="edge e-7 in-7" d="M450 82 H627" marker-end="url(#ah-ragmcp)"/>

      <!-- server -->
      <g class="n-3 n-5">
        <rect class="box" x="290" y="240" width="170" height="56"/>
        <text class="label" x="375" y="258">retrieve</text>
        <text class="small" x="375" y="280">(query, n = 5)</text>
      </g>
      <g class="n-4">
        <path class="box" d="M500 240 a60 10 0 0 0 120 0 v56 a60 10 0 0 1 -120 0 z"/>
        <ellipse class="box" cx="560" cy="240" rx="60" ry="10"/>
        <text class="label" x="560" y="274">Chroma</text>
      </g>
      <g class="n-1">
        <rect class="box" x="650" y="240" width="130" height="56"/>
        <text class="label" x="715" y="258">ingest_pdf</text>
        <text class="small" x="715" y="280">4,096 / 409</text>
      </g>
      <path class="edge e-1 in-1" d="M650 268 H623" marker-end="url(#ah-ragmcp)"/>
      <text class="small in-1" x="715" y="318">chunks, embedded</text>

      <path class="edge e-3 in-3" d="M360 104 V237" marker-end="url(#ah-ragmcp)"/>
      <text class="small in-3" x="300" y="176">tools/call</text>
      <path class="edge e-4 in-4" d="M460 268 H497" marker-end="url(#ah-ragmcp)"/>
      <text class="small in-4" x="560" y="326">5 nearest, squared L2</text>
      <text class="fig in-5" x="375" y="318">1 − distance</text>
      <path class="edge dashed e-6 in-6" d="M390 240 V107" marker-end="url(#ah-ragmcp)"/>
      <text class="small in-6" x="460" y="176">JSON result</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-ragmcp-cap">
    <li><button type="button" data-tok="650,240">Ingest</button><span>The model calls ingest_pdf once per document. The server splits the text into 4,096-character chunks with 409 characters of overlap, embeds them and upserts them into Chroma.</span></li>
    <li><button type="button" data-tok="30,60">Question</button><span>Later, a user asks the host a question.</span></li>
    <li><button type="button" data-tok="300,60">Call</button><span>The model picks retrieve and writes the query. The host sends tools/call with that query and n = 5.</span></li>
    <li><button type="button" data-tok="500,240">Search</button><span>The server embeds the query and asks Chroma for the five nearest chunks by squared L2 distance.</span></li>
    <li><button type="button" data-tok="290,240">Score</button><span>It reports each distance as “similarity_score”, 1 − distance: the field every client reads.</span></li>
    <li><button type="button" data-tok="300,60">Result</button><span>Text, metadata and both scores go back as one JSON tool result.</span></li>
    <li><button type="button" data-tok="630,60">Answer</button><span>The model answers from the chunks it was given.</span></li>
  </ol>
</figure>
