<!-- Animated version of the adaptive RAG flowchart in ../README.md, used by index.html.
     The graph is the 03a notebook's: route_user_query, grade_documents (RELEVANCE_THRESHOLD = 0.5), web_search, grade_hallucinations.
     The run shown is one path through it, with no figures, since the notebook ships without outputs.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-adaptive-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The adaptive RAG graph, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 880 330" role="img" aria-labelledby="anim-adaptive-title anim-adaptive-desc">
      <title id="anim-adaptive-title">The adaptive RAG graph</title>
      <desc id="anim-adaptive-desc">A question about tuning Postgres memory on a Larkspur server is routed to the vector store, rewritten and retrieved. The grader finds half or fewer of the chunks relevant, so the graph rewrites the question for the web and searches with Tavily. The answer is generated from the surviving chunks and the web pages, checked for hallucinations, and returned. A hallucinated answer would loop back to generation with the grader's feedback.</desc>
      <defs>
        <marker id="ah-adaptive" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- vector store path -->
      <g class="n-1"><rect class="box" x="20" y="28" width="120" height="44"/><text class="label" x="80" y="50">Question</text></g>
      <g class="in-1">
        <rect class="doc" x="20" y="96" width="120" height="40"/>
        <text class="small" x="80" y="110">tune Postgres</text>
        <text class="small" x="80" y="126">memory?</text>
      </g>
      <path class="edge e-1" d="M140 50 H167" marker-end="url(#ah-adaptive)"/>
      <g class="n-1">
        <path class="box" d="M220 16 L270 50 L220 84 L170 50 Z"/>
        <text class="small" x="220" y="50">Source?</text>
      </g>
      <path class="edge e-2" d="M270 50 H307" marker-end="url(#ah-adaptive)"/>
      <g class="n-2"><rect class="box" x="310" y="28" width="140" height="44"/><text class="label" x="380" y="50">Rewrite</text></g>
      <path class="edge e-3" d="M450 50 H477" marker-end="url(#ah-adaptive)"/>
      <g class="n-3"><rect class="box" x="480" y="28" width="140" height="44"/><text class="label" x="550" y="50">Retrieve</text></g>
      <g class="in-3">
        <rect class="chunk" x="520" y="80" width="60" height="5"/><rect class="chunk" x="520" y="87" width="60" height="5"/>
        <rect class="chunk" x="520" y="94" width="60" height="5"/><rect class="chunk" x="520" y="101" width="60" height="5"/>
        <rect class="chunk" x="520" y="108" width="60" height="5"/>
      </g>
      <path class="edge e-4" d="M620 50 H637" marker-end="url(#ah-adaptive)"/>
      <g class="n-4">
        <path class="box" d="M700 14 L760 50 L700 86 L640 50 Z"/>
        <text class="small" x="700" y="50">Grade</text>
      </g>
      <path class="edge" d="M760 50 H800 V157" marker-end="url(#ah-adaptive)"/>
      <text class="small" x="818" y="100">yes</text>

      <!-- web path -->
      <path class="edge e-5" d="M700 86 V118 H380 V157" marker-end="url(#ah-adaptive)"/>
      <text class="small" x="716" y="104">no</text>
      <path class="edge" d="M220 84 V182 H307" marker-end="url(#ah-adaptive)"/>
      <text class="small" x="244" y="140">web</text>
      <g class="n-5"><rect class="box" x="310" y="160" width="140" height="44"/><text class="label" x="380" y="182">Rewrite</text></g>
      <path class="edge e-5" d="M450 182 H507" marker-end="url(#ah-adaptive)"/>
      <g class="n-5"><rect class="box" x="510" y="160" width="140" height="44"/><text class="label" x="580" y="182">Web search</text></g>
      <path class="edge e-6" d="M650 182 H737" marker-end="url(#ah-adaptive)"/>

      <!-- generate and check -->
      <g class="n-6"><rect class="box" x="740" y="160" width="120" height="44"/><text class="label" x="800" y="182">Generate</text></g>
      <path class="edge e-7" d="M800 204 V245" marker-end="url(#ah-adaptive)"/>
      <g class="n-7">
        <path class="box" d="M800 248 L860 282 L800 316 L740 282 Z"/>
        <text class="small" x="800" y="282">Grounded?</text>
      </g>
      <path class="edge dashed" d="M860 282 H874 V182 H863" marker-end="url(#ah-adaptive)"/>
      <text class="small" x="842" y="230">retry</text>
      <path class="edge e-8" d="M740 282 H683" marker-end="url(#ah-adaptive)"/>
      <g class="n-8"><rect class="box" x="560" y="260" width="120" height="44"/><text class="label" x="620" y="282">Answer</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-adaptive-cap">
    <li><button type="button" data-tok="20,28">Route</button><span>A customer asks how to tune Postgres memory on a Larkspur server. The source classifier reads “server” and “memory”, which the handbook covers, and picks the vector store.</span></li>
    <li><button type="button" data-tok="310,28">Rewrite</button><span>An LLM rewrites the question for semantic search.</span></li>
    <li><button type="button" data-tok="480,28">Retrieve</button><span>The retriever returns up to five chunks that score 0.35 or more.</span></li>
    <li><button type="button" data-tok="640,14">Grade</button><span>An LLM grades each chunk yes or no. Half or fewer pass, so the graph sets web_search_needed and keeps only the chunks that passed.</span></li>
    <li><button type="button" data-tok="310,160">Web</button><span>The question is rewritten for a search engine and sent to Tavily, which returns up to six pages.</span></li>
    <li><button type="button" data-tok="740,160">Generate</button><span>The model answers from the surviving chunks and the web pages together.</span></li>
    <li><button type="button" data-tok="740,248">Check</button><span>A second LLM call grades the answer against those documents. A hallucinated answer goes back to Generate with the grader’s feedback.</span></li>
    <li><button type="button" data-tok="560,260">Answer</button><span>This answer is grounded, so the graph ends.</span></li>
  </ol>
</figure>
