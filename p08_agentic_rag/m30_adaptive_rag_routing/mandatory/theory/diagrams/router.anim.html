<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The routing rule and the retriever settings are the 01a notebook's: determine_route, k = 3, score_threshold = 0.2.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-router-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The support router, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 880 300" role="img" aria-labelledby="anim-router-title anim-router-desc">
      <title id="anim-router-title">The support router</title>
      <desc id="anim-router-desc">A Larkspur ticket is classified twice, once for its category and once for its sentiment. A negative ticket goes to a human agent. Any other ticket is routed by category to the billing, technical or general knowledge base, where retrieval is filtered to that category and returns at most three chunks scoring 0.2 or more.</desc>
      <defs>
        <marker id="ah-router" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="16" y="140" width="110" height="44"/><text class="label" x="71" y="162">Ticket</text></g>
      <g class="in-1">
        <rect class="doc" x="16" y="196" width="110" height="40"/>
        <text class="small" x="71" y="210">charged for my</text>
        <text class="small" x="71" y="226">annual plan?</text>
      </g>

      <path class="edge e-2" d="M126 162 H163" marker-end="url(#ah-router)"/>
      <g class="n-2"><rect class="box" x="166" y="140" width="130" height="44"/><text class="label" x="231" y="162">Category</text></g>
      <text class="fig in-2" x="231" y="206">Billing</text>

      <path class="edge e-3" d="M296 162 H333" marker-end="url(#ah-router)"/>
      <g class="n-3"><rect class="box" x="336" y="140" width="130" height="44"/><text class="label" x="401" y="162">Sentiment</text></g>
      <text class="fig in-3" x="401" y="206">Neutral</text>

      <path class="edge e-4" d="M466 162 H503" marker-end="url(#ah-router)"/>
      <g class="n-4">
        <path class="box" d="M556 126 L606 162 L556 198 L506 162 Z"/>
        <text class="small" x="556" y="162">Route</text>
      </g>

      <!-- the escalation branch is checked first -->
      <path class="edge dashed" d="M556 126 V52 H653" marker-end="url(#ah-router)"/>
      <text class="small" x="600" y="40">negative</text>
      <rect class="box" x="656" y="30" width="130" height="44"/><text class="label" x="721" y="52">Human agent</text>

      <path class="edge e-4 e-5" d="M606 162 C630 162 630 130 653 130" marker-end="url(#ah-router)"/>
      <path class="edge" d="M606 162 C630 162 630 180 653 180" marker-end="url(#ah-router)"/>
      <path class="edge" d="M606 162 C630 162 630 230 653 230" marker-end="url(#ah-router)"/>
      <g class="n-5 n-6"><rect class="box" x="656" y="110" width="130" height="40"/><text class="label" x="721" y="130">Billing KB</text></g>
      <rect class="box" x="656" y="160" width="130" height="40"/><text class="label" x="721" y="180">Technical KB</text>
      <rect class="box" x="656" y="210" width="130" height="40"/><text class="label" x="721" y="230">General KB</text>
      <text class="fig in-5" x="556" y="272">filter: category = billing</text>

      <g class="mv-6" style="--from: translate(-60px, 0px)">
        <rect class="hit" x="800" y="112" width="56" height="8"/>
        <rect class="hit" x="800" y="126" width="56" height="8"/>
        <rect class="hit" x="800" y="140" width="56" height="8"/>
      </g>
      <text class="fig in-6" x="828" y="172">k ≤ 3</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-router-cap">
    <li><button type="button" data-tok="16,140">Ticket</button><span>A customer asks “When will I be charged for my annual plan?”</span></li>
    <li><button type="button" data-tok="166,140">Category</button><span>One LLM call with structured output picks Billing, Technical or General.</span></li>
    <li><button type="button" data-tok="336,140">Sentiment</button><span>A second call picks Positive, Neutral or Negative.</span></li>
    <li><button type="button" data-tok="506,126">Route</button><span>The router checks sentiment first: a negative ticket goes to a human. This one goes by category.</span></li>
    <li><button type="button" data-tok="656,110">Filter</button><span>Retrieval runs on the shared index with a metadata filter, so only billing chunks can come back.</span></li>
    <li><button type="button" data-tok="800,112">Retrieve</button><span>The retriever returns at most three chunks scoring 0.2 or more, and the billing prompt answers from them.</span></li>
  </ol>
</figure>
