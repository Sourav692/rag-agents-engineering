<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The call counts are the M29 lab's own: the export question at k = 5.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-correction-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Where CRAG and Self-RAG correct, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 340" role="img" aria-labelledby="anim-correction-title anim-correction-desc">
      <title id="anim-correction-title">Where CRAG and Self-RAG correct</title>
      <desc id="anim-correction-desc">A question is retrieved against, then the chunks are graded. When too few are relevant the context is fixed: CRAG rewrites and searches the web, Self-RAG rewrites and retrieves again. The model generates, and Self-RAG then checks the answer for groundedness and usefulness, sending a failure back to the fix. On the export question at k = 5 the baseline makes 1 LLM call, CRAG 7 and Self-RAG 9.</desc>
      <defs>
        <marker id="ah-cp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- main line -->
      <g class="n-1"><rect class="box" x="16" y="60" width="100" height="44"/><text class="label" x="66" y="82">Question</text></g>
      <g class="n-2"><rect class="box" x="146" y="60" width="110" height="44"/><text class="label" x="201" y="82">Retrieve</text></g>
      <g class="n-3"><path class="box" d="M330 47 L390 82 L330 117 L270 82 Z"/><text class="label" x="330" y="82">Relevant?</text></g>
      <g class="n-5"><rect class="box" x="430" y="60" width="110" height="44"/><text class="label" x="485" y="82">Generate</text></g>
      <g class="n-6">
        <path class="box" d="M620 47 L680 82 L620 117 L560 82 Z"/>
        <text class="small" x="620" y="74">Grounded,</text><text class="small" x="620" y="92">useful?</text>
      </g>
      <g class="n-7"><rect class="box" x="704" y="60" width="84" height="44"/><text class="label" x="746" y="82">Answer</text></g>

      <path class="edge e-2" d="M116 82 H143" marker-end="url(#ah-cp)"/>
      <path class="edge e-3" d="M256 82 H267" marker-end="url(#ah-cp)"/>
      <path class="edge e-5" d="M390 82 H427" marker-end="url(#ah-cp)"/>
      <text class="small" x="409" y="66">yes</text>
      <path class="edge e-6" d="M540 82 H557" marker-end="url(#ah-cp)"/>
      <path class="edge e-7" d="M680 82 H701" marker-end="url(#ah-cp)"/>
      <text class="small" x="692" y="66">yes</text>

      <!-- the fix -->
      <g class="n-4">
        <rect class="box" x="300" y="200" width="260" height="68"/>
        <text class="label" x="430" y="218">Fix the context</text>
        <text class="small" x="430" y="238">CRAG: rewrite, search the web</text>
        <text class="small" x="430" y="256">Self-RAG: rewrite, retrieve again</text>
      </g>
      <path class="edge e-4" d="M330 117 V197" marker-end="url(#ah-cp)"/>
      <text class="small" x="344" y="160">no</text>
      <path class="edge e-5" d="M485 200 V107" marker-end="url(#ah-cp)"/>
      <path class="edge dashed e-6" d="M620 117 V234 H563" marker-end="url(#ah-cp)"/>
      <text class="small" x="634" y="160">no</text>

      <!-- what appears at each step -->
      <g class="in-1"><text class="small" x="66" y="126">export my data</text><text class="small" x="66" y="144">after I cancel?</text></g>
      <g class="in-2">
        <rect class="chunk" x="177" y="120" width="48" height="6"/><rect class="chunk" x="177" y="130" width="48" height="6"/>
        <rect class="chunk" x="177" y="140" width="48" height="6"/><rect class="chunk" x="177" y="150" width="48" height="6"/>
        <rect class="chunk" x="177" y="160" width="48" height="6"/>
        <text class="fig" x="201" y="184">k = 5</text>
      </g>
      <text class="small in-3" x="201" y="232">one call per chunk</text>
      <text class="small in-6" x="716" y="160">Self-RAG only</text>
      <g class="in-7">
        <text class="fig" x="400" y="310">export question, k = 5: baseline 1 call, CRAG 7, Self-RAG 9</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-correction-cap">
    <li><button type="button" data-tok="16,60">Question</button><span>A customer asks “Can I export my data after I cancel my plan?”</span></li>
    <li><button type="button" data-tok="146,60">Retrieve</button><span>The retriever returns the top k chunks, here five.</span></li>
    <li><button type="button" data-tok="270,47">Grade</button><span>CRAG and Self-RAG grade each chunk, one LLM call per chunk.</span></li>
    <li><button type="button" data-tok="300,200">Fix</button><span>When too few chunks pass, the context is fixed. CRAG rewrites the question and searches the web; Self-RAG rewrites it and retrieves again.</span></li>
    <li><button type="button" data-tok="430,60">Generate</button><span>The model answers from the context that survived.</span></li>
    <li><button type="button" data-tok="560,47">Check</button><span>Self-RAG grades the answer twice more: is it grounded in the chunks, and is it useful? A no goes back round.</span></li>
    <li><button type="button" data-tok="704,60">Answer</button><span>The answer goes out. On this question at k = 5 the baseline made 1 LLM call, CRAG 7 and Self-RAG 9.</span></li>
  </ol>
</figure>
