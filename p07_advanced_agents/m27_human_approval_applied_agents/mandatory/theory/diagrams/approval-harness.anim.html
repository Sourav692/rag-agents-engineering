<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The fingerprint is the approval-gate lab's own, for the eu-west post with no edit after the preview.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the nodes in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-harness-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The approval harness, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-harness-title anim-harness-desc">
      <title id="anim-harness-title">The dry-run and approval harness</title>
      <desc id="anim-harness-desc">The agent proposes a status post, the dry run returns its preview and fingerprint c4e9e330698e, and the review node pauses the graph while the checkpointer holds the state. The reviewer answers approve and the run resumes. Approve leads to the fingerprint check, anything else to Cancel. At publish the fingerprint is recomputed, matches c4e9e330698e, and the post becomes post_1 in the feed; a mismatch would lead to Refuse.</desc>
      <defs>
        <marker id="ah-harness" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- main row -->
      <g class="n-1"><rect class="box" x="16" y="36" width="140" height="56"/><text class="label" x="86" y="56">Propose</text><text class="small" x="86" y="76">LLM drafts the post</text></g>
      <g class="n-2"><rect class="box" x="196" y="36" width="150" height="56"/><text class="label" x="271" y="56">Dry run</text><text class="small" x="271" y="76">preview + fingerprint</text></g>
      <g class="n-3 n-4"><rect class="box" x="386" y="36" width="140" height="56"/><text class="label" x="456" y="56">Review</text><text class="small" x="456" y="76">interrupt()</text></g>
      <path class="edge e-2" d="M156 64 H193" marker-end="url(#ah-harness)"/>
      <path class="edge e-3" d="M346 64 H383" marker-end="url(#ah-harness)"/>

      <g class="n-5"><path class="box" d="M626 30 L682 64 L626 98 L570 64 Z"/><text class="small" x="626" y="64">approve?</text></g>
      <path class="edge e-5" d="M526 64 H567" marker-end="url(#ah-harness)"/>
      <g><rect class="box" x="712" y="42" width="80" height="44"/><text class="label" x="752" y="64">Cancel</text></g>
      <path class="edge" d="M682 64 H709" marker-end="url(#ah-harness)"/>
      <text class="small" x="696" y="50">no</text>

      <g class="n-6"><path class="box" d="M626 146 L700 186 L626 226 L552 186 Z"/><text class="small" x="626" y="178">same</text><text class="small" x="626" y="194">fingerprint?</text></g>
      <path class="edge e-5" d="M626 98 V143" marker-end="url(#ah-harness)"/>
      <text class="small" x="644" y="121">yes</text>
      <g><rect class="box" x="722" y="164" width="72" height="44"/><text class="label" x="758" y="186">Refuse</text></g>
      <path class="edge" d="M700 186 H719" marker-end="url(#ah-harness)"/>
      <text class="small" x="710" y="172">no</text>

      <g class="n-7"><rect class="box" x="561" y="266" width="130" height="44"/><text class="label" x="626" y="288">Publish</text></g>
      <path class="edge e-7" d="M626 226 V263" marker-end="url(#ah-harness)"/>
      <text class="small" x="644" y="246">yes</text>

      <!-- under the main row -->
      <g class="in-1">
        <rect class="doc" x="66" y="148" width="40" height="46"/>
        <path class="line" d="M73 160 H99 M73 168 H99 M73 176 H93"/>
        <text class="small" x="86" y="212">eu-west post</text>
      </g>
      <text class="fig in-2" x="271" y="118">c4e9e330698e</text>

      <g class="in-3">
        <path class="box" d="M206 158 a65 9 0 0 0 130 0 v38 a65 9 0 0 1 -130 0 z"/>
        <ellipse class="box" cx="271" cy="158" rx="65" ry="9"/>
        <text class="label" x="271" y="182">Checkpoint</text>
        <path class="edge dashed e-3" d="M400 92 C400 130 360 150 339 166" marker-end="url(#ah-harness)"/>
      </g>
      <g class="n-4 in-3">
        <rect class="box" x="386" y="150" width="140" height="56"/>
        <text class="label" x="456" y="168">Reviewer</text>
        <path class="edge e-3" d="M440 92 V147" marker-end="url(#ah-harness)"/>
        <path class="edge e-4" d="M476 150 V95" marker-end="url(#ah-harness)"/>
      </g>
      <text class="fig in-4" x="456" y="190">“approve”</text>

      <g class="in-6">
        <text class="small" x="440" y="236">approved = at publish</text>
        <text class="fig" x="440" y="254">c4e9e330698e = c4e9e330698e</text>
      </g>

      <g class="n-7"><rect class="box" x="16" y="266" width="140" height="44"/><text class="label" x="86" y="281">Feed</text></g>
      <path class="edge e-7" d="M561 288 H159" marker-end="url(#ah-harness)"/>
      <text class="fig in-7" x="86" y="299">post_1</text>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-harness-cap">
    <li><button type="button">Propose</button><span>The agent drafts a status post: the eu-west outage is resolved.</span></li>
    <li><button type="button">Dry run</button><span>The tool runs with dry_run=True and returns the preview and fingerprint c4e9e330698e. The feed is still empty.</span></li>
    <li><button type="button">Pause</button><span>The review node calls interrupt(). The graph stops, the checkpointer saves its state, and the preview goes to the reviewer.</span></li>
    <li><button type="button">Resume</button><span>The reviewer answers approve, and Command(resume=…) restarts the review node on the same thread.</span></li>
    <li><button type="button">Decide</button><span>The answer normalises to approve, so the run takes the publish branch. Any other answer goes to Cancel.</span></li>
    <li><button type="button">Check</button><span>The publish node recomputes the fingerprint of the post it holds: c4e9e330698e, the one the reviewer saw.</span></li>
    <li><button type="button">Publish</button><span>Only now does the live call run. The post becomes post_1 in the feed.</span></li>
  </ol>
</figure>
