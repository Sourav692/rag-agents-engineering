<!-- Animated version of the Chain-of-verification flowchart in ../README.md, used by index.html.
     The claims are the hand-written Larkspur example in the table below that diagram; it has no measured numbers.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-cove-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Chain-of-verification, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 310" role="img" aria-labelledby="anim-cove-title anim-cove-desc">
      <title id="anim-cove-title">Chain-of-verification</title>
      <desc id="anim-cove-desc">A draft answer to a Larkspur cancellation question makes three claims. The planner writes one question per claim. Each question is answered in its own call, without the draft, from a handbook chunk: refund-window, refund-timing and retention. Two claims disagree with their chunks, and the reviser, which sees the draft only at this point, fixes them.</desc>
      <defs>
        <marker id="ah-cove" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="40" width="150" height="44"/><text class="label" x="95" y="62">Draft</text></g>
      <g class="n-2"><rect class="box" x="210" y="40" width="140" height="44"/><text class="label" x="280" y="62">Plan questions</text></g>
      <text class="lane-label" x="388" y="20">Fresh calls, draft not shown</text>
      <rect class="lane e-3" x="380" y="28" width="240" height="196"/>
      <g class="n-4"><rect class="box" x="400" y="40" width="200" height="44"/><text class="label" x="500" y="62">Answer each alone</text></g>
      <g class="n-5 n-6"><rect class="box" x="650" y="40" width="130" height="44"/><text class="label" x="715" y="62">Revise</text></g>

      <path class="edge e-2" d="M170 62 H207" marker-end="url(#ah-cove)"/>
      <path class="edge e-3" d="M350 62 H397" marker-end="url(#ah-cove)"/>
      <path class="edge e-5" d="M600 62 H647" marker-end="url(#ah-cove)"/>

      <g class="in-1">
        <rect class="doc" x="40" y="100" width="110" height="80"/>
        <path class="line" d="M50 116 H140 M50 140 H132 M50 164 H136"/>
        <text class="small" x="95" y="196">three claims</text>
      </g>
      <g class="in-2">
        <text class="small" x="280" y="116">Q1 refund rule</text>
        <text class="small" x="280" y="140">Q2 refund time</text>
        <text class="small" x="280" y="164">Q3 data kept</text>
      </g>
      <g class="in-4">
        <text class="fig" x="500" y="116">refund-window</text>
        <text class="fig" x="500" y="140">refund-timing</text>
        <text class="fig" x="500" y="164">retention</text>
      </g>
      <g class="in-5">
        <text class="small hit" x="715" y="116">fix: 100 GB rule</text>
        <text class="small" x="715" y="140">keep</text>
        <text class="small hit" x="715" y="164">fix: 30 days</text>
      </g>
      <path class="edge dashed e-6" d="M48 180 V256 H657" marker-end="url(#ah-cove)"/>
      <text class="small" x="380" y="244">the draft is shown again only here</text>
      <g class="in-6">
        <rect class="doc" x="660" y="216" width="110" height="80"/>
        <path class="line" d="M670 260 H754"/>
        <path class="hit-line" d="M670 236 H760 M670 284 H748"/>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-cove-cap">
    <li><button type="button" data-tok="20,40">Draft</button><span>The draft answers a cancelling customer in one pass and makes three claims.</span></li>
    <li><button type="button" data-tok="210,40">Plan</button><span>The planner writes one self-contained question per claim.</span></li>
    <li><button type="button" data-tok="380,28">Isolate</button><span>Each question goes to its own call. The draft is not in the prompt.</span></li>
    <li><button type="button" data-tok="400,40">Answer</button><span>Each call retrieves its handbook chunk: refund-window, refund-timing and retention.</span></li>
    <li><button type="button" data-tok="650,40">Compare</button><span>Two claims disagree with their chunks: a full refund needs under 100 GB of outbound traffic, and data is kept 30 days, not 90.</span></li>
    <li><button type="button" data-tok="660,216">Revise</button><span>The reviser sees the draft next to the answers for the first time and fixes those two claims.</span></li>
  </ol>
</figure>
