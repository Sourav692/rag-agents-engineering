# Neo4j for the M43 lab: docker compose up -d   (from lab/solution/)
# Browser at http://localhost:7474, Bolt at bolt://localhost:7687, user neo4j, password larkspur-lab.
# APOC is needed by langchain_neo4j.Neo4jGraph to read the schema.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: m43-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/larkspur-lab
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - m43-neo4j-data:/data

volumes:
  m43-neo4j-data:
