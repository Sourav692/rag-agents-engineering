<!-- Animated version of the Baseline-first optimisation flowchart in ../README.md, used by index-animated.html.
     The figures are the top-k lab's own: means over its three golden questions at k = 2 and k = 5.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-baseline-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The baseline loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 880 340" role="img" aria-labelledby="anim-baseline-title anim-baseline-desc">
      <title id="anim-baseline-title">Baseline-first optimisation</title>
      <desc id="anim-baseline-desc">A golden set runs through the plain pipeline to give the baseline row, recall@2 0.50 and precision@2 0.50. Raising k to 5 and re-running gives recall@5 0.50 and precision@5 0.20, which is worse, so the change is reverted. A change that beats the baseline with no regressions is kept and becomes the new baseline.</desc>
      <defs>
        <marker id="ah-bl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1">
        <path class="box" d="M30 36 a80 10 0 0 0 160 0 v52 a80 10 0 0 1 -160 0 z"/>
        <ellipse class="box" cx="110" cy="36" rx="80" ry="10"/>
        <text class="label" x="110" y="64">Golden set</text>
        <text class="small" x="110" y="82">3 questions</text>
      </g>
      <path class="edge e-2" d="M110 98 V125" marker-end="url(#ah-bl)"/>
      <g class="n-2"><rect class="box" x="30" y="128" width="160" height="44"/><text class="label" x="110" y="150">Plain pipeline</text></g>
      <path class="edge e-2" d="M110 172 V201" marker-end="url(#ah-bl)"/>
      <g class="n-2 n-6">
        <rect class="box" x="20" y="204" width="220" height="76"/>
        <text class="small" x="130" y="222">Baseline row</text>
      </g>
      <g class="in-2">
        <text class="fig" x="130" y="246">recall@2 0.50</text>
        <text class="fig" x="130" y="266">precision@2 0.50</text>
      </g>

      <path class="edge e-3" d="M240 230 C272 230 268 62 297 62" marker-end="url(#ah-bl)"/>
      <g class="n-3">
        <rect class="box" x="300" y="40" width="160" height="56"/>
        <text class="label" x="380" y="60">Change one stage</text>
      </g>
      <text class="fig in-3" x="380" y="82">k: 2 to 5</text>

      <path class="edge e-4" d="M460 62 H537" marker-end="url(#ah-bl)"/>
      <g class="n-4"><rect class="box" x="540" y="40" width="160" height="44"/><text class="label" x="620" y="62">Re-run golden set</text></g>
      <g class="in-4">
        <text class="fig" x="790" y="54">recall@5 0.50</text>
        <text class="fig" x="790" y="74">precision@5 0.20</text>
      </g>

      <path class="edge e-5 e-6" d="M620 84 V151" marker-end="url(#ah-bl)"/>
      <g class="n-5 n-6">
        <path class="box" d="M620 154 L690 190 L620 226 L550 190 Z"/>
        <text class="small" x="620" y="183">Better, no</text>
        <text class="small" x="620" y="199">regressions?</text>
      </g>

      <path class="edge e-5" d="M550 190 C505 190 505 282 463 282" marker-end="url(#ah-bl)"/>
      <text class="small" x="522" y="230">No</text>
      <g class="n-5"><rect class="box" x="300" y="260" width="160" height="44"/><text class="label" x="380" y="282">Revert</text></g>
      <path class="edge e-5" d="M380 260 V99" marker-end="url(#ah-bl)"/>
      <text class="small in-5" x="522" y="246">precision fell</text>

      <path class="edge e-6" d="M620 226 V257" marker-end="url(#ah-bl)"/>
      <text class="small" x="638" y="244">Yes</text>
      <g class="n-6"><rect class="box" x="560" y="260" width="120" height="44"/><text class="label" x="620" y="282">Keep</text></g>
      <path class="edge e-6" d="M620 304 V324 H130 V283" marker-end="url(#ah-bl)"/>
      <text class="small in-6" x="470" y="316">becomes the new baseline</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-baseline-cap">
    <li><button type="button" data-tok="30,36">Golden set</button><span>Freeze a golden set. The lab’s has three questions, each with two evidence chunks.</span></li>
    <li><button type="button" data-tok="20,204">Baseline</button><span>Run the plain pipeline over it and record the baseline row: recall@2 0.50, precision@2 0.50.</span></li>
    <li><button type="button" data-tok="300,40">Change</button><span>Change one stage. Here, raise k from 2 to 5.</span></li>
    <li><button type="button" data-tok="540,40">Re-run</button><span>Re-run the golden set: recall@5 0.50, precision@5 0.20.</span></li>
    <li><button type="button" data-tok="300,260">Compare</button><span>Compare with the baseline. Recall did not move and precision fell, so revert.</span></li>
    <li><button type="button" data-tok="560,260">Keep</button><span>A change that beats the row on the questions it targets, and breaks none, is kept and becomes the new baseline.</span></li>
  </ol>
</figure>
