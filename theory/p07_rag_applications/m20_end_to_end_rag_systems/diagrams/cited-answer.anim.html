<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The question and chunk ids are the Larkspur Cloud handbook's (M11). No figures: the module's notebooks ship without outputs.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-cited-cap">
  <div class="anim__canvas" tabindex="0" aria-label="A cited answer, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-cited-title anim-cited-desc">
      <title id="anim-cited-title">From question to a cited answer</title>
      <desc id="anim-cited-desc">A question about refunds is routed to retrieval, since it needs no aggregate over every row. The retriever returns chunks with their id and page. One call writes the answer from those chunks only; a second call returns citations in a Pydantic schema; code checks every quote against the chunk it names; the system returns the answer, the citations and the sources. Questions that need every row go to a query engine instead.</desc>
      <defs>
        <marker id="ah-cited" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- row one: question, route, retrieve, answer -->
      <g class="n-1"><rect class="box" x="24" y="60" width="120" height="44"/><text class="label" x="84" y="82">Question</text></g>
      <g class="n-2"><rect class="box" x="184" y="60" width="110" height="44"/><text class="label" x="239" y="82">Route</text></g>
      <g class="n-3"><rect class="box" x="334" y="60" width="140" height="44"/><text class="label" x="404" y="82">Retrieve</text></g>
      <g class="n-4"><rect class="box" x="514" y="60" width="130" height="44"/><text class="label" x="579" y="82">Answer call</text></g>
      <path class="edge e-2 in-2" d="M144 82 H181" marker-end="url(#ah-cited)"/>
      <path class="edge e-3 in-3" d="M294 82 H331" marker-end="url(#ah-cited)"/>
      <path class="edge e-4 in-4" d="M474 82 H511" marker-end="url(#ah-cited)"/>

      <g class="in-1">
        <rect class="doc" x="14" y="116" width="140" height="40"/>
        <text class="small" x="84" y="132">refund on my</text>
        <text class="small" x="84" y="148">annual plan?</text>
      </g>

      <!-- the other route: questions that need every row -->
      <path class="edge dashed in-2" d="M239 104 V145" marker-end="url(#ah-cited)"/>
      <g class="in-2">
        <rect class="box" x="174" y="148" width="130" height="44"/>
        <text class="label" x="239" y="170">Query engine</text>
        <text class="small" x="239" y="212">needs every row</text>
      </g>

      <g class="in-3">
        <rect class="hit" x="370" y="118" width="68" height="8"/>
        <rect class="hit" x="370" y="132" width="68" height="8"/>
        <text class="small" x="404" y="160">chunks with</text>
        <text class="small" x="404" y="176">id and page</text>
      </g>
      <g class="in-4">
        <rect class="doc" x="544" y="116" width="70" height="40"/>
        <path class="line" d="M552 126 H606 M552 136 H600 M552 146 H590"/>
      </g>

      <!-- row two, right to left: cite, check, return -->
      <path class="edge e-5 in-5" d="M579 156 V237" marker-end="url(#ah-cited)"/>
      <g class="n-5"><rect class="box" x="514" y="240" width="130" height="44"/><text class="label" x="579" y="262">Cite call</text></g>
      <g class="n-6"><rect class="box" x="354" y="240" width="130" height="44"/><text class="label" x="419" y="262">Check quotes</text></g>
      <g class="n-7"><rect class="box" x="164" y="240" width="150" height="44"/><text class="label" x="239" y="262">Return</text></g>
      <path class="edge e-6 in-6" d="M514 262 H487" marker-end="url(#ah-cited)"/>
      <path class="edge e-7 in-7" d="M354 262 H317" marker-end="url(#ah-cited)"/>
      <path class="edge dashed in-2" d="M239 216 V237" marker-end="url(#ah-cited)"/>

      <g class="in-5">
        <text class="fig" x="579" y="306">id, page,</text>
        <text class="fig" x="579" y="324">quotes</text>
      </g>
      <g class="in-6">
        <rect class="doc" x="384" y="294" width="70" height="40"/>
        <path class="hit-line" d="M392 306 H446"/>
        <path class="line" d="M392 316 H440 M392 326 H430"/>
      </g>
      <g class="in-7">
        <rect class="doc" x="194" y="294" width="90" height="40"/>
        <path class="line" d="M202 306 H276"/>
        <text class="fig" x="239" y="326">[1] [2]</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-cited-cap">
    <li><button type="button" data-tok="84,60">Question</button><span>A customer asks “Can I get a refund on my annual plan?”</span></li>
    <li><button type="button" data-tok="239,60">Route</button><span>The router sees a policy question. Averages, counts and id lookups would go to the query engine instead.</span></li>
    <li><button type="button" data-tok="404,60">Retrieve</button><span>The retriever returns the top-k chunks, each with its id, source and page in metadata.</span></li>
    <li><button type="button" data-tok="579,60">Answer</button><span>The first call formats the chunks with their metadata and answers from them only, or says it does not know.</span></li>
    <li><button type="button" data-tok="579,240">Cite</button><span>A second call returns citations in a Pydantic schema: chunk id, source, title, page and the quoted sentences.</span></li>
    <li><button type="button" data-tok="419,240">Check</button><span>Code looks for each quote in the chunk it names. A paraphrase or a wrong id fails here.</span></li>
    <li><button type="button" data-tok="239,240">Return</button><span>The caller gets the answer, the checked citations and the source chunks, so a reader can open each one.</span></li>
  </ol>
</figure>
