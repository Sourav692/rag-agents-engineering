<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Ranks are the lab's, for "Which month missed the 99.95% availability target?" at k = 3. -->
<figure class="anim sheet" aria-labelledby="anim-routes-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Four ways to index a page with a figure, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 416" role="img" aria-labelledby="anim-routes-title anim-routes-desc">
      <title id="anim-routes-title">Four ways to index a handbook page with a figure</title>
      <desc id="anim-routes-desc">A handbook page with two paragraphs and Figure 1 is indexed four ways. Text only drops the figure. CLIP embeds text and the figure in one space, where the figure ranks 7 of 9. A vision model writes a caption that ranks 2 of 9. A page-image model embeds the whole page as 1,139 patch vectors, and the page ranks 1 of 3. At k = 3 the caption and the page reach the model; the CLIP figure does not.</desc>
      <defs>
        <marker id="ah-routes" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <rect class="lane" x="170" y="12" width="622" height="92"/>
      <text class="lane-label" x="180" y="30">Text only</text>
      <rect class="lane" x="170" y="112" width="622" height="92"/>
      <text class="lane-label" x="180" y="130">CLIP joint space</text>
      <rect class="lane" x="170" y="212" width="622" height="92"/>
      <text class="lane-label" x="180" y="230">Caption then index</text>
      <rect class="lane" x="170" y="312" width="622" height="92"/>
      <text class="lane-label" x="180" y="330">Page image</text>

      <!-- the page -->
      <g class="n-1">
        <rect class="box" x="20" y="96" width="124" height="168"/>
        <path class="line" d="M32 112 H132 M32 122 H124 M32 136 H132 M32 146 H112"/>
        <rect class="chunk" x="44" y="198" width="16" height="44"/><rect class="hit" x="70" y="214" width="16" height="28"/><rect class="chunk" x="96" y="202" width="16" height="40"/>
        <path class="line" d="M38 208 H124"/>
        <text class="small" x="82" y="282">handbook page 1</text>
      </g>

      <!-- routes -->
      <path class="edge e-2 in-2" d="M144 150 C160 150 160 70 177 70" marker-end="url(#ah-routes)"/>
      <path class="edge e-3 in-3" d="M144 170 C160 170 160 170 177 170" marker-end="url(#ah-routes)"/>
      <path class="edge e-4 in-4" d="M144 200 C160 200 160 270 177 270" marker-end="url(#ah-routes)"/>
      <path class="edge e-5 in-5" d="M144 230 C158 230 158 370 177 370" marker-end="url(#ah-routes)"/>

      <g class="n-2 in-2"><rect class="box" x="180" y="48" width="160" height="44"/><text class="label" x="260" y="70">Extract text</text></g>
      <g class="in-2">
        <rect class="chunk" x="372" y="56" width="64" height="7"/><rect class="chunk" x="372" y="70" width="64" height="7"/>
        <rect class="doc" x="470" y="48" width="40" height="34"/>
        <path class="hit-line" d="M466 44 L514 86 M514 44 L466 86"/>
        <text class="small" x="490" y="96">figure dropped</text>
      </g>

      <g class="n-3 in-3"><rect class="box" x="180" y="148" width="160" height="44"/><text class="label" x="260" y="170">CLIP encoders</text></g>
      <g class="in-3">
        <circle class="vec" cx="380" cy="170" r="5"/><circle class="hit" cx="398" cy="170" r="5"/><circle class="vec" cx="416" cy="170" r="5"/>
        <circle class="vec" cx="470" cy="170" r="5"/><circle class="vec" cx="486" cy="170" r="5"/><circle class="vec" cx="502" cy="170" r="5"/>
        <circle class="vec" cx="518" cy="170" r="5"/><circle class="vec" cx="534" cy="170" r="5"/><circle class="vec" cx="550" cy="170" r="5"/>
        <text class="small" x="398" y="194">3 images</text>
        <text class="small" x="510" y="194">6 text chunks</text>
      </g>

      <g class="n-4 in-4"><rect class="box" x="180" y="248" width="160" height="44"/><text class="label" x="260" y="270">Vision LLM caption</text></g>
      <g class="in-4">
        <rect class="doc" x="380" y="240" width="150" height="38"/>
        <path class="line" d="M388 250 H452"/>
        <path class="hit-line" d="M388 260 H520 M388 270 H500"/>
        <text class="small" x="455" y="292">caption with the values</text>
      </g>

      <g class="n-5 in-5"><rect class="box" x="180" y="348" width="160" height="44"/><text class="label" x="260" y="370">Page to patches</text></g>
      <g class="in-5">
        <rect class="doc" x="380" y="340" width="44" height="56"/>
        <path class="line" d="M391 340 V396 M402 340 V396 M413 340 V396 M380 354 H424 M380 368 H424 M380 382 H424"/>
        <text class="small" x="500" y="368">1,139 vectors</text>
      </g>

      <!-- the question -->
      <g class="n-6 in-6">
        <rect class="box" x="20" y="312" width="124" height="70"/>
        <text class="small" x="82" y="330">Which month</text>
        <text class="small" x="82" y="347">missed the</text>
        <text class="small" x="82" y="364">99.95% target?</text>
      </g>

      <!-- ranks -->
      <g class="in-7">
        <text class="fig" x="690" y="58">not indexed</text>
        <text class="fig" x="690" y="158">rank 7 of 9</text>
        <text class="fig" x="690" y="258">rank 2 of 9</text>
        <text class="fig" x="690" y="358">rank 1 of 3</text>
      </g>

      <!-- what reaches the model at k = 3 -->
      <g class="in-8">
        <text class="small" x="690" y="82">nothing to send</text>
        <text class="small" x="690" y="182">not sent at k = 3</text>
        <circle class="hit" cx="630" cy="282" r="5"/><text class="small" x="696" y="282">sent at k = 3</text>
        <circle class="hit" cx="630" cy="382" r="5"/><text class="small" x="696" y="382">sent at k = 3</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-routes-cap">
    <li><button type="button">Page</button><span>Handbook page 1 has two paragraphs and Figure 1. May’s 99.91% exists only in the bars.</span></li>
    <li><button type="button">Text only</button><span>Text extraction keeps the paragraphs and drops the figure.</span></li>
    <li><button type="button">CLIP</button><span>CLIP embeds the text chunks and the figure image into one space.</span></li>
    <li><button type="button">Caption</button><span>A vision model writes a caption with the values, embedded as text.</span></li>
    <li><button type="button">Patches</button><span>A page-image model turns the whole page into 1,139 patch vectors.</span></li>
    <li><button type="button">Question</button><span>A customer asks “Which month missed the 99.95% availability target?”</span></li>
    <li><button type="button">Rank</button><span>Each index ranks its items. CLIP puts the figure behind all six text chunks.</span></li>
    <li><button type="button">Send</button><span>At k = 3 the caption and the page reach the model. The CLIP figure does not.</span></li>
  </ol>
</figure>
