<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The 2 Documents and 17 nodes are the Larkspur handbook as lesson 22.4 parses it. No scores: the stages, not one run.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-lipipe-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The LlamaIndex pipeline, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-lipipe-title anim-lipipe-desc">
      <title id="anim-lipipe-title">The LlamaIndex pipeline</title>
      <desc id="anim-lipipe-desc">Ingestion: a reader loads the handbook as 2 Documents, transformations split them into 17 nodes, and the nodes are embedded into a VectorStoreIndex. Query: a question goes to the retriever, which returns the top-k nodes; the node postprocessors rerank or rewrite that list; the response synthesizer writes the answer and returns it with its source nodes.</desc>
      <defs>
        <marker id="ah-lipipe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Ingestion: once</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">QueryEngine: every question</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- ingestion -->
      <g class="n-1"><rect class="box" x="24" y="48" width="120" height="44"/><text class="label" x="84" y="70">Reader</text></g>
      <g class="n-1"><rect class="box" x="180" y="48" width="120" height="44"/><text class="label" x="240" y="70">Documents</text></g>
      <g class="n-2"><rect class="box" x="336" y="48" width="140" height="44"/><text class="label" x="406" y="70">Transformations</text></g>
      <g class="n-2"><rect class="box" x="512" y="48" width="100" height="44"/><text class="label" x="562" y="70">Nodes</text></g>
      <g class="n-3">
        <path class="box" d="M648 50 a64 10 0 0 0 128 0 v94 a64 10 0 0 1 -128 0 z"/>
        <ellipse class="box" cx="712" cy="50" rx="64" ry="10"/>
        <text class="label" x="712" y="78">Index</text>
      </g>
      <path class="edge e-1 in-1" d="M144 70 H177" marker-end="url(#ah-lipipe)"/>
      <path class="edge e-2 in-2" d="M300 70 H333" marker-end="url(#ah-lipipe)"/>
      <path class="edge e-2 in-2" d="M476 70 H509" marker-end="url(#ah-lipipe)"/>
      <path class="edge e-3 in-3" d="M612 70 H645" marker-end="url(#ah-lipipe)"/>

      <g class="in-1">
        <rect class="doc" x="214" y="104" width="20" height="26"/><path class="line" d="M218 112 H230 M218 118 H230 M218 124 H226"/>
        <rect class="doc" x="246" y="104" width="20" height="26"/><path class="line" d="M250 112 H262 M250 118 H262 M250 124 H258"/>
        <text class="small" x="240" y="148">2 Documents</text>
      </g>
      <g class="in-2">
        <rect class="chunk" x="538" y="104" width="48" height="5"/><rect class="chunk" x="538" y="112" width="48" height="5"/>
        <rect class="chunk" x="538" y="120" width="48" height="5"/><rect class="chunk" x="538" y="128" width="48" height="5"/>
        <text class="small" x="562" y="148">17 nodes</text>
      </g>
      <g class="in-3">
        <circle class="vec" cx="684" cy="104" r="5"/><circle class="vec" cx="704" cy="104" r="5"/>
        <circle class="vec" cx="724" cy="104" r="5"/><circle class="vec" cx="744" cy="104" r="5"/>
        <circle class="vec" cx="684" cy="124" r="5"/><circle class="vec" cx="704" cy="124" r="5"/>
        <circle class="vec" cx="724" cy="124" r="5"/><circle class="vec" cx="744" cy="124" r="5"/>
      </g>

      <!-- the index is the one thing the two lanes share -->
      <path class="edge dashed e-5 in-5" d="M712 154 C712 180 249 180 249 225" marker-end="url(#ah-lipipe)"/>
      <text class="small" x="500" y="196">similarity</text>

      <!-- query -->
      <g class="n-4"><rect class="box" x="24" y="228" width="120" height="44"/><text class="label" x="84" y="250">Question</text></g>
      <g class="n-5"><rect class="box" x="184" y="228" width="130" height="44"/><text class="label" x="249" y="250">Retriever</text></g>
      <g class="n-6"><rect class="box" x="354" y="228" width="140" height="44"/><text class="label" x="424" y="250">Postprocessors</text></g>
      <g class="n-7"><rect class="box" x="534" y="228" width="120" height="44"/><text class="label" x="594" y="250">Synthesizer</text></g>
      <g class="n-7"><rect class="box" x="684" y="228" width="96" height="44"/><text class="label" x="732" y="250">Response</text></g>
      <path class="edge e-5 in-5" d="M144 250 H181" marker-end="url(#ah-lipipe)"/>
      <path class="edge e-6 in-6" d="M314 250 H351" marker-end="url(#ah-lipipe)"/>
      <path class="edge e-7 in-7" d="M494 250 H531" marker-end="url(#ah-lipipe)"/>
      <path class="edge e-7 in-7" d="M654 250 H681" marker-end="url(#ah-lipipe)"/>

      <g class="in-4">
        <rect class="doc" x="24" y="288" width="120" height="40"/>
        <text class="small" x="84" y="302">refund after</text>
        <text class="small" x="84" y="318">45 days?</text>
      </g>
      <g class="in-5">
        <circle class="hit" cx="704" cy="104" r="5"/><circle class="hit" cx="724" cy="124" r="5"/>
      </g>
      <g class="mv-5" style="--from: translate(470px, -180px)">
        <rect class="chunk" x="225" y="292" width="48" height="8"/><rect class="chunk" x="225" y="306" width="48" height="8"/>
        <text class="small" x="249" y="330">top-k nodes</text>
      </g>
      <g class="in-6">
        <rect class="hit" x="400" y="292" width="48" height="8"/><rect class="chunk" x="400" y="306" width="48" height="8"/>
        <text class="small" x="424" y="330">reranked list</text>
      </g>
      <g class="in-7">
        <rect class="doc" x="684" y="286" width="96" height="44"/>
        <path class="line" d="M692 298 H772 M692 308 H756"/>
        <text class="small" x="732" y="321">source_nodes</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-lipipe-cap">
    <li><button type="button">Read</button><span>A reader loads the handbook’s two sections as 2 Documents.</span></li>
    <li><button type="button">Transform</button><span>The transformations run in order and turn the Documents into 17 nodes.</span></li>
    <li><button type="button">Index</button><span>Each node is embedded and stored in the VectorStoreIndex.</span></li>
    <li><button type="button">Question</button><span>A customer asks “Can I get a refund on an annual plan after 45 days?”</span></li>
    <li><button type="button">Retrieve</button><span>The retriever returns the similarity_top_k nearest nodes with their scores.</span></li>
    <li><button type="button">Postprocess</button><span>Each node postprocessor edits the list in turn: rerank, filter or swap in a window.</span></li>
    <li><button type="button">Synthesize</button><span>The synthesizer writes the answer and returns it with the source nodes it used.</span></li>
  </ol>
</figure>
