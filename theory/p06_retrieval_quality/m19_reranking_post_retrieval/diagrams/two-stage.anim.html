<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-twostage-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Two-stage retrieval, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-twostage-title anim-twostage-desc">
      <title id="anim-twostage-title">Two-stage retrieval</title>
      <desc id="anim-twostage-desc">Stage 1: a question goes to a bi-encoder with BM25, which scores every chunk and returns 50 candidates; the two evidence chunks are among them but not at the top. Stage 2: a cross-encoder scores each question and candidate pair, the two evidence chunks move to the top, and the top 5 are kept. They are compressed or expanded to fit the context budget, and the model answers and cites them.</desc>
      <defs>
        <marker id="ah-ts" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Stage 1: retrieve wide</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">Stage 2: rerank narrow, then fit the budget</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- stage 1 -->
      <g class="n-1"><rect class="box" x="30" y="48" width="120" height="44"/><text class="label" x="90" y="70">Question</text></g>
      <g class="in-1">
        <rect class="doc" x="30" y="104" width="120" height="44"/>
        <text class="small" x="90" y="118">export my data</text>
        <text class="small" x="90" y="134">after I cancel?</text>
      </g>
      <path class="edge e-2" d="M150 70 H197" marker-end="url(#ah-ts)"/>
      <g class="n-2"><rect class="box" x="200" y="48" width="200" height="44"/><text class="label" x="300" y="70">Bi-encoder + BM25</text></g>
      <text class="small in-2" x="300" y="112">scores every chunk</text>
      <path class="edge e-2" d="M400 70 H452" marker-end="url(#ah-ts)"/>

      <g class="in-2">
        <rect class="doc" x="478" y="44" width="236" height="92"/>
        <rect class="doc" x="472" y="50" width="236" height="92"/>
        <rect class="doc" x="466" y="56" width="236" height="92"/>
        <text class="label" x="584" y="96">50 candidates</text>
        <rect class="hit" x="598" y="72" width="80" height="7"/>
        <rect class="hit" x="486" y="112" width="80" height="7"/>
      </g>

      <!-- the candidates are the only input to stage 2 -->
      <path class="edge e-3" d="M596 164 C596 190 115 186 115 225" marker-end="url(#ah-ts)"/>

      <!-- stage 2 -->
      <g class="n-3"><rect class="box" x="30" y="228" width="170" height="44"/><text class="label" x="115" y="250">Cross-encoder</text></g>
      <g class="in-3">
        <text class="small" x="115" y="294">one pass per</text>
        <text class="small" x="115" y="312">question-chunk pair</text>
      </g>
      <path class="edge e-4" d="M200 250 H247" marker-end="url(#ah-ts)"/>
      <g class="n-4"><rect class="box" x="250" y="228" width="150" height="44"/><text class="label" x="325" y="250">Keep top 5</text></g>
      <g class="mv-4" style="--from: translate(313px, -214px)"><rect class="hit" x="285" y="286" width="80" height="7"/></g>
      <g class="mv-4" style="--from: translate(201px, -185px)"><rect class="hit" x="285" y="297" width="80" height="7"/></g>
      <g class="in-4">
        <rect class="chunk" x="285" y="308" width="80" height="7"/>
        <rect class="chunk" x="285" y="319" width="80" height="7"/>
        <rect class="chunk" x="285" y="330" width="80" height="7"/>
      </g>
      <path class="edge e-5" d="M400 250 H437" marker-end="url(#ah-ts)"/>
      <g class="n-5"><rect class="box" x="440" y="228" width="150" height="44"/><text class="label" x="515" y="250">Fit the budget</text></g>
      <g class="in-5">
        <text class="small" x="515" y="294">compress or</text>
        <text class="small" x="515" y="312">expand each chunk</text>
      </g>
      <path class="edge e-6" d="M590 250 H627" marker-end="url(#ah-ts)"/>
      <g class="n-6"><rect class="box" x="630" y="228" width="140" height="44"/><text class="label" x="700" y="250">Generate</text></g>
      <g class="in-6">
        <rect class="doc" x="640" y="284" width="120" height="44"/>
        <path class="line" d="M650 296 H750 M650 306 H730"/>
        <text class="fig" x="700" y="319">[1] [2]</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-twostage-cap">
    <li><button type="button" data-tok="30,48">Question</button><span>A customer asks “Can I export my data after I cancel my plan?”</span></li>
    <li><button type="button" data-tok="200,48">Retrieve</button><span>Stage 1 scores every chunk in the index and returns 50 candidates. The two evidence chunks are in the list, but not at the top.</span></li>
    <li><button type="button" data-tok="30,228">Score</button><span>Stage 2 reads the question and each candidate together: 50 pairs, one cross-encoder pass each.</span></li>
    <li><button type="button" data-tok="250,228">Keep 5</button><span>The candidates are sorted by the new scores. The two evidence chunks, export and retention, move to the top, and the cut keeps 5.</span></li>
    <li><button type="button" data-tok="440,228">Budget</button><span>Each kept chunk is compressed to the sentences that answer, or expanded to its neighbours, within the context budget.</span></li>
    <li><button type="button" data-tok="630,228">Generate</button><span>The model reads the five chunks, best first, and answers with citations to the evidence.</span></li>
  </ol>
</figure>
