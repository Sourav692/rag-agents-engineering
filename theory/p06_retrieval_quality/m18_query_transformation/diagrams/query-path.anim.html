<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The retrieval and fusion figures are the query-variant lab's own (outage question, five variants, RRF k = 60, top 3); the route is illustrative.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-querypath-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The query path, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 260" role="img" aria-labelledby="anim-querypath-title anim-querypath-desc">
      <title id="anim-querypath-title">The query path before retrieval</title>
      <desc id="anim-querypath-desc">A Larkspur customer asks what happens if their server goes down. A router picks the reliability destination, an LLM writes five variants of the question, each variant retrieves its own top four chunks, reciprocal rank fusion with k of 60 merges the lists into reboot, sla and incidents, and the top three reach the model with recall at 3 of 1.00.</desc>
      <defs>
        <marker id="ah-qp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="16" y="30" width="108" height="44"/><text class="label" x="70" y="52">Question</text></g>
      <g class="n-2"><rect class="box" x="148" y="30" width="108" height="44"/><text class="label" x="202" y="52">Route</text></g>
      <g class="n-3"><rect class="box" x="280" y="30" width="108" height="44"/><text class="label" x="334" y="52">Transform</text></g>
      <g class="n-4"><rect class="box" x="412" y="30" width="108" height="44"/><text class="label" x="466" y="52">Retrieve</text></g>
      <g class="n-5"><rect class="box" x="544" y="30" width="108" height="44"/><text class="label" x="598" y="52">Merge</text></g>
      <g class="n-6"><rect class="box" x="676" y="30" width="108" height="44"/><text class="label" x="730" y="52">Generate</text></g>
      <path class="edge e-2" d="M124 52 H145" marker-end="url(#ah-qp)"/>
      <path class="edge e-3" d="M256 52 H277" marker-end="url(#ah-qp)"/>
      <path class="edge e-4" d="M388 52 H409" marker-end="url(#ah-qp)"/>
      <path class="edge e-5" d="M520 52 H541" marker-end="url(#ah-qp)"/>
      <path class="edge e-6" d="M652 52 H673" marker-end="url(#ah-qp)"/>

      <g class="in-1">
        <rect class="doc" x="16" y="96" width="108" height="66"/>
        <text class="small" x="70" y="114">What happens</text>
        <text class="small" x="70" y="130">if my server</text>
        <text class="small" x="70" y="146">goes down?</text>
      </g>

      <g class="in-2">
        <rect class="doc" x="164" y="96" width="84" height="22"/><text class="small" x="206" y="107">billing</text>
        <rect class="doc" x="164" y="124" width="84" height="22"/><text class="small" x="206" y="135">data</text>
        <rect class="doc" x="164" y="152" width="84" height="22"/><text class="small" x="206" y="163">reliability</text>
        <rect class="doc" x="164" y="180" width="84" height="22"/><text class="small" x="206" y="191">servers</text>
        <circle class="hit" cx="154" cy="163" r="5"/>
      </g>

      <g class="in-3">
        <rect class="chunk" x="292" y="100" width="84" height="8"/>
        <rect class="chunk" x="292" y="116" width="72" height="8"/>
        <rect class="chunk" x="292" y="132" width="80" height="8"/>
        <rect class="chunk" x="292" y="148" width="68" height="8"/>
        <rect class="chunk" x="292" y="164" width="76" height="8"/>
        <text class="small" x="334" y="194">5 variants</text>
      </g>

      <!-- five result lists, one column per variant; magenta squares are evidence chunks -->
      <g class="in-4">
        <rect class="hit" x="424" y="98" width="12" height="10"/><rect class="chunk" x="424" y="112" width="12" height="10"/><rect class="chunk" x="424" y="126" width="12" height="10"/><rect class="chunk" x="424" y="140" width="12" height="10"/>
        <rect class="hit" x="440" y="98" width="12" height="10"/><rect class="hit" x="440" y="112" width="12" height="10"/><rect class="chunk" x="440" y="126" width="12" height="10"/>
        <rect class="hit" x="456" y="98" width="12" height="10"/><rect class="chunk" x="456" y="112" width="12" height="10"/>
        <rect class="chunk" x="472" y="98" width="12" height="10"/><rect class="chunk" x="472" y="112" width="12" height="10"/><rect class="chunk" x="472" y="126" width="12" height="10"/>
        <rect class="hit" x="488" y="98" width="12" height="10"/>
        <text class="small" x="466" y="194">top 4 each</text>
      </g>

      <g class="mv-5" style="--from: translate(-130px, 0px)">
        <text class="small" x="606" y="106">reboot</text>
        <circle class="hit" cx="562" cy="128" r="5"/><text class="small" x="606" y="128">sla</text>
        <circle class="hit" cx="562" cy="150" r="5"/><text class="small" x="606" y="150">incidents</text>
        <path class="hit-line" d="M556 166 H652"/>
        <text class="small" x="606" y="194">RRF, k = 60</text>
      </g>

      <g class="in-6">
        <rect class="doc" x="676" y="96" width="108" height="66"/>
        <path class="line" d="M688 112 H772 M688 124 H760"/>
        <path class="hit-line" d="M688 138 H766 M688 150 H748"/>
        <text class="fig" x="730" y="194">recall@3 1.00</text>
      </g>
      <text class="small" x="400" y="240">The question as asked, with no transformation, reaches neither evidence chunk: recall@3 0.00.</text>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-querypath-cap">
    <li><button type="button">Question</button><span>A customer asks “What happens if my server goes down?” It shares no term with either evidence chunk in the M11 index.</span></li>
    <li><button type="button">Route</button><span>A router picks where the question goes before any search runs. Here it is the reliability destination (lesson 18.7).</span></li>
    <li><button type="button">Transform</button><span>An LLM writes five phrasings of the question with different vocabulary (lesson 18.3).</span></li>
    <li><button type="button">Retrieve</button><span>Each variant retrieves its own top 4. Three reach <code>sla</code> and two reach <code>incidents</code>.</span></li>
    <li><button type="button">Merge</button><span>Reciprocal rank fusion with k = 60 merges the five lists into one: <code>reboot</code>, <code>sla</code>, <code>incidents</code>.</span></li>
    <li><button type="button">Generate</button><span>The top 3 reach the model with both evidence chunks among them, recall@3 1.00.</span></li>
  </ol>
</figure>
