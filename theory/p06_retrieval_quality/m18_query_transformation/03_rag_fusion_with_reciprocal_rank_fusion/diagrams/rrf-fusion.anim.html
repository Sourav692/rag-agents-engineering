<!-- Animated version of the RAG-Fusion flowchart in ../README.md, used by index.html.
     Every list, rank and score is the query-variant lab's own: the outage question, all five variants, top 4 per variant, RRF k = 60, three chunks sent.
     Classes and data attributes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-rrf-cap">
  <div class="anim__canvas" tabindex="0" aria-label="RAG-Fusion on the outage question, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-rrf-title anim-rrf-desc">
      <title id="anim-rrf-title">RAG-Fusion on the outage question</title>
      <desc id="anim-rrf-desc">Five variants of “What happens if my server goes down?” each retrieve up to four chunks. Ranks count from 0. Reciprocal rank fusion with k of 60 adds 1 over rank plus 60 for every list a chunk appears in: reboot 0.0656 from four lists, sla 0.0500 from three, incidents 0.0331 from two, sizing 0.0325, export 0.0320. The cut after three chunks sends both evidence chunks, sla and incidents, to the model.</desc>
      <defs>
        <marker id="ah-rrf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="16" y="16" width="230" height="44"/><text class="label" x="131" y="38">server goes down?</text></g>
      <g class="n-2"><rect class="box" x="290" y="16" width="200" height="44"/><text class="label" x="390" y="38">LLM writes 5 variants</text></g>
      <path class="edge e-2" d="M246 38 H287" marker-end="url(#ah-rrf)"/>

      <path class="edge e-3" d="M390 60 V72 H66 V86" marker-end="url(#ah-rrf)"/>
      <path class="edge e-3" d="M390 72 H178 V86" marker-end="url(#ah-rrf)"/>
      <path class="edge e-3" d="M390 72 H290 V86" marker-end="url(#ah-rrf)"/>
      <path class="edge e-3" d="M390 72 H402 V86" marker-end="url(#ah-rrf)"/>
      <path class="edge e-3" d="M390 72 H514 V86" marker-end="url(#ah-rrf)"/>

      <!-- one column per variant: its ranked list, rank 0 at the top -->
      <g class="in-3">
        <text class="small" x="66" y="98">variant 1</text>
        <rect class="doc" x="16" y="108" width="100" height="24"/><text class="small" x="70" y="120">sla</text><circle class="hit" cx="111" cy="120" r="4"/>
        <rect class="doc" x="16" y="136" width="100" height="24"/><text class="small" x="70" y="148">reboot</text>
        <rect class="doc" x="16" y="164" width="100" height="24"/><text class="small" x="70" y="176">sizing</text>
        <rect class="doc" x="16" y="192" width="100" height="24"/><text class="small" x="70" y="204">export</text>

        <text class="small" x="178" y="98">variant 2</text>
        <rect class="doc" x="128" y="108" width="100" height="24"/><text class="small" x="182" y="120">sla</text><circle class="hit" cx="223" cy="120" r="4"/>
        <rect class="doc" x="128" y="136" width="100" height="24"/><text class="small" x="182" y="148">incidents</text><circle class="hit" cx="223" cy="148" r="4"/>
        <rect class="doc" x="128" y="164" width="100" height="24"/><text class="small" x="182" y="176">reboot</text>

        <text class="small" x="290" y="98">variant 3</text>
        <rect class="doc" x="240" y="108" width="100" height="24"/><text class="small" x="294" y="120">sla</text><circle class="hit" cx="335" cy="120" r="4"/>
        <rect class="doc" x="240" y="136" width="100" height="24"/><text class="small" x="294" y="148">reboot</text>

        <text class="small" x="402" y="98">variant 4</text>
        <rect class="doc" x="352" y="108" width="100" height="24"/><text class="small" x="406" y="120">reboot</text>
        <rect class="doc" x="352" y="136" width="100" height="24"/><text class="small" x="406" y="148">sizing</text>
        <rect class="doc" x="352" y="164" width="100" height="24"/><text class="small" x="406" y="176">export</text>

        <text class="small" x="514" y="98">variant 5</text>
        <rect class="doc" x="464" y="108" width="100" height="24"/><text class="small" x="518" y="120">incidents</text><circle class="hit" cx="559" cy="120" r="4"/>
      </g>

      <!-- ranks, counted from 0 as in 03a -->
      <g class="in-4">
        <text class="fig" x="26" y="120">0</text><text class="fig" x="26" y="148">1</text><text class="fig" x="26" y="176">2</text><text class="fig" x="26" y="204">3</text>
        <text class="fig" x="138" y="120">0</text><text class="fig" x="138" y="148">1</text><text class="fig" x="138" y="176">2</text>
        <text class="fig" x="250" y="120">0</text><text class="fig" x="250" y="148">1</text>
        <text class="fig" x="362" y="120">0</text><text class="fig" x="362" y="148">1</text><text class="fig" x="362" y="176">2</text>
        <text class="fig" x="474" y="120">0</text>
        <text class="small" x="290" y="246">each appearance adds 1 / (rank + 60)</text>
        <text class="fig" x="290" y="268">first place 0.0167, fourth place 0.0159</text>
      </g>

      <path class="edge e-5" d="M566 160 H597" marker-end="url(#ah-rrf)"/>
      <g class="mv-5" style="--from: translate(-160px, 0px)">
        <text class="small" x="692" y="98">fused, k = 60</text>
        <rect class="doc" x="600" y="108" width="184" height="24"/><text class="small" x="658" y="120">reboot</text><text class="fig" x="740" y="120">0.0656</text>
        <rect class="doc" x="600" y="136" width="184" height="24"/><circle class="hit" cx="612" cy="148" r="4"/><text class="small" x="658" y="148">sla</text><text class="fig" x="740" y="148">0.0500</text>
        <rect class="doc" x="600" y="164" width="184" height="24"/><circle class="hit" cx="612" cy="176" r="4"/><text class="small" x="658" y="176">incidents</text><text class="fig" x="740" y="176">0.0331</text>
        <rect class="doc" x="600" y="196" width="184" height="24"/><text class="small" x="658" y="208">sizing</text><text class="fig" x="740" y="208">0.0325</text>
        <rect class="doc" x="600" y="224" width="184" height="24"/><text class="small" x="658" y="236">export</text><text class="fig" x="740" y="236">0.0320</text>
      </g>

      <g class="in-6">
        <path class="hit-line" d="M596 192 H788"/>
        <text class="small" x="692" y="270">top 3 sent to the model</text>
        <text class="fig" x="692" y="292">recall@3 1.00</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-rrf-cap">
    <li><button type="button">Question</button><span>“What happens if my server goes down?” shares no term with <code>sla</code> or <code>incidents</code>.</span></li>
    <li><button type="button">Variants</button><span>An LLM rewrites it five ways, each with different vocabulary. The lab’s five are hand-written.</span></li>
    <li><button type="button">Retrieve</button><span>Each variant retrieves its own top 4, keeping only chunks it shares a term with.</span></li>
    <li><button type="button">Ranks</button><span>Every appearance is worth 1 / (rank + 60), rank counted from 0: 0.0167 for first place, 0.0159 for fourth.</span></li>
    <li><button type="button">Fuse</button><span>Scores add across lists. <code>reboot</code> wins on four votes, <code>sla</code> follows on three first places, <code>incidents</code> on two.</span></li>
    <li><button type="button">Cut</button><span>Three chunks go to the model and both evidence chunks are among them, recall@3 1.00. At two chunks <code>incidents</code> falls out.</span></li>
  </ol>
</figure>
