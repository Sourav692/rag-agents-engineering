<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the RRF constant flattens rank weights</title>
  <desc id="d">Weight of a document at rank r relative to rank 1 in Reciprocal Rank Fusion, 1/(c + r) divided by 1/(c + 1), for c = 1, 10 and 60. With c = 60, the EnsembleRetriever default, rank 10 keeps 0.87 of the rank-1 weight and rank 20 keeps 0.76. With c = 1, rank 10 keeps 0.18.</desc>
  <rect width="800" height="440" fill="#e5eaef"/>
  <rect width="800" height="2" fill="#060e15"/>
  <text x="28" y="38" font-size="18" font-weight="600" fill="#060e15">The constant decides how much rank 1 outweighs rank 10</text>
  <text x="28" y="62" font-size="14" fill="#3b434b">Weight of rank r relative to rank 1 in Reciprocal Rank Fusion: (c + 1) / (c + r)</text>
  <line x1="80" y1="360.0" x2="620" y2="360.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="364.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0.00</text>
  <line x1="80" y1="297.5" x2="620" y2="297.5" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="301.5" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0.25</text>
  <line x1="80" y1="235.0" x2="620" y2="235.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="239.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0.50</text>
  <line x1="80" y1="172.5" x2="620" y2="172.5" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="176.5" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0.75</text>
  <line x1="80" y1="110.0" x2="620" y2="110.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="114.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">1.00</text>
  <text x="80.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">1</text>
  <text x="193.7" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">5</text>
  <text x="335.8" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">10</text>
  <text x="477.9" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">15</text>
  <text x="620.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">20</text>
  <text x="350.0" y="404" font-size="14" text-anchor="middle" fill="#182027">rank in one retriever's list</text>
  <text x="24" y="235.0" font-size="14" text-anchor="middle" fill="#182027" transform="rotate(-90 24 235.0)">share of rank-1 weight</text>
  <polyline points="80.0,110.0 108.4,114.0 136.8,117.9 165.3,121.7 193.7,125.4 222.1,128.9 250.5,132.4 278.9,135.7 307.4,139.0 335.8,142.1 364.2,145.2 392.6,148.2 421.1,151.1 449.5,153.9 477.9,156.7 506.3,159.3 534.7,161.9 563.2,164.5 591.6,167.0 620.0,169.4" fill="none" stroke="#970d63" stroke-width="2.5"/>
  <text x="630" y="174.4" font-size="14" fill="#970d63" font-weight="600">c = 60 (default)</text>
  <polyline points="80.0,110.0 108.4,130.8 136.8,148.5 165.3,163.6 193.7,176.7 222.1,188.1 250.5,198.2 278.9,207.2 307.4,215.3 335.8,222.5 364.2,229.0 392.6,235.0 421.1,240.4 449.5,245.4 477.9,250.0 506.3,254.2 534.7,258.1 563.2,261.8 591.6,265.2 620.0,268.3" fill="none" stroke="#060e15" stroke-width="2"/>
  <text x="630" y="273.3" font-size="14" fill="#060e15" font-weight="600">c = 10</text>
  <polyline points="80.0,110.0 108.4,193.3 136.8,235.0 165.3,260.0 193.7,276.7 222.1,288.6 250.5,297.5 278.9,304.4 307.4,310.0 335.8,314.5 364.2,318.3 392.6,321.5 421.1,324.3 449.5,326.7 477.9,328.8 506.3,330.6 534.7,332.2 563.2,333.7 591.6,335.0 620.0,336.2" fill="none" stroke="#3b434b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="630" y="341.2" font-size="14" fill="#3b434b" font-weight="600">c = 1</text>
  <text x="28" y="422" font-size="13" fill="#3b434b">A document missing from a list gets nothing from that list, at any c.</text>
</svg>
