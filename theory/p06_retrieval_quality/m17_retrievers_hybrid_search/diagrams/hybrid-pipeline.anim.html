<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     No figures: the bars are positions in ranked lists, not scores. Classes and data attributes: scripts/site/theory-anim.css.
     Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-hybrid-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The hybrid retrieval pipeline, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-hybrid-title anim-hybrid-desc">
      <title id="anim-hybrid-title">Hybrid retrieval pipeline</title>
      <desc id="anim-hybrid-desc">A question goes to two retrievers at once: BM25 ranks chunks by shared exact tokens and an embedding retriever ranks them by meaning. Fusion merges the two ranked lists into one, a filter drops chunks that cannot be right, MMR drops near-duplicates, and the top k chunks go to the model.</desc>
      <defs>
        <marker id="ah-hybrid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- question -->
      <g class="n-1"><rect class="box" x="24" y="154" width="120" height="44"/><text class="label" x="84" y="176">Question</text></g>
      <g class="in-1">
        <rect class="doc" x="44" y="212" width="80" height="44"/>
        <path class="line" d="M52 224 H116 M52 234 H108"/>
        <path class="hit-line" d="M52 244 H88"/>
        <text class="small" x="84" y="272">words + an ID</text>
      </g>

      <!-- two retrievers -->
      <path class="edge e-2" d="M144 170 C164 170 164 82 181 82" marker-end="url(#ah-hybrid)"/>
      <path class="edge e-3" d="M144 182 C164 182 164 270 181 270" marker-end="url(#ah-hybrid)"/>
      <g class="n-2"><rect class="box" x="184" y="60" width="150" height="44"/><text class="label" x="259" y="74">BM25</text><text class="small" x="259" y="93">exact terms</text></g>
      <g class="n-3"><rect class="box" x="184" y="248" width="150" height="44"/><text class="label" x="259" y="262">Embeddings</text><text class="small" x="259" y="281">meaning</text></g>

      <g class="in-2">
        <rect class="hit" x="350" y="62" width="48" height="7"/><rect class="chunk" x="350" y="72" width="48" height="7"/>
        <rect class="chunk" x="350" y="82" width="48" height="7"/><rect class="chunk" x="350" y="92" width="48" height="7"/>
        <text class="small" x="374" y="46">ranked list</text>
      </g>
      <g class="in-3">
        <rect class="hit" x="350" y="250" width="48" height="7"/><rect class="chunk" x="350" y="260" width="48" height="7"/>
        <rect class="chunk" x="350" y="270" width="48" height="7"/><rect class="chunk" x="350" y="280" width="48" height="7"/>
        <text class="small" x="374" y="306">ranked list</text>
      </g>

      <!-- fusion -->
      <path class="edge e-4" d="M402 82 C424 82 424 168 437 168" marker-end="url(#ah-hybrid)"/>
      <path class="edge e-4" d="M402 270 C424 270 424 184 437 184" marker-end="url(#ah-hybrid)"/>
      <g class="n-4"><rect class="box" x="440" y="154" width="120" height="44"/><text class="label" x="500" y="168">Fuse</text><text class="small" x="500" y="187">one list</text></g>
      <g class="in-4">
        <rect class="hit" x="476" y="212" width="48" height="7"/><rect class="hit" x="476" y="222" width="48" height="7"/>
        <rect class="chunk" x="476" y="232" width="48" height="7"/><rect class="chunk" x="476" y="242" width="48" height="7"/>
        <rect class="chunk" x="476" y="252" width="48" height="7"/><rect class="chunk" x="476" y="262" width="48" height="7"/>
        <text class="small" x="500" y="284">both hits on top</text>
      </g>

      <!-- post-processing -->
      <path class="edge e-5" d="M560 170 C580 170 580 82 597 82" marker-end="url(#ah-hybrid)"/>
      <g class="n-5"><rect class="box" x="600" y="60" width="176" height="44"/><text class="label" x="688" y="74">Filter</text><text class="small" x="688" y="93">metadata, score floor</text></g>
      <path class="edge e-6" d="M688 104 V151" marker-end="url(#ah-hybrid)"/>
      <g class="n-6"><rect class="box" x="600" y="154" width="176" height="44"/><text class="label" x="688" y="168">MMR</text><text class="small" x="688" y="187">drop near-duplicates</text></g>
      <path class="edge e-7" d="M688 198 V245" marker-end="url(#ah-hybrid)"/>
      <g class="n-7"><rect class="box" x="600" y="248" width="176" height="44"/><text class="label" x="688" y="262">Top-k</text><text class="small" x="688" y="281">to the model</text></g>
      <g class="in-7">
        <rect class="hit" x="664" y="304" width="48" height="7"/><rect class="hit" x="664" y="314" width="48" height="7"/>
        <rect class="chunk" x="664" y="324" width="48" height="7"/>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-hybrid-cap">
    <li><button type="button">Question</button><span>A question arrives with ordinary words and an exact string, such as an order ID.</span></li>
    <li><button type="button">Sparse</button><span>BM25 ranks the chunks that share the question’s exact tokens. The chunk holding the ID comes first.</span></li>
    <li><button type="button">Dense</button><span>The embedding retriever ranks chunks by meaning, so a chunk worded differently from the question can come first.</span></li>
    <li><button type="button">Fuse</button><span>Fusion merges the two lists into one, by rank (RRF) or by normalised score. Both first places can now sit near the top.</span></li>
    <li><button type="button">Filter</button><span>Metadata and score filters drop chunks that cannot be right, such as a superseded policy.</span></li>
    <li><button type="button">Diversify</button><span>MMR replaces near-copies of a chunk already chosen with chunks that add something new.</span></li>
    <li><button type="button">Top-k</button><span>The top k chunks go to the model, or to a reranker first (M19).</span></li>
  </ol>
</figure>
