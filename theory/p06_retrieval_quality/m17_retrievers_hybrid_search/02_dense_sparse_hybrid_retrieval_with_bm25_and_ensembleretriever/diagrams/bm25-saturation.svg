<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BM25 term-frequency saturation</title>
  <desc id="d">Contribution of one query term to the BM25 score, as a multiple of its idf, against how often the term appears in the chunk, with rank_bm25 defaults k1 = 1.5 and b = 0.75. For an average-length chunk the first occurrence is worth 1.00, the second brings it to 1.43, and ten occurrences reach 2.17, below the ceiling of 2.5. A chunk half the average length gets 1.29 for one occurrence; one twice the average gets 0.69.</desc>
  <rect width="800" height="440" fill="#e5eaef"/>
  <rect width="800" height="2" fill="#060e15"/>
  <text x="28" y="38" font-size="18" font-weight="600" fill="#060e15">Repeating a term helps less each time; long chunks are discounted</text>
  <text x="28" y="62" font-size="14" fill="#3b434b">BM25 weight of one query term, as a multiple of its idf (k1 = 1.5, b = 0.75, the rank_bm25 defaults)</text>
  <line x1="80" y1="360.0" x2="620" y2="360.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="364.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0.0</text>
  <line x1="80" y1="310.0" x2="620" y2="310.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="314.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0.5</text>
  <line x1="80" y1="260.0" x2="620" y2="260.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="264.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">1.0</text>
  <line x1="80" y1="210.0" x2="620" y2="210.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="214.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">1.5</text>
  <line x1="80" y1="160.0" x2="620" y2="160.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="164.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">2.0</text>
  <line x1="80" y1="110.0" x2="620" y2="110.0" stroke="#a1a9af" stroke-width="1"/>
  <text x="72" y="114.0" font-size="13" text-anchor="end" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">2.5</text>
  <text x="80.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">0</text>
  <text x="188.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">2</text>
  <text x="296.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">4</text>
  <text x="404.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">6</text>
  <text x="512.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">8</text>
  <text x="620.0" y="380" font-size="13" text-anchor="middle" fill="#3b434b" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">10</text>
  <text x="350.0" y="404" font-size="14" text-anchor="middle" fill="#182027">times the term appears in the chunk</text>
  <text x="24" y="235.0" font-size="14" text-anchor="middle" fill="#182027" transform="rotate(-90 24 235.0)">× idf</text>
  <polyline points="80.0,360.0 134.0,231.0 188.0,189.8 242.0,169.5 296.0,157.5 350.0,149.5 404.0,143.8 458.0,139.5 512.0,136.2 566.0,133.6 620.0,131.4" fill="none" stroke="#970d63" stroke-width="2.5"/>
  <text x="630" y="128.4" font-size="14" fill="#970d63" font-weight="600">half-length chunk</text>
  <polyline points="80.0,360.0 134.0,260.0 188.0,217.1 242.0,193.3 296.0,178.2 350.0,167.7 404.0,160.0 458.0,154.1 512.0,149.5 566.0,145.7 620.0,142.6" fill="none" stroke="#060e15" stroke-width="2"/>
  <text x="630" y="150.6" font-size="14" fill="#060e15" font-weight="600">average chunk</text>
  <polyline points="80.0,360.0 134.0,291.0 188.0,251.9 242.0,226.7 296.0,209.1 350.0,196.1 404.0,186.1 458.0,178.2 512.0,171.8 566.0,166.5 620.0,162.0" fill="none" stroke="#3b434b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="630" y="179.0" font-size="14" fill="#3b434b" font-weight="600">double-length chunk</text>
  <text x="28" y="422" font-size="13" fill="#3b434b">Ceiling: k1 + 1 = 2.5. Plain term frequency would rise in a straight line instead.</text>
</svg>
