<!-- Animated version of the handoff thread sequence diagram in ../README.md, used by index.html.
     The marker sits on the agent that holds the conversation (active_agent) after each step.
     Classes and data attributes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-handoff-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One thread with handoffs, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 376" role="img" aria-labelledby="anim-handoff-title anim-handoff-desc">
      <title id="anim-handoff-title">One Larkspur thread with handoffs</title>
      <desc id="anim-handoff-desc">Turn 1 reaches triage, which hands off to operations, which hands off to billing. Turn 2 goes straight to billing, the active agent, and triage does not run. Turn 3 also starts at billing, which hands off sideways to operations.</desc>
      <defs>
        <marker id="ah-handoff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- participants and lifelines -->
      <g><rect class="box" x="25" y="20" width="130" height="44"/><text class="label" x="90" y="42">Customer</text></g>
      <g class="n-1"><rect class="box" x="225" y="20" width="130" height="44"/><text class="label" x="290" y="42">Triage</text></g>
      <g class="n-2 n-6"><rect class="box" x="425" y="20" width="130" height="44"/><text class="label" x="490" y="42">Operations</text></g>
      <g class="n-3 n-4 n-5"><rect class="box" x="625" y="20" width="130" height="44"/><text class="label" x="690" y="42">Billing</text></g>
      <path class="edge dashed" d="M90 64 V364 M290 64 V364 M490 64 V364 M690 64 V364"/>

      <!-- turn 1 -->
      <g class="in-1">
        <path class="edge e-1" d="M90 104 H286" marker-end="url(#ah-handoff)"/>
        <text class="small" x="190" y="90">Turn 1: credits?</text>
      </g>
      <g class="in-2">
        <path class="edge e-2" d="M290 144 H486" marker-end="url(#ah-handoff)"/>
        <text class="fig" x="390" y="130">to operations</text>
      </g>
      <g class="in-3">
        <path class="edge e-3" d="M490 184 H686" marker-end="url(#ah-handoff)"/>
        <text class="fig" x="590" y="170">to billing</text>
      </g>
      <!-- turn 2 -->
      <g class="in-4">
        <path class="edge e-4" d="M90 244 H686" marker-end="url(#ah-handoff)"/>
        <text class="small" x="190" y="230">Turn 2: which invoice?</text>
      </g>
      <!-- turn 3 -->
      <g class="in-5">
        <path class="edge e-5" d="M90 300 H686" marker-end="url(#ah-handoff)"/>
        <text class="small" x="190" y="286">Turn 3: root cause?</text>
      </g>
      <g class="in-6">
        <path class="edge e-6" d="M690 340 H494" marker-end="url(#ah-handoff)"/>
        <text class="fig" x="590" y="326">to operations</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-handoff-cap">
    <li><button type="button" data-tok="290,20">Turn 1</button><span>A new thread has no active agent, so “My server went down last night. Do I get service credits?” goes to triage. The marker shows who holds the conversation.</span></li>
    <li><button type="button" data-tok="490,20">Handoff</button><span>Triage calls <code>transfer_to_operations</code>. The tool’s <code>Command</code> runs operations next and sets <code>active_agent</code>.</span></li>
    <li><button type="button" data-tok="690,20">Handoff</button><span>Operations answers the outage part and calls <code>transfer_to_billing</code>. Billing answers the credits part and keeps the conversation.</span></li>
    <li><button type="button" data-tok="690,20">Turn 2</button><span>“Which invoice will the credit be on?” goes straight to billing, read from the saved thread. Triage does not run.</span></li>
    <li><button type="button" data-tok="690,20">Turn 3</button><span>“When is the root-cause report out?” also starts at billing, which has no incident section.</span></li>
    <li><button type="button" data-tok="490,20">Sideways</button><span>Billing hands off to operations, which answers. No coordinator was involved, and <code>active_agent</code> is now operations.</span></li>
  </ol>
</figure>
