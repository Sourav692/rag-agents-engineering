<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The call counts are the routing cost lab's own: the outage request, first turn, 5 calls for the supervisor and 3 for the swarm.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-supswarm-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Supervisor against swarm, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 344" role="img" aria-labelledby="anim-supswarm-title anim-supswarm-desc">
      <title id="anim-supswarm-title">Supervisor against swarm on the outage request</title>
      <desc id="anim-supswarm-desc">Left: a supervisor routes the outage request to operations, takes control back, routes to billing, takes control back and finishes: 5 model calls, 3 of them routing. Right: triage hands off to operations, which answers its part and hands off to billing: 3 model calls, 1 of them routing.</desc>
      <defs>
        <marker id="ah-supswarm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Supervisor: control comes back</text>
      <rect class="lane" x="8" y="28" width="384" height="308"/>
      <text class="lane-label" x="416" y="20">Swarm: control moves on</text>
      <rect class="lane" x="408" y="28" width="384" height="308"/>

      <!-- supervisor star -->
      <g class="n-1 n-3 n-5"><rect class="box" x="125" y="56" width="150" height="48"/><text class="label" x="200" y="80">Supervisor</text></g>
      <g class="n-2"><rect class="box" x="30" y="196" width="140" height="48"/><text class="label" x="100" y="220">Operations</text></g>
      <g class="n-4"><rect class="box" x="230" y="196" width="140" height="48"/><text class="label" x="300" y="220">Billing</text></g>
      <path class="edge e-2" d="M160 104 L118 193" marker-end="url(#ah-supswarm)"/>
      <path class="edge dashed e-3" d="M72 196 C52 140 80 80 122 80" marker-end="url(#ah-supswarm)"/>
      <path class="edge e-4" d="M240 104 L282 193" marker-end="url(#ah-supswarm)"/>
      <path class="edge dashed e-5" d="M328 196 C348 140 320 80 278 80" marker-end="url(#ah-supswarm)"/>
      <text class="small" x="164" y="150">route</text>
      <text class="small" x="236" y="150">route</text>
      <text class="small" x="44" y="128">report</text>
      <text class="small" x="356" y="128">report</text>
      <g class="in-5">
        <text class="fig" x="200" y="290">5 model calls</text>
        <text class="small" x="200" y="312">3 of them routing</text>
      </g>

      <!-- swarm chain -->
      <g class="n-6"><rect class="box" x="450" y="56" width="140" height="48"/><text class="label" x="520" y="80">Triage</text></g>
      <g class="n-7"><rect class="box" x="530" y="146" width="140" height="48"/><text class="label" x="600" y="170">Operations</text></g>
      <g class="n-8"><rect class="box" x="610" y="236" width="140" height="48"/><text class="label" x="680" y="260">Billing</text></g>
      <path class="edge e-7" d="M540 104 L572 143" marker-end="url(#ah-supswarm)"/>
      <path class="edge e-8" d="M620 194 L652 233" marker-end="url(#ah-supswarm)"/>
      <text class="small" x="514" y="128">handoff</text>
      <text class="small" x="594" y="218">handoff</text>
      <g class="in-8">
        <text class="fig" x="520" y="290">3 model calls</text>
        <text class="small" x="520" y="312">1 of them routing</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-supswarm-cap">
    <li><button type="button" data-tok="200,56">Decide</button><span>“My server went down last night. Do I get service credits?” reaches the supervisor, which picks operations. Call 1.</span></li>
    <li><button type="button" data-tok="100,196">Operations</button><span>Operations answers the outage part from its handbook section. Call 2.</span></li>
    <li><button type="button" data-tok="200,56">Decide again</button><span>Control comes back. The supervisor reads the answer and picks billing for the credits. Call 3.</span></li>
    <li><button type="button" data-tok="300,196">Billing</button><span>Billing answers the credits part. Call 4.</span></li>
    <li><button type="button" data-tok="200,56">Finish</button><span>Control comes back once more, and the supervisor decides the request is done. Call 5, the third spent on routing.</span></li>
    <li><button type="button" data-tok="520,56">Triage</button><span>The same request in a swarm reaches triage, which hands off to operations. Call 1, the only routing call.</span></li>
    <li><button type="button" data-tok="600,146">Operations</button><span>Operations answers the outage part and hands off to billing itself. Call 2.</span></li>
    <li><button type="button" data-tok="680,236">Billing</button><span>Billing answers the credits part and keeps the conversation. Call 3.</span></li>
  </ol>
</figure>
