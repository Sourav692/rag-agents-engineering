<!-- Animated version of the Tiered memory flowchart in ../README.md, used by index.html.
     The figures are the tiered-memory lab's own at a window of 6: 11 messages by turn 6, 5 paged out, the query "outbound traffic" returns the turn-2 message at rank 1.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-paging-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Paging messages to the archive, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-paging-title anim-paging-desc">
      <title id="anim-paging-title">Paging messages out and searching them back</title>
      <desc id="anim-paging-desc">Eleven messages arrive over six turns. Core memory keeps the customer’s plan. When the sixth turn arrives the window keeps the last six messages and pages five out to the archive, including the turn-2 message with 12 days and 80 GB. The model searches the archive for outbound traffic, gets that message back at rank 1, and can answer the refund question.</desc>
      <defs>
        <marker id="ah-paging" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">The conversation, oldest first (c customer, a agent)</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">Each call</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- eleven messages -->
      <g class="in-1">
        <rect class="doc" x="24" y="60" width="60" height="36"/><text class="fig" x="54" y="78">c1</text>
        <rect class="doc" x="92" y="60" width="60" height="36"/><text class="fig" x="122" y="78">a1</text>
        <rect class="doc" x="160" y="60" width="60" height="36"/><text class="fig" x="190" y="78">c2</text>
        <rect class="doc" x="228" y="60" width="60" height="36"/><text class="fig" x="258" y="78">a2</text>
      </g>
      <g class="in-2">
        <rect class="doc" x="296" y="60" width="60" height="36"/><text class="fig" x="326" y="78">c3</text>
        <rect class="doc" x="364" y="60" width="60" height="36"/><text class="fig" x="394" y="78">a3</text>
        <rect class="doc" x="432" y="60" width="60" height="36"/><text class="fig" x="462" y="78">c4</text>
        <rect class="doc" x="500" y="60" width="60" height="36"/><text class="fig" x="530" y="78">a4</text>
        <rect class="doc" x="568" y="60" width="60" height="36"/><text class="fig" x="598" y="78">c5</text>
        <rect class="doc" x="636" y="60" width="60" height="36"/><text class="fig" x="666" y="78">a5</text>
      </g>
      <g class="in-3">
        <rect class="doc" x="704" y="60" width="60" height="36"/><text class="fig" x="734" y="78">c6</text>
        <!-- the five oldest are paged out -->
        <rect class="box" x="20" y="54" width="340" height="48"/><text class="small" x="190" y="78">paged out</text>
        <path class="hit-line" d="M360 48 H770 M360 48 V56 M770 48 V56"/>
        <text class="small" x="565" y="124">window: the last 6 messages</text>
      </g>
      <g class="in-1"><text class="small" x="190" y="124">c2: 12 days, 80 GB</text></g>

      <!-- each call: core memory, prompt, model, archive -->
      <g class="n-1"><rect class="box" x="24" y="236" width="180" height="64"/><text class="label" x="114" y="256">Core memory</text></g>
      <g class="in-1"><text class="small" x="114" y="282">annual business plan</text></g>
      <g class="n-3"><rect class="box" x="244" y="236" width="150" height="64"/><text class="label" x="319" y="256">Prompt</text><text class="small" x="319" y="282">core + window</text></g>
      <g class="n-4 n-6"><rect class="box" x="434" y="236" width="150" height="64"/><text class="label" x="509" y="256">Model</text></g>
      <path class="edge e-3" d="M204 268 H241" marker-end="url(#ah-paging)"/>
      <path class="edge e-3 in-3" d="M565 104 C565 170 319 170 319 233" marker-end="url(#ah-paging)"/>
      <path class="edge e-3" d="M394 268 H431" marker-end="url(#ah-paging)"/>

      <g class="n-3 n-5">
        <path class="box" d="M626 238 a77 10 0 0 0 154 0 v84 a77 10 0 0 1 -154 0 z"/>
        <ellipse class="box" cx="703" cy="238" rx="77" ry="10"/>
        <text class="label" x="703" y="262">Archive</text>
      </g>
      <path class="edge e-4" d="M584 256 H623" marker-end="url(#ah-paging)"/>
      <path class="edge e-5" d="M626 288 H587" marker-end="url(#ah-paging)"/>

      <!-- archive copies of the five paged-out messages, moving down from the conversation row -->
      <rect class="chunk mv-3" style="--from: translate(-607px, -230px)" x="631" y="290" width="26" height="14"/>
      <rect class="chunk mv-3" style="--from: translate(-569px, -230px)" x="661" y="290" width="26" height="14"/>
      <rect class="chunk mv-3" style="--from: translate(-531px, -230px)" x="691" y="290" width="26" height="14"/>
      <rect class="chunk mv-3" style="--from: translate(-493px, -230px)" x="721" y="290" width="26" height="14"/>
      <rect class="chunk mv-3" style="--from: translate(-455px, -230px)" x="751" y="290" width="26" height="14"/>
      <g class="in-5"><rect class="hit" x="691" y="290" width="26" height="14"/><text class="fig" x="704" y="318">c2, rank 1</text></g>

      <g class="in-4"><text class="fig" x="509" y="324">“outbound traffic”</text></g>
      <g class="in-6"><text class="small" x="509" y="282">30 days, 100 GB</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-paging-cap">
    <li><button type="button" data-tok="114,226">Facts</button><span>Dana states her plan, and the model appends it to core memory. Turn 2 says 12 days and 80 GB of outbound traffic.</span></li>
    <li><button type="button" data-tok="462,40">Filler</button><span>Three unrelated questions bring the conversation to 10 messages.</span></li>
    <li><button type="button" data-tok="565,40">Evict</button><span>Turn 6 arrives. The window keeps the last 6 messages and pages the 5 oldest out to the archive, the turn-2 message with them.</span></li>
    <li><button type="button" data-tok="604,236">Search</button><span>The model calls archival_memory_search with the query “outbound traffic”.</span></li>
    <li><button type="button" data-tok="704,274">Recall</button><span>The turn-2 message comes back at rank 1, sharing 2 words with the query.</span></li>
    <li><button type="button" data-tok="509,226">Answer</button><span>With 12 days and 80 GB back in context, the model can apply the handbook rule: a full refund within 30 days if under 100 GB.</span></li>
  </ol>
</figure>
