<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The turn is turn 3 of the lab's Exports chat; the rewrite and the score are the lab's own (rewritten question, k = 1).
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-turn-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One conversational RAG turn, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 340" role="img" aria-labelledby="anim-turn-title anim-turn-desc">
      <title id="anim-turn-title">One conversational RAG turn</title>
      <desc id="anim-turn-desc">A follow-up, How long do I have, arrives. The session’s history is loaded and an LLM rewrites the follow-up as How long is my data kept after I cancel my plan. The retriever searches for the rewrite and ranks the retention chunk first at 0.404. The model answers from that chunk and the history, and the question and answer are saved to the history for the next turn.</desc>
      <defs>
        <marker id="ah-turn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="24" y="48" width="150" height="44"/><text class="label" x="99" y="70">Follow-up</text></g>
      <g class="n-3"><rect class="box" x="214" y="48" width="150" height="44"/><text class="label" x="289" y="70">Rewrite</text></g>
      <g class="n-4"><rect class="box" x="424" y="48" width="150" height="44"/><text class="label" x="499" y="70">Retrieve top-k</text></g>
      <g class="n-5"><rect class="box" x="624" y="48" width="150" height="44"/><text class="label" x="699" y="70">Answer</text></g>
      <path class="edge e-3" d="M174 70 H211" marker-end="url(#ah-turn)"/>
      <path class="edge e-4" d="M364 70 H421" marker-end="url(#ah-turn)"/>
      <path class="edge e-5" d="M574 70 H621" marker-end="url(#ah-turn)"/>

      <g class="in-1">
        <rect class="doc" x="24" y="104" width="150" height="48"/>
        <text class="small" x="99" y="120">How long</text>
        <text class="small" x="99" y="138">do I have?</text>
      </g>

      <g class="n-2 n-6">
        <path class="box" d="M24 236 a75 10 0 0 0 150 0 v66 a75 10 0 0 1 -150 0 z"/>
        <ellipse class="box" cx="99" cy="236" rx="75" ry="10"/>
        <text class="label" x="99" y="260">History</text>
        <text class="small" x="99" y="278">per session</text>
      </g>
      <g class="in-2">
        <rect class="chunk" x="33" y="288" width="18" height="8"/><rect class="chunk" x="56" y="288" width="18" height="8"/>
        <rect class="chunk" x="79" y="288" width="18" height="8"/><rect class="chunk" x="102" y="288" width="18" height="8"/>
      </g>
      <path class="edge dashed e-2" d="M174 262 C206 262 222 200 222 96" marker-end="url(#ah-turn)"/>
      <text class="small" x="248" y="196">load</text>

      <g class="in-3">
        <text class="small" x="296" y="116">How long is my</text>
        <text class="small" x="296" y="134">data kept after I</text>
        <text class="small" x="296" y="152">cancel my plan?</text>
      </g>

      <g class="in-4">
        <rect class="hit" x="454" y="108" width="90" height="8"/>
        <text class="fig" x="499" y="134">retention 0.404</text>
        <text class="small" x="499" y="154">k = 1</text>
      </g>

      <g class="in-5">
        <rect class="doc" x="644" y="104" width="110" height="48"/>
        <path class="line" d="M652 116 H746 M652 126 H730"/>
        <text class="fig" x="699" y="141">[retention]</text>
      </g>

      <path class="edge dashed e-6" d="M699 156 C699 300 420 306 178 292" marker-end="url(#ah-turn)"/>
      <text class="small" x="440" y="320">save turn</text>
      <g class="mv-6" style="--from: translate(560px, -170px)">
        <rect class="hit" x="125" y="288" width="18" height="8"/><rect class="hit" x="148" y="288" width="18" height="8"/>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-turn-cap">
    <li><button type="button">Follow-up</button><span>Turn 3 of the Exports chat arrives: “How long do I have?”</span></li>
    <li><button type="button">Load</button><span>The history for this session comes back: turns 1 and 2, four messages.</span></li>
    <li><button type="button">Rewrite</button><span>An LLM rewrites the follow-up with that history as a standalone question.</span></li>
    <li><button type="button">Retrieve</button><span>The retriever searches for the rewrite. In the lab the retention chunk ranks first at 0.404; the raw follow-up scores zero against every chunk.</span></li>
    <li><button type="button">Answer</button><span>The model answers from the retention chunk and the history.</span></li>
    <li><button type="button">Save</button><span>The question and the answer join the history, ready for turn 4.</span></li>
  </ol>
</figure>
