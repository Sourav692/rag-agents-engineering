<!-- Animated version of the quality-loop flowchart in ../README.md, used by index.html.
     The figures are notebook 05c’s settings: NUM_QUERIES 3, RESULTS_PER_QUERY 3, QUALITY_THRESHOLD 0.7, MAX_DRAFTS 2.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-qloop-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The research quality loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 880 300" role="img" aria-labelledby="anim-qloop-title anim-qloop-desc">
      <title id="anim-qloop-title">Planner, parallel search and a capped quality loop</title>
      <desc id="anim-qloop-desc">A planner writes 3 search queries. Send starts one search agent per query, in parallel, each reading 3 results; their findings append to one list. An analyst reads all findings and a writer drafts the report. A quality checker scores three criteria and keeps the weakest. The gate approves at 0.7 or more with all four sections present; otherwise the report goes back to the writer, until 2 drafts have been reviewed, when the gate ends the loop whatever the scores.</desc>
      <defs>
        <marker id="ah-qloop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="74" width="140" height="56"/><text class="label" x="90" y="94">Planner</text><text class="small" x="90" y="114">3 queries</text></g>

      <path class="edge e-2" d="M160 102 C195 102 195 46 227 46" marker-end="url(#ah-qloop)"/>
      <path class="edge e-2" d="M160 102 H227" marker-end="url(#ah-qloop)"/>
      <path class="edge e-2" d="M160 102 C195 102 195 158 227 158" marker-end="url(#ah-qloop)"/>
      <g class="n-2"><rect class="box" x="230" y="24" width="150" height="44"/><text class="label" x="305" y="46">Search agent</text></g>
      <g class="n-2"><rect class="box" x="230" y="80" width="150" height="44"/><text class="label" x="305" y="102">Search agent</text></g>
      <g class="n-2"><rect class="box" x="230" y="136" width="150" height="44"/><text class="label" x="305" y="158">Search agent</text></g>
      <text class="small in-2" x="305" y="198">3 results each</text>

      <path class="edge e-3" d="M380 46 C415 46 415 102 447 102" marker-end="url(#ah-qloop)"/>
      <path class="edge e-3" d="M380 102 H447" marker-end="url(#ah-qloop)"/>
      <path class="edge e-3" d="M380 158 C415 158 415 102 447 102" marker-end="url(#ah-qloop)"/>
      <g class="n-3"><rect class="box" x="450" y="74" width="140" height="56"/><text class="label" x="520" y="94">Analyst</text><text class="small" x="520" y="114">all findings</text></g>

      <path class="edge e-4" d="M590 102 H657" marker-end="url(#ah-qloop)"/>
      <g class="n-4 n-6"><rect class="box" x="660" y="74" width="160" height="56"/><text class="label" x="740" y="102">Report writer</text></g>
      <text class="fig in-4" x="700" y="58">draft 1</text>
      <text class="fig in-6" x="780" y="58">draft 2</text>

      <path class="edge e-5" d="M740 130 V197" marker-end="url(#ah-qloop)"/>
      <g class="n-5 n-7"><rect class="box" x="660" y="200" width="160" height="56"/><text class="label" x="740" y="220">Quality checker</text><text class="small" x="740" y="240">weakest criterion</text></g>

      <path class="edge e-5 e-7" d="M660 228 H557" marker-end="url(#ah-qloop)"/>
      <g class="n-5 n-7">
        <path class="box" d="M500 192 L555 228 L500 264 L445 228 Z"/>
        <text class="small" x="500" y="220">Approved, or</text>
        <text class="small" x="500" y="238">2 drafts?</text>
      </g>

      <path class="edge e-6" d="M500 192 V160 H690 V133" marker-end="url(#ah-qloop)"/>
      <text class="small" x="600" y="150">no</text>

      <path class="edge e-7" d="M445 228 H383" marker-end="url(#ah-qloop)"/>
      <text class="small" x="414" y="216">yes</text>
      <g class="n-7"><rect class="box" x="230" y="205" width="150" height="46"/><text class="label" x="305" y="228">Report</text></g>
      <text class="small in-7" x="305" y="276">the cap is code, not the model</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-qloop-cap">
    <li><button type="button" data-tok="20,74">Plan</button><span>The planner writes the search queries once, and code keeps at most 3.</span></li>
    <li><button type="button" data-tok="230,80">Fan out</button><span>Send starts one search agent per query; they run at the same time and each reads 3 results.</span></li>
    <li><button type="button" data-tok="450,74">Gather</button><span>Their findings append to one list through the operator.add reducer, and the analyst reads all of them.</span></li>
    <li><button type="button" data-tok="660,74">Draft</button><span>The writer drafts a report with four required sections.</span></li>
    <li><button type="button" data-tok="660,200">Review</button><span>The checker scores three criteria and keeps the weakest. Below 0.7, or a section missing, the gate sends it back.</span></li>
    <li><button type="button" data-tok="660,74">Revise</button><span>The writer revises from its previous draft and the reviewer’s feedback.</span></li>
    <li><button type="button" data-tok="230,205">Stop</button><span>After the second review the gate ends the loop, approved or not: MAX_DRAFTS is 2.</span></li>
  </ol>
</figure>
