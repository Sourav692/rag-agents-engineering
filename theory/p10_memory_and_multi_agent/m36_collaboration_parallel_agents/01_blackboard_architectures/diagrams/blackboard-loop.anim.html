<!-- Animated version of the Blackboard flowchart in ../README.md, used by index.html.
     The run is the Larkspur outage escalation from the lesson page, an illustration with no measured figures.
     Classes and data attributes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-blackboard-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The blackboard loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 360" role="img" aria-labelledby="anim-blackboard-title anim-blackboard-desc">
      <title id="anim-blackboard-title">The blackboard loop</title>
      <desc id="anim-blackboard-desc">An outage escalation reaches the controller. It picks the incident analyst, who posts that availability fell below the SLA. The controller re-reads the board, picks the credits analyst and skips the status analyst. The credits analyst posts the credit terms, the reply writer drafts from the board, and the controller finishes. Three specialists ran and the controller decided four times.</desc>
      <defs>
        <marker id="ah-bb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="160" width="110" height="44"/><text class="label" x="75" y="182">Request</text></g>
      <path class="edge e-1" d="M130 182 H167" marker-end="url(#ah-bb)"/>

      <g class="n-2 n-4 n-7"><rect class="box" x="170" y="160" width="140" height="44"/><text class="label" x="240" y="182">Controller</text></g>

      <g class="n-3"><rect class="box" x="380" y="40" width="160" height="44"/><text class="label" x="460" y="62">Incident analyst</text></g>
      <g class="n-5"><rect class="box" x="380" y="120" width="160" height="44"/><text class="label" x="460" y="142">Credits analyst</text></g>
      <g><rect class="box" x="380" y="200" width="160" height="44"/><text class="label" x="460" y="222">Status analyst</text></g>
      <g class="n-6"><rect class="box" x="380" y="280" width="160" height="44"/><text class="label" x="460" y="302">Reply writer</text></g>

      <path class="edge e-2" d="M310 182 C345 182 345 62 377 62" marker-end="url(#ah-bb)"/>
      <path class="edge e-5" d="M310 182 C345 182 345 142 377 142" marker-end="url(#ah-bb)"/>
      <path class="edge dashed" d="M310 182 C345 182 345 222 377 222" marker-end="url(#ah-bb)"/>
      <path class="edge e-6" d="M310 182 C345 182 345 302 377 302" marker-end="url(#ah-bb)"/>
      <text class="small in-4" x="460" y="260">skipped</text>

      <g>
        <path class="box" d="M610 48 a85 10 0 0 0 170 0 v264 a85 10 0 0 1 -170 0 z"/>
        <ellipse class="box" cx="695" cy="48" rx="85" ry="10"/>
        <text class="label" x="695" y="82">Blackboard</text>
      </g>
      <path class="edge e-3" d="M540 62 H607" marker-end="url(#ah-bb)"/>
      <path class="edge e-5" d="M540 142 H607" marker-end="url(#ah-bb)"/>
      <path class="edge dashed" d="M540 222 H607" marker-end="url(#ah-bb)"/>
      <path class="edge e-6" d="M540 302 H607" marker-end="url(#ah-bb)"/>
      <text class="small in-3" x="695" y="120">Incident: SLA missed</text>
      <text class="small in-5" x="695" y="160">Credits: next invoice</text>
      <text class="small in-6" x="695" y="200">Writer: draft reply</text>

      <path class="edge dashed e-4 e-6 e-7" d="M695 324 V344 H240 V207" marker-end="url(#ah-bb)"/>
      <text class="small" x="470" y="336">re-read after every post</text>

      <path class="edge e-7" d="M190 204 C190 260 160 292 133 292" marker-end="url(#ah-bb)"/>
      <g class="n-7"><rect class="box" x="20" y="270" width="110" height="44"/><text class="label" x="75" y="292">Reply</text></g>
      <text class="small in-7" x="75" y="330">FINISH</text>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-blackboard-cap">
    <li><button type="button">Request</button><span>An escalation arrives: two outages this week, a credit reply if the SLA was missed, a status-page reply if not. The board is empty.</span></li>
    <li><button type="button">Pick</button><span>The controller reads the empty board and picks the incident analyst.</span></li>
    <li><button type="button">Post</button><span>The incident analyst reads the incident log and posts that availability fell below the 99.95% SLA.</span></li>
    <li><button type="button">Re-read</button><span>The controller re-reads the board. The SLA was missed, so the status analyst is skipped.</span></li>
    <li><button type="button">Credits</button><span>The credits analyst posts the credit terms: service credits on the next invoice.</span></li>
    <li><button type="button">Write</button><span>With a finding and the credit terms on the board, the controller picks the reply writer, who drafts from them.</span></li>
    <li><button type="button">Finish</button><span>The board holds a draft, so the controller returns FINISH. Three specialists ran and the controller decided four times.</span></li>
  </ol>
</figure>
