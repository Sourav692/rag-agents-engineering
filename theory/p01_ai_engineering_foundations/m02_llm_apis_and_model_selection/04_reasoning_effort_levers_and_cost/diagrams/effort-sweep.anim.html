<!-- Animated version of the sweep flowchart in ../README.md, used by index.html.
     The figures are the effort-knee lab's own, from its representative step-then-plateau inputs, per 10,000 answers.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-sweep-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The effort sweep, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-sweep-title anim-sweep-desc">
      <title id="anim-sweep-title">The effort sweep</title>
      <desc id="anim-sweep-desc">Six problems run through o4-mini at low, medium and high effort and are graded by substring. With the lab’s representative inputs each level gives a row: low 4 of 6 at $11.44, medium 5 of 6 at $31.24, high 5 of 6 at $79.64 per 10,000 answers. The marginal table prices each step: low to medium $1.19 per point, medium to high no gain, so the knee is medium.</desc>
      <defs>
        <marker id="ah-sw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1">
        <path class="box" d="M20 42 a60 10 0 0 0 120 0 v34 a60 10 0 0 1 -120 0 z"/>
        <ellipse class="box" cx="80" cy="42" rx="60" ry="10"/>
        <text class="label" x="80" y="64">6 problems</text>
      </g>
      <g class="n-2 n-6"><rect class="box" x="180" y="40" width="140" height="44"/><text class="label" x="250" y="62">Pick effort</text></g>
      <g class="n-3"><rect class="box" x="360" y="40" width="150" height="44"/><text class="label" x="435" y="62">Call o4-mini</text></g>
      <g class="n-4"><rect class="box" x="550" y="40" width="140" height="44"/><text class="label" x="620" y="62">Grade</text></g>
      <path class="edge e-2" d="M140 62 H177" marker-end="url(#ah-sw)"/>
      <path class="edge e-3" d="M320 62 H357" marker-end="url(#ah-sw)"/>
      <path class="edge e-4" d="M510 62 H547" marker-end="url(#ah-sw)"/>

      <text class="small in-1" x="80" y="106">mixed easy and hard</text>
      <text class="fig in-2" x="200" y="106" style="text-anchor: start">low, medium, high</text>
      <text class="small in-3" x="435" y="106">18 calls in all</text>
      <text class="small in-4" x="620" y="106">expected text in reply</text>

      <path class="edge e-5" d="M620 84 V137" marker-end="url(#ah-sw)"/>
      <g class="n-5 n-6">
        <rect class="box" x="520" y="140" width="260" height="104"/>
        <text class="small" x="650" y="158">per 10,000 answers</text>
      </g>
      <text class="fig in-5" x="650" y="184">low: 4 of 6, $11.44</text>
      <text class="fig in-6" x="650" y="206">medium: 5 of 6, $31.24</text>
      <text class="fig in-6" x="650" y="228">high: 5 of 6, $79.64</text>

      <path class="edge e-6 in-6" d="M520 192 H190 V87" marker-end="url(#ah-sw)"/>
      <text class="small in-6" x="390" y="178">next effort</text>

      <path class="edge e-7 in-7" d="M650 244 V286 H447" marker-end="url(#ah-sw)"/>
      <g class="n-7 n-8 in-7">
        <rect class="box" x="120" y="236" width="324" height="80"/>
        <text class="label" x="282" y="254">Marginal step</text>
        <text class="fig" x="282" y="276">low to medium: $1.19 a point</text>
        <text class="fig" x="282" y="298">medium to high: no gain</text>
      </g>
      <g class="in-8">
        <rect class="hit" x="20" y="262" width="88" height="30"/>
        <text class="small" x="64" y="277" style="fill: var(--color-accent-ink)">knee: medium</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-sweep-cap">
    <li><button type="button" data-tok="20,36">Problems</button><span>Six problems, some a competent model solves without thinking and some that need the working.</span></li>
    <li><button type="button" data-tok="180,40">Effort</button><span>Pick the first effort level, low.</span></li>
    <li><button type="button" data-tok="360,40">Call</button><span>Send every problem to o4-mini with that reasoning_effort. Three levels make 18 calls.</span></li>
    <li><button type="button" data-tok="550,40">Grade</button><span>A reply is correct when it contains the expected text.</span></li>
    <li><button type="button" data-tok="520,140">Row</button><span>The level becomes one row: accuracy, seconds, mean reasoning tokens and cost. In the lab, low gets 4 of 6.</span></li>
    <li><button type="button" data-tok="190,192">Next</button><span>Repeat at medium and high. The bill keeps climbing; accuracy stops at 5 of 6.</span></li>
    <li><button type="button" data-tok="120,236">Marginal</button><span>Price each step up in dollars per accuracy point. Medium to high buys nothing.</span></li>
    <li><button type="button" data-tok="20,262">Knee</button><span>The knee is the last step you would pay for: medium, at a $2 threshold.</span></li>
  </ol>
</figure>
