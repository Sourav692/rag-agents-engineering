<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     No figures: the steps follow one Larkspur question through a model call. Classes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-modelcall-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One model call, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-modelcall-title anim-modelcall-desc">
      <title id="anim-modelcall-title">One model call</title>
      <desc id="anim-modelcall-desc">The app builds a messages list, sends it to an endpoint, and the model may spend hidden reasoning tokens before it writes the visible answer. The usage object counts prompt and completion tokens, reasoning included, and the cost is the tokens times the prices.</desc>
      <defs>
        <marker id="ah-mc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="40" width="140" height="44"/><text class="label" x="90" y="62">Messages</text></g>
      <g class="n-2"><rect class="box" x="210" y="40" width="140" height="44"/><text class="label" x="280" y="62">Endpoint</text></g>
      <g class="n-3"><rect class="box" x="400" y="40" width="160" height="44"/><text class="label" x="480" y="62">Model</text></g>
      <g class="n-4"><rect class="box" x="610" y="40" width="170" height="44"/><text class="label" x="695" y="62">Answer</text></g>
      <path class="edge e-2 in-2" d="M160 62 H207" marker-end="url(#ah-mc)"/>
      <path class="edge e-3 in-3" d="M350 62 H397" marker-end="url(#ah-mc)"/>
      <path class="edge e-4 in-4" d="M560 62 H607" marker-end="url(#ah-mc)"/>

      <g class="in-1">
        <rect class="doc" x="20" y="100" width="140" height="70"/>
        <text class="small" x="90" y="118">system: answer</text>
        <text class="small" x="90" y="136">from the handbook</text>
        <text class="small" x="90" y="156">user: refund time?</text>
      </g>
      <g class="in-2">
        <text class="small" x="280" y="108">OpenAI, Gemini,</text>
        <text class="small" x="280" y="126">Hugging Face</text>
        <text class="small" x="280" y="144">or a local GPU</text>
      </g>
      <g class="in-3">
        <circle class="hit" cx="425" cy="108" r="5"/><circle class="hit" cx="445" cy="108" r="5"/><circle class="hit" cx="465" cy="108" r="5"/>
        <circle class="hit" cx="485" cy="108" r="5"/><circle class="hit" cx="505" cy="108" r="5"/><circle class="hit" cx="525" cy="108" r="5"/>
        <circle class="hit" cx="425" cy="126" r="5"/><circle class="hit" cx="445" cy="126" r="5"/><circle class="hit" cx="465" cy="126" r="5"/>
        <circle class="hit" cx="485" cy="126" r="5"/><circle class="hit" cx="505" cy="126" r="5"/><circle class="hit" cx="525" cy="126" r="5"/>
        <text class="small" x="480" y="152">reasoning tokens, hidden</text>
      </g>
      <g class="in-4">
        <rect class="doc" x="610" y="100" width="170" height="44"/>
        <text class="small" x="695" y="122">5 to 10 business days</text>
      </g>

      <path class="edge dashed e-5 in-5" d="M480 166 V217" marker-end="url(#ah-mc)"/>
      <path class="edge dashed e-5 in-5" d="M695 144 C695 190 560 190 560 217" marker-end="url(#ah-mc)"/>
      <g class="n-5 in-5">
        <rect class="box" x="400" y="220" width="200" height="72"/>
        <text class="label" x="500" y="240">usage</text>
        <text class="small" x="500" y="262">completion tokens =</text>
        <text class="small" x="500" y="280">reasoning + answer</text>
      </g>
      <path class="edge e-6 in-6" d="M600 256 H647" marker-end="url(#ah-mc)"/>
      <g class="n-6 in-6">
        <rect class="box" x="650" y="220" width="130" height="72"/>
        <text class="label" x="715" y="240">Cost</text>
        <text class="small" x="715" y="262">tokens ×</text>
        <text class="small" x="715" y="280">prices</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-modelcall-cap">
    <li><button type="button">Messages</button><span>The app builds the messages: a system instruction, the retrieved handbook chunk and the customer’s question.</span></li>
    <li><button type="button">Endpoint</button><span>One client call sends them to an endpoint: a vendor API, a Hugging Face provider or a model on your own GPU.</span></li>
    <li><button type="button">Think</button><span>A reasoning model spends reasoning tokens first. You never receive them. A fast model skips this step.</span></li>
    <li><button type="button">Answer</button><span>The model returns the visible answer, here a few tokens from the refund-timing chunk.</span></li>
    <li><button type="button">Usage</button><span>The response’s usage object counts prompt and completion tokens. Completion includes the hidden reasoning.</span></li>
    <li><button type="button">Cost</button><span>Cost is prompt tokens at the input price plus completion tokens at the output price.</span></li>
  </ol>
</figure>
