<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Hanken Grotesk, ui-sans-serif, system-ui, sans-serif">
  <title>Normalising embedding rows with broadcasting</title>
  <desc>Top: the row norms of a 12 by 384 embedding matrix, kept as a 12 by 1 column with keepdims=True, stretch across all 384 columns, so each row is divided by its own length. Bottom: without keepdims the norms are a flat array of 12, which NumPy lines up with the last axis of 384 and rejects. On a square matrix the same line runs without an error and divides columns instead of rows.</desc>
  <rect width="760" height="330" fill="#e5eaef"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#060e15">With keepdims=True: each row divided by its own length</text>

  <!-- E -->
  <text x="110" y="58" font-size="13" text-anchor="middle" fill="#3b434b">E, the chunk vectors</text>
  <rect x="30" y="66" width="160" height="84" fill="#f4f6f8" stroke="#3b434b"/>
  <path d="M30 80 H190 M30 94 H190 M30 108 H190 M30 122 H190 M30 136 H190" stroke="#a1a9af"/>
  <text x="110" y="170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#060e15">(12, 384)</text>

  <text x="214" y="114" font-size="22" text-anchor="middle" fill="#060e15">÷</text>

  <!-- norms as a column, stretched -->
  <text x="300" y="58" font-size="13" text-anchor="middle" fill="#3b434b">row lengths, stretched</text>
  <rect x="238" y="66" width="20" height="84" fill="#f0ccdc" stroke="#970d63" stroke-width="1.5"/>
  <rect x="262" y="66" width="100" height="84" fill="none" stroke="#970d63" stroke-dasharray="4 4"/>
  <path d="M262 80 H362 M262 94 H362 M262 108 H362 M262 122 H362 M262 136 H362" stroke="#f0ccdc"/>
  <text x="248" y="170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#970d63">(12, 1)</text>
  <text x="320" y="170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#3b434b">(12, 384)</text>

  <text x="426" y="114" font-size="22" text-anchor="middle" fill="#060e15">=</text>

  <text x="540" y="58" font-size="13" text-anchor="middle" fill="#3b434b">E_n, unit-length rows</text>
  <rect x="460" y="66" width="160" height="84" fill="#f4f6f8" stroke="#060e15" stroke-width="1.5"/>
  <path d="M460 80 H620 M460 94 H620 M460 108 H620 M460 122 H620 M460 136 H620" stroke="#a1a9af"/>
  <text x="540" y="170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#060e15">(12, 384)</text>
  <text x="640" y="104" font-size="13" fill="#182027">then</text>
  <text x="640" y="122" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#182027">E_n @ q_n</text>
  <text x="640" y="140" font-size="13" fill="#182027">is cosine</text>

  <path d="M24 196 H736" stroke="#a1a9af"/>

  <text x="24" y="226" font-size="15" font-weight="600" fill="#060e15">Without keepdims: a flat array of 12 lines up with the last axis</text>
  <rect x="30" y="242" width="160" height="40" fill="#f4f6f8" stroke="#3b434b"/>
  <text x="110" y="300" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#060e15">(12, 384)</text>
  <text x="214" y="268" font-size="22" text-anchor="middle" fill="#060e15">÷</text>
  <rect x="238" y="254" width="96" height="16" fill="#f0ccdc" stroke="#970d63" stroke-width="1.5"/>
  <text x="286" y="300" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#970d63">(12,)</text>
  <text x="360" y="258" font-size="13" fill="#060e15">384 against 12: ValueError, cannot broadcast.</text>
  <text x="360" y="278" font-size="13" fill="#182027">On a square matrix the same line runs, divides</text>
  <text x="360" y="296" font-size="13" fill="#182027">columns instead of rows, and the ranking changes.</text>
</svg>
