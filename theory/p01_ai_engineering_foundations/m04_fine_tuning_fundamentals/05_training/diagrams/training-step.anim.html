<!-- Animated version of the optimizer-step flowchart in ../README.md, used by index.html.
     Figures are the lesson 4.5 notebook's TrainingArguments; the learning rates come from transformers 5.17's
     get_linear_schedule_with_warmup(num_warmup_steps=1, num_training_steps=3) at lr 1e-5.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-trainstep-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One optimizer step with gradient accumulation, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 290" role="img" aria-labelledby="anim-trainstep-title anim-trainstep-desc">
      <title id="anim-trainstep-title">Gradient accumulation in the lesson 4.5 run</title>
      <desc id="anim-trainstep-desc">One example goes forward through the model, the loss is computed, and its gradients are added to a running sum. After four micro-batches the optimizer updates the weights at the scheduled learning rate and the gradients are zeroed. The run’s three updates use learning rates 0, 1e-5 and 5e-6, and stop after 12 examples, 0.95% of the 1,260 training rows.</desc>
      <defs>
        <marker id="ah-trainstep" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1 n-4"><rect class="box" x="30" y="70" width="130" height="52"/><text class="label" x="95" y="96">Micro-batch</text></g>
      <g class="n-2 n-4"><rect class="box" x="210" y="70" width="130" height="52"/><text class="label" x="275" y="96">Forward</text></g>
      <g class="n-3 n-4"><rect class="box" x="390" y="70" width="130" height="52"/><text class="label" x="455" y="96">Backward</text></g>
      <g class="n-4">
        <path class="box" d="M650 56 L730 96 L650 136 L570 96 Z"/>
        <text class="small" x="650" y="96">4 collected?</text>
      </g>
      <g class="n-5"><rect class="box" x="540" y="200" width="120" height="52"/><text class="label" x="600" y="218">Optimizer</text><text class="label" x="600" y="238">step</text></g>
      <g class="n-6"><rect class="box" x="340" y="200" width="130" height="52"/><text class="label" x="405" y="218">Zero</text><text class="label" x="405" y="238">gradients</text></g>

      <path class="edge e-2" d="M160 96 H207" marker-end="url(#ah-trainstep)"/>
      <path class="edge e-3" d="M340 96 H387" marker-end="url(#ah-trainstep)"/>
      <path class="edge e-4" d="M520 96 H567" marker-end="url(#ah-trainstep)"/>
      <path class="edge e-4" d="M650 56 V28 H95 V67" marker-end="url(#ah-trainstep)"/>
      <text class="small" x="372" y="18">no: next micro-batch</text>
      <path class="edge e-5" d="M650 136 V170 H600 V197" marker-end="url(#ah-trainstep)"/>
      <text class="small" x="672" y="160">yes</text>
      <path class="edge e-6" d="M540 226 H473" marker-end="url(#ah-trainstep)"/>
      <path class="edge e-6 e-7" d="M340 226 H95 V125" marker-end="url(#ah-trainstep)"/>

      <text class="fig in-1" x="95" y="142">1 example</text>
      <text class="fig in-2" x="275" y="142">loss</text>
      <text class="fig in-3" x="455" y="142">gradient sum</text>
      <text class="fig in-4" x="765" y="96">4 of 4</text>
      <text class="fig in-5" x="730" y="214">step 1: lr 0</text>
      <text class="fig in-6" x="730" y="234">step 2: lr 1e-5</text>
      <text class="fig in-6" x="730" y="254">step 3: lr 5e-6</text>
      <g class="in-7">
        <text class="fig" x="250" y="170">3 updates × 4 = 12 examples</text>
        <text class="fig" x="250" y="190">0.95% of one epoch</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-trainstep-cap">
    <li><button type="button" data-tok="30,70">Micro-batch</button><span>The data loader yields one example: <code>per_device_train_batch_size</code> is 1.</span></li>
    <li><button type="button" data-tok="210,70">Forward</button><span>The model predicts every next token, and the loss compares those predictions with <code>labels</code>.</span></li>
    <li><button type="button" data-tok="390,70">Backward</button><span>Backpropagation computes the gradients and adds them to the running sum.</span></li>
    <li><button type="button" data-tok="570,96">Accumulate</button><span>Micro-batches 2 to 4 run the same loop. After four, the sum stands for a batch of 4.</span></li>
    <li><button type="button" data-tok="540,200">Update</button><span>Adafactor applies the summed gradients at the scheduled rate. Update 1 is the warmup step, at learning rate 0.</span></li>
    <li><button type="button" data-tok="340,200">Zero</button><span>The gradients are cleared. Updates 2 and 3 run the same loop at 1e-5, then 5e-6.</span></li>
    <li><button type="button" data-tok="126,170">Stop</button><span><code>max_steps = 3</code> ends the run after 12 examples, 0.95% of the 1,260 training rows.</span></li>
  </ol>
</figure>
