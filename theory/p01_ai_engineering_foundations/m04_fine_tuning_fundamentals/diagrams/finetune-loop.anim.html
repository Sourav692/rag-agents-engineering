<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Figures come from the notebooks and their data: pythia-70m's parameter count from its config, the lamini_docs row and split counts,
     the lesson 4.5 run (3 steps, batch 1, 4 accumulation steps), and exact match over lamini/lamini_docs_evaluation.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-ftloop-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The fine-tuning loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 290" role="img" aria-labelledby="anim-ftloop-title anim-ftloop-desc">
      <title id="anim-ftloop-title">The fine-tuning loop</title>
      <desc id="anim-ftloop-desc">A base model, pythia-70m with 70.4 million parameters, is trained on 1,400 question and answer pairs. Preparation tokenizes them and splits them into 1,260 training rows and 140 held out. The Trainer runs 3 optimizer steps of 4 examples, 12 examples in all. Evaluation on held-out answers decides: worse goes back to the data, better ships the checkpoint. On the notebooks’ evaluation set exact match finds 0 of 139.</desc>
      <defs>
        <marker id="ah-ftloop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="70" width="120" height="52"/><text class="label" x="80" y="88">Base model</text><text class="small" x="80" y="108">pythia-70m</text></g>
      <g class="n-2 n-6"><rect class="box" x="175" y="70" width="120" height="52"/><text class="label" x="235" y="88">Instruction</text><text class="label" x="235" y="108">data</text></g>
      <g class="n-3"><rect class="box" x="330" y="70" width="120" height="52"/><text class="label" x="390" y="96">Prepare</text></g>
      <g class="n-4"><rect class="box" x="485" y="70" width="120" height="52"/><text class="label" x="545" y="96">Train</text></g>
      <g class="n-5 n-6 n-7">
        <path class="box" d="M700 56 L770 96 L700 136 L630 96 Z"/>
        <text class="label" x="700" y="96">Evaluate</text>
      </g>
      <g class="n-7"><rect class="box" x="640" y="214" width="120" height="44"/><text class="label" x="700" y="236">Ship</text></g>

      <path class="edge e-2" d="M140 96 H172" marker-end="url(#ah-ftloop)"/>
      <path class="edge e-3" d="M295 96 H327" marker-end="url(#ah-ftloop)"/>
      <path class="edge e-4" d="M450 96 H482" marker-end="url(#ah-ftloop)"/>
      <path class="edge e-5" d="M605 96 H627" marker-end="url(#ah-ftloop)"/>
      <path class="edge e-6" d="M700 56 V30 H235 V67" marker-end="url(#ah-ftloop)"/>
      <text class="small" x="470" y="20">worse: fix the data</text>
      <path class="edge e-7" d="M700 136 V211" marker-end="url(#ah-ftloop)"/>
      <text class="small" x="740" y="176">better</text>

      <text class="fig in-1" x="80" y="146">70.4M params</text>
      <text class="fig in-2" x="235" y="146">1,400 rows</text>
      <g class="in-3">
        <text class="fig" x="390" y="146">1,260 train</text>
        <text class="fig" x="390" y="166">140 held out</text>
      </g>
      <g class="in-4">
        <text class="fig" x="545" y="146">3 steps × 4</text>
        <text class="fig" x="545" y="166">= 12 examples</text>
      </g>
      <g class="in-5">
        <text class="fig" x="590" y="190">exact match</text>
        <text class="fig" x="590" y="210">0 of 139</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-ftloop-cap">
    <li><button type="button" data-tok="20,70">Base</button><span>Start from a pre-trained base model. The notebooks use pythia-70m, 70.4 million parameters.</span></li>
    <li><button type="button" data-tok="175,70">Data</button><span>Collect question and answer pairs: 1,400 rows in <code>lamini_docs</code>.</span></li>
    <li><button type="button" data-tok="330,70">Prepare</button><span>Tokenize, cut and pad, then split: 1,260 rows to train on, 140 held out.</span></li>
    <li><button type="button" data-tok="485,70">Train</button><span>The Trainer runs 3 optimizer steps of 4 examples each, 12 examples in all.</span></li>
    <li><button type="button" data-tok="630,96">Evaluate</button><span>Score answers the model never trained on. Exact match finds 0 of 139 on the notebooks’ evaluation set.</span></li>
    <li><button type="button" data-tok="235,30">Revise</button><span>Worse than the baseline: go back to the examples and how they were prepared.</span></li>
    <li><button type="button" data-tok="640,214">Ship</button><span>Better on the questions it targets, with no regressions: ship the checkpoint.</span></li>
  </ol>
</figure>
