<!-- Animated version of the Workflow or ReAct agent flowchart in ../README.md, used by index.html.
     Figures come from the notebooks: 2 LLM calls per workflow question, 8 tables in the comic-store database, CREATE TABLE plus 3 sample rows per table, the mode=ro connection.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-t2s-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Text-to-SQL as a workflow and as an agent, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 380" role="img" aria-labelledby="anim-t2s-title anim-t2s-desc">
      <title id="anim-t2s-title">Text-to-SQL: workflow and ReAct agent</title>
      <desc id="anim-t2s-desc">Workflow: every question goes through write SQL with the whole schema in the prompt, run the stored SQL, and answer, for 2 LLM calls. ReAct agent: the model calls list tables and gets 8 tables, reads the schema of the tables it needs, has the query checked, runs it on a read-only connection, and answers when it needs no more tools.</desc>
      <defs>
        <marker id="ah-t2s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Workflow: the same steps every time</text>
      <rect class="lane" x="8" y="28" width="784" height="140"/>
      <text class="lane-label" x="16" y="200">ReAct agent: the model picks each step</text>
      <rect class="lane" x="8" y="208" width="784" height="164"/>

      <!-- workflow -->
      <g><rect class="box" x="24" y="52" width="110" height="52"/><text class="label" x="79" y="78">Question</text></g>
      <g class="n-1"><rect class="box" x="174" y="52" width="160" height="52"/><text class="label" x="254" y="70">Write SQL</text><text class="small" x="254" y="90">whole schema in prompt</text></g>
      <g class="n-2"><rect class="box" x="374" y="52" width="160" height="52"/><text class="label" x="454" y="78">Run stored SQL</text></g>
      <g class="n-3"><rect class="box" x="574" y="52" width="110" height="52"/><text class="label" x="629" y="78">Answer</text></g>
      <path class="edge e-1" d="M134 78 H171" marker-end="url(#ah-t2s)"/>
      <path class="edge e-2" d="M334 78 H371" marker-end="url(#ah-t2s)"/>
      <path class="edge e-3" d="M534 78 H571" marker-end="url(#ah-t2s)"/>
      <text class="small in-1" x="254" y="128">LLM call 1</text>
      <text class="small in-2" x="454" y="128">no LLM call</text>
      <text class="small in-3" x="629" y="128">LLM call 2</text>
      <text class="fig in-3" x="740" y="78">2 calls</text>

      <!-- agent -->
      <g class="n-4 n-5 n-6 n-7 n-8"><rect class="box" x="24" y="236" width="140" height="56"/><text class="label" x="94" y="256">Agent model</text><text class="small" x="94" y="276">ReAct loop</text></g>
      <g class="n-4"><rect class="box" x="204" y="246" width="120" height="44"/><text class="label" x="264" y="268">List tables</text></g>
      <g class="n-5"><rect class="box" x="344" y="246" width="120" height="44"/><text class="label" x="404" y="268">Read schema</text></g>
      <g class="n-6"><rect class="box" x="484" y="246" width="120" height="44"/><text class="label" x="544" y="268">Check query</text></g>
      <g class="n-7"><rect class="box" x="624" y="246" width="120" height="44"/><text class="label" x="684" y="268">Run query</text></g>
      <path class="edge e-4" d="M164 268 H201" marker-end="url(#ah-t2s)"/>
      <path class="edge e-5" d="M120 236 V224 H404 V243" marker-end="url(#ah-t2s)"/>
      <path class="edge e-6" d="M120 236 V224 H544 V243" marker-end="url(#ah-t2s)"/>
      <path class="edge e-7" d="M120 236 V224 H684 V243" marker-end="url(#ah-t2s)"/>
      <path class="edge dashed e-4 e-5 e-6 e-7" d="M684 290 V336 H140 V295" marker-end="url(#ah-t2s)"/>
      <text class="small" x="420" y="350">observation back to the model</text>

      <text class="fig in-4" x="264" y="310">8 tables</text>
      <text class="small in-5" x="404" y="310">CREATE + 3 rows</text>
      <text class="small in-6" x="544" y="310">LLM reviews SQL</text>
      <text class="fig in-7" x="684" y="310">mode=ro</text>

      <g class="n-8 in-8"><rect class="doc" x="44" y="306" width="72" height="26"/><text class="small" x="80" y="319">Answer</text></g>
      <path class="edge e-8 in-8" d="M80 292 V303" marker-end="url(#ah-t2s)"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-t2s-cap">
    <li><button type="button">Write SQL</button><span>The workflow puts the whole schema in the prompt and the LLM writes one query.</span></li>
    <li><button type="button">Run SQL</button><span>The stored query runs as written. A query that fails is not retried.</span></li>
    <li><button type="button">Answer</button><span>A second LLM call writes the answer from the rows: 2 LLM calls for every question.</span></li>
    <li><button type="button">List tables</button><span>The agent’s first tool call, as its prompt requires, returns the 8 table names.</span></li>
    <li><button type="button">Schema</button><span>It reads the CREATE TABLE statement and 3 sample rows of only the tables it needs.</span></li>
    <li><button type="button">Check</button><span>The query checker, another LLM call, reviews the SQL before it runs.</span></li>
    <li><button type="button">Run query</button><span>The query runs on a read-only connection, so a DELETE fails at the database.</span></li>
    <li><button type="button">Answer</button><span>When the model needs no more tools, it answers from the rows it observed.</span></li>
  </ol>
</figure>
