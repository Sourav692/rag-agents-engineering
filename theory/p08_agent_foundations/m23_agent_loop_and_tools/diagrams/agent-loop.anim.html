<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The run is the lab's "How long does a refund take?" question at handle_tool_errors=default: six messages,
     the first tool call fails validation and the second succeeds (refund-timing, 0.347), checked against LangGraph.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-agentloop-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The agent loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 356" role="img" aria-labelledby="anim-agentloop-title anim-agentloop-desc">
      <title id="anim-agentloop-title">The agent loop</title>
      <desc id="anim-agentloop-desc">A question goes to the model. While the model's reply holds tool calls, your code runs each call and sends a ToolMessage back to the model; when a reply has no tool calls, it is the answer. In the lab's refund run the first call has a wrong argument name and comes back as an error, the second returns refund-timing at score 0.347, and the run ends with six messages in state.</desc>
      <defs>
        <marker id="ah-agentloop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="44" width="130" height="48"/><text class="label" x="85" y="68">Question</text></g>
      <path class="edge e-2" d="M150 68 H227" marker-end="url(#ah-agentloop)"/>
      <g class="n-2 n-4">
        <rect class="box" x="230" y="36" width="170" height="64"/>
        <text class="label" x="315" y="60">Model call</text>
        <text class="small" x="315" y="82">with tool schemas</text>
      </g>
      <path class="edge e-3 e-5 e-6" d="M400 68 H487" marker-end="url(#ah-agentloop)"/>
      <g class="n-3 n-5 n-6">
        <path class="box" d="M560 26 L632 68 L560 110 L488 68 Z"/>
        <text class="small" x="560" y="60">Tool calls</text>
        <text class="small" x="560" y="78">in the reply?</text>
      </g>
      <path class="edge e-6" d="M632 68 H677" marker-end="url(#ah-agentloop)"/>
      <text class="small" x="654" y="54">no</text>
      <g class="n-6"><rect class="box" x="680" y="44" width="100" height="48"/><text class="label" x="730" y="68">Answer</text></g>

      <path class="edge e-3 e-5" d="M560 110 V187" marker-end="url(#ah-agentloop)"/>
      <text class="small" x="578" y="150">yes</text>
      <g class="n-3 n-5">
        <rect class="box" x="470" y="190" width="180" height="56"/>
        <text class="label" x="560" y="210">Your code runs</text>
        <text class="small" x="560" y="230">each call</text>
      </g>
      <path class="edge e-4" d="M470 218 H315 V103" marker-end="url(#ah-agentloop)"/>
      <text class="small" x="392" y="204">ToolMessage per call</text>

      <text class="lane-label" x="16" y="282">Messages in state</text>
      <rect class="lane" x="8" y="290" width="784" height="58"/>
      <g class="in-1"><rect class="box" x="18" y="298" width="122" height="42"/><text class="small" x="79" y="312">0 Human</text><text class="small" x="79" y="330">refund question</text></g>
      <g class="in-2"><rect class="box" x="146" y="298" width="122" height="42"/><text class="small" x="207" y="312">1 AI</text><text class="fig" x="207" y="330">q='refund'</text></g>
      <g class="in-3"><rect class="box" x="274" y="298" width="122" height="42"/><text class="small" x="335" y="312">2 Tool</text><text class="fig" x="335" y="330">status error</text></g>
      <g class="in-4"><rect class="box" x="402" y="298" width="122" height="42"/><text class="small" x="463" y="312">3 AI</text><text class="small" x="463" y="330">fixed argument</text></g>
      <g class="in-5"><rect class="box" x="530" y="298" width="122" height="42"/><text class="small" x="591" y="312">4 Tool</text><text class="fig" x="591" y="330">0.347</text></g>
      <g class="in-6"><rect class="box" x="658" y="298" width="122" height="42"/><text class="small" x="719" y="312">5 AI</text><text class="small" x="719" y="330">answer</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-agentloop-cap">
    <li><button type="button" data-tok="20,44">Question</button><span>The customer asks how long a refund takes. State holds one HumanMessage.</span></li>
    <li><button type="button" data-tok="230,36">Tool call</button><span>The model replies with a call to <code>search_handbook</code>, but names the argument <code>q</code> instead of <code>query</code>.</span></li>
    <li><button type="button" data-tok="470,190">Error</button><span>The ToolNode validates the arguments and returns a ToolMessage with status error: <code>query: Field required</code>.</span></li>
    <li><button type="button" data-tok="230,100">Retry</button><span>The model reads the error and calls <code>search_handbook</code> again, this time with <code>query</code>.</span></li>
    <li><button type="button" data-tok="650,190">Result</button><span>The tool returns <code>refund-timing</code> at score 0.347, and the ToolMessage goes back to the model.</span></li>
    <li><button type="button" data-tok="680,44">Answer</button><span>The reply has no tool calls, so the loop ends: six messages, two of them tool results.</span></li>
  </ol>
</figure>
