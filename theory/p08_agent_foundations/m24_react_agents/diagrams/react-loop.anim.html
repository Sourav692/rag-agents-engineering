<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The run is the M24 lab's own: the outage question, three searches, four model calls, about 451 tokens of context; run_limit=3 stops it before call 4.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-react-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The ReAct loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 360" role="img" aria-labelledby="anim-react-title anim-react-desc">
      <title id="anim-react-title">The ReAct loop with middleware hooks</title>
      <desc id="anim-react-desc">A question enters the loop. Before each model call a before_model hook checks the call cap; after it an after_model hook can pause for approval. While the model asks for a tool, the tools run and their ToolMessage goes back to the model. For the lab’s outage question the first two searches return reboot and sizing, the third returns incidents and sla, and the fourth model call answers: four calls, about 451 tokens. With run_limit set to 3 the before_model hook would end the run before call 4.</desc>
      <defs>
        <marker id="ah-react" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="40" width="140" height="56"/><text class="label" x="90" y="60">Question</text><text class="small" x="90" y="80">server goes down</text></g>
      <g class="n-1 n-7"><rect class="box" x="190" y="40" width="150" height="56"/><text class="label" x="265" y="60">before_model</text><text class="small" x="265" y="80">call cap</text></g>
      <g class="n-2 n-4 n-5 n-6"><rect class="box" x="370" y="40" width="150" height="56"/><text class="label" x="445" y="60">Model</text><text class="small" x="445" y="80">reason</text></g>
      <g class="n-6"><rect class="box" x="550" y="40" width="150" height="56"/><text class="label" x="625" y="60">after_model</text><text class="small" x="625" y="80">approval</text></g>
      <g class="n-3 n-4 n-5"><rect class="box" x="370" y="200" width="150" height="56"/><text class="label" x="445" y="220">Tools</text><text class="small" x="445" y="240">act: search</text></g>
      <g class="n-6"><rect class="box" x="650" y="280" width="140" height="56"/><text class="label" x="720" y="300">Answer</text><text class="small" x="720" y="320">4 calls, 451 tokens</text></g>

      <path class="edge e-1" d="M160 68 H187" marker-end="url(#ah-react)"/>
      <path class="edge e-2 e-4 e-5 e-6" d="M340 68 H367" marker-end="url(#ah-react)"/>
      <path class="edge e-2 e-4 e-5 e-6" d="M520 68 H547" marker-end="url(#ah-react)"/>
      <path class="edge e-3 e-4 e-5" d="M590 96 V228 H523" marker-end="url(#ah-react)"/>
      <text class="small" x="548" y="160">tool call</text>
      <path class="edge e-3 e-4 e-5" d="M370 228 H265 V99" marker-end="url(#ah-react)"/>
      <text class="small" x="318" y="214">ToolMessage</text>
      <path class="edge e-6" d="M700 68 H720 V277" marker-end="url(#ah-react)"/>
      <text class="small" x="760" y="180">no tool call</text>

      <text class="small" x="445" y="120">model calls</text>
      <rect class="chunk in-2" x="411" y="132" width="14" height="14"/>
      <rect class="chunk in-4" x="429" y="132" width="14" height="14"/>
      <rect class="chunk in-5" x="447" y="132" width="14" height="14"/>
      <rect class="chunk in-6" x="465" y="132" width="14" height="14"/>
      <text class="fig in-7" x="265" y="128">run_limit=3:</text>
      <text class="fig in-7" x="265" y="148">stops before call 4</text>

      <text class="small" x="445" y="280">Observations</text>
      <text class="fig in-3" x="445" y="302">1  reboot, sizing</text>
      <text class="fig in-4" x="445" y="322">2  reboot, sizing</text>
      <text class="fig hit in-5" x="445" y="342">3  incidents, sla</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-react-cap">
    <li><button type="button" data-tok="20,40">Question</button><span>The question enters as a HumanMessage. Before every model call, the before_model hooks run; the call cap is one of them.</span></li>
    <li><button type="button" data-tok="370,40">Reason</button><span>Model call 1 reads the message list and asks for search_handbook with the question’s own words.</span></li>
    <li><button type="button" data-tok="370,200">Observe</button><span>The tool returns reboot and sizing, which share the word “server” but say nothing about outages. The ToolMessage goes back to the model.</span></li>
    <li><button type="button" data-tok="370,200">Reword</button><span>Call 2 rewords the search to “server outage”. TF-IDF still ranks reboot and sizing first.</span></li>
    <li><button type="button" data-tok="370,200">Reword again</button><span>Call 3 searches “what happens during an outage incident” and gets both evidence chunks, incidents and sla.</span></li>
    <li><button type="button" data-tok="650,280">Answer</button><span>Call 4 has the evidence and asks for no tool, so the run ends with an answer: four calls, about 451 tokens of context read.</span></li>
    <li><button type="button" data-tok="190,40">Cap</button><span>With run_limit=3 the before_model hook ends the run before call 4, and the user receives the limit message instead.</span></li>
  </ol>
</figure>
