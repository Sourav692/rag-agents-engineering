<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The run is the lesson 26.1 lab's default: four lookups, the first search returns the wrong chunk; the counts are the lab's.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-pcv-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Plan, check, replan and verify, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-pcv-title anim-pcv-desc">
      <title id="anim-pcv-title">Plan, execute and check, replan, draft, verify</title>
      <desc id="anim-pcv-desc">A question about cancelling a Larkspur annual plan becomes a plan of four lookups. The first search returns the refund-timing chunk, the check rejects it, and the replanner rewrites that lookup. The retry returns refund-window and the other lookups pass their checks. The draft is written from accepted results only, 8 LLM calls and 5 searches in the lab’s run, and each claim is verified before the answer goes out.</desc>
      <defs>
        <marker id="ah-pcv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="40" width="110" height="44"/><text class="label" x="75" y="62">Question</text></g>
      <g class="n-2"><rect class="box" x="170" y="40" width="120" height="44"/><text class="label" x="230" y="62">Plan</text></g>
      <g class="n-3 n-6"><rect class="box" x="330" y="40" width="130" height="44"/><text class="label" x="395" y="62">Execute</text></g>
      <g class="n-4 n-6"><path class="box" d="M555 28 L615 62 L555 96 L495 62 Z"/><text class="label" x="555" y="62">Check</text></g>
      <g class="n-5"><rect class="box" x="430" y="150" width="130" height="44"/><text class="label" x="495" y="172">Replan</text></g>
      <g class="n-7"><rect class="box" x="650" y="40" width="130" height="44"/><text class="label" x="715" y="62">Draft</text></g>
      <g class="n-8"><rect class="box" x="650" y="150" width="130" height="44"/><text class="label" x="715" y="172">Verify</text></g>
      <g class="n-8"><rect class="box" x="650" y="250" width="130" height="44"/><text class="label" x="715" y="272">Answer</text></g>

      <path class="edge e-2" d="M130 62 H167" marker-end="url(#ah-pcv)"/>
      <path class="edge e-3" d="M290 62 H327" marker-end="url(#ah-pcv)"/>
      <path class="edge e-4" d="M460 62 H492" marker-end="url(#ah-pcv)"/>
      <path class="edge e-5" d="M555 96 V147" marker-end="url(#ah-pcv)"/>
      <text class="small" x="570" y="124">no</text>
      <path class="edge e-6" d="M430 172 H360 V87" marker-end="url(#ah-pcv)"/>
      <path class="edge e-6" d="M555 28 C555 6 395 6 395 37" marker-end="url(#ah-pcv)"/>
      <text class="small" x="475" y="14">yes, more</text>
      <path class="edge e-7" d="M615 62 H647" marker-end="url(#ah-pcv)"/>
      <text class="small" x="632" y="44">done</text>
      <path class="edge e-8" d="M715 84 V147" marker-end="url(#ah-pcv)"/>
      <path class="edge e-8" d="M715 194 V247" marker-end="url(#ah-pcv)"/>

      <g class="in-1">
        <rect class="doc" x="35" y="100" width="80" height="52"/>
        <text class="small" x="75" y="118">cancel an</text>
        <text class="small" x="75" y="136">annual plan</text>
      </g>
      <g class="in-2">
        <rect class="chunk" x="200" y="102" width="60" height="6"/><rect class="chunk" x="200" y="112" width="60" height="6"/>
        <rect class="chunk" x="200" y="122" width="60" height="6"/><rect class="chunk" x="200" y="132" width="60" height="6"/>
        <text class="small" x="230" y="154">4 lookups</text>
      </g>
      <g class="in-3">
        <text class="fig" x="440" y="114">refund-timing</text>
        <path class="hit-line" d="M392 124 H488"/>
      </g>
      <text class="small in-4" x="618" y="108">wrong chunk</text>
      <text class="small in-5" x="495" y="214">rewrite lookup 1</text>
      <text class="fig in-6" x="440" y="140">refund-window</text>
      <g class="in-7">
        <text class="fig" x="250" y="262">8 LLM calls, 5 searches</text>
        <text class="small" x="250" y="284">the lab’s run, lookup 1 wrong first</text>
      </g>
      <text class="small in-8" x="715" y="314">each claim checked</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-pcv-cap">
    <li><button type="button" data-tok="20,40">Question</button><span>A customer cancelling a Larkspur annual plan asks four things at once.</span></li>
    <li><button type="button" data-tok="170,40">Plan</button><span>The planner lists four lookups in one LLM call, before any search runs.</span></li>
    <li><button type="button" data-tok="330,40">Execute</button><span>The first search, for the refund rule, returns the refund-timing chunk.</span></li>
    <li><button type="button" data-tok="555,28">Check</button><span>The evaluator rejects it: the result answers a different question.</span></li>
    <li><button type="button" data-tok="430,150">Replan</button><span>The replanner rewrites that lookup from the reason it failed and keeps the other three.</span></li>
    <li><button type="button" data-tok="330,40">Retry</button><span>The rewritten search returns refund-window, and the remaining lookups pass their checks.</span></li>
    <li><button type="button" data-tok="650,40">Draft</button><span>The synthesizer writes from accepted results only. The lab counts 8 LLM calls and 5 searches for this run.</span></li>
    <li><button type="button" data-tok="650,150">Verify</button><span>Each claim in the draft is checked in a fresh call that cannot see the draft (lesson 26.4), then the answer goes out.</span></li>
  </ol>
</figure>
