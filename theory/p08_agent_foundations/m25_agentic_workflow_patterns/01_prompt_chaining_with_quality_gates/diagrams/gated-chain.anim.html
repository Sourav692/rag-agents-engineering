<!-- Animated version of the gated-chain flowchart in ../README.md, used by index.html.
     The run is the 25.1 notebook's: the abstract topic rejected on attempts 1 to 3 at MAX_VALIDATION_RETRIES = 3, then the concrete topic passing on attempt 1.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-gate-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The gated chain, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 300" role="img" aria-labelledby="anim-gate-title anim-gate-desc">
      <title id="anim-gate-title">Prompt chain with a quality gate</title>
      <desc id="anim-gate-desc">A topic goes to an extract step, then a gate run by a temperature-0 judge. The abstract topic is rejected on attempts 1, 2 and 3; each rejection loops back to extract, and the third ends the chain at a stop node, so draft and polish never run. A concrete topic passes the gate on attempt 1 and goes on to draft and polish.</desc>
      <defs>
        <marker id="ah-gate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g><rect class="box" x="20" y="38" width="90" height="44"/><text class="label" x="65" y="60">Topic</text></g>
      <path class="edge e-1" d="M110 60 H147" marker-end="url(#ah-gate)"/>
      <g class="n-1 n-3"><rect class="box" x="150" y="38" width="130" height="44"/><text class="label" x="215" y="53">Extract</text><text class="small" x="215" y="71">key points</text></g>
      <path class="edge e-2 e-3 e-4" d="M280 60 H317" marker-end="url(#ah-gate)"/>
      <g class="n-2 n-4">
        <path class="box" d="M380 26 L440 60 L380 94 L320 60 Z"/>
        <text class="label" x="380" y="53">Gate</text><text class="small" x="380" y="71">judge</text>
      </g>

      <path class="edge e-6" d="M440 60 H477" marker-end="url(#ah-gate)"/>
      <text class="small" x="459" y="44">pass</text>
      <g class="n-6"><rect class="box" x="480" y="38" width="110" height="44"/><text class="label" x="535" y="60">Draft</text></g>
      <path class="edge e-6" d="M590 60 H617" marker-end="url(#ah-gate)"/>
      <g class="n-6"><rect class="box" x="620" y="38" width="110" height="44"/><text class="label" x="675" y="60">Polish</text></g>
      <g class="in-6"><text class="small" x="605" y="108">concrete topic:</text><text class="fig" x="605" y="128">passed on attempt 1</text></g>

      <path class="edge e-3 e-4" d="M350 77 C330 132 215 132 215 85" marker-end="url(#ah-gate)"/>
      <text class="small" x="262" y="146">reject, try again</text>

      <path class="edge e-5" d="M380 94 V207" marker-end="url(#ah-gate)"/>
      <text class="small" x="424" y="176">3 rejects</text>
      <g class="n-5"><rect class="box" x="320" y="210" width="120" height="44"/><text class="label" x="380" y="232">Stop</text></g>
      <text class="small in-5" x="380" y="278">draft and polish never run</text>

      <text class="small in-2" x="170" y="198">abstract topic:</text>
      <text class="fig in-2" x="170" y="220">attempt 1: reject</text>
      <text class="fig in-3" x="170" y="242">attempt 2: reject</text>
      <text class="fig in-4" x="170" y="264">attempt 3: reject</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-gate-cap">
    <li><button type="button" data-tok="150,38">Extract</button><span>The abstract topic, <em>The meaning of life and happiness</em>, goes in. Step 1 lists three key points at temperature 0.7.</span></li>
    <li><button type="button" data-tok="320,60">Gate</button><span>The temperature-0 judge returns actionable False: no request, decision or next step. Attempt 1 of 3.</span></li>
    <li><button type="button" data-tok="150,38">Retry</button><span>The router sends it back to extract for a fresh sample. Attempt 2 is rejected too.</span></li>
    <li><button type="button" data-tok="320,60">Third try</button><span>Attempt 3 is rejected, and retry_count has reached MAX_VALIDATION_RETRIES, 3.</span></li>
    <li><button type="button" data-tok="320,210">Stop</button><span>The router takes the fail edge. The stop node writes why; draft and polish never run. Six LLM calls in all.</span></li>
    <li><button type="button" data-tok="620,38">Pass</button><span>A concrete topic, the deadline-extension request, passed on attempt 1 and went on to draft and polish: four LLM calls.</span></li>
  </ol>
</figure>
