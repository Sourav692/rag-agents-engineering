<!-- Animated version of the Send fan-out flowchart in ../README.md, used by index.html.
     The plan is illustrative: the Larkspur golden question split along its two M11 evidence chunks. The 25.4 notebook prints no timings, so the figure has none;
     the finish order in step 4 is an example, and the merge order in step 5 is what the notebook states (Send order).
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-send-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The Send fan-out, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-send-title anim-send-desc">
      <title id="anim-send-title">Orchestrator-worker with Send</title>
      <desc id="anim-send-desc">A question goes to an orchestrator, which returns a plan with two items, export and retention. One Send per item starts two llm_call workers. The retention worker finishes first, but the reducer merges the results in Send order, export then retention, and a synthesizer writes one reply.</desc>
      <defs>
        <marker id="ah-send" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g><rect class="box" x="20" y="136" width="110" height="56"/><text class="label" x="75" y="156">Question</text><text class="small" x="75" y="176">two parts</text></g>
      <path class="edge e-1" d="M130 164 H167" marker-end="url(#ah-send)"/>
      <g class="n-1"><rect class="box" x="170" y="136" width="140" height="56"/><text class="label" x="240" y="156">Orchestrator</text><text class="small" x="240" y="176">returns a plan</text></g>
      <g class="in-1">
        <path class="edge dashed" d="M240 192 V219"/>
        <rect class="doc" x="180" y="222" width="120" height="64"/>
        <text class="fig" x="240" y="242">1 export</text>
        <text class="fig" x="240" y="266">2 retention</text>
        <text class="small" x="240" y="306">the plan</text>
      </g>

      <path class="edge e-2" d="M310 164 C352 164 360 95 397 95" marker-end="url(#ah-send)"/>
      <path class="edge e-2" d="M310 164 C352 164 360 233 397 233" marker-end="url(#ah-send)"/>
      <text class="small in-2" x="344" y="106">Send</text>
      <text class="small in-2" x="344" y="226">Send</text>
      <g class="n-3"><rect class="box" x="400" y="70" width="150" height="50"/><text class="label" x="475" y="88">llm_call</text><text class="small" x="475" y="106">export</text></g>
      <g class="n-3 n-4"><rect class="box" x="400" y="208" width="150" height="50"/><text class="label" x="475" y="226">llm_call</text><text class="small" x="475" y="244">retention</text></g>
      <text class="small in-4" x="475" y="280">finishes first</text>

      <path class="edge e-5" d="M550 95 C576 95 574 142 597 142" marker-end="url(#ah-send)"/>
      <path class="edge e-5" d="M550 233 C576 233 574 192 597 192" marker-end="url(#ah-send)"/>
      <g class="n-5"><rect class="box" x="600" y="110" width="180" height="110"/><text class="small" x="690" y="130">completed_sections</text></g>
      <text class="fig mv-5" x="690" y="166" style="--from: translate(-215px, -71px)">1 export</text>
      <text class="fig mv-5" x="690" y="194" style="--from: translate(-215px, 39px)">2 retention</text>
      <path class="edge e-6" d="M690 220 V255" marker-end="url(#ah-send)"/>
      <g class="n-6"><rect class="box" x="600" y="258" width="180" height="48"/><text class="label" x="690" y="282">Synthesizer</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-send-cap">
    <li><button type="button" data-tok="170,136">Plan</button><span>The orchestrator reads <em>Can I export my data after I cancel my plan?</em> and returns a plan with two items: export and retention.</span></li>
    <li><button type="button" data-tok="310,164">Send</button><span>assign_workers returns one Send per item, so LangGraph starts two llm_call runs. A one-part question would start one.</span></li>
    <li><button type="button" data-tok="400,70">Work</button><span>Each worker gets its own WorkerState, the question and one plan item, and answers only that item.</span></li>
    <li><button type="button" data-tok="400,208">Finish</button><span>Workers finish in their own order. Say retention returns first: stream_mode updates reports it first.</span></li>
    <li><button type="button" data-tok="600,110">Merge</button><span>The operator.add reducer appends both results in Send order, export then retention, whichever finished first.</span></li>
    <li><button type="button" data-tok="600,258">Answer</button><span>The synthesizer reads the merged list and writes one reply.</span></li>
  </ol>
</figure>
