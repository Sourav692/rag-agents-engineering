<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Hanken Grotesk, sans-serif">
  <title>How gpt-4o prices one 1280 by 720 frame</title>
  <desc>At detail high the frame is covered by 512-pixel tiles: three across and two down, six tiles, so it costs 85 plus 6 times 170, which is 1,105 tokens. At detail low the same frame costs the base 85 tokens whatever its size.</desc>
  <rect width="800" height="380" fill="#e5eaef"/>

  <text x="32" y="40" font-size="17" font-weight="600" fill="#060e15">detail="high"</text>
  <text x="32" y="62" font-size="14" fill="#3b434b">fit in 2048, shortest side at most 768, then 512 px tiles</text>
  <!-- tiles: 512 px = 128 units; 3 x 2 tiles cover 1536 x 1024 -->
  <g transform="translate(40 88)">
    <rect x="0" y="0" width="320" height="180" fill="#f0ccdc" stroke="#970d63" stroke-width="2"/>
    <rect x="0" y="0" width="384" height="256" fill="none" stroke="#3b434b" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="M128 0 V256 M256 0 V256 M0 128 H384" stroke="#3b434b" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="88" y="148" width="144" height="24" fill="#f0ccdc"/>
    <text x="160" y="165" font-size="15" font-weight="600" fill="#060e15" text-anchor="middle">frame 1280 × 720</text>
    <text x="64" y="244" font-size="13" fill="#3b434b" text-anchor="middle" font-family="IBM Plex Mono, monospace">tile</text>
    <text x="192" y="244" font-size="13" fill="#3b434b" text-anchor="middle" font-family="IBM Plex Mono, monospace">tile</text>
    <text x="320" y="244" font-size="13" fill="#3b434b" text-anchor="middle" font-family="IBM Plex Mono, monospace">tile</text>
  </g>
  <text x="40" y="370" font-size="14" fill="#060e15" font-family="IBM Plex Mono, monospace">85 + 6 × 170 = 1,105 tokens</text>

  <line x1="470" y1="32" x2="470" y2="352" stroke="#a1a9af" stroke-width="1"/>

  <text x="500" y="40" font-size="17" font-weight="600" fill="#060e15">detail="low"</text>
  <text x="500" y="62" font-size="14" fill="#3b434b">base tokens only, any size</text>
  <g transform="translate(500 88)">
    <rect x="0" y="0" width="256" height="144" fill="#f0ccdc" stroke="#970d63" stroke-width="2"/>
    <text x="128" y="78" font-size="15" font-weight="600" fill="#060e15" text-anchor="middle">same frame</text>
  </g>
  <text x="500" y="370" font-size="14" fill="#060e15" font-family="IBM Plex Mono, monospace">85 tokens</text>
</svg>
