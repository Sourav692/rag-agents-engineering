<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="Hanken Grotesk, sans-serif">
<title id="t">Vote accuracy against the number of sampled paths, one path right 40% of the time</title>
<desc id="d">Exact majority-vote accuracy for N from 1 to 15 when each path is right with probability 0.40. With one wrong answer (a yes/no grade) accuracy falls from 0.400 to 0.213 at N = 15. With four equally likely wrong answers it rises from 0.400 to 0.780. Values from the self-consistency lab.</desc>
