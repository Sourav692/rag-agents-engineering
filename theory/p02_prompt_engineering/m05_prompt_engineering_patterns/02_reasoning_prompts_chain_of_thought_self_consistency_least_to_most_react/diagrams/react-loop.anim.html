<!-- Animated version of the ReAct format flowchart in ../README.md, used by index.html.
     The observation is two real chunks of the M11 lab's Larkspur handbook (export, retention); the thoughts are representative.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-react-loop-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The ReAct loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 310" role="img" aria-labelledby="anim-react-loop-title anim-react-loop-desc">
      <title id="anim-react-loop-title">The ReAct loop</title>
      <desc id="anim-react-loop-desc">A question goes to a Thought. The Thought chooses an Action, a call to a handbook search tool. The tool runs and its result comes back as an Observation, which feeds the next Thought. When a Thought has enough evidence, the loop ends in a Final Answer.</desc>
      <defs>
        <marker id="ah-rl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="136" width="130" height="48"/><text class="label" x="85" y="160">Question</text></g>
      <g class="n-2 n-5"><rect class="box" x="220" y="136" width="130" height="48"/><text class="label" x="285" y="160">Thought</text></g>
      <g class="n-3"><rect class="box" x="420" y="40" width="170" height="48"/><text class="label" x="505" y="64">Action</text></g>
      <g class="n-4"><rect class="box" x="620" y="40" width="160" height="48"/><text class="label" x="700" y="64">Observation</text></g>
      <g class="n-6"><rect class="box" x="420" y="244" width="170" height="48"/><text class="label" x="505" y="268">Final Answer</text></g>

      <path class="edge e-2 in-2" d="M150 160 H217" marker-end="url(#ah-rl)"/>
      <path class="edge e-3 in-3" d="M285 136 C285 84 340 64 417 64" marker-end="url(#ah-rl)"/>
      <path class="edge e-4 in-4" d="M590 64 H617" marker-end="url(#ah-rl)"/>
      <path class="edge e-5 in-5" d="M700 88 C700 150 420 160 353 160" marker-end="url(#ah-rl)"/>
      <path class="edge e-6 in-6" d="M285 184 C285 262 340 268 417 268" marker-end="url(#ah-rl)"/>

      <g class="in-3"><text class="fig" x="505" y="106">search_handbook(</text><text class="fig" x="505" y="124">“export after cancel”)</text></g>
      <g class="in-4"><text class="small" x="700" y="22">export and retention chunks</text></g>
      <g class="in-5"><text class="small" x="560" y="184">enough evidence?</text></g>
      <g class="in-6">
        <rect class="doc" x="620" y="240" width="160" height="56"/>
        <text class="small" x="700" y="258">yes, within 30 days,</text>
        <text class="small" x="700" y="278">Settings, then Data</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-react-loop-cap">
    <li><button type="button" data-tok="20,136">Question</button><span>A customer asks “Can I export my data after I cancel my plan?”</span></li>
    <li><button type="button" data-tok="220,136">Thought</button><span>The model reasons that the handbook holds the answer and that it should search it.</span></li>
    <li><button type="button" data-tok="420,40">Action</button><span>It names a tool and its input. With tool calling this is a structured call, not a line of text to parse.</span></li>
    <li><button type="button" data-tok="620,40">Observation</button><span>The tool runs and returns the export and retention chunks: exports from Settings, data kept 30 days after cancelling.</span></li>
    <li><button type="button" data-tok="220,136">Thought</button><span>The next Thought reads the Observation and decides the evidence is enough.</span></li>
    <li><button type="button" data-tok="420,244">Answer</button><span>The Final Answer: yes, export from Settings, then Data, within 30 days of cancelling.</span></li>
  </ol>
</figure>
