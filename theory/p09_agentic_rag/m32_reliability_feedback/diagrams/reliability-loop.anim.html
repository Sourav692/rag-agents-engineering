<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram.
     Figures: k = 4 is 01a's retriever setting; 0.333 to 1.667 is the range of 02a's average / 3 multiplier. -->
<figure class="anim sheet" aria-labelledby="anim-reliability-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The reliability loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-reliability-title anim-reliability-desc">
      <title id="anim-reliability-title">The reliability loop</title>
      <desc id="anim-reliability-desc">Every question: retrieve the top 4 chunks, grade each one and drop the irrelevant ones, generate from the kept chunks, and check that the answer is grounded in them. Across questions: highlight the exact source segments, collect the user's rating from 1 to 5, and re-weight each rated chunk by its average rating over 3, between 0.333 and 1.667, before the next retrieval.</desc>
      <defs>
        <marker id="ah-rel" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Every question: check</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="200">Across questions: learn</text>
      <rect class="lane" x="8" y="208" width="784" height="136"/>

      <!-- check -->
      <g class="n-1 n-8"><rect class="box" x="40" y="48" width="140" height="44"/><text class="label" x="110" y="70">Retrieve top 4</text></g>
      <g class="n-2"><rect class="box" x="230" y="48" width="140" height="44"/><text class="label" x="300" y="70">Grade chunks</text></g>
      <g class="n-3"><rect class="box" x="420" y="48" width="140" height="44"/><text class="label" x="490" y="70">Generate</text></g>
      <g class="n-4"><path class="box" d="M690 38 L772 70 L690 102 L608 70 Z"/><text class="label" x="690" y="70">Grounded?</text></g>
      <path class="edge e-2" d="M180 70 H227" marker-end="url(#ah-rel)"/>
      <path class="edge e-3" d="M370 70 H417" marker-end="url(#ah-rel)"/>
      <path class="edge e-4" d="M560 70 H605" marker-end="url(#ah-rel)"/>

      <g class="in-1">
        <rect class="chunk" x="86" y="104" width="48" height="6"/><rect class="chunk" x="86" y="114" width="48" height="6"/>
        <rect class="chunk" x="86" y="124" width="48" height="6"/><rect class="chunk" x="86" y="134" width="48" height="6"/>
        <text class="small" x="110" y="152">candidates</text>
      </g>
      <g class="in-2">
        <rect class="hit" x="276" y="104" width="48" height="6"/><rect class="hit" x="276" y="114" width="48" height="6"/>
        <rect class="chunk" x="276" y="124" width="48" height="6"/><rect class="chunk" x="276" y="134" width="48" height="6"/>
        <text class="small" x="300" y="152">kept, dropped</text>
      </g>
      <g class="in-3">
        <rect class="doc" x="470" y="104" width="40" height="36"/>
        <path class="line" d="M476 114 H504 M476 122 H504 M476 130 H496"/>
        <text class="small" x="490" y="152">answer</text>
      </g>
      <g class="in-4">
        <text class="small" x="690" y="124">no: regenerate</text>
        <text class="small" x="690" y="142">or abstain</text>
      </g>

      <!-- learn: runs right to left -->
      <path class="edge e-5" d="M772 70 H784 V250 H763" marker-end="url(#ah-rel)"/>
      <text class="small" x="762" y="186">yes</text>
      <g class="n-5"><rect class="box" x="620" y="228" width="140" height="44"/><text class="label" x="690" y="250">Highlight</text></g>
      <g class="n-6"><rect class="box" x="420" y="228" width="140" height="44"/><text class="label" x="490" y="250">User rating</text></g>
      <g class="n-7"><rect class="box" x="230" y="228" width="140" height="44"/><text class="label" x="300" y="250">Re-weight</text></g>
      <path class="edge e-6" d="M620 250 H563" marker-end="url(#ah-rel)"/>
      <path class="edge e-7" d="M420 250 H373" marker-end="url(#ah-rel)"/>
      <path class="edge dashed e-8" d="M230 250 H24 V70 H37" marker-end="url(#ah-rel)"/>
      <text class="small" x="127" y="238">next question</text>

      <g class="in-5">
        <rect class="doc" x="650" y="284" width="80" height="40"/>
        <path class="line" d="M658 294 H722"/>
        <path class="hit-line" d="M658 304 H710 M658 314 H716"/>
      </g>
      <g class="in-6">
        <text class="fig" x="490" y="296">1 to 5</text>
        <text class="small" x="490" y="316">or a source click</text>
      </g>
      <g class="in-7">
        <text class="fig" x="300" y="296">× average / 3</text>
        <text class="fig" x="300" y="316">0.333 to 1.667</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-reliability-cap">
    <li><button type="button">Retrieve</button><span>The retriever returns the top 4 chunks for the question.</span></li>
    <li><button type="button">Grade</button><span>An LLM grader answers yes or no for each chunk, and the chunks graded no are dropped.</span></li>
    <li><button type="button">Generate</button><span>The model answers from the kept chunks only.</span></li>
    <li><button type="button">Check</button><span>A second grader asks whether the answer is grounded in those chunks. A no means regenerate or abstain.</span></li>
    <li><button type="button">Highlight</button><span>The model quotes the exact segments it used, and code checks that each one appears in its chunk.</span></li>
    <li><button type="button">Rate</button><span>The user rates the answer from 1 to 5, or the client records which source they opened.</span></li>
    <li><button type="button">Re-weight</button><span>Each rated chunk's score is multiplied by its average rating over 3, so it ends between 0.333 and 1.667.</span></li>
    <li><button type="button">Next</button><span>When the question comes back, retrieval returns the same candidates in the re-weighted order. A chunk it never returned is still missing.</span></li>
  </ol>
</figure>
