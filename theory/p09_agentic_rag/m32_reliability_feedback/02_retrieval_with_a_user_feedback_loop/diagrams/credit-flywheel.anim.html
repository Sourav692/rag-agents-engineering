<!-- Animated version of the feedback-loop flowchart in ../README.md, used by index.html.
     The figures are the feedback-flywheel lab's own, for "Is there a credit if my server plan has an outage?" in the thumbs-on-the-answer setting: events 4 and 9.
     Classes and data attributes: scripts/site/theory-anim.css. -->
<figure class="anim sheet" aria-labelledby="anim-flywheel-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The feedback flywheel on one question, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-flywheel-title anim-flywheel-desc">
      <title id="anim-flywheel-title">Two ratings fix one question</title>
      <desc id="anim-flywheel-desc">Event 4: the retriever returns sizing, reboot, sla and export, all at relevance_score 1.000. The answer uses sizing and reboot, misses the evidence chunk sla, and gets a rating of 1, so both drop to 0.333. Event 9: the answer uses sla and export and gets a rating of 5, so both rise to 1.667. Recall@2 goes from 0.00 to 1.00.</desc>
      <defs>
        <marker id="ah-fw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1 n-6"><rect class="box" x="140" y="14" width="520" height="40"/><text class="label" x="400" y="34">Is there a credit if my server plan has an outage?</text></g>
      <text class="small in-1" x="400" y="68">evidence: sla</text>

      <!-- event 4, as retrieved -->
      <g class="n-2 n-3 n-4">
        <rect class="box" x="30" y="84" width="230" height="136"/>
      </g>
      <g class="in-2">
        <text class="small" x="145" y="98">Event 4, as retrieved</text>
        <text class="fig" x="95" y="124">sizing</text><text class="fig" x="205" y="124">1.000</text>
        <text class="fig" x="95" y="150">reboot</text><text class="fig" x="205" y="150">1.000</text>
        <text class="fig hit" x="95" y="180">sla</text><text class="fig" x="205" y="180">1.000</text>
        <text class="fig" x="95" y="206">export</text><text class="fig" x="205" y="206">1.000</text>
      </g>
      <path class="hit-line in-3" d="M40 165 H250"/>
      <g class="in-3"><text class="fig" x="145" y="246">recall@2 0.00</text></g>
      <g class="in-4"><text class="label" x="145" y="280">rating 1</text><text class="small" x="145" y="302">thumbs down</text></g>

      <!-- after event 4 -->
      <path class="edge e-5" d="M262 152 H323" marker-end="url(#ah-fw)"/>
      <g class="mv-5 n-5 n-6 n-7" style="--from: translate(-260px, 0px)">
        <rect class="box" x="330" y="84" width="230" height="136"/>
        <text class="small" x="445" y="98">After event 4</text>
        <text class="fig hit" x="395" y="124">sla</text><text class="fig" x="505" y="124">1.000</text>
        <text class="fig" x="395" y="150">export</text><text class="fig" x="505" y="150">1.000</text>
        <text class="fig" x="395" y="180">sizing</text><text class="fig" x="505" y="180">0.333</text>
        <text class="fig" x="395" y="206">reboot</text><text class="fig" x="505" y="206">0.333</text>
      </g>
      <path class="hit-line in-6" d="M340 165 H550"/>
      <g class="in-6"><text class="fig" x="445" y="246">event 9 answers</text></g>
      <g class="in-7"><text class="label" x="445" y="280">rating 5</text><text class="small" x="445" y="302">thumbs up</text></g>

      <!-- after event 9 -->
      <path class="edge e-8" d="M562 152 H623" marker-end="url(#ah-fw)"/>
      <g class="mv-8 n-8" style="--from: translate(-260px, 0px)">
        <rect class="box" x="630" y="84" width="150" height="136"/>
        <text class="small" x="705" y="98">After event 9</text>
        <text class="fig hit" x="670" y="124">sla</text><text class="fig" x="740" y="124">1.667</text>
        <text class="fig" x="670" y="150">export</text><text class="fig" x="740" y="150">1.667</text>
        <text class="fig" x="670" y="180">sizing</text><text class="fig" x="740" y="180">0.333</text>
        <text class="fig" x="670" y="206">reboot</text><text class="fig" x="740" y="206">0.333</text>
      </g>
      <g class="in-8"><text class="fig" x="705" y="246">recall@2 1.00</text><text class="small" x="705" y="280">no change after this</text></g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-flywheel-cap">
    <li><button type="button">Ask</button><span>Event 4 asks “Is there a credit if my server plan has an outage?” Its evidence is the sla chunk.</span></li>
    <li><button type="button">Retrieve</button><span>TF-IDF returns sizing, reboot, sla and export. With no ratings yet, every relevance_score is 1.000 and the retriever’s order stands.</span></li>
    <li><button type="button">Answer</button><span>The answer uses the top two, sizing and reboot. The evidence is third, so recall@2 is 0.00.</span></li>
    <li><button type="button">Rate</button><span>The user gives a thumbs-down, a rating of 1.</span></li>
    <li><button type="button">Re-weight</button><span>Both chunks in the answer drop to 1/3, or 0.333. sla and export move up at 1.000.</span></li>
    <li><button type="button">Ask again</button><span>Event 9 asks the same question, and the answer now uses sla and export.</span></li>
    <li><button type="button">Rate</button><span>The answer holds the evidence, so the user gives a thumbs-up, a rating of 5.</span></li>
    <li><button type="button">Re-weight</button><span>sla and export rise to 5/3, or 1.667. Recall@2 has gone from 0.00 to 1.00, and the 91 events after this change nothing.</span></li>
  </ol>
</figure>
