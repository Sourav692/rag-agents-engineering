<!-- Animated version of the Self-RAG flowchart in ../README.md, used by index.html.
     The figures are the M29 lab's own: "How much does the starter plan cost per month?" at k = 5, max_iterations = 2, 20 LLM calls.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-selfrag-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The Self-RAG loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 -16 800 356" role="img" aria-labelledby="anim-selfrag-title anim-selfrag-desc">
      <title id="anim-selfrag-title">The Self-RAG loop on a question the handbook cannot answer</title>
      <desc id="anim-selfrag-desc">The starter-plan price question at k = 5. Self-RAG decides to retrieve, grades five chunks and keeps none, rewrites the question and tries again, twice. After the third pass the iteration cap sends it to generate with no context; the groundedness check sees no documents and passes without a call; the utility grade says no, and the run ends. 20 LLM calls in all.</desc>
      <defs>
        <marker id="ah-sr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- top row -->
      <g class="n-1"><rect class="box" x="16" y="40" width="110" height="44"/><text class="label" x="71" y="62">Retrieve?</text></g>
      <g class="n-2 n-4 n-6"><rect class="box" x="156" y="40" width="120" height="44"/><text class="label" x="216" y="62">Retrieve</text></g>
      <g class="n-2 n-4 n-6"><rect class="box" x="306" y="40" width="120" height="44"/><text class="label" x="366" y="62">Grade chunks</text></g>
      <g class="n-7"><rect class="box" x="486" y="40" width="120" height="44"/><text class="label" x="546" y="62">Generate</text></g>
      <g class="n-7"><rect class="box" x="646" y="40" width="120" height="44"/><text class="label" x="706" y="62">Grounded?</text></g>

      <!-- bottom row -->
      <g class="n-3 n-5"><rect class="box" x="231" y="220" width="120" height="44"/><text class="label" x="291" y="242">Rewrite</text></g>
      <g class="n-8"><rect class="box" x="486" y="220" width="120" height="44"/><text class="label" x="546" y="242">Answer</text></g>
      <g class="n-8"><rect class="box" x="646" y="220" width="120" height="44"/><text class="label" x="706" y="242">Useful?</text></g>

      <path class="edge e-2" d="M126 62 H153" marker-end="url(#ah-sr)"/>
      <path class="edge e-2 e-4 e-6" d="M276 62 H303" marker-end="url(#ah-sr)"/>
      <path class="edge e-7" d="M426 62 H483" marker-end="url(#ah-sr)"/>
      <path class="edge e-7" d="M606 62 H643" marker-end="url(#ah-sr)"/>
      <path class="edge e-8" d="M750 84 V217" marker-end="url(#ah-sr)"/>
      <path class="edge e-8" d="M646 242 H609" marker-end="url(#ah-sr)"/>
      <path class="edge e-3 e-5" d="M340 84 C340 150 320 160 320 217" marker-end="url(#ah-sr)"/>
      <text class="small" x="372" y="190">none kept</text>
      <path class="edge e-4 e-6" d="M260 220 C260 150 230 150 230 87" marker-end="url(#ah-sr)"/>
      <path class="edge dashed" d="M690 40 C690 8 562 8 562 37" marker-end="url(#ah-sr)"/>
      <text class="small" x="626" y="0">not grounded</text>
      <path class="edge dashed" d="M670 264 V300 H291 V267" marker-end="url(#ah-sr)"/>
      <text class="small" x="420" y="318">not useful</text>

      <!-- what each step adds -->
      <text class="small in-1" x="71" y="104">yes, 1 call</text>
      <text class="fig in-2" x="446" y="108">pass 1: 0 of 5</text>
      <text class="fig in-4" x="446" y="128">pass 2: 0 of 5</text>
      <text class="fig in-6" x="446" y="148">pass 3: 0 of 5</text>
      <text class="fig in-3" x="160" y="232">rewrite 1</text>
      <text class="fig in-5" x="160" y="252">rewrite 2</text>
      <text class="small in-7" x="566" y="104">no context</text>
      <g class="in-7"><text class="small" x="690" y="140">check skipped:</text><text class="small" x="690" y="158">no documents</text></g>
      <text class="small in-8" x="730" y="284">no, cap reached</text>
      <text class="fig in-8" x="546" y="284">20 LLM calls</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-selfrag-cap">
    <li><button type="button" data-tok="16,40">Decide</button><span>“How much does the starter plan cost per month?” is about the handbook, so the Retrieve judgment says yes. 1 call.</span></li>
    <li><button type="button" data-tok="306,40">Pass 1</button><span>Retrieve five chunks and grade each one. None mentions a price, so none is kept. 6 calls so far.</span></li>
    <li><button type="button" data-tok="231,220">Rewrite 1</button><span>Rewrite the question and go back to retrieval. 7 calls.</span></li>
    <li><button type="button" data-tok="306,40">Pass 2</button><span>The lab’s rewrite repeats the question, so the same five chunks come back and fail again. 12 calls.</span></li>
    <li><button type="button" data-tok="231,220">Rewrite 2</button><span>The second rewrite uses up max_iterations = 2. 13 calls.</span></li>
    <li><button type="button" data-tok="306,40">Pass 3</button><span>Nothing relevant, and the cap is reached, so the graph goes to generation anyway. 18 calls.</span></li>
    <li><button type="button" data-tok="486,40">Generate</button><span>The model generates with no context. The groundedness check sees no documents and passes without a call. 19 calls.</span></li>
    <li><button type="button" data-tok="646,220">Utility</button><span>The utility grade says no, but the cap is reached, so the run ends: 20 LLM calls for a question the handbook cannot answer.</span></li>
  </ol>
</figure>
