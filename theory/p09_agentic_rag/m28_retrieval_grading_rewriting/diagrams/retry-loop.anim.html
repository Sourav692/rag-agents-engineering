<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The figures are the grade-rewrite-retry lab's own: the outage question with two rewrites allowed and the topic check on.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-retry-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The grade and rewrite loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 400" role="img" aria-labelledby="anim-retry-title anim-retry-desc">
      <title id="anim-retry-title">Grade, rewrite, retry</title>
      <desc id="anim-retry-desc">The question "What happens if my server goes down?" passes the topic check. Retrieval returns reboot at 0.416 and sizing at 0.389; the grader passes neither, so the query is rewritten. The first rewrite returns the same two chunks. The second rewrite returns sla at 0.470 and incidents at 0.253, both relevant, and the model answers from them. The run costs 10 LLM calls and 3 retrievals. Had the two allowed rewrites run out, the graph would have ended in the no-results reply.</desc>
      <defs>
        <marker id="ah-retry" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <!-- main row -->
      <g class="n-1"><rect class="box" x="20" y="40" width="120" height="48"/><text class="label" x="80" y="64">Question</text></g>
      <g class="n-2">
        <path class="box" d="M235 30 L295 64 L235 98 L175 64 Z"/>
        <text class="small" x="235" y="64">On topic?</text>
      </g>
      <g class="n-3 n-6 n-7"><rect class="box" x="330" y="40" width="120" height="48"/><text class="label" x="390" y="64">Retrieve top-2</text></g>
      <g class="n-4 n-6 n-7">
        <path class="box" d="M565 30 L635 64 L565 98 L495 64 Z"/>
        <text class="small" x="565" y="56">Any chunk</text>
        <text class="small" x="565" y="72">relevant?</text>
      </g>
      <g class="n-8"><rect class="box" x="680" y="40" width="100" height="48"/><text class="label" x="730" y="64">Generate</text></g>

      <path class="edge e-2" d="M140 64 H172" marker-end="url(#ah-retry)"/>
      <path class="edge e-2" d="M295 64 H327" marker-end="url(#ah-retry)"/>
      <text class="small" x="311" y="50">yes</text>
      <path class="edge e-4 e-6 e-7" d="M450 64 H492" marker-end="url(#ah-retry)"/>
      <path class="edge e-8" d="M635 64 H677" marker-end="url(#ah-retry)"/>
      <text class="small" x="656" y="50">yes</text>

      <!-- second row: the two exits and the loop -->
      <path class="edge" d="M235 98 V163" marker-end="url(#ah-retry)"/>
      <text class="small" x="252" y="130">no</text>
      <g><rect class="box" x="175" y="166" width="120" height="44"/><text class="label" x="235" y="188">Off-topic reply</text></g>

      <path class="edge e-5" d="M565 98 V153" marker-end="url(#ah-retry)"/>
      <text class="small" x="582" y="126">no</text>
      <g class="n-5">
        <path class="box" d="M565 156 L635 190 L565 224 L495 190 Z"/>
        <text class="small" x="565" y="182">Rewrites</text>
        <text class="small" x="565" y="198">left?</text>
      </g>
      <path class="edge e-5" d="M495 190 H453" marker-end="url(#ah-retry)"/>
      <text class="small" x="474" y="176">yes</text>
      <g class="n-5 n-7"><rect class="box" x="330" y="166" width="120" height="48"/><text class="label" x="390" y="190">Rewrite query</text></g>
      <path class="edge e-6 e-7" d="M390 166 V91" marker-end="url(#ah-retry)"/>

      <path class="edge" d="M565 224 V247" marker-end="url(#ah-retry)"/>
      <text class="small" x="580" y="236">no</text>
      <g><rect class="box" x="505" y="250" width="120" height="40"/><text class="label" x="565" y="270">No-results reply</text></g>

      <path class="edge e-8" d="M730 88 V163" marker-end="url(#ah-retry)"/>
      <g class="n-8"><rect class="doc" x="680" y="166" width="100" height="48"/><text class="label" x="730" y="190">Answer</text></g>

      <g class="in-1">
        <rect class="doc" x="20" y="110" width="120" height="44"/>
        <text class="small" x="80" y="124">What happens if my</text>
        <text class="small" x="80" y="140">server goes down?</text>
      </g>

      <!-- the ledger: one row per retrieval -->
      <text class="small" x="60" y="318">Try</text>
      <text class="small" x="300" y="318">Top 2 chunks, TF-IDF score</text>
      <text class="small" x="540" y="318">Graded relevant</text>
      <path class="line" d="M20 330 H620"/>
      <g class="in-4">
        <text class="fig" x="60" y="346">0</text>
        <text class="fig" x="300" y="346">reboot 0.416, sizing 0.389</text>
        <text class="fig" x="540" y="346">0 of 2</text>
      </g>
      <g class="in-6">
        <text class="fig" x="60" y="368">1</text>
        <text class="fig" x="300" y="368">reboot 0.416, sizing 0.389</text>
        <text class="fig" x="540" y="368">0 of 2</text>
      </g>
      <g class="in-7">
        <text class="fig hit" x="60" y="390">2</text>
        <text class="fig hit" x="300" y="390">sla 0.470, incidents 0.253</text>
        <text class="fig hit" x="540" y="390">2 of 2</text>
      </g>
      <g class="in-8">
        <text class="fig" x="710" y="346">10 LLM calls</text>
        <text class="fig" x="710" y="368">3 retrievals</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-retry-cap">
    <li><button type="button" data-tok="20,40">Question</button><span>A customer asks “What happens if my server goes down?”</span></li>
    <li><button type="button" data-tok="235,30">Topic check</button><span>One structured-output call classifies it as on topic, so it goes on to retrieval.</span></li>
    <li><button type="button" data-tok="330,40">Retrieve</button><span>Top-2 retrieval returns reboot and sizing: they share the word “server” with the question.</span></li>
    <li><button type="button" data-tok="565,30">Grade</button><span>The grader reads each chunk against the question. Neither says what happens in an outage: 0 of 2 pass.</span></li>
    <li><button type="button" data-tok="330,166">Rewrite</button><span>No rewrite has been used yet and two are allowed, so the router sends the query to the rewriter.</span></li>
    <li><button type="button" data-tok="330,40">Retry</button><span>“What happens when my server is unavailable?” retrieves the same two chunks. 0 of 2 pass again.</span></li>
    <li><button type="button" data-tok="565,30">Rewrite 2</button><span>The last allowed rewrite names the outage and the availability guarantee. sla and incidents come back and both pass.</span></li>
    <li><button type="button" data-tok="680,40">Generate</button><span>The model answers from the two passing chunks. The question cost 10 LLM calls and 3 retrievals; one answered on the first pass costs 4.</span></li>
  </ol>
</figure>
