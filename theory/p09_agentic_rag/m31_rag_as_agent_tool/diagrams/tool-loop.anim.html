<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The graph is the tool agent of notebook 01a (agent, should_continue, ToolNode, tools back to agent). k = 2 is the notebook's retriever setting.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-toolloop-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The tool loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 290" role="img" aria-labelledby="anim-toolloop-title anim-toolloop-desc">
      <title id="anim-toolloop-title">Retrieval as a tool the agent chooses to call</title>
      <desc id="anim-toolloop-desc">A question reaches the agent node, which calls the model with the question and the two tool descriptions. The model replies with a tool call to handbook_search. ToolNode runs the retriever and returns two chunks to the agent as a ToolMessage. The model reads them, makes no further tool call, and its reply ends the graph as the answer.</desc>
      <defs>
        <marker id="ah-toolloop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="110" width="130" height="44"/><text class="label" x="85" y="132">Question</text></g>
      <g class="n-2 n-5 n-6"><rect class="box" x="200" y="110" width="150" height="44"/><text class="label" x="275" y="132">Agent</text></g>
      <g class="n-3 n-6">
        <path class="box" d="M450 98 L510 132 L450 166 L390 132 Z"/>
        <text class="small" x="450" y="132">Tool call?</text>
      </g>
      <g class="n-4"><rect class="box" x="600" y="110" width="170" height="44"/><text class="label" x="685" y="132">ToolNode</text></g>
      <g class="n-7"><rect class="box" x="390" y="220" width="120" height="44"/><text class="label" x="450" y="242">Answer</text></g>

      <path class="edge e-2" d="M150 132 H197" marker-end="url(#ah-toolloop)"/>
      <path class="edge e-3 e-6" d="M350 132 H387" marker-end="url(#ah-toolloop)"/>
      <path class="edge e-4" d="M510 132 H597" marker-end="url(#ah-toolloop)"/>
      <text class="small" x="553" y="120">yes</text>
      <path class="edge e-5" d="M685 110 C685 50 275 50 275 107" marker-end="url(#ah-toolloop)"/>
      <path class="edge e-7" d="M450 166 V217" marker-end="url(#ah-toolloop)"/>
      <text class="small" x="468" y="192">no</text>

      <g class="in-1">
        <rect class="doc" x="20" y="176" width="130" height="44"/>
        <text class="small" x="85" y="191">export my data</text>
        <text class="small" x="85" y="207">after I cancel?</text>
      </g>
      <g class="in-2">
        <rect class="doc" x="200" y="176" width="150" height="44"/>
        <text class="fig" x="275" y="191">handbook_search</text>
        <text class="fig" x="275" y="207">web_search</text>
      </g>
      <text class="small in-3" x="553" y="150">tool call</text>
      <g class="in-4">
        <rect class="hit" x="655" y="176" width="60" height="8"/><rect class="hit" x="655" y="190" width="60" height="8"/>
        <text class="small" x="685" y="214">k = 2 chunks</text>
      </g>
      <text class="small in-5" x="480" y="44">chunks as a ToolMessage</text>
      <text class="small in-7" x="580" y="242">from the 2 chunks</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-toolloop-cap">
    <li><button type="button" data-tok="20,110">Question</button><span>A customer asks “Can I export my data after I cancel my plan?”</span></li>
    <li><button type="button" data-tok="200,110">Agent</button><span>The agent node calls the model with the question and both tool descriptions.</span></li>
    <li><button type="button" data-tok="450,98">Tool call</button><span>The model replies with a tool call to <code>handbook_search</code>, with a query it wrote itself.</span></li>
    <li><button type="button" data-tok="600,110">Retrieve</button><span>ToolNode runs the retriever, which returns the k = 2 nearest chunks.</span></li>
    <li><button type="button" data-tok="480,64">Return</button><span>The chunks go back to the agent as a ToolMessage, and the model is called again.</span></li>
    <li><button type="button" data-tok="450,98">Decide</button><span>This time the model makes no tool call: the two chunks answer the question.</span></li>
    <li><button type="button" data-tok="390,220">Answer</button><span>With no tool call, <code>should_continue</code> ends the graph and the model’s reply is the answer.</span></li>
  </ol>
</figure>
