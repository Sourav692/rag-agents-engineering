<!-- Animated version of the Mental model sequence diagram in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Messages are the ones recorded from the larkspur-handbook server with MCP SDK 1.30.0. -->
<figure class="anim sheet" aria-labelledby="anim-session-cap">
  <div class="anim__canvas" tabindex="0" aria-label="An MCP session, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 444" role="img" aria-labelledby="anim-session-title anim-session-desc">
      <title id="anim-session-title">One MCP session over stdio</title>
      <desc id="anim-session-desc">The MCP client starts the larkspur-handbook server over stdio, sends initialize and agrees on protocol version 2025-11-25, and lists the server’s one tool, search_handbook. The user asks how long a refund takes; the model picks search_handbook, the client sends tools/call, the two refund chunks go back to the model, and it answers citing the chunk ids.</desc>
      <defs>
        <marker id="ah-sess" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>
      <path class="lane" d="M70 52 V432"/>
      <path class="lane" d="M265 52 V432"/>
      <path class="lane" d="M480 52 V432"/>
      <path class="lane" d="M700 52 V432"/>
      <g class="n-4 n-8"><rect class="box" x="20" y="12" width="100" height="40"/><text class="label" x="70" y="32">User</text></g>
      <g class="n-4 n-5 n-7 n-8"><rect class="box" x="180" y="12" width="170" height="40"/><text class="label" x="265" y="32">Chatbot + LLM</text></g>
      <g class="n-1 n-2 n-3 n-5 n-6 n-7"><rect class="box" x="410" y="12" width="140" height="40"/><text class="label" x="480" y="32">MCP client</text></g>
      <g class="n-1 n-2 n-3 n-6 n-7"><rect class="box" x="630" y="12" width="140" height="40"/><text class="label" x="700" y="32">MCP server</text></g>
      <g class="in-1"><path class="edge e-1" d="M484 94 H696" marker-end="url(#ah-sess)"/><text class="small" x="590" y="83">spawn over stdio</text></g>
      <g class="in-2"><path class="edge e-2" d="M484 134 H696" marker-end="url(#ah-sess)"/><text class="fig" x="590" y="123">initialize</text></g>
      <g class="in-2"><path class="edge dashed e-2" d="M696 164 H484" marker-end="url(#ah-sess)"/><text class="fig" x="590" y="153">2025-11-25</text></g>
      <g class="in-3"><path class="edge e-3" d="M484 204 H696" marker-end="url(#ah-sess)"/><text class="fig" x="590" y="193">tools/list</text></g>
      <g class="in-3"><path class="edge dashed e-3" d="M696 234 H484" marker-end="url(#ah-sess)"/><text class="fig" x="590" y="223">search_handbook</text></g>
      <g class="in-4"><path class="edge e-4" d="M74 274 H261" marker-end="url(#ah-sess)"/><text class="small" x="167" y="263">a refund question</text></g>
      <g class="in-5"><path class="edge e-5" d="M269 314 H476" marker-end="url(#ah-sess)"/><text class="fig" x="372" y="303">tool_use</text></g>
      <g class="in-6"><path class="edge e-6" d="M484 344 H696" marker-end="url(#ah-sess)"/><text class="fig" x="590" y="333">tools/call</text></g>
      <g class="in-7"><path class="edge dashed e-7" d="M696 384 H269" marker-end="url(#ah-sess)"/><text class="small" x="590" y="373">2 chunks</text></g>
      <g class="in-8"><path class="edge e-8" d="M261 420 H74" marker-end="url(#ah-sess)"/><text class="small" x="167" y="409">answer, chunk ids</text></g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-session-cap">
    <li><button type="button">Spawn</button><span>The client starts the server as a subprocess and talks over its standard input and output.</span></li>
    <li><button type="button">Initialize</button><span>The client sends <code>initialize</code>; the server agrees on protocol version 2025-11-25 and declares tools, resources and prompts.</span></li>
    <li><button type="button">List</button><span>The client asks for the tools and gets one definition, <code>search_handbook</code>.</span></li>
    <li><button type="button">Ask</button><span>A customer asks “How long does a refund take?”</span></li>
    <li><button type="button">Choose</button><span>The model reads the question and the tool definition, and asks for <code>search_handbook</code>.</span></li>
    <li><button type="button">Call</button><span>The chatbot hands the call to the session that owns the tool, which sends <code>tools/call</code>.</span></li>
    <li><button type="button">Result</button><span>The server returns two chunks, <code>refund-window</code> and <code>refund-timing</code>, and they go back to the model as a tool result.</span></li>
    <li><button type="button">Answer</button><span>The model answers from the two chunks and cites their ids.</span></li>
  </ol>
</figure>
