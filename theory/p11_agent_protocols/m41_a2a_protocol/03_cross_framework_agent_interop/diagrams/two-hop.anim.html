<!-- Animated version of the Cross-framework interop flowchart in ../README.md, used by index.html.
     Ports and agent names are notebook 03a's. No figures: the repr length (1,492) is the lab's handbook agent, quoted in the prose.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-twohop-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Two hops over A2A, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 330" role="img" aria-labelledby="anim-twohop-title anim-twohop-desc">
      <title id="anim-twohop-title">Two agents from different frameworks, two hops over A2A</title>
      <desc id="anim-twohop-desc">The orchestrator reads a registry of two base URLs and fetches both Agent Cards. Hop 1 sends the topic to the research agent, a LangGraph ReAct agent on port 10101, which replies with a Task. The orchestrator reads the answer from status.message. Hop 2 sends that text to the writer agent, one LLM call on port 10102, which replies with a Task holding the paragraph.</desc>
      <defs>
        <marker id="ah-twohop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1">
        <path class="box" d="M30 30 a75 10 0 0 0 150 0 v50 a75 10 0 0 1 -150 0 z"/>
        <ellipse class="box" cx="105" cy="30" rx="75" ry="10"/>
        <text class="small" x="105" y="56">agent_registry.json</text>
        <text class="fig" x="105" y="74">2 base URLs</text>
      </g>
      <path class="edge e-2" d="M105 90 V137" marker-end="url(#ah-twohop)"/>
      <g class="n-2"><rect class="box" x="30" y="140" width="150" height="56"/><text class="label" x="105" y="160">AgentDiscovery</text><text class="small" x="105" y="180">2 Agent Cards</text></g>
      <path class="edge e-2" d="M180 168 H297" marker-end="url(#ah-twohop)"/>

      <g class="n-3 n-4 n-5 n-6"><rect class="box" x="300" y="140" width="160" height="56"/><text class="label" x="380" y="168">Orchestrator</text></g>

      <g class="n-3"><rect class="box" x="590" y="30" width="190" height="56"/><text class="label" x="685" y="50">Research agent</text><text class="small" x="685" y="70">LangGraph + lookup_facts</text></g>
      <g class="in-3">
        <path class="edge e-3" d="M440 140 C470 70 540 58 587 58" marker-end="url(#ah-twohop)"/>
        <text class="small" x="500" y="56">hop 1: topic</text>
      </g>
      <g class="in-4">
        <path class="edge dashed e-4" d="M640 86 C620 130 500 150 463 156" marker-end="url(#ah-twohop)"/>
        <text class="small" x="600" y="132">Task</text>
      </g>

      <g class="in-4 n-4"><rect class="box" x="300" y="246" width="160" height="56"/><text class="small" x="380" y="266">read</text><text class="fig" x="380" y="286">status.message</text></g>
      <path class="edge in-4 e-4" d="M380 196 V243" marker-end="url(#ah-twohop)"/>

      <g class="n-5"><rect class="box" x="590" y="246" width="190" height="56"/><text class="label" x="685" y="266">Writer agent</text><text class="small" x="685" y="286">one LLM call</text></g>
      <g class="in-5">
        <path class="edge e-5" d="M460 274 H587" marker-end="url(#ah-twohop)"/>
        <text class="small" x="523" y="262">hop 2: notes</text>
      </g>
      <g class="in-6">
        <path class="edge dashed e-6" d="M640 246 C620 210 500 190 463 184" marker-end="url(#ah-twohop)"/>
        <text class="small" x="706" y="222">Task: paragraph</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-twohop-cap">
    <li><button type="button" data-tok="105,30">Registry</button><span>The orchestrator starts from a file of two base URLs and nothing else.</span></li>
    <li><button type="button" data-tok="180,168">Discover</button><span>It fetches each agent-card.json and picks the two agents by card name.</span></li>
    <li><button type="button" data-tok="587,58">Hop 1</button><span>It sends the topic to the research agent, a LangGraph ReAct agent on port 10101.</span></li>
    <li><button type="button" data-tok="380,243">Read</button><span>The reply is a Task. The answer is its status message; the notebook’s connector forwards str(Task) instead.</span></li>
    <li><button type="button" data-tok="587,274">Hop 2</button><span>It sends the research notes to the writer agent: one LLM call, no graph, no tools, port 10102.</span></li>
    <li><button type="button" data-tok="463,184">Reply</button><span>The writer’s Task carries the paragraph. The orchestrator imported neither agent’s code.</span></li>
  </ol>
</figure>
