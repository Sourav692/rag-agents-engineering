<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The tool names and message names are the ones recorded from the two Larkspur probe servers with mcp 1.30.0.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-multi-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One client, two servers, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-multi-title anim-multi-desc">
      <title id="anim-multi-title">One MCP client in front of two servers</title>
      <desc id="anim-multi-desc">The client opens one session per server: a stdio session that starts the handbook server as a process, and a Streamable HTTP session to the status server. Each session sends initialize and tools/list. The client merges the two tools into one list for the model. The model picks search_handbook, and the call goes back down the handbook session.</desc>
      <defs>
        <marker id="ah-multi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-5"><rect class="box" x="16" y="148" width="104" height="44"/><text class="label" x="68" y="170">Question</text></g>
      <g class="n-5"><rect class="box" x="156" y="148" width="120" height="44"/><text class="label" x="216" y="170">Agent, model</text></g>
      <g class="n-4"><rect class="box" x="312" y="124" width="150" height="92"/><text class="label" x="387" y="146">MCP client</text></g>
      <g class="in-4">
        <text class="fig" x="387" y="174">search_handbook</text>
        <text class="fig" x="387" y="196">search_status</text>
      </g>

      <g class="n-1 n-6"><rect class="box" x="504" y="56" width="120" height="52"/><text class="label" x="564" y="74">Session</text><text class="small" x="564" y="94">stdio</text></g>
      <g class="n-1"><rect class="box" x="504" y="232" width="120" height="52"/><text class="label" x="564" y="250">Session</text><text class="small" x="564" y="270">streamable HTTP</text></g>

      <g class="n-2 n-3 n-6"><rect class="box" x="660" y="56" width="128" height="52"/><text class="label" x="724" y="82">handbook</text></g>
      <g class="n-2 n-3"><rect class="box" x="660" y="232" width="128" height="52"/><text class="label" x="724" y="258">status</text></g>

      <path class="edge e-5" d="M120 170 H153" marker-end="url(#ah-multi)"/>
      <path class="edge e-5" d="M276 170 H309" marker-end="url(#ah-multi)"/>
      <path class="edge e-1 e-6" d="M462 150 C486 150 480 82 501 82" marker-end="url(#ah-multi)"/>
      <path class="edge e-1" d="M462 190 C486 190 480 258 501 258" marker-end="url(#ah-multi)"/>
      <path class="edge e-2 e-3 e-6" d="M624 82 H657" marker-end="url(#ah-multi)"/>
      <path class="edge e-2 e-3" d="M624 258 H657" marker-end="url(#ah-multi)"/>

      <text class="small in-1" x="564" y="126">starts a process</text>
      <text class="small in-1" x="564" y="302">POST /mcp</text>
      <text class="fig in-2" x="724" y="40">initialize</text>
      <text class="fig in-2" x="724" y="216">initialize</text>
      <text class="fig in-3" x="724" y="126">tools/list</text>
      <text class="fig in-3" x="724" y="302">tools/list</text>
      <text class="small in-5" x="216" y="214">picks search_handbook</text>
      <text class="fig in-6" x="564" y="40">tools/call</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-multi-cap">
    <li><button type="button" data-tok="504,56">Connect</button><span>The client opens one session per server. Over stdio that starts the handbook server as a child process; over HTTP it posts to a server that is already running.</span></li>
    <li><button type="button" data-tok="660,56">Initialize</button><span>Each session starts with an <code>initialize</code> handshake and the initialized notification.</span></li>
    <li><button type="button" data-tok="660,232">List</button><span>Each session sends <code>tools/list</code>. The handbook lists <code>search_handbook</code>; the status server lists <code>search_status</code>.</span></li>
    <li><button type="button" data-tok="312,124">Merge</button><span>The client merges both into one list. The model never learns there are two servers.</span></li>
    <li><button type="button" data-tok="156,148">Choose</button><span>A question comes in, <em>How long does a refund take?</em>, and the model picks <code>search_handbook</code> by its description.</span></li>
    <li><button type="button" data-tok="504,56">Call</button><span>The call goes down the session of the server that listed the tool. Held open, that session serves every later call without another handshake.</span></li>
  </ol>
</figure>
