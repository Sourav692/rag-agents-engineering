<!-- Animated version of the SSE sequence diagram in ../README.md, used by index.html.
     Recorded with mcp 1.30.0: every POST to /messages/ got 202, and every JSON-RPC answer arrived on the GET /sse stream.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-sse-cap">
  <div class="anim__canvas" tabindex="0" aria-label="An SSE session, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 372" role="img" aria-labelledby="anim-sse-title anim-sse-desc">
      <title id="anim-sse-title">An MCP session over SSE</title>
      <desc id="anim-sse-desc">The client opens GET /sse and keeps it open. The server’s first event names the POST endpoint with a session id. Every request is a POST to /messages/ answered with 202 Accepted, and every answer arrives as an event on the open stream. Closing the stream ends the session.</desc>
      <defs>
        <marker id="ah-sse" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1 n-3 n-5 n-7"><rect class="box" x="40" y="12" width="160" height="40"/><text class="label" x="120" y="32">Client</text></g>
      <g class="n-2 n-4 n-6"><rect class="box" x="600" y="12" width="160" height="40"/><text class="label" x="680" y="32">Server</text></g>
      <path class="edge dashed" d="M120 52 V356"/>
      <path class="edge dashed" d="M680 52 V356"/>

      <!-- the open stream, from step 1 until the client closes it -->
      <g class="in-1">
        <rect class="lane" x="712" y="70" width="40" height="252"/>
        <text class="small" x="732" y="340">/sse</text>
      </g>

      <g class="in-1"><path class="edge e-1" d="M124 82 H676" marker-end="url(#ah-sse)"/><text class="small" x="400" y="70">GET /sse, the stream stays open</text></g>
      <g class="in-2"><path class="edge dashed e-2" d="M676 122 H124" marker-end="url(#ah-sse)"/><text class="small" x="400" y="110">event: endpoint, /messages/?session_id=…</text></g>
      <g class="in-3"><path class="edge e-3" d="M124 162 H676" marker-end="url(#ah-sse)"/><text class="small" x="400" y="150">POST initialize, 202 Accepted</text></g>
      <g class="in-4"><path class="edge dashed e-4" d="M676 202 H124" marker-end="url(#ah-sse)"/><text class="small" x="400" y="190">initialize result, on the stream</text></g>
      <g class="in-5"><path class="edge e-5" d="M124 242 H676" marker-end="url(#ah-sse)"/><text class="small" x="400" y="230">POST tools/call, 202 Accepted</text></g>
      <g class="in-6"><path class="edge dashed e-6" d="M676 282 H124" marker-end="url(#ah-sse)"/><text class="small" x="400" y="270">tools/call result, on the stream</text></g>
      <g class="in-7"><path class="edge e-7" d="M706 322 H758"/><text class="small" x="400" y="322">the client closes the stream; no message is sent</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-sse-cap">
    <li><button type="button" data-tok="124,82">Open</button><span>The client sends <code>GET /sse</code>. The response is an event stream that stays open for the whole session.</span></li>
    <li><button type="button" data-tok="676,122">Endpoint</button><span>The server’s first event names where to POST: <code>/messages/</code> with a session id in the query string.</span></li>
    <li><button type="button" data-tok="124,162">Initialize</button><span>Each request is a POST to that address. The server answers <code>202 Accepted</code> at once, with no result in the body.</span></li>
    <li><button type="button" data-tok="676,202">Answer</button><span>The result arrives as an event on the stream. The initialized notification and <code>tools/list</code> take one more POST each.</span></li>
    <li><button type="button" data-tok="124,242">Call</button><span>A tool call is one more POST and one more <code>202</code>.</span></li>
    <li><button type="button" data-tok="676,282">Result</button><span>Its result comes back on the same stream. Two servers and 8 held calls made 16 HTTP requests: 2 GETs and 14 POSTs.</span></li>
    <li><button type="button" data-tok="732,322">Close</button><span>No message ends the session. The client closes the stream, and the server drops the session id.</span></li>
  </ol>
</figure>
