<!-- Animated version of the session-per-call flowchart in ../README.md, used by index.html.
     The message counts and bytes are the session lab's own recording: process #2 of "Session per tool call" with one question and one call.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-percall-cap">
  <div class="anim__canvas" tabindex="0" aria-label="A tool call with a session per call, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-percall-title anim-percall-desc">
      <title id="anim-percall-title">A tool call with a session per call</title>
      <desc id="anim-percall-desc">In the LangGraph client, chat_node returns a tool call and tools_condition routes it to tool_node. Because the tools came from MultiServerMCPClient.get_tools(), the call starts a new server process, which takes the handshake (3 messages), the call and its result (2), and a tools/list the client sends to fetch the output schema (2), then exits: 7 messages and 2,071 bytes for one call in the lab’s recording. The tool result goes back to chat_node.</desc>
      <defs>
        <marker id="ah-percall" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">LangGraph client</text>
      <rect class="lane" x="8" y="28" width="344" height="316"/>
      <text class="lane-label" x="380" y="20">New server process for this call</text>
      <rect class="lane" x="372" y="28" width="420" height="316"/>

      <!-- the graph -->
      <g class="n-1 n-8"><rect class="box" x="40" y="48" width="150" height="44"/><text class="label" x="115" y="70">chat_node</text></g>
      <g class="n-2">
        <path class="box" d="M115 120 L190 150 L115 180 L40 150 Z"/>
        <text class="small" x="115" y="150">tools_condition</text>
      </g>
      <g class="n-2"><rect class="box" x="40" y="220" width="150" height="44"/><text class="label" x="115" y="242">tool_node</text></g>
      <rect class="box" x="262" y="132" width="70" height="36"/><text class="label" x="297" y="150">END</text>
      <path class="edge e-1" d="M115 92 V117" marker-end="url(#ah-percall)"/>
      <path class="edge e-2" d="M115 180 V217" marker-end="url(#ah-percall)"/>
      <text class="small" x="150" y="200">tool call</text>
      <path class="edge" d="M190 150 H259" marker-end="url(#ah-percall)"/>
      <text class="small" x="226" y="138">no call</text>
      <path class="edge dashed e-8 in-8" d="M40 250 C16 250 16 62 37 62" marker-end="url(#ah-percall)"/>
      <text class="small in-8" x="290" y="318">ToolMessage</text>

      <!-- the process -->
      <path class="edge e-3 in-3" d="M190 236 C300 236 300 64 417 64" marker-end="url(#ah-percall)"/>
      <g class="n-3 in-3"><rect class="box" x="420" y="44" width="170" height="40"/><text class="label" x="505" y="64">Start process</text></g>
      <g class="n-4 in-4"><rect class="box" x="420" y="104" width="170" height="40"/><text class="label" x="505" y="124">initialize</text></g>
      <g class="n-5 in-5"><rect class="box" x="420" y="164" width="170" height="40"/><text class="label" x="505" y="184">tools/call</text></g>
      <g class="n-6 in-6"><rect class="box" x="420" y="224" width="170" height="40"/><text class="label" x="505" y="244">tools/list</text></g>
      <g class="n-7 in-7"><rect class="box" x="420" y="284" width="170" height="40"/><text class="label" x="505" y="304">Exit</text></g>
      <path class="edge e-4 in-4" d="M505 84 V101" marker-end="url(#ah-percall)"/>
      <path class="edge e-5 in-5" d="M505 144 V161" marker-end="url(#ah-percall)"/>
      <path class="edge e-6 in-6" d="M505 204 V221" marker-end="url(#ah-percall)"/>
      <path class="edge e-7 in-7" d="M505 264 V281" marker-end="url(#ah-percall)"/>
      <text class="fig in-4" x="690" y="124">3 messages</text>
      <text class="fig in-5" x="690" y="184">2 messages</text>
      <text class="fig in-6" x="690" y="244">2 messages</text>
      <text class="fig in-7" x="690" y="304">7 msgs, 2,071 bytes</text>
      <path class="edge dashed e-8 in-8" d="M420 310 C320 310 250 262 193 254" marker-end="url(#ah-percall)"/>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-percall-cap">
    <li><button type="button" data-tok="40,48">Chat</button><span>chat_node calls the model, which replies with a tool call for retrieve.</span></li>
    <li><button type="button" data-tok="40,120">Route</button><span>tools_condition sees the tool call and routes to tool_node.</span></li>
    <li><button type="button" data-tok="420,44">Start</button><span>The tool came from get_tools(), so it opens a new session: a new server process.</span></li>
    <li><button type="button" data-tok="420,104">Handshake</button><span>initialize, its result and the initialized notification: 3 messages.</span></li>
    <li><button type="button" data-tok="420,164">Call</button><span>tools/call and its result: 2 messages.</span></li>
    <li><button type="button" data-tok="420,224">Schema</button><span>The new session has no output schema for retrieve, so ClientSession sends tools/list before it checks the result: 2 more.</span></li>
    <li><button type="button" data-tok="420,284">Exit</button><span>The session closes and the process exits: 7 messages and 2,071 bytes for one call. A held session sends only the 2 call messages.</span></li>
    <li><button type="button" data-tok="40,48">Back</button><span>The result goes back to chat_node as a ToolMessage, and the next call starts another process.</span></li>
  </ol>
</figure>
