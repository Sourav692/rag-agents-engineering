<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram.
     The only figure is 1536, the text-embedding-3-small default from notebook 14.1. -->
<figure class="anim sheet" aria-labelledby="anim-embpath-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The path of a chunk and a question through the embedding model, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 392" role="img" aria-labelledby="anim-embpath-title anim-embpath-desc">
      <title id="anim-embpath-title">One model on both sides</title>
      <desc id="anim-embpath-desc">Index time: a chunk is looked up in the embedding cache by model, dimensions and text; on a miss the embedding model returns 1536 numbers, and the vector is stored with the model name and dimensions. Query time: the question is embedded by the same model, scored against every stored vector by cosine, and the k best chunks are returned.</desc>
      <defs>
        <marker id="ah-embpath" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Index time: embed_documents, once per chunk</text>
      <rect class="lane" x="8" y="28" width="784" height="176"/>
      <text class="lane-label" x="16" y="240">Query time: embed_query, every question</text>
      <rect class="lane" x="8" y="248" width="784" height="136"/>

      <!-- index time -->
      <g class="n-1"><rect class="box" x="30" y="48" width="120" height="44"/><text class="label" x="90" y="70">Chunk</text></g>
      <g class="n-2">
        <path class="box" d="M260 42 L320 70 L260 98 L200 70 Z"/>
        <text class="small" x="260" y="70">In cache?</text>
      </g>
      <g class="n-3"><rect class="box" x="380" y="48" width="150" height="44"/><text class="label" x="455" y="70">Embedding model</text></g>
      <g class="n-4">
        <path class="box" d="M610 50 a75 10 0 0 0 150 0 v94 a75 10 0 0 1 -150 0 z"/>
        <ellipse class="box" cx="685" cy="50" rx="75" ry="10"/>
        <text class="label" x="685" y="78">Vector store</text>
      </g>
      <path class="edge e-2" d="M150 70 H197" marker-end="url(#ah-embpath)"/>
      <path class="edge e-3" d="M320 70 H377" marker-end="url(#ah-embpath)"/>
      <text class="small" x="349" y="58">no</text>
      <path class="edge e-4" d="M530 70 H607" marker-end="url(#ah-embpath)"/>
      <path class="edge dashed e-4" d="M260 98 C260 160 300 182 380 182 H560 C590 182 592 126 607 126" marker-end="url(#ah-embpath)"/>
      <text class="small" x="440" y="170">yes: no model call</text>

      <g class="in-1">
        <rect class="doc" x="80" y="104" width="20" height="26"/>
        <path class="line" d="M84 112 H96 M84 118 H96 M84 124 H92"/>
        <text class="small" x="90" y="146">refund-timing</text>
      </g>
      <g class="in-2"><text class="small" x="205" y="118">key: model,</text><text class="small" x="205" y="134">dims, text</text></g>
      <g class="in-3">
        <circle class="vec" cx="425" cy="112" r="5"/><circle class="vec" cx="445" cy="112" r="5"/>
        <circle class="vec" cx="465" cy="112" r="5"/><circle class="vec" cx="485" cy="112" r="5"/>
        <text class="fig" x="455" y="136">1536 numbers</text>
      </g>
      <g class="in-4">
        <circle class="vec" cx="650" cy="100" r="5"/><circle class="vec" cx="672" cy="100" r="5"/>
        <circle class="vec" cx="694" cy="100" r="5"/><circle class="vec" cx="716" cy="100" r="5"/>
        <text class="small" x="685" y="124">+ model, dims</text>
      </g>

      <!-- the stored vectors are what the question is scored against -->
      <path class="edge dashed e-7" d="M685 154 C685 222 489 226 489 265" marker-end="url(#ah-embpath)"/>
      <text class="small" x="640" y="226">cosine</text>

      <!-- query time -->
      <g class="n-5"><rect class="box" x="24" y="268" width="140" height="44"/><text class="label" x="94" y="290">Question</text></g>
      <g class="n-6"><rect class="box" x="214" y="268" width="150" height="44"/><text class="label" x="289" y="290">The same model</text></g>
      <g class="n-7"><rect class="box" x="414" y="268" width="150" height="44"/><text class="label" x="489" y="290">Score</text></g>
      <g class="n-8"><rect class="box" x="634" y="268" width="130" height="44"/><text class="label" x="699" y="290">Top k</text></g>
      <path class="edge e-6" d="M164 290 H211" marker-end="url(#ah-embpath)"/>
      <path class="edge e-7" d="M364 290 H411" marker-end="url(#ah-embpath)"/>
      <path class="edge e-8" d="M564 290 H631" marker-end="url(#ah-embpath)"/>

      <g class="in-5">
        <rect class="doc" x="24" y="326" width="140" height="44"/>
        <text class="small" x="94" y="341">How long does</text>
        <text class="small" x="94" y="357">a refund take?</text>
      </g>
      <g class="in-6">
        <circle class="vec" cx="259" cy="338" r="5"/><circle class="vec" cx="279" cy="338" r="5"/>
        <circle class="vec" cx="299" cy="338" r="5"/><circle class="vec" cx="319" cy="338" r="5"/>
        <text class="fig" x="289" y="362">1536 numbers</text>
      </g>
      <g class="in-7"><text class="small" x="489" y="340">against every</text><text class="small" x="489" y="356">stored vector</text></g>
      <g class="mv-8" style="--from: translate(-210px, 0px)">
        <rect class="hit" x="675" y="330" width="48" height="8"/><rect class="hit" x="675" y="344" width="48" height="8"/>
        <text class="small" x="699" y="368">refund chunks</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-embpath-cap">
    <li><button type="button">Chunk</button><span>A chunk from M13 arrives, here <code>refund-timing</code>.</span></li>
    <li><button type="button">Cache</button><span>The cache looks it up by model, dimensions and text. A hit skips the model entirely.</span></li>
    <li><button type="button">Embed</button><span>On a miss, the embedding model returns the vector: 1536 numbers for <code>text-embedding-3-small</code>.</span></li>
    <li><button type="button">Store</button><span>The vector is stored with the model name and dimensions that made it.</span></li>
    <li><button type="button">Question</button><span>A customer asks <em>How long does a refund take?</em></span></li>
    <li><button type="button">Same model</button><span>The question is embedded by the same model with the same dimensions.</span></li>
    <li><button type="button">Score</button><span>Its vector is compared with every stored vector by cosine similarity.</span></li>
    <li><button type="button">Top k</button><span>The k closest chunks go to the prompt.</span></li>
  </ol>
</figure>
