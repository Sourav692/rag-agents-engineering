<path d="M90 85 L540 70 L540 225 L640 245 L640 382 L590 330" fill="none" stroke="#970d63" stroke-width="2.5" marker-end="url(#ah)"/>
<circle cx="90" cy="85" r="9" fill="none" stroke="#970d63" stroke-width="2"/><text x="90" y="112" text-anchor="middle" font-size="13" fill="#060e15">entry point</text>
<circle cx="606" cy="307" r="7" fill="#f0ccdc" stroke="#970d63" stroke-width="2"/><text x="620" y="312" font-size="13" fill="#970d63" font-weight="600">query</text>
<text x="580" y="318" text-anchor="end" font-size="13" fill="#060e15">nearest found</text>
<text x="24" y="440" font-size="14" fill="#060e15">Greedy search: move to the neighbour closest to the query; when none is closer, drop a layer.</text>
<text x="24" y="460" font-size="14" fill="#3b434b">M: links per node. ef_construction: build-time candidates. ef_search: query-time candidates.</text>
