<line x1="90" y1="215" x2="260" y2="240" stroke="#3b434b" stroke-width="1"/>
<line x1="260" y1="240" x2="370" y2="200" stroke="#3b434b" stroke-width="1"/>
<line x1="370" y1="200" x2="540" y2="225" stroke="#3b434b" stroke-width="1"/>
