<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Hanken Grotesk, Arial, sans-serif">
<title>HNSW: a layered graph searched from the top down</title>
<desc>Three layers of one HNSW index. Layer 0 holds every vector, linked to its near neighbours; each higher layer keeps a random subset with longer links. A search enters at the top layer, moves greedily to the neighbour closest to the query, drops a layer when no neighbour is closer, and ends at layer 0 beside the query. The drawing is schematic, not measured.</desc>
<rect width="800" height="470" fill="#e5eaef"/>
<rect x="20" y="30" width="760" height="110" fill="none" stroke="#a1a9af"/>
<text x="768" y="52" text-anchor="end" font-size="14" font-weight="500" fill="#3b434b">Layer 2: few nodes, long links</text>
<rect x="20" y="160" width="760" height="110" fill="none" stroke="#a1a9af"/>
<text x="768" y="182" text-anchor="end" font-size="14" font-weight="500" fill="#3b434b">Layer 1</text>
<rect x="20" y="290" width="760" height="120" fill="none" stroke="#a1a9af"/>
<text x="768" y="402" text-anchor="end" font-size="14" font-weight="500" fill="#3b434b">Layer 0: every vector</text>
<line x1="90" y1="85" x2="90" y2="330" stroke="#a1a9af" stroke-dasharray="3 4"/>
<line x1="540" y1="70" x2="540" y2="370" stroke="#a1a9af" stroke-dasharray="3 4"/>
