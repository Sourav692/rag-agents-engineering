<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The figures are the record-manager lab's own: refunds.md edited from 30 to 14 days, then index() with cleanup="incremental".
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-living-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The living index, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-living-title anim-living-desc">
      <title id="anim-living-title">The living index</title>
      <desc id="anim-living-desc">Sync lane: index() loads 10 chunks from the handbook folder and hashes each one from its text and source. The record manager already holds 9 of those hashes, so 9 are skipped and 1, the edited 14-day refund rule, is embedded and added. Every key is stamped with the run’s time, and incremental cleanup deletes the 30-day refund chunk, whose key the run never touched. Query lane: a question with a metadata filter searches the collection and ANN search returns the top k chunks.</desc>
      <defs>
        <marker id="ah-living" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Sync: every index() run</text>
      <rect class="lane" x="8" y="28" width="784" height="184"/>
      <text class="lane-label" x="16" y="234">Query: every question</text>
      <rect class="lane" x="8" y="242" width="784" height="102"/>

      <g class="n-1"><rect class="box" x="30" y="48" width="130" height="52"/><text class="label" x="95" y="66">Source folder</text></g>
      <text class="fig in-1" x="95" y="86">10 chunks</text>
      <path class="edge e-2" d="M160 74 H197" marker-end="url(#ah-living)"/>
      <g class="n-2"><rect class="box" x="200" y="48" width="130" height="52"/><text class="label" x="265" y="66">Hash</text><text class="small" x="265" y="86">text + source</text></g>
      <path class="edge e-3" d="M330 74 H367" marker-end="url(#ah-living)"/>
      <g class="n-3 n-5 n-6"><rect class="box" x="370" y="48" width="150" height="52"/><text class="label" x="445" y="66">Record manager</text><text class="small" x="445" y="86">key: hash, time</text></g>
      <text class="fig in-5" x="445" y="118">10 keys stamped</text>

      <path class="edge e-3" d="M520 62 H555 V58 H587" marker-end="url(#ah-living)"/>
      <g class="n-3"><rect class="box" x="590" y="40" width="180" height="36"/><text class="label" x="680" y="58">Skip</text></g>
      <text class="fig in-3" x="680" y="93">9 skipped</text>
      <path class="edge e-4" d="M520 86 H555 V128 H587" marker-end="url(#ah-living)"/>
      <g class="n-4"><rect class="box" x="590" y="110" width="180" height="36"/><text class="label" x="680" y="128">Embed and add</text></g>
      <text class="fig in-4" x="700" y="164">1 added: 14 days</text>

      <path class="edge e-6" d="M445 126 V145" marker-end="url(#ah-living)"/>
      <g class="n-6"><rect class="box" x="370" y="148" width="150" height="40"/><text class="label" x="445" y="168">Clean up</text></g>
      <text class="fig in-6" x="250" y="168">1 deleted: 30 days</text>

      <path class="edge e-4" d="M620 146 V222 H498 V249" marker-end="url(#ah-living)"/>
      <path class="edge e-6" d="M445 188 V249" marker-end="url(#ah-living)"/>
      <g class="n-4 n-6 n-7">
        <path class="box" d="M370 262 a75 10 0 0 0 150 0 v58 a75 10 0 0 1 -150 0 z"/>
        <ellipse class="box" cx="445" cy="262" rx="75" ry="10"/>
        <text class="label" x="445" y="290">Collection</text>
        <text class="fig" x="445" y="310">10 chunks</text>
      </g>

      <g class="n-7"><rect class="box" x="30" y="268" width="200" height="48"/><text class="label" x="130" y="292">Question + filter</text></g>
      <path class="edge e-7" d="M230 292 H367" marker-end="url(#ah-living)"/>
      <path class="edge e-7" d="M520 292 H587" marker-end="url(#ah-living)"/>
      <g class="n-7"><rect class="box" x="590" y="268" width="180" height="48"/><text class="label" x="680" y="292">ANN search, top k</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-living-cap">
    <li><button type="button" data-tok="30,48">Load</button><span>The loader returns the handbook folder as 10 chunks. refunds.md now says 14 days where it said 30.</span></li>
    <li><button type="button" data-tok="200,48">Hash</button><span>Each chunk gets an ID from a hash of its text and its source. Same text, same ID.</span></li>
    <li><button type="button" data-tok="590,40">Skip</button><span>The record manager already holds 9 of the 10 hashes. Those 9 are skipped and never re-embedded.</span></li>
    <li><button type="button" data-tok="590,110">Embed</button><span>One hash is new: the 14-day refund rule. Only that chunk is embedded and added to the collection.</span></li>
    <li><button type="button" data-tok="370,48">Stamp</button><span>All 10 keys are stamped with this run’s time, the skipped ones included.</span></li>
    <li><button type="button" data-tok="370,148">Clean up</button><span>Incremental cleanup lists keys from refunds.md older than the run. The 30-day chunk is one, so it is deleted.</span></li>
    <li><button type="button" data-tok="30,268">Query</button><span>A question with a metadata filter searches the collection, and ANN search returns the top k chunks.</span></li>
  </ol>
</figure>
