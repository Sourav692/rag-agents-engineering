<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The Document counts are the PDF parsers lab's own: page 7 gives 1 Document with PyPDF and 10 with Unstructured in element mode.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-ingest-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The ingestion pipeline, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-ingest-title anim-ingest-desc">
      <title id="anim-ingest-title">The ingestion pipeline</title>
      <desc id="anim-ingest-desc">A blob loader fetches the handbook PDF as bytes with a mimetype and source, and a parser turns the bytes into Documents with text and metadata. Page 7 becomes 1 Document with PyPDF or 10 with Unstructured in element mode. The Documents are validated for counts, lengths and empty text, then go to the splitter in M13.</desc>
      <defs>
        <marker id="ah-ingest" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Loader: fetch and parse</text>
      <rect class="lane" x="8" y="28" width="784" height="136"/>
      <text class="lane-label" x="16" y="206">Check, then split</text>
      <rect class="lane" x="8" y="214" width="784" height="130"/>

      <!-- loader -->
      <g class="n-1">
        <path class="box" d="M40 50 a65 10 0 0 0 130 0 v36 a65 10 0 0 1 -130 0 z"/>
        <ellipse class="box" cx="105" cy="50" rx="65" ry="10"/>
        <text class="label" x="105" y="74">Source</text>
      </g>
      <g class="n-2"><rect class="box" x="225" y="48" width="130" height="44"/><text class="label" x="290" y="70">Blob loader</text></g>
      <g class="n-3"><rect class="box" x="410" y="48" width="130" height="44"/><text class="label" x="475" y="70">Blob</text></g>
      <g class="n-4"><rect class="box" x="600" y="48" width="160" height="44"/><text class="label" x="680" y="70">Parser</text></g>
      <path class="edge e-2" d="M170 70 H222" marker-end="url(#ah-ingest)"/>
      <path class="edge e-3" d="M355 70 H407" marker-end="url(#ah-ingest)"/>
      <path class="edge e-4" d="M540 70 H597" marker-end="url(#ah-ingest)"/>

      <g class="in-1">
        <rect class="doc" x="95" y="104" width="20" height="26"/>
        <path class="line" d="M99 112 H111 M99 118 H111 M99 124 H107"/>
        <text class="small" x="105" y="146">handbook.pdf</text>
      </g>
      <g class="in-2">
        <text class="small" x="290" y="116">file, bucket</text>
        <text class="small" x="290" y="134">or URL</text>
      </g>
      <g class="in-3">
        <text class="fig" x="475" y="116">application/pdf</text>
        <text class="small" x="475" y="136">bytes + source</text>
      </g>
      <g class="in-4">
        <text class="small" x="680" y="116">pypdf, PyMuPDF</text>
        <text class="small" x="680" y="134">or Unstructured</text>
      </g>

      <!-- hand-off: parser output drops into the second lane -->
      <path class="edge e-5" d="M760 70 H780 V182 H170 V231" marker-end="url(#ah-ingest)"/>

      <g class="n-5"><rect class="box" x="40" y="234" width="170" height="44"/><text class="label" x="125" y="256">Documents</text></g>
      <g class="n-6"><rect class="box" x="290" y="234" width="150" height="44"/><text class="label" x="365" y="256">Validate</text></g>
      <g class="n-7"><rect class="box" x="520" y="234" width="130" height="44"/><text class="label" x="585" y="256">Split</text></g>
      <path class="edge e-6" d="M210 256 H287" marker-end="url(#ah-ingest)"/>
      <path class="edge e-7" d="M440 256 H517" marker-end="url(#ah-ingest)"/>
      <path class="edge dashed e-7" d="M650 256 H737" marker-end="url(#ah-ingest)"/>
      <text class="small" x="762" y="256">M13</text>

      <g class="in-5">
        <text class="small" x="125" y="298">page 7 becomes</text>
        <text class="fig" x="125" y="316">1 with PyPDF</text>
        <text class="fig" x="125" y="334">10 with Unstructured</text>
      </g>
      <g class="in-6">
        <text class="small" x="365" y="298">count per source</text>
        <text class="small" x="365" y="316">no empty text</text>
        <text class="small" x="365" y="334">lengths in range</text>
      </g>
      <g class="in-7">
        <rect class="chunk" x="561" y="292" width="48" height="6"/><rect class="chunk" x="561" y="302" width="48" height="6"/>
        <rect class="chunk" x="561" y="312" width="48" height="6"/>
        <text class="small" x="585" y="334">chunks</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-ingest-cap">
    <li><button type="button">Source</button><span>The handbook PDF sits in a folder, a bucket or behind a URL.</span></li>
    <li><button type="button">Fetch</button><span>A blob loader reads the raw bytes without interpreting them.</span></li>
    <li><button type="button">Blob</button><span>The bytes travel with their mimetype and source, so any parser can take them.</span></li>
    <li><button type="button">Parse</button><span>The parser turns bytes into text and structure. Layout, tables and headers are kept or lost here.</span></li>
    <li><button type="button">Documents</button><span>Out come Documents: page 7 gives 1 with PyPDF and 10 with Unstructured in element mode.</span></li>
    <li><button type="button">Validate</button><span>Count Documents per source and look for empty or tiny text before anything is embedded.</span></li>
    <li><button type="button">Split</button><span>The checked Documents go to the splitter in M13.</span></li>
  </ol>
</figure>
