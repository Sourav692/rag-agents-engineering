<!-- Animated version of the lazy_load sequence diagram in ../README.md, used by index.html.
     No figures: the batch size in the prose is an example, not a measurement.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-lazy-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The lazy loading loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 310" role="img" aria-labelledby="anim-lazy-title anim-lazy-desc">
      <title id="anim-lazy-title">The lazy loading loop</title>
      <desc id="anim-lazy-desc">The indexer asks the loader for the next Document, and lazy_load yields one ticket. The indexer splits it into the current batch. A full batch is embedded and upserted in one call, the index returns the stored ids, and the indexer records the last one as a checkpoint. The loop repeats until the source is exhausted, so memory holds one batch at a time.</desc>
      <defs>
        <marker id="ah-lazy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1 n-6"><rect class="box" x="40" y="30" width="170" height="52"/><text class="label" x="125" y="48">Loader</text><text class="fig" x="125" y="68">lazy_load()</text></g>
      <g class="n-2 n-3"><rect class="box" x="315" y="30" width="170" height="52"/><text class="label" x="400" y="48">Indexer</text><text class="small" x="400" y="68">split, batch</text></g>
      <g class="n-4"><rect class="box" x="590" y="30" width="170" height="52"/><text class="label" x="675" y="48">Embed + upsert</text><text class="small" x="675" y="68">one call per batch</text></g>

      <path class="edge e-1 e-6" d="M315 46 H213" marker-end="url(#ah-lazy)"/>
      <text class="fig" x="262" y="36">next()</text>
      <path class="edge e-2" d="M210 66 H312" marker-end="url(#ah-lazy)"/>
      <text class="fig" x="262" y="80">Document</text>

      <path class="edge e-3" d="M400 82 V125" marker-end="url(#ah-lazy)"/>
      <g class="n-3"><rect class="box" x="330" y="128" width="140" height="64"/></g>
      <text class="small" x="400" y="208">batch</text>
      <g class="in-3">
        <rect class="chunk" x="352" y="142" width="96" height="6"/><rect class="chunk" x="352" y="154" width="96" height="6"/>
        <rect class="chunk" x="352" y="166" width="96" height="6"/>
      </g>

      <path class="edge e-4" d="M470 150 C540 150 545 56 587 56" marker-end="url(#ah-lazy)"/>
      <path class="edge e-4" d="M675 82 V197" marker-end="url(#ah-lazy)"/>
      <g class="n-5">
        <path class="box" d="M610 210 a65 10 0 0 0 130 0 v44 a65 10 0 0 1 -130 0 z"/>
        <ellipse class="box" cx="675" cy="210" rx="65" ry="10"/>
      </g>
      <text class="small" x="675" y="284">Index</text>
      <g class="in-4">
        <circle class="vec" cx="645" cy="232" r="5"/><circle class="vec" cx="665" cy="232" r="5"/>
        <circle class="vec" cx="685" cy="232" r="5"/><circle class="vec" cx="705" cy="232" r="5"/>
      </g>

      <path class="edge dashed e-5" d="M610 240 C560 240 520 180 473 180" marker-end="url(#ah-lazy)"/>
      <text class="small" x="560" y="262">ids stored</text>
      <text class="fig in-5" x="400" y="230">checkpoint: last id</text>

      <path class="edge dashed e-6" d="M330 176 H125 V85" marker-end="url(#ah-lazy)"/>
      <text class="small" x="228" y="194">until the source is exhausted</text>
      <text class="small in-6" x="228" y="290">memory holds one batch at a time</text>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-lazy-cap">
    <li><button type="button" data-tok="40,30">Ask</button><span>The indexer calls <code>next()</code> on the loader.</span></li>
    <li><button type="button" data-tok="315,30">Yield</button><span><code>lazy_load()</code> reads one ticket from the API and yields it as a Document.</span></li>
    <li><button type="button" data-tok="330,128">Batch</button><span>The indexer splits it and adds the chunks to the current batch.</span></li>
    <li><button type="button" data-tok="590,30">Upsert</button><span>When the batch is full, it is embedded and written to the index in one call.</span></li>
    <li><button type="button" data-tok="610,200">Checkpoint</button><span>The index returns the stored ids, and the indexer records the last one as its checkpoint.</span></li>
    <li><button type="button" data-tok="40,30">Repeat</button><span>The loop runs until the source is exhausted, so memory never holds more than one batch.</span></li>
  </ol>
</figure>
