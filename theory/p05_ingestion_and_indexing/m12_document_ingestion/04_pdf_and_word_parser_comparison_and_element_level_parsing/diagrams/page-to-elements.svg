<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Page-level versus element-level parsing</title>
  <desc id="d">A two-column handbook page with a header, two section titles, paragraphs, a table, list items and a footer. Page-level parsing turns it into one Document whose text mixes all regions. Element-level parsing turns it into one typed Document per region, linked to its section title by parent_id.</desc>
  <rect width="800" height="430" rx="14" fill="#e5eaef"/>
  <text x="28" y="36" font-size="17" font-weight="700" fill="#060e15">One page, two ways to turn it into Documents</text>

  <!-- the page -->
  <rect x="28" y="56" width="250" height="340" rx="6" fill="#f2f5f8" stroke="#a1a9af"/>
  <rect x="40" y="66" width="226" height="16" rx="3" fill="#bbc2c8"/><text x="46" y="78" font-size="9" fill="#3b434b">Header</text>
  <rect x="40" y="92" width="108" height="16" rx="3" fill="#f0ccdc"/><text x="46" y="104" font-size="9" fill="#76004b">Title 4</text>
  <rect x="40" y="114" width="108" height="64" rx="3" fill="#d5dbe0"/><text x="46" y="128" font-size="9" fill="#182027">NarrativeText</text>
  <rect x="40" y="186" width="108" height="78" rx="3" fill="#aeb5bb"/><text x="46" y="200" font-size="9" fill="#060e15">Table</text>
  <line x1="40" y1="212" x2="148" y2="212" stroke="#a1a9af"/><line x1="40" y1="230" x2="148" y2="230" stroke="#a1a9af"/><line x1="40" y1="248" x2="148" y2="248" stroke="#a1a9af"/>
  <line x1="80" y1="204" x2="80" y2="264" stroke="#a1a9af"/><line x1="114" y1="204" x2="114" y2="264" stroke="#a1a9af"/>
  <rect x="158" y="92" width="108" height="16" rx="3" fill="#f0ccdc"/><text x="164" y="104" font-size="9" fill="#76004b">Title 5</text>
  <rect x="158" y="114" width="108" height="50" rx="3" fill="#d5dbe0"/><text x="164" y="128" font-size="9" fill="#182027">NarrativeText</text>
  <rect x="158" y="172" width="108" height="26" rx="3" fill="#cfd5db"/><text x="164" y="188" font-size="9" fill="#182027">ListItem</text>
  <rect x="158" y="204" width="108" height="26" rx="3" fill="#cfd5db"/><text x="164" y="220" font-size="9" fill="#182027">ListItem</text>
  <rect x="158" y="236" width="108" height="26" rx="3" fill="#cfd5db"/><text x="164" y="252" font-size="9" fill="#182027">ListItem</text>
  <rect x="40" y="370" width="226" height="16" rx="3" fill="#bbc2c8"/><text x="46" y="382" font-size="9" fill="#3b434b">Footer</text>
  <text x="153" y="412" font-size="11" text-anchor="middle" fill="#3b434b">handbook.pdf, page 7</text>

  <!-- arrows -->
  <path d="M286 140 C 330 140, 330 110, 372 110" fill="none" stroke="#3b434b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M286 300 C 330 300, 330 270, 372 270" fill="none" stroke="#3b434b" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b434b"/></marker></defs>

  <!-- page-level -->
  <text x="378" y="76" font-size="13" font-weight="700" fill="#060e15">Page-level: PyPDFLoader, PyMuPDFLoader</text>
  <rect x="378" y="86" width="394" height="92" rx="6" fill="#f2f5f8" stroke="#970d63" stroke-width="1.5"/>
  <text x="390" y="104" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#060e15">Document(page_content="Larkspur Cloud · Customer</text>
  <text x="390" y="120" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#060e15">  Handbook\n4. Plans… Starter 1 2 GB 1 TB $6…</text>
  <text x="390" y="136" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#060e15">  5. Refunds… Page 7 of 24",</text>
  <text x="390" y="152" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#060e15">  metadata={"source": …, "page": 6})</text>
  <text x="390" y="170" font-size="11" fill="#76004b">header, two sections and a flattened table in one string</text>

  <!-- element-level -->
  <text x="378" y="236" font-size="13" font-weight="700" fill="#060e15">Element-level: Unstructured, mode="elements"</text>
  <g font-size="11" font-family="ui-monospace, Menlo, monospace">
    <rect x="378" y="246" width="190" height="22" rx="4" fill="#bbc2c8"/><text x="386" y="261" fill="#3b434b">Header (drop it)</text>
    <rect x="582" y="246" width="190" height="22" rx="4" fill="#f0ccdc"/><text x="590" y="261" fill="#76004b">Title "5. Refunds"</text>
    <rect x="378" y="274" width="190" height="22" rx="4" fill="#aeb5bb"/><text x="386" y="289" fill="#060e15">Table + text_as_html</text>
    <rect x="582" y="274" width="190" height="22" rx="4" fill="#d5dbe0"/><text x="590" y="289" fill="#182027">NarrativeText</text>
    <rect x="378" y="302" width="190" height="22" rx="4" fill="#bbc2c8"/><text x="386" y="317" fill="#3b434b">Footer (drop it)</text>
    <rect x="582" y="302" width="190" height="22" rx="4" fill="#cfd5db"/><text x="590" y="317" fill="#182027">ListItem × 3</text>
  </g>
  <text x="378" y="346" font-size="11" fill="#76004b">parent_id links each element to its Title: section="5. Refunds"</text>
  <text x="378" y="364" font-size="11" fill="#182027">page_number is 1-based; category tells you what each piece is</text>
  <text x="378" y="392" font-size="11" fill="#3b434b">Cost: slower, heavier dependencies (hi_res layout model).</text>
</svg>
