<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The figures are the M16 lab's at child 150 and parent 600, for the refund question: 5 parents, 19 children,
     the best child #5 (145 characters, score 0.630) and its parent P2 (523 characters).
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-kp-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Search key and payload, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-kp-title anim-kp-desc">
      <title id="anim-kp-title">Search key and payload</title>
      <desc id="anim-kp-desc">A 2,184-character handbook page is split into 5 parents, stored in the docstore by id, and 19 children, embedded in the vector index with their parent’s id. The refund question matches child 5, 145 characters, at a score of 0.630. Its parent id points to parent 2 in the docstore, and the model reads that 523-character parent.</desc>
      <defs>
        <marker id="ah-kp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="20" y="22">Index time</text>
      <text class="lane-label" x="640" y="22">Query time</text>

      <g class="n-1">
        <rect class="box" x="20" y="146" width="130" height="60"/>
        <text class="label" x="85" y="168">Handbook page</text>
        <text class="small" x="85" y="190">2,184 characters</text>
      </g>

      <path class="edge e-1" d="M150 166 C182 166 178 68 207 68" marker-end="url(#ah-kp)"/>
      <path class="edge e-1" d="M150 186 C182 186 178 284 207 284" marker-end="url(#ah-kp)"/>
      <g class="n-2">
        <rect class="box" x="210" y="40" width="150" height="56"/>
        <text class="label" x="285" y="60">Parents</text>
        <text class="fig" x="285" y="80">5, P1 to P5</text>
      </g>
      <g class="n-3">
        <rect class="box" x="210" y="256" width="150" height="56"/>
        <text class="label" x="285" y="276">Children</text>
        <text class="fig" x="285" y="296">19 search keys</text>
      </g>

      <path class="edge e-2" d="M360 68 H417" marker-end="url(#ah-kp)"/>
      <g class="in-2 n-2 n-5">
        <path class="box" d="M420 36 a80 10 0 0 0 160 0 v52 a80 10 0 0 1 -160 0 z"/>
        <ellipse class="box" cx="500" cy="36" rx="80" ry="10"/>
        <text class="label" x="500" y="64">Docstore</text>
        <text class="small" x="500" y="84">id to parent</text>
      </g>

      <path class="edge e-3" d="M360 284 H417" marker-end="url(#ah-kp)"/>
      <g class="in-3 n-3 n-4">
        <path class="box" d="M420 252 a80 10 0 0 0 160 0 v52 a80 10 0 0 1 -160 0 z"/>
        <ellipse class="box" cx="500" cy="252" rx="80" ry="10"/>
        <text class="label" x="500" y="280">Vector index</text>
        <text class="small" x="500" y="300">vector + parent id</text>
      </g>

      <g class="in-4 n-4">
        <rect class="box" x="640" y="256" width="140" height="56"/>
        <text class="label" x="710" y="276">Question</text>
        <text class="small" x="710" y="296">refund window</text>
      </g>
      <path class="edge e-4" d="M640 284 H583" marker-end="url(#ah-kp)"/>
      <text class="fig in-4" x="500" y="334">best: child #5, 0.630</text>

      <path class="edge e-5" d="M500 242 V101" marker-end="url(#ah-kp)"/>
      <text class="fig in-5" x="548" y="176">id of P2</text>

      <path class="edge e-6" d="M580 68 H637" marker-end="url(#ah-kp)"/>
      <g class="in-6 n-6">
        <rect class="box" x="640" y="40" width="140" height="56"/>
        <text class="label" x="710" y="60">LLM</text>
        <text class="small" x="710" y="80">reads P2</text>
      </g>
      <g class="in-6">
        <text class="fig" x="710" y="122">P2: 523 characters</text>
        <text class="fig" x="710" y="142">child #5: 145</text>
      </g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-kp-cap">
    <li><button type="button" data-tok="20,146">Split</button><span>The 2,184-character page is cut twice: into 5 parents of up to 600 characters, then each parent into children of up to 150.</span></li>
    <li><button type="button" data-tok="420,36">Store</button><span>The parents go into the docstore, each under its own id. They are the payload.</span></li>
    <li><button type="button" data-tok="420,252">Index</button><span>The 19 children are embedded into the vector index, each with its parent’s id in its metadata. They are the search keys.</span></li>
    <li><button type="button" data-tok="640,256">Match</button><span>The refund question is matched against the children only. Child #5, 145 characters, scores best at 0.630.</span></li>
    <li><button type="button" data-tok="500,172">Look up</button><span>The retriever reads child #5’s parent id and fetches P2 from the docstore.</span></li>
    <li><button type="button" data-tok="640,40">Read</button><span>The model reads P2, 523 characters with the whole answer, where child #5 alone stopped before the 100 GB condition.</span></li>
  </ol>
</figure>
