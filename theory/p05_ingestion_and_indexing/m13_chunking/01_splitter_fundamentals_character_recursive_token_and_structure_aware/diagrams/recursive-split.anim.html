    <li><button type="button">Section</button><span>The splitter gets the 1,111-character refund section, with chunk_size 300 and no overlap.</span></li>
    <li><button type="button">Blank lines</button><span>It splits on the first separator present, the blank line, which gives five pieces of 25, 262, 525, 151 and 148 characters.</span></li>
    <li><button type="button">Chunk 1</button><span>The first two pieces fit together under 300, so they merge into chunk 1 (287 characters).</span></li>
    <li><button type="button">Recurse</button><span>The 525-character paragraph is over 300, so the splitter recurses into it with the next separator. A line break only peels off the blank line in front.</span></li>
    <li><button type="button">Spaces</button><span>It falls through to spaces and splits the paragraph into 95 words.</span></li>
    <li><button type="button">Chunks 2, 3</button><span>The words merge back up to 300 characters, giving chunk 2 (297) and chunk 3 (225).</span></li>
    <li><button type="button">Chunk 4</button><span>The last two paragraphs fit together as chunk 4 (297).</span></li>
    <li><button type="button">The cut</button><span>The answer sentence lands 113 characters in chunk 2 and 27 in chunk 3, cut after “used less than”.</span></li>
  </ol>
