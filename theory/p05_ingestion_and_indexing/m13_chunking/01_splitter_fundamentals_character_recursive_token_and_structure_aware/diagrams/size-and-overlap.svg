<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chunk size and overlap</title>
  <desc id="d">Top: a document split into chunks of chunk_size characters, where each chunk repeats the last chunk_overlap characters of the one before it. Bottom: the 300/0 split of the refund section cuts the answer sentence between chunk 2 and chunk 3; with 150 characters of overlap, chunk 3 holds the whole sentence.</desc>
  <rect width="800" height="400" rx="14" fill="#e5eaef"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#060e15">chunk_size sets the window; chunk_overlap sets how much it repeats</text>

  <!-- the document -->
  <text x="28" y="74" font-size="12" fill="#3b434b">document</text>
  <rect x="110" y="60" width="660" height="20" rx="4" fill="#bbc2c8"/>
  <!-- chunks -->
  <rect x="110" y="92" width="240" height="26" rx="5" fill="#182027"/>
  <text x="122" y="110" font-size="12" font-weight="600" fill="#f2f5f8">chunk 1</text>
  <rect x="300" y="126" width="240" height="26" rx="5" fill="#182027"/>
  <text x="362" y="144" font-size="12" font-weight="600" fill="#f2f5f8">chunk 2</text>
  <rect x="490" y="160" width="240" height="26" rx="5" fill="#182027"/>
  <text x="552" y="178" font-size="12" font-weight="600" fill="#f2f5f8">chunk 3</text>
  <!-- overlap bands -->
  <rect x="300" y="92" width="50" height="60" fill="#970d63" opacity=".55"/>
  <rect x="490" y="126" width="50" height="60" fill="#970d63" opacity=".55"/>
  <!-- dimension: size -->
  <line x1="110" y1="204" x2="350" y2="204" stroke="#060e15" stroke-width="1.2"/>
  <line x1="110" y1="198" x2="110" y2="210" stroke="#060e15" stroke-width="1.2"/>
  <line x1="350" y1="198" x2="350" y2="210" stroke="#060e15" stroke-width="1.2"/>
  <text x="230" y="222" font-size="12" text-anchor="middle" fill="#060e15">chunk_size: upper bound per chunk</text>
  <!-- dimension: overlap -->
  <line x1="490" y1="204" x2="540" y2="204" stroke="#970d63" stroke-width="1.2"/>
  <line x1="490" y1="198" x2="490" y2="210" stroke="#970d63" stroke-width="1.2"/>
  <line x1="540" y1="198" x2="540" y2="210" stroke="#970d63" stroke-width="1.2"/>
  <text x="490" y="222" font-size="12" fill="#970d63">chunk_overlap: stored twice</text>

  <!-- the real example -->
  <line x1="28" y1="246" x2="772" y2="246" stroke="#bbc2c8"/>
  <text x="28" y="272" font-size="13" font-weight="700" fill="#060e15">Refund section, chunk_size=300, chunk_overlap=0</text>
  <rect x="28" y="284" width="360" height="44" rx="6" fill="#f2f5f8" stroke="#970d63" stroke-width="1.5"/>
  <text x="40" y="302" font-size="11" fill="#3b434b">chunk 2 ends</text>
  <text x="40" y="319" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#060e15">…as long as the account has used less than</text>
  <rect x="404" y="284" width="368" height="44" rx="6" fill="#f2f5f8" stroke="#970d63" stroke-width="1.5"/>
  <text x="416" y="302" font-size="11" fill="#3b434b">chunk 3 starts</text>
  <text x="416" y="319" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#060e15">100 GB of outbound traffic. After day 30…</text>
  <text x="28" y="352" font-size="12" fill="#76004b">The 30-day rule and its 100 GB condition land in different chunks; retrieving chunk 2 gives half the policy.</text>
  <text x="28" y="376" font-size="12" fill="#182027">With chunk_overlap=150, chunk 3 starts at “Annual plans work differently.” and holds the whole sentence (1.26× storage).</text>
</svg>
