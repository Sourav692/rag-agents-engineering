<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Semantic chunking breakpoints</title>
  <desc id="d">Distance between each pair of neighbouring sentences in the refund section, with two percentile thresholds. The 95th percentile (0.39) cuts once; the 75th (0.25) cuts at the three topic changes. Distances are illustrative.</desc>
  <rect width="800" height="390" rx="0" fill="#e5eaef"/>
  <rect width="800" height="2" fill="#060e15"/>
  <text x="28" y="38" font-size="17" font-weight="600" fill="#060e15">A breakpoint is a distance above the threshold</text>
  <text x="28" y="58" font-size="12" fill="#3b434b">1 − cosine similarity between neighbouring sentences of the refund section (illustrative values)</text>
  <line x1="70" y1="296.0" x2="760" y2="296.0" stroke="#a1a9af" stroke-width="1"/><text x="62" y="300.0" font-size="10" text-anchor="end" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">0.0</text>
  <line x1="70" y1="256.0" x2="760" y2="256.0" stroke="#a1a9af" stroke-width="1"/><text x="62" y="260.0" font-size="10" text-anchor="end" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">0.1</text>
  <line x1="70" y1="216.0" x2="760" y2="216.0" stroke="#a1a9af" stroke-width="1"/><text x="62" y="220.0" font-size="10" text-anchor="end" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">0.2</text>
  <line x1="70" y1="176.0" x2="760" y2="176.0" stroke="#a1a9af" stroke-width="1"/><text x="62" y="180.0" font-size="10" text-anchor="end" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">0.3</text>
  <line x1="70" y1="136.0" x2="760" y2="136.0" stroke="#a1a9af" stroke-width="1"/><text x="62" y="140.0" font-size="10" text-anchor="end" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">0.4</text>
  <line x1="70" y1="96.0" x2="760" y2="96.0" stroke="#a1a9af" stroke-width="1"/><text x="62" y="100.0" font-size="10" text-anchor="end" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">0.5</text>
  <rect x="81.5" y="224.0" width="34.5" height="72.0" fill="#aeb5bb"/>
  <text x="98.8" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">1|2</text>
  <rect x="139.0" y="256.0" width="34.5" height="40.0" fill="#aeb5bb"/>
  <text x="156.2" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">2|3</text>
  <rect x="196.5" y="160.0" width="34.5" height="136.0" fill="#da97b6"/>
  <text x="213.8" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">3|4</text>
  <text x="213.8" y="86" font-size="10" text-anchor="middle" fill="#182027">cancelling to refundability</text>
  <rect x="254.0" y="248.0" width="34.5" height="48.0" fill="#aeb5bb"/>
  <text x="271.2" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">4|5</text>
  <rect x="311.5" y="208.0" width="34.5" height="88.0" fill="#aeb5bb"/>
  <text x="328.8" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">5|6</text>
  <rect x="369.0" y="260.0" width="34.5" height="36.0" fill="#aeb5bb"/>
  <text x="386.2" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">6|7</text>
  <rect x="426.5" y="252.0" width="34.5" height="44.0" fill="#aeb5bb"/>
  <text x="443.8" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">7|8</text>
  <rect x="484.0" y="228.0" width="34.5" height="68.0" fill="#aeb5bb"/>
  <text x="501.2" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">8|9</text>
  <rect x="541.5" y="132.0" width="34.5" height="164.0" fill="#970d63"/>
  <text x="558.8" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">9|10</text>
  <text x="558.8" y="86" font-size="10" text-anchor="middle" fill="#182027">refunds to credits</text>
  <rect x="599.0" y="244.0" width="34.5" height="52.0" fill="#aeb5bb"/>
  <text x="616.2" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">10|11</text>
  <rect x="656.5" y="148.0" width="34.5" height="148.0" fill="#da97b6"/>
  <text x="673.8" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">11|12</text>
  <text x="673.8" y="86" font-size="10" text-anchor="middle" fill="#182027">credits to requests</text>
  <rect x="714.0" y="264.0" width="34.5" height="32.0" fill="#aeb5bb"/>
  <text x="731.2" y="312" font-size="10" text-anchor="middle" fill="#3b434b" font-family="ui-monospace, Menlo, monospace">12|13</text>
  <line x1="70" y1="140.8" x2="760" y2="140.8" stroke="#76004b" stroke-width="1.5"/>
  <line x1="70" y1="196.0" x2="760" y2="196.0" stroke="#3b434b" stroke-width="1.5"/>
  <text x="760" y="330" font-size="11" text-anchor="end" fill="#3b434b">sentence pair</text>
  <rect x="70" y="332" width="12" height="12" fill="#970d63"/><text x="88" y="342" font-size="12" fill="#060e15">above the 95th percentile (0.39, the default): 1 cut, 2 chunks</text>
  <rect x="70" y="352" width="12" height="12" fill="#da97b6"/><text x="88" y="362" font-size="12" fill="#060e15">above the 75th only (0.25, amount=75): 3 cuts, 4 chunks</text>
  <text x="70" y="382" font-size="12" fill="#3b434b">Percentile thresholds are relative: each document is cut at its own top 5% (or 25%) of distances.</text>
</svg>
