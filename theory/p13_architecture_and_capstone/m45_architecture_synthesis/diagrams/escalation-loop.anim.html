<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     No figures: the outage example is named in words only, since its counts come from different labs (M24, M17).
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-escalation-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The escalation loop, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 300" role="img" aria-labelledby="anim-escalation-title anim-escalation-desc">
      <title id="anim-escalation-title">Start plain, add one rung at a time</title>
      <desc id="anim-escalation-desc">Plain RAG runs over a frozen golden set. If the results meet the requirement, it ships. If not, the failing stage is named, the cheapest rung that fixes that stage is added, and the golden set runs again. For the question “What happens if my server goes down?” the failing stage is retrieval, and dense retrieval fixes it with the same single model call.</desc>
      <defs>
        <marker id="ah-esc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1">
        <rect class="box" x="20" y="40" width="160" height="60"/>
        <text class="label" x="100" y="66">Plain RAG</text>
        <text class="small" x="100" y="86">1 retrieval, 1 call</text>
      </g>
      <path class="edge e-2 in-2" d="M180 70 H227" marker-end="url(#ah-esc)"/>
      <g class="n-2 in-2">
        <rect class="box" x="230" y="40" width="160" height="60"/>
        <text class="label" x="310" y="66">Run the</text>
        <text class="label" x="310" y="86">golden set</text>
      </g>
      <path class="edge e-3 in-3" d="M390 70 H437" marker-end="url(#ah-esc)"/>
      <g class="n-3 in-3">
        <path class="box" d="M510 30 L580 70 L510 110 L440 70 Z"/>
        <text class="small" x="510" y="66">Meets the</text>
        <text class="small" x="510" y="82">requirement?</text>
      </g>
      <path class="edge e-6 in-6" d="M580 70 H637" marker-end="url(#ah-esc)"/>
      <text class="small in-6" x="608" y="60">yes</text>
      <g class="n-6 in-6">
        <rect class="box" x="640" y="44" width="140" height="52"/>
        <text class="label" x="710" y="75">Ship it</text>
      </g>

      <path class="edge e-4 in-4" d="M510 110 V187" marker-end="url(#ah-esc)"/>
      <text class="small in-4" x="526" y="152">no</text>
      <g class="n-4 in-4">
        <rect class="box" x="420" y="190" width="180" height="60"/>
        <text class="label" x="510" y="216">Name the</text>
        <text class="label" x="510" y="236">failing stage</text>
      </g>
      <text class="fig in-4" x="510" y="276">retrieval: the words differ</text>
      <path class="edge e-5 in-5" d="M420 220 H353" marker-end="url(#ah-esc)"/>
      <g class="n-5 in-5">
        <rect class="box" x="170" y="190" width="180" height="60"/>
        <text class="label" x="260" y="216">Add the cheapest</text>
        <text class="label" x="260" y="236">rung that fixes it</text>
      </g>
      <text class="fig in-5" x="260" y="276">dense retrieval, still 1 call</text>
      <path class="edge e-5 in-5" d="M290 190 V103" marker-end="url(#ah-esc)"/>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-escalation-cap">
    <li><button type="button" data-tok="20,40">Plain RAG</button><span>Start with the M11 pipeline: one retrieval and one model call per question.</span></li>
    <li><button type="button" data-tok="230,40">Measure</button><span>Run the frozen golden set through it and record the row.</span></li>
    <li><button type="button" data-tok="440,70">Compare</button><span>Hold the row against the requirement: answer quality, latency and cost.</span></li>
    <li><button type="button" data-tok="420,190">Diagnose</button><span>If it falls short, name the stage. “What happens if my server goes down?” fails in retrieval, because the handbook says “outage”.</span></li>
    <li><button type="button" data-tok="170,190">Add one</button><span>Add the cheapest rung that fixes that stage. Dense retrieval finds both outage chunks in the M17 lab and still makes one call. Then measure again.</span></li>
    <li><button type="button" data-tok="640,44">Ship</button><span>When the row meets the requirement, ship it, and keep the golden set for the next change.</span></li>
  </ol>
</figure>
