<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     The run is the lab's high-risk refund with the guards on and no fault: 2 client calls, 8 checkpoints (steps -1 to 6), recorded with LangGraph 1.2.18.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-refund-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The refund run, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-refund-title anim-refund-desc">
      <title id="anim-refund-title">A refund that pauses for approval</title>
      <desc id="anim-refund-desc">The high-risk refund refund-99 runs triage, assess and notify, then human_gate calls interrupt() and the first call returns. A second call resumes it with the answer approve; human_gate runs again from its first line, then execute and done. The checkpointer saves 8 checkpoints, steps -1 to 6.</desc>
      <defs>
        <marker id="ah-refund" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <g class="n-1"><rect class="box" x="20" y="40" width="120" height="44"/><text class="label" x="80" y="59">Request</text><text class="small" x="80" y="76">refund-99</text></g>
      <path class="edge e-2" d="M140 62 H177" marker-end="url(#ah-refund)"/>
      <g class="n-2"><rect class="box" x="180" y="40" width="110" height="44"/><text class="label" x="235" y="67">triage</text></g>
      <path class="edge e-3" d="M290 62 H347" marker-end="url(#ah-refund)"/>
      <g class="n-3"><path class="box" d="M410 30 L470 62 L410 94 L350 62 Z"/><text class="small" x="410" y="59">assess</text><text class="small" x="410" y="76">risk?</text></g>
      <path class="edge dashed" d="M470 62 H527" marker-end="url(#ah-refund)"/>
      <text class="small" x="498" y="54">low</text>
      <path class="edge e-4" d="M410 94 V137" marker-end="url(#ah-refund)"/>
      <text class="small" x="430" y="122">high</text>
      <g class="n-4"><rect class="box" x="355" y="140" width="110" height="44"/><text class="label" x="410" y="167">notify</text></g>
      <path class="edge e-5" d="M465 162 H512" marker-end="url(#ah-refund)"/>
      <g class="n-5 n-6"><rect class="box" x="515" y="140" width="140" height="44"/><text class="label" x="585" y="159">human_gate</text><text class="small" x="585" y="176">interrupt()</text></g>
      <path class="edge e-7" d="M585 140 V87" marker-end="url(#ah-refund)"/>
      <text class="small" x="620" y="118">resume</text>
      <g class="n-7"><rect class="box" x="530" y="40" width="110" height="44"/><text class="label" x="585" y="67">execute</text></g>
      <path class="edge e-8" d="M640 62 H677" marker-end="url(#ah-refund)"/>
      <g class="n-8"><rect class="box" x="680" y="40" width="100" height="44"/><text class="label" x="730" y="67">done</text></g>

      <text class="small in-4" x="410" y="206">notice sent once</text>
      <text class="small in-5" x="600" y="206">call 1 returns __interrupt__</text>
      <text class="small in-7" x="585" y="26">refund applied</text>

      <text class="lane-label" x="16" y="244">Checkpointer, thread refund-99: step, then next node</text>
      <rect class="lane" x="8" y="252" width="784" height="92"/>
      <g class="in-1 n-1"><rect class="box" x="24" y="262" width="80" height="40"/><text class="fig" x="64" y="287">-1</text><text class="small" x="64" y="324">start</text></g>
      <g class="in-1 n-1"><rect class="box" x="120" y="262" width="80" height="40"/><text class="fig" x="160" y="287">0</text><text class="small" x="160" y="324">triage</text></g>
      <g class="in-2 n-2"><rect class="box" x="216" y="262" width="80" height="40"/><text class="fig" x="256" y="287">1</text><text class="small" x="256" y="324">assess</text></g>
      <g class="in-3 n-3"><rect class="box" x="312" y="262" width="80" height="40"/><text class="fig" x="352" y="287">2</text><text class="small" x="352" y="324">notify</text></g>
      <g class="in-4 n-4"><rect class="box" x="408" y="262" width="80" height="40"/><text class="fig" x="448" y="287">3</text><text class="small" x="448" y="324">gate</text></g>
      <g class="in-6 n-6"><rect class="box" x="504" y="262" width="80" height="40"/><text class="fig" x="544" y="287">4</text><text class="small" x="544" y="324">execute</text></g>
      <g class="in-7 n-7"><rect class="box" x="600" y="262" width="80" height="40"/><text class="fig" x="640" y="287">5</text><text class="small" x="640" y="324">done</text></g>
      <g class="in-8 n-8"><rect class="box" x="696" y="262" width="80" height="40"/><text class="fig" x="736" y="287">6</text><text class="small" x="736" y="324">end</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-refund-cap">
    <li><button type="button" data-tok="20,40">Invoke</button><span>Call 1 sends the request on thread refund-99. Two checkpoints are saved before any node runs: step -1, the input, and step 0.</span></li>
    <li><button type="button" data-tok="180,40">Triage</button><span>triage appends a line to <code>events</code>, and checkpoint step 1 records it.</span></li>
    <li><button type="button" data-tok="350,30">Assess</button><span>assess reads <code>risk=high</code> and routes to notify. Step 2.</span></li>
    <li><button type="button" data-tok="355,140">Notify</button><span>notify sends the approval request to the billing team. Step 3 names human_gate as the next node.</span></li>
    <li><button type="button" data-tok="515,140">Pause</button><span>human_gate calls <code>interrupt()</code>. Call 1 returns with <code>__interrupt__</code>, and the thread waits with no worker attached.</span></li>
    <li><button type="button" data-tok="515,140">Resume</button><span>Call 2 resumes the thread with the billing team’s answer, approve. human_gate runs again from its first line, and this time <code>interrupt()</code> returns that answer. Step 4.</span></li>
    <li><button type="button" data-tok="530,40">Execute</button><span>execute calls the payment provider and the refund is applied. Step 5.</span></li>
    <li><button type="button" data-tok="680,40">Done</button><span>done finishes the run: 8 checkpoints in all, steps -1 to 6.</span></li>
  </ol>
</figure>
