<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. The messages, route and answer are the M09 lab's run of the refund question with add_messages. -->
<figure class="anim sheet" aria-labelledby="anim-support-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The Larkspur support graph, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-support-title anim-support-desc">
      <title id="anim-support-title">The Larkspur support graph and its state</title>
      <desc id="anim-support-desc">The question enters the state. The classify node writes a route and a message, and add_messages appends the message. A conditional edge reads the route and sends the run to the billing node, which writes the structured answer and a second message. The graph ends and returns the state: three messages, route billing, answer from refund-timing.</desc>
      <defs>
        <marker id="ah-support" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Graph: nodes and edges</text>
      <rect class="lane" x="8" y="28" width="784" height="160"/>
      <text class="lane-label" x="16" y="214">State: messages uses add_messages</text>
      <rect class="lane" x="8" y="222" width="784" height="122"/>

      <!-- graph -->
      <g class="n-1"><rect class="box" x="24" y="86" width="116" height="44"/><text class="label" x="82" y="108">Question</text></g>
      <g class="n-2"><rect class="box" x="184" y="86" width="124" height="44"/><text class="label" x="246" y="108">classify</text></g>
      <g class="n-5"><rect class="box" x="400" y="40" width="124" height="36"/><text class="label" x="462" y="58">billing</text></g>
      <g><rect class="box" x="400" y="90" width="124" height="36"/><text class="label" x="462" y="108">technical</text></g>
      <g><rect class="box" x="400" y="140" width="124" height="36"/><text class="label" x="462" y="158">human</text></g>
      <g class="n-7"><rect class="box" x="620" y="90" width="100" height="36"/><text class="label" x="670" y="108">END</text></g>

      <path class="edge e-2" d="M140 108 H181" marker-end="url(#ah-support)"/>
      <path class="edge dashed e-4" d="M308 100 C352 100 356 58 397 58" marker-end="url(#ah-support)"/>
      <path class="edge dashed" d="M308 108 H397" marker-end="url(#ah-support)"/>
      <path class="edge dashed" d="M308 116 C352 116 356 158 397 158" marker-end="url(#ah-support)"/>
      <path class="edge e-7" d="M524 58 C576 58 578 100 617 100" marker-end="url(#ah-support)"/>
      <path class="edge" d="M524 108 H617" marker-end="url(#ah-support)"/>
      <path class="edge" d="M524 158 C576 158 578 116 617 116" marker-end="url(#ah-support)"/>
      <text class="small in-4" x="352" y="44">route = billing</text>
      <text class="small in-7" x="670" y="150">returns state</text>

      <!-- state -->
      <text class="small" x="66" y="254">messages</text>
      <text class="small" x="66" y="292">route</text>
      <text class="small" x="66" y="324">answer</text>
      <g class="in-1"><rect class="doc" x="122" y="240" width="214" height="28"/><text class="small" x="229" y="254">Human: When will my refund…</text></g>
      <g class="mv-3" style="--from: translate(-186px, -146px)"><rect class="doc" x="350" y="240" width="164" height="28"/><text class="small" x="432" y="254">AI: Route: billing</text></g>
      <g class="mv-6" style="--from: translate(-180px, -196px)"><rect class="doc" x="528" y="240" width="236" height="28"/><text class="small" x="646" y="254">AI: Answer: refund-timing</text></g>
      <text class="fig in-3" x="168" y="292">“billing”</text>
      <text class="fig in-6" x="300" y="324">{route: billing, source: refund-timing}</text>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-support-cap">
    <li><button type="button">Question</button><span>The input puts “When will my refund appear on my statement?” into messages.</span></li>
    <li><button type="button">Classify</button><span>The classify node reads the whole state and returns route and one new message.</span></li>
    <li><button type="button">Merge</button><span>route has no reducer, so it is set; add_messages appends the message. The state holds 2 messages.</span></li>
    <li><button type="button">Route</button><span>The conditional edge reads route and names the next node, billing.</span></li>
    <li><button type="button">Answer</button><span>The billing node answers from the handbook page refund-timing.</span></li>
    <li><button type="button">Append</button><span>Its answer key is set and its message appended: 3 messages, the question once.</span></li>
    <li><button type="button">Return</button><span>No edge leaves billing except the one to END, so the run returns the final state.</span></li>
  </ol>
</figure>
