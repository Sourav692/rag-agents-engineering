<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the steps in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-ragchain-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The LCEL RAG chain, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 320" role="img" aria-labelledby="anim-ragchain-title anim-ragchain-desc">
      <title id="anim-ragchain-title">The LCEL RAG chain</title>
      <desc id="anim-ragchain-desc">A question enters a dict that runs two branches at once: the retriever with format_docs, and a passthrough. Their outputs form one dict with context and question, which flows through the prompt, the chat model and the string parser to an answer string.</desc>
      <defs>
        <marker id="ah-ragchain" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="138" y="44">RunnableParallel, the dict</text>
      <rect class="lane" x="130" y="56" width="204" height="240"/>

      <!-- the question -->
      <g class="n-1"><rect class="box" x="10" y="154" width="96" height="44"/><text class="label" x="58" y="176">Question</text></g>
      <g class="in-1">
        <text class="small" x="58" y="218">How long does</text>
        <text class="small" x="58" y="234">a refund take?</text>
      </g>

      <!-- two branches, same input -->
      <path class="edge e-2" d="M106 176 C124 176 124 110 143 110" marker-end="url(#ah-ragchain)"/>
      <path class="edge e-2" d="M106 176 C124 176 124 242 143 242" marker-end="url(#ah-ragchain)"/>
      <g class="n-2">
        <rect class="box" x="146" y="84" width="172" height="52"/>
        <text class="label" x="232" y="102">retriever</text>
        <text class="small" x="232" y="122">| format_docs</text>
      </g>
      <g class="n-2"><rect class="box" x="146" y="216" width="172" height="52"/><text class="label" x="232" y="242">Passthrough</text></g>
      <g class="in-2">
        <rect class="hit" x="196" y="146" width="44" height="7"/><rect class="hit" x="244" y="146" width="24" height="7"/>
        <text class="small" x="232" y="170">chunks, joined</text>
        <text class="small" x="232" y="284">question, unchanged</text>
      </g>

      <!-- fan-in: one dict -->
      <path class="edge e-3" d="M318 110 C338 110 336 176 353 176" marker-end="url(#ah-ragchain)"/>
      <path class="edge e-3" d="M318 242 C338 242 336 176 353 176" marker-end="url(#ah-ragchain)"/>
      <g class="n-3"><rect class="box" x="356" y="154" width="92" height="44"/><text class="label" x="402" y="176">dict</text></g>
      <g class="in-3">
        <text class="small" x="402" y="218">context,</text>
        <text class="small" x="402" y="234">question</text>
      </g>

      <!-- the straight pipe -->
      <path class="edge e-4" d="M448 176 H469" marker-end="url(#ah-ragchain)"/>
      <g class="n-4"><rect class="box" x="472" y="154" width="86" height="44"/><text class="label" x="515" y="176">Prompt</text></g>
      <g class="in-4"><text class="small" x="515" y="218">ChatPromptValue</text></g>

      <path class="edge e-5" d="M558 176 H579" marker-end="url(#ah-ragchain)"/>
      <g class="n-5"><rect class="box" x="582" y="154" width="80" height="44"/><text class="label" x="622" y="176">Model</text></g>
      <g class="in-5"><text class="small" x="622" y="234">AIMessage</text></g>

      <path class="edge e-6" d="M662 176 H683" marker-end="url(#ah-ragchain)"/>
      <g class="n-6"><rect class="box" x="686" y="154" width="104" height="44"/><text class="label" x="738" y="176">Parser</text></g>
      <g class="in-6"><text class="small" x="722" y="218">str</text></g>

      <g class="in-7">
        <path class="edge e-7" d="M766 198 V243" marker-end="url(#ah-ragchain)"/>
        <rect class="doc" x="700" y="246" width="90" height="46"/>
        <path class="line" d="M710 258 H780"/>
        <path class="hit-line" d="M710 270 H772 M710 281 H756"/>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-ragchain-cap">
    <li><button type="button">Question</button><span>A customer asks “How long does a refund take?” The string is the chain’s only input.</span></li>
    <li><button type="button">Fan out</button><span>The dict runs both branches on the same string at once. The retriever finds handbook chunks and format_docs joins them into one string.</span></li>
    <li><button type="button">Merge</button><span>The two results come back as one dict with the keys context and question.</span></li>
    <li><button type="button">Prompt</button><span>The prompt fills its two variables and returns a ChatPromptValue.</span></li>
    <li><button type="button">Model</button><span>The chat model reads the messages and returns an AIMessage.</span></li>
    <li><button type="button">Parser</button><span>StrOutputParser takes the message text and returns a plain string.</span></li>
    <li><button type="button">Answer</button><span>The caller gets the answer string. The whole pipe is one Runnable, called with invoke.</span></li>
  </ol>
</figure>
