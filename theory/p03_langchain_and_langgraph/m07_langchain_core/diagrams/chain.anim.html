<!-- Animated version of the Mental model flowchart in ../README.md, used by index.html.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the stages in step with the Mermaid diagram.
     The reply and the error are the lab's: the "Clean JSON" and "Invented id" rows of 06_output_parsers/interactive/parser-bench-lab.html. -->
<figure class="anim sheet" aria-labelledby="anim-chain-cap">
  <div class="anim__canvas" tabindex="0" aria-label="One call through a prompt, model and parser chain, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 352" role="img" aria-labelledby="anim-chain-title anim-chain-desc">
      <title id="anim-chain-title">One call through prompt, model and parser</title>
      <desc id="anim-chain-desc">A dict with the refund question and three passages fills a prompt template, which produces system and human messages. A chat model returns an AIMessage holding JSON text and token counts. The output parser checks the JSON against the schema and returns an Answer citing refund-timing, or raises OutputParserException when a citation names no real passage.</desc>
      <defs>
        <marker id="ah-chain" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <text class="lane-label" x="16" y="20">Into the model: what you send</text>
      <rect class="lane" x="8" y="28" width="784" height="140"/>
      <text class="lane-label" x="16" y="196">Out of the model: what your code gets</text>
      <rect class="lane" x="8" y="204" width="784" height="140"/>

      <!-- into the model -->
      <g class="n-1"><rect class="box" x="40" y="48" width="170" height="44"/><text class="label" x="125" y="70">Variables</text></g>
      <g class="n-2"><rect class="box" x="315" y="48" width="170" height="44"/><text class="label" x="400" y="70">Prompt template</text></g>
      <g class="n-3"><rect class="box" x="590" y="48" width="170" height="44"/><text class="label" x="675" y="70">Chat model</text></g>
      <path class="edge e-2 in-2" d="M210 70 H312" marker-end="url(#ah-chain)"/>
      <path class="edge e-3 in-3" d="M485 70 H587" marker-end="url(#ah-chain)"/>

      <g class="in-1">
        <text class="small" x="125" y="118">question</text>
        <text class="small" x="125" y="140">3 passages</text>
      </g>
      <g class="in-2">
        <rect class="doc" x="345" y="106" width="110" height="20"/><text class="small" x="400" y="117">system</text>
        <rect class="doc" x="345" y="132" width="110" height="20"/><text class="small" x="400" y="143">human</text>
      </g>
      <g class="in-3">
        <text class="small" x="675" y="118">same call for</text>
        <text class="small" x="675" y="140">any provider</text>
      </g>

      <!-- out of the model -->
      <path class="edge e-4 in-4" d="M742 92 V221" marker-end="url(#ah-chain)"/>
      <g class="n-4"><rect class="box" x="590" y="224" width="170" height="44"/><text class="label" x="675" y="246">AIMessage</text></g>
      <g class="n-5"><rect class="box" x="315" y="224" width="170" height="44"/><text class="label" x="400" y="246">Output parser</text></g>
      <g class="n-6"><rect class="box" x="40" y="224" width="170" height="44"/><text class="label" x="125" y="246">Answer</text></g>
      <path class="edge e-5 in-5" d="M590 246 H488" marker-end="url(#ah-chain)"/>
      <path class="edge e-6 in-6" d="M315 246 H213" marker-end="url(#ah-chain)"/>

      <g class="in-4">
        <text class="fig" x="675" y="292">content: JSON text</text>
        <text class="fig" x="675" y="314">usage_metadata</text>
      </g>
      <g class="in-5">
        <text class="small" x="400" y="292">find the JSON,</text>
        <text class="small" x="400" y="314">then the schema</text>
      </g>
      <g class="in-6">
        <text class="fig" x="125" y="292">citations:</text>
        <text class="fig" x="125" y="314">refund-timing</text>
      </g>
      <path class="edge dashed e-7 in-7" d="M330 268 C305 318 250 330 170 330" marker-end="url(#ah-chain)"/>
      <g class="in-7">
        <text class="fig hit" x="120" y="334">or a raise</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-chain-cap">
    <li><button type="button">Variables</button><span>The chain is invoked with a dict: the refund question and three handbook passages.</span></li>
    <li><button type="button">Template</button><span>The prompt template fills its slots and returns a PromptValue holding a system message and a human message.</span></li>
    <li><button type="button">Model</button><span>The chat model sends the messages to its provider. Every chat model class takes the same input.</span></li>
    <li><button type="button">AIMessage</button><span>The reply comes back as an AIMessage: the text on .content, token counts on .usage_metadata.</span></li>
    <li><button type="button">Parser</button><span>The parser finds the JSON in the text, then validates it against the schema.</span></li>
    <li><button type="button">Answer</button><span>The lab’s clean reply becomes an Answer object that cites refund-timing.</span></li>
    <li><button type="button">Raise</button><span>A reply that cites handbook-p4, an id no passage has, raises OutputParserException under the Literal schema instead.</span></li>
  </ol>
</figure>
