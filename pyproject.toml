[project]
name = "rag-agents-engineering"
version = "0.1.0"
description = "RAG & Agents Engineering course generated from ai-engineering-demystified repos 01-06 and 08-10"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT (original content); see NOTICE.md for third-party notebooks" }
# Union of the four source repos' default dependencies. Where they disagreed, the looser
# bound wins so every group can resolve together (see "Dependency notes" in CLAUDE.md).
dependencies = [
    # LangChain / LangGraph runtime
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-experimental>=0.4.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-swarm>=0.1.0",
    "deepagents>=0.7.13",
    "langsmith>=0.12.1",
    # chat-model providers
    "langchain-openai>=1.6.0",
    "langchain-anthropic>=1.7.1",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.4.0",
    "langchain-aws>=1.7.5",
    "langchain-nebius>=0.1.3",
    "databricks-langchain>=0.20.0",
    "databricks-sdk>=0.135.0",
    "openai>=2.54.0",
    "groq>=0.37.1",
    "aied-helpers",
    # vector stores, retrieval, graphs
    "langchain-chroma>=1.1.0",
    "chromadb>=1.5.9",
    "langchain-postgres>=0.0.17",
    "langchain-neo4j>=0.11.0",
    "neo4j>=6.3.0",
    "faiss-cpu>=1.15.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.6.1",
    # tools and loaders
    "langchain-tavily>=0.2.18",
    "tavily-python>=0.8.1",
    "ddgs>=9.16",
    "wikipedia>=1.4.0",
    "arxiv>=4.0.1",
    "youtube-transcript-api>=1.2.4",
    "pypdf>=6.17.0",
    "pypdf2>=3.0.1",
    "pymupdf>=1.28.2",
    "docx2txt>=0.9",
    "jq>=1.8",
    "markitdown>=0.1.7",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "numexpr>=2.10",
    "mypy-extensions>=1.0",
    "textblob>=0.19.0",
    # foundations (repo 01): data, databases, web APIs
    "pymysql>=1.2.0",
    "mysql-connector-python>=26.7.0",
    "psycopg2-binary>=2.9.12",
    "flask>=3.1.3",
    "yfinance>=1.7.0",
    "aiohttp>=3.14.3",
    "huggingface-hub>=1.16.1",
    "langchain-huggingface>=1.2.2",
    # prompting (repo 02); repo 02 pins LangChain 0.3, see CLAUDE.md
    "google-generativeai>=0.8.6",
    "duckduckgo-search>=8.1.1",
    "opencv-python-headless>=4.10",
    "moviepy>=1.0.3,<2",  # notebook 02/04/02 imports moviepy.editor, removed in moviepy 2
    "gdown>=5.2",
    # agent protocols (repo 10); mcp, a2a-sdk and uvicorn are in the `protocols` group
    "httpx>=0.28.1",
    "anthropic>=1.3.0",
    # numerics
    "numpy>=2.5.2",
    "pandas>=2.2",  # 06/08 asked for >=3.0.5, but llama-index (llamaindex group) needs <3
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
    "matplotlib>=3.11.1",
    "tabulate>=0.9",
    # notebook utilities
    "cohere>=5.18",
    "deepeval>=4.2.1",
    "pydantic>=2.12.5",
    "typing-extensions>=4.16.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "nest-asyncio>=1.6.0",
    "rich>=14.3.4",
    "tqdm>=4.70.0",
    "colorama>=0.4.6",
    "graphviz>=0.20",
    "ipython>=9.17.1",
    "ipywidgets>=8.1",
    "jupyter-ui-poll>=1.0",
    "markdown>=3.7",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13", "pre-commit>=4.0", "nbstripout>=0.8", "jupyterlab>=4.2", "ipykernel>=6.29"]
# Local models (large download: torch): HF embeddings, cross-encoders, CLIP, MarianMT — M04, M09, M11, M27
hf = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
    "torch>=2.14.0",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
]
# Hugging Face media models, Gradio and fine-tuning (repo 01, M03-M04; torch)
hf-foundations = [
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "transformers>=5.16.1",
    "diffusers>=0.39.0",
    "accelerate>=1.14.0",
    "datasets>=4.0",
    "trl>=1.12.0",
    "gradio>=6.26.0",
    "librosa",
    "pyannote-audio",
    "pydub",
    "jsonlines>=4.0.0",
    "python-configuration",
    "lamini",
    # lamini 2.5 imports pkg_resources, which setuptools 82 removed
    "setuptools<82",
]
# ColPali page retrieval (M11 optional). byaldi pins transformers<5, so it cannot share an env with hf
colpali = ["byaldi>=0.0.7", "google-generativeai>=0.8.6"]
# Unstructured loaders and NLP splitters — M02, M03
document-parsing = ["unstructured[md,pdf,docx]>=0.27.5", "nltk>=3.9", "spacy>=3.8", "en-core-web-sm"]
# LlamaIndex — M03 optional, M12, M21 exercise
llamaindex = [
    "llama-index>=0.14",
    "llama-index-vector-stores-faiss>=0.5",
    "llama-index-readers-file>=0.5",
    "llama-index-retrievers-bm25>=0.5",
    "llama-index-readers-wikipedia>=0.3",
    "chainlit>=2.0",
]
# Managed services — platform-specific notebooks
vendors = [
    "langchain-pinecone>=0.2.13",
    "langchain-astradb>=1.0",
    "langchain-cohere>=0.5",
    "google-generativeai>=0.8.6",
    "jrag>=0.0.1",
    "contextual-client>=0.5",
]
databricks = ["databricks-vectorsearch>=0.75", "databricks-ai-search>=0.78", "mlflow>=3.16.0", "databricks-sql-connector>=4.5.0"]
apps = ["streamlit>=1.63.0", "validators>=0.35.0", "unstructured>=0.27.5"]
finance = ["openbb>=4.3.5", "openbb-cboe>=1.6.1"]
# Knowledge graphs and graph stores — M29, M30
graph = ["pymilvus>=2.5", "spacy>=3.8", "nltk>=3.9", "streamlit>=1.63.0", "en-core-web-sm"]
local-models = ["ollama>=0.4", "sentence-transformers>=6.0.1"]
msgraphrag = ["graphrag>=2.0"]
# ColBERT and RAGAS cells — M31
rag-ecosystem = ["ragatouille>=0.0.9", "ragas>=0.4.3", "datasets>=4.0"]
# Agent protocols (M38-M41): the MCP and A2A SDKs and the server they run on
protocols = ["mcp>=1.29.1", "a2a-sdk[http-server]>=0.3.0,<0.4", "uvicorn>=0.52.4"]
# MCP labs and applications (M38-M41)
mcp-labs = ["fastmcp>=3.4.7", "langchain-mcp-adapters>=0.3.2", "google-genai>=2.22.0", "google-adk>=2.7.0", "click>=8.1"]
mcp-apps = ["fastmcp>=3.4.7", "mcp-use>=1.3", "langchain-ollama>=1.0", "langchain-mcp-adapters>=0.3.2", "streamlit>=1.63.0"]

[tool.uv]
default-groups = ["dev"]
conflicts = [
    [{ group = "hf" }, { group = "colpali" }],
    [{ group = "hf-foundations" }, { group = "colpali" }],  # byaldi pins transformers<5
    # openbb (finance) pins old uvicorn/fastapi releases that the MCP and A2A stacks outgrew
    [{ group = "finance" }, { group = "protocols" }],
    [{ group = "finance" }, { group = "mcp-labs" }],
    [{ group = "finance" }, { group = "mcp-apps" }],
]

[tool.uv.sources]
aied-helpers = { git = "https://github.com/Sourav692/ai-engineering-demystified-shared.git", rev = "v0.1.0" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/helpers", "src/rag_techniques"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb", "course", "src/helpers", "src/rag_paths.py", "scripts/site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# long HTML and Markdown template lines
"scripts/build_curriculum.py" = ["E501"]
"scripts/build_docs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
