    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#3f3f46"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b" text-anchor="middle">
    <rect x="16" y="48" width="78" height="36" rx="18" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="55" y="71">START</text>
