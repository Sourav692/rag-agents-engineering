<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" role="img" aria-label="Current run: reviewer returns to writer once, then ends">
  <rect width="860" height="180" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#3f3f46"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b" text-anchor="middle">
    <rect x="16" y="36" width="78" height="36" rx="18" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="55" y="59">START</text>
    <rect x="160" y="36" width="120" height="36" rx="8" fill="#f4f4f5" stroke="#3f3f46"/>
    <text x="220" y="59">researcher</text>
    <rect x="360" y="36" width="90" height="36" rx="8" fill="#f4f4f5" stroke="#3f3f46"/>
    <text x="405" y="59">writer</text>
    <rect x="530" y="36" width="110" height="36" rx="8" fill="#f4f4f5" stroke="#3f3f46"/>
    <text x="585" y="59">reviewer</text>
    <rect x="740" y="36" width="78" height="36" rx="18" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="779" y="59">END</text>
  </g>
  <g fill="none" stroke="#3f3f46" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M 94 54 H 160"/>
    <path d="M 280 54 H 360"/>
    <path d="M 450 54 H 530"/>
    <path d="M 640 54 H 740"/>
    <path d="M 560 72 V 120 H 430 V 72"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b" text-anchor="middle">
    <text x="690" y="28">second visit</text>
    <text x="495" y="148">first visit</text>
  </g>
</svg>
