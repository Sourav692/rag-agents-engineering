  level: core
  hours: 6
  stages:
  - chunk
  sources:
  - 05:03_chunking
  why: The chunk is the unit of retrieval. Its size and boundaries decide what the retriever can find and how much noise reaches
    the model.
  objectives:
  - Apply character, recursive, token and structure-aware (Markdown, HTML, code) splitters
  - Chunk on meaning with embedding-distance breakpoints (semantic chunking)
  - Turn text into atomic, self-contained propositions and index those
  - Pick chunk size and overlap by measurement instead of by habit
  concepts:
  - Chunk size and overlap
  - Breakpoint threshold
  - Propositions
  - Structure-aware splitting
  lab: 'Chunking bake-off: index the same corpus with recursive, semantic and proposition chunking at three sizes each, and
    compare hit rate and answer faithfulness against the Module 1 baseline.'
