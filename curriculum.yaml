  level: core
  hours: 4
  stages:
  - post
  sources:
  - 05:09_post_retrieval_and_reranking
  why: Bi-encoders are fast but coarse. Retrieving wide and then reranking, compressing or expanding the context gives precision
    without losing recall.
  objectives:
  - 'Design two-stage retrieval: high-recall first stage, precise second stage'
  - Rerank with cross-encoders and with LLMs and compare cost and quality
  - Compress chunks to only the query-relevant sentences
  - Restore surrounding context with enrichment windows and relevant segment extraction
  concepts:
  - Bi-encoder vs cross-encoder
  - Recall@50 → precision@5
  - Lost in the middle
  - Context budget
  lab: 'Precision stack: add a cross-encoder reranker over a top-50 hybrid retrieval and measure the gain at top-5, plus the
    latency budget it consumes.'
