# Single source of truth for the course: parts, modules, lessons, and where every source file lands.
# scripts/migrate.py copies files from the source repos using `source` -> course/<part>/<module>/<folder>/<file>;
# scripts/build_curriculum.py renders CURRICULUM.md, module READMEs and the docs site from this file.
# source format: <repo key>:<path relative to that source repo's root>. tier: mandatory | alternate | platform | extension
course:
  title: RAG & Agents Engineering Curriculum
  subtitle: From your first retriever to agentic, memory-backed, multi-agent and graph-based RAG
  audience:
  - Software and ML engineers who build LLM applications and need retrieval that actually works
  - Data engineers moving into AI engineering who already know Python and SQL
  - Practitioners who have built a demo RAG app and want to understand why it fails and how to fix it
  prereqs:
  - Python 3.12, Jupyter notebooks, `.env` files and calling an LLM provider API
  - Prompt writing and structured output
  - 'LangChain basics: models, messages, prompt templates, output parsers and LCEL `|` composition'
  - LangGraph basics (state, nodes, conditional edges, checkpointers) before Part V; tool calling and the agent loop are taught
    in Part V
  outcomes:
  - Explain the RAG lifecycle and build a measured baseline before optimising anything
  - 'Engineer the ingestion pipeline: loaders, metadata, chunking, embeddings and vector stores'
  - Change what gets indexed (parent-document, multi-representation, HyPE, contextual headers, hierarchical)
  - Improve retrieval quality with hybrid search, fusion, query transformation and reranking
  - Ship complete RAG apps with sources, citations, structured data and images
  - Write the agent loop by hand, build ReAct agents, and apply the five workflow patterns plus planning and reflection
  - Build self-correcting RAG (grading, CRAG, Self-RAG, adaptive routing) as LangGraph graphs
  - Expose retrieval as an agent tool and make it reliable with checks and feedback loops
  - Add conversation, long-term and agentic memory, and coordinate retrieval across supervisor, swarm and research multi-agent
    systems
  - Build knowledge graphs in Neo4j and apply RAPTOR, LightRAG and GraphRAG
  - Pick an architecture for a given problem and defend the trade-offs
sources:
  '05':
    repo: ai-engineering-demystified-05-retrieval-rag
    topic: Retrieval & RAG
  '06':
    repo: ai-engineering-demystified-06-agent-fundamentals
    topic: Agent fundamentals
  08:
    repo: ai-engineering-demystified-08-advanced-agent-systems
    topic: Advanced agent systems
  09:
    repo: ai-engineering-demystified-09-advanced-rag
    topic: Advanced RAG
levels:
  foundation: Foundation
  core: Core
  advanced: Advanced
  expert: Expert
tiers:
  mandatory:
    label: Mandatory
    description: Needed for the lesson objective and the module lab
  alternate:
    label: Alternate
    description: Same idea taught again from another source course, or the same pattern in another API (e.g. LCEL instead
      of LangGraph)
  platform:
    label: Platform-specific
    description: 'Needs a particular vendor or extra infrastructure: Databricks, Astra DB, Postgres, Milvus, Contextual AI,
      ColPali GPU stack'
  extension:
    label: Extension
    description: Extra applied example, reference material or a niche variant; useful practice, not needed for the lab
stages:
  concepts: RAG concepts
  load: Load
  chunk: Chunk
  embed: Embed
  store: Store / Index
  query: Transform query
  retrieve: Retrieve
  post: Rerank & compress
  generate: Generate & cite
  agent: Grade · reflect · route
  graph: Trees & graphs
  memory: Memory & multi-agent
capstone_hours: 12
parts:
- id: found
  num: I
  title: RAG Foundations
  weeks: Week 1
  level: foundation
  summary: Why retrieval exists, the four stages of a pipeline, and a baseline you will measure every later change against.
  folder: p1_rag_foundations
- id: ingest
  num: II
  title: The Ingestion & Indexing Pipeline
  weeks: Weeks 2–3
  level: core
  summary: 'Everything that happens before a query arrives: loading, metadata, chunking, embedding, storing, and deciding
    what to index.'
  folder: p2_ingestion_and_indexing
- id: retrieval
  num: III
  title: Retrieval Quality Engineering
  weeks: Weeks 4–5
  level: core
  summary: 'Getting the right chunks into the top-k: hybrid search, fusion, query transformation, routing and reranking.'
  folder: p3_retrieval_quality
- id: apps
  num: IV
  title: Building Complete RAG Applications
  weeks: Week 6
  level: core
  summary: Assembling full systems with sources, citations, structured data and images, in LangChain and LlamaIndex.
  folder: p4_rag_applications
- id: agents
  num: V
  title: Agent Foundations for RAG
  weeks: Weeks 7–9
  level: core
  summary: The agent loop, tools, ReAct, the five workflow patterns, planning and reflection. Agentic RAG in Part VI is built
    from exactly these parts.
  folder: p5_agent_foundations
- id: agentic_rag
  num: VI
  title: Agentic & Self-Correcting RAG
  weeks: Weeks 10–11
  level: advanced
  summary: 'Retrieval that makes decisions: grade, rewrite, fall back to the web, reflect, route, and act as an agent tool.'
  folder: p6_agentic_rag
- id: memory
  num: VII
  title: Memory & Multi-Agent RAG
  weeks: Weeks 12–13
  level: advanced
  summary: Conversation and long-term memory as retrieval over the agent's own history, then supervisors, swarms and research
    teams that retrieve together.
  folder: p7_memory_and_multi_agent
- id: graph
  num: VIII
  title: Hierarchical, Memory & Graph RAG
  weeks: Weeks 14–15
  level: expert
  summary: 'Structural indexes for questions flat chunks cannot answer: summary trees, memory, knowledge graphs and GraphRAG.'
  folder: p8_hierarchical_and_graph_rag
- id: capstone
  num: IX
  title: Architecture Synthesis & Capstone
  weeks: Weeks 16–17
  level: expert
  summary: Compare every architecture side by side, choose one for a real problem, and ship it as a capstone.
  folder: p9_architecture_and_capstone
modules:
- num: 1
  key: lifecycle
  folder: m01_rag_lifecycle
  part: found
  title: Why RAG & the RAG Lifecycle
  level: foundation
  hours: 4
  stages:
  - concepts
  - load
  - embed
  - retrieve
  - generate
  sources:
  - 05:01_introduction_to_rag
  why: Before tuning anything you need a working pipeline and a number to beat. This module builds both, first by hand and
    then with LangChain.
  objectives:
  - 'Explain the knowledge problem RAG solves: stale training data, private data, hallucination, and context-window limits'
  - Compare RAG with fine-tuning and with simply using a long context window
  - Build an index from scratch so 'indexing' and 'nearest neighbour' are concrete
  - Run the full lifecycle (load → split → embed → store → retrieve → generate) and record baseline metrics
  concepts:
  - Parametric vs non-parametric knowledge
  - Indexing vs retrieval vs generation
  - Top-k
  - Baseline-first optimisation
  lab: 'Baseline pipeline: build the canonical lifecycle notebook end to end on the course corpus and save its retrieval and
    answer metrics. Every later module reports its improvement against this baseline.'
  lessons:
  - title: 'The knowledge problem: hallucination, freshness, context-window growth, RAG vs fine-tuning vs long context'
    items: []
  - title: Indexing from scratch with TF-IDF and nearest neighbours
    items:
    - source: 05:modules/01_introduction_to_rag/notebooks/01_indexing_from_scratch.ipynb
      tier: mandatory
      folder: notebooks
      file: 02a_indexing_from_scratch.ipynb
  - title: Semantic retrieval with embedding similarity
    items:
    - source: 05:modules/01_introduction_to_rag/notebooks/02_retrieval_strategies.ipynb
      tier: mandatory
      folder: notebooks
      file: 03a_retrieval_strategies.ipynb
  - title: Your first LangChain RAG with Chroma
    items:
    - source: 05:modules/01_introduction_to_rag/notebooks/03_langchain_rag_quickstart.ipynb
      tier: mandatory
      folder: notebooks
      file: 04a_langchain_rag_quickstart.ipynb
  - title: The RAG lifecycle and a measured baseline
    items:
    - source: 05:modules/01_introduction_to_rag/notebooks/04_rag_lifecycle_and_baseline.ipynb
      tier: mandatory
      folder: notebooks
