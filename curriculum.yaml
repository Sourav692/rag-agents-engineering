- num: 6
  key: indexing
  folder: m06_advanced_indexing
  part: ingest
  title: Advanced Indexing Strategies
  level: core
  hours: 5
  stages:
  - store
  - chunk
  sources:
  - 05:06_indexing_strategies
  - 05:10_building_rag_systems
  why: What you embed does not have to be what you return. Decoupling the search key from the payload fixes many precision
    and context problems.
  objectives:
  - Embed summaries but return full documents (multi-representation / multi-vector indexing)
  - Embed small child chunks but return their parent (parent-document retrieval), with a persistent docstore
  - Build two-tier hierarchical indices and search top-down
  - Generate hypothetical questions at index time (HyPE, document augmentation)
  - Prepend document context to chunks before embedding (contextual chunk headers, contextual retrieval)
  concepts:
  - Search key vs payload
  - Docstore
  - HyPE
  - Contextual retrieval
  lab: 'Index redesign: apply parent-document retrieval and contextual chunk headers to the baseline and report the change
    in hit rate and answer quality.'
  lessons:
  - title: 'Multi-representation indexing: search summaries, return documents'
    items:
