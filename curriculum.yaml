- num: 7
  key: hybrid
  folder: m07_retrievers_hybrid_search
  part: retrieval
  title: Retrievers & Hybrid Search
  level: core
  hours: 5
  stages:
  - retrieve
  sources:
  - 05:07_retrievers_and_hybrid_search
  why: Dense vectors miss exact terms such as IDs, names and codes; keyword search misses paraphrase. Production retrieval
    usually combines both.
  objectives:
  - 'Use the retriever interface: similarity, score threshold, MMR, multi-query, compression, ensemble'
  - Combine dense and sparse (BM25) retrieval and build a RAG chain on top
  - Fuse rankings with normalised scores and with Reciprocal Rank Fusion
  - Trade relevance against diversity with Maximal Marginal Relevance
  - Filter by metadata, similarity threshold, keywords and diversity together
  concepts:
  - Dense vs sparse
  - BM25
  - Reciprocal Rank Fusion
  - MMR λ
  lab: 'Hybrid upgrade: add BM25 to the vector retriever, tune the fusion weights on the golden set, and find three queries
    that only hybrid search answers.'
  lessons:
  - title: The retriever interface and its search modes
    items:
    - source: 05:modules/07_retrievers_and_hybrid_search/notebooks/01_retrievers.ipynb
      tier: mandatory
      folder: notebooks
      file: 01a_retrievers.ipynb
