capstones:
- title: Enterprise Knowledge Assistant
  level: core
  brief: A cited Q&A assistant over a company's PDFs, wiki pages and tables.
  requires:
  - Multi-source ingestion with a metadata schema (M2)
  - Measured chunking and embedding choice (M3, M4)
  - pgvector with incremental indexing (M5)
  - Hybrid retrieval and reranking (M7, M9)
  - Per-claim citations (M10)
  - CRAG fallback for out-of-corpus questions (M19)
- title: Customer-Support Routing Copilot
  level: advanced
  brief: An agent that routes tickets across department knowledge bases, remembers each customer, and escalates to humans.
  requires:
  - Query routing and self-query filters (M8, M20)
  - Graded retrieval with a rewrite loop (M18)
  - Conversation and long-term customer memory (M23, M24)
  - RAG exposed as agent tools with approval gates (M21, M17)
  - Hallucination checks and a feedback loop (M22)
- title: Multi-Agent Research Analyst
  level: advanced
  brief: A supervisor-led research team that plans, retrieves from private and web sources in parallel, and writes a cited
    report.
  requires:
  - Plan-and-execute with replanning (M16)
  - Orchestrator–worker decomposition (M15)
  - Supervisor with specialist RAG agents (M25)
  - Parallel retrieval and STORM-style perspectives (M26)
  - Edge-case testing and error handling (M27)
- title: Research GraphRAG Explorer
  level: expert
  brief: An assistant that answers multi-hop and whole-corpus questions over a research collection.
  requires:
  - arXiv and PDF ingestion including figures (M2, M11)
  - Neo4j knowledge graph built by LLM extraction (M29)
  - RAPTOR or Microsoft GraphRAG for global questions (M28, M30)
  - Adaptive routing between vector, graph and global search (M20)
  - Architecture decision record (M31)
assessment:
- component: Module labs
  weight: 40%
  detail: One lab per module, each reported as a change against the Module 1 baseline
- component: Part checkpoints
  weight: 20%
  detail: Short concept quiz plus a design question at the end of each Part
- component: Architecture review
  weight: 10%
  detail: The final module's design document, peer reviewed
- component: Capstone
  weight: 30%
  detail: Working system, evaluation report on a golden set, and a 10-minute demo
gaps:
- title: RAG evaluation
  status: Partial
  detail: The repos include `evaluation/evalute_rag.py` helpers, LlamaIndex faithfulness and relevancy evaluators (05/03/10)
    and RAGAS cells (09/11/01), but no dedicated module. Add retrieval metrics (hit rate, recall@k, MRR, nDCG), generation
    metrics (faithfulness, answer relevancy, context precision), golden-set building and LLM-as-judge. The repos point to
    the separate `Agent_Evaluation_Demystified` repository for this.
- title: Caching (CacheRAG)
  status: Planned
  detail: 'Module 09/12 exists as a placeholder: semantic caching and result reuse. Embedding caching is already covered in
    05/04/07.'
- title: Production RAG
  status: Missing here
  detail: Serving behind an API, streaming, tracing, latency budgets and cost control. The repos defer this to repository
    13 (production and observability).
- title: Security & governance
  status: Missing
  detail: Prompt injection carried in retrieved documents, document-level access control enforced through metadata filters,
    PII redaction at ingestion, and audit logging of sources.
- title: Vector index internals
  status: Missing
  detail: HNSW, IVF and product quantisation, the recall / latency / memory trade-off, and tuning parameters such as ef and
    nprobe. Fits as a lesson inside Module 5.
- title: Fine-tuning retrieval models
  status: Missing
  detail: Fine-tuning embedding models and rerankers on domain pairs, and synthetic query generation for training data. Fits
    after Module 9.
