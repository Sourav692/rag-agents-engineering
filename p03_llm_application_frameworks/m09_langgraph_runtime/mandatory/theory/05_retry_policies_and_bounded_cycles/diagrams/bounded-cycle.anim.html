<!-- Animated version of the Bounded cycles flowchart in ../README.md, used by index.html.
     The run is the 05b graph with max_iterations=3 and a validator that always fails, run with LangGraph 1.2.18:
     generate and validate three times each, then finalize, with 3 errors in state.
     Classes and data attributes: scripts/site/theory-anim.css. data-tok is where the run marker sits at each step. -->
<figure class="anim sheet" aria-labelledby="anim-cycle-cap">
  <div class="anim__canvas" tabindex="0" aria-label="The bounded cycle, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 320" role="img" aria-labelledby="anim-cycle-title anim-cycle-desc">
      <title id="anim-cycle-title">A loop with a cap</title>
      <desc id="anim-cycle-desc">generate sets iteration to 1, validate fails and appends an error, and the router sends the run back to generate. After the third failure iteration is 3, which reaches max_iterations, so the router goes to finalize with success still false and 3 errors in state.</desc>
      <defs>
        <marker id="ah-cycle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>
      </defs>

      <ellipse class="box" cx="66" cy="150" rx="46" ry="22"/>
      <text class="label" x="66" y="155">start</text>
      <path class="edge e-1" d="M112 150 H147" marker-end="url(#ah-cycle)"/>
      <g class="n-1 n-4 n-5"><rect class="box" x="150" y="128" width="140" height="44"/><text class="label" x="220" y="147">generate</text><text class="small" x="220" y="164">iteration + 1</text></g>
      <path class="edge e-2 e-4 e-5" d="M290 150 H337" marker-end="url(#ah-cycle)"/>
      <g class="n-2 n-4 n-5"><rect class="box" x="340" y="128" width="130" height="44"/><text class="label" x="405" y="155">validate</text></g>
      <path class="edge e-3 e-6" d="M470 150 H507" marker-end="url(#ah-cycle)"/>
      <g class="n-3 n-6"><path class="box" d="M580 106 L650 150 L580 194 L510 150 Z"/><text class="small" x="580" y="146">success, or</text><text class="small" x="580" y="162">iteration ≥ 3?</text></g>
      <path class="edge e-3" d="M580 106 V56 H220 V125" marker-end="url(#ah-cycle)"/>
      <text class="small" x="400" y="46">no: back to generate</text>
      <path class="edge e-6" d="M650 150 H687" marker-end="url(#ah-cycle)"/>
      <text class="small" x="668" y="140">yes</text>
      <g class="n-6"><rect class="box" x="690" y="128" width="100" height="44"/><text class="label" x="740" y="155">finalize</text></g>

      <text class="lane-label" x="16" y="226">State after each validate</text>
      <rect class="lane" x="8" y="234" width="784" height="76"/>
      <g class="in-2"><rect class="box" x="40" y="248" width="200" height="48"/><text class="fig" x="140" y="268">iteration 1</text><text class="small" x="140" y="287">1 error, success false</text></g>
      <g class="in-4"><rect class="box" x="300" y="248" width="200" height="48"/><text class="fig" x="400" y="268">iteration 2</text><text class="small" x="400" y="287">2 errors, success false</text></g>
      <g class="in-5"><rect class="box" x="560" y="248" width="200" height="48"/><text class="fig" x="660" y="268">iteration 3</text><text class="small" x="660" y="287">3 errors, success false</text></g>

      <circle class="tok" cx="0" cy="0" r="7"/>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-cycle-cap">
    <li><button type="button" data-tok="150,128">Generate</button><span>generate writes the first attempt and returns iteration 1. The counter lives in a node, so the update is kept.</span></li>
    <li><button type="button" data-tok="340,128">Validate</button><span>The tests fail. The <code>operator.add</code> reducer appends the first error.</span></li>
    <li><button type="button" data-tok="510,106">Route back</button><span>The router reads success false and iteration 1, below the cap of 3, and sends the run back to generate.</span></li>
    <li><button type="button" data-tok="150,128">Attempt 2</button><span>generate fixes the code from the latest error, iteration becomes 2, and validate fails again.</span></li>
    <li><button type="button" data-tok="340,128">Attempt 3</button><span>A third attempt and a third failure. Iteration is now 3.</span></li>
    <li><button type="button" data-tok="690,128">Cap</button><span>Iteration 3 reaches the cap, so the router goes to finalize: 7 node runs, 3 errors, and success still false for the caller to handle.</span></li>
  </ol>
</figure>
