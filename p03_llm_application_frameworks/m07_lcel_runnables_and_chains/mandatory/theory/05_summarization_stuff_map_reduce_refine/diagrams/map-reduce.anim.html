<!-- Animated version of the map-reduce flowchart in ../README.md, used by index.html.
     Numbers from the lab: the whole handbook (2,746 characters) at chunk_size=400 and max_concurrency=4.
     Classes and data attributes: scripts/site/theory-anim.css. Keep the steps in step with the Mermaid diagram. -->
<figure class="anim sheet" aria-labelledby="anim-mapreduce-cap">
  <div class="anim__canvas" tabindex="0" aria-label="Map-reduce summarisation, scrolls sideways on a narrow screen">
    <svg viewBox="0 0 800 320" role="img" aria-labelledby="anim-mapreduce-title anim-mapreduce-desc">
      <title id="anim-mapreduce-title">Map-reduce summarisation</title>
      <desc id="anim-mapreduce-desc">The 2,746-character handbook splits into 10 chunks. With max_concurrency 4 the map step summarises them in three rounds of 4, 4 and 2 calls. One reduce call combines the 10 summaries into the final summary: 11 calls in 4 rounds.</desc>
      <defs>
        <marker id="ah-mapreduce" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker>

      <g class="n-1">
        <rect class="box" x="16" y="128" width="110" height="56"/>
        <text class="label" x="71" y="148">Handbook</text>
        <text class="fig" x="71" y="170">2,746 chars</text>
      </g>

      <path class="edge e-2" d="M126 156 H155" marker-end="url(#ah-mapreduce)"/>
      <g class="in-2">
        <rect class="chunk" x="160" y="40" width="40" height="14"/>

        <rect class="chunk" x="160" y="208" width="40" height="14"/>
        <rect class="chunk" x="160" y="232" width="40" height="14"/>
        <rect class="chunk" x="160" y="256" width="40" height="14"/>
        <text class="small" x="180" y="290">10 chunks</text>
      </g>
      <g class="in-3"><rect class="hit" x="160" y="40" width="40" height="14"/><rect class="hit" x="160" y="64" width="40" height="14"/><rect class="hit" x="160" y="88" width="40" height="14"/><rect class="hit" x="160" y="112" width="40" height="14"/></g>
      <g class="in-4"><rect class="hit" x="160" y="136" width="40" height="14"/><rect class="hit" x="160" y="160" width="40" height="14"/><rect class="hit" x="160" y="184" width="40" height="14"/><rect class="hit" x="160" y="208" width="40" height="14"/></g>
      <g class="in-5"><rect class="hit" x="160" y="232" width="40" height="14"/><rect class="hit" x="160" y="256" width="40" height="14"/></g>

      <text class="lane-label" x="258" y="44">Round 1</text>
      <g class="in-3 n-3">
        <rect class="box" x="250" y="60" width="90" height="34"/><text class="fig" x="295" y="77">map 1</text>
        <rect class="box" x="250" y="112" width="90" height="34"/><text class="fig" x="295" y="129">map 2</text>
        <rect class="box" x="250" y="164" width="90" height="34"/><text class="fig" x="295" y="181">map 3</text>
        <rect class="box" x="250" y="216" width="90" height="34"/><text class="fig" x="295" y="233">map 4</text>
      </g>
      <text class="lane-label" x="378" y="44">Round 2</text>
      <g class="in-4 n-4">
        <rect class="box" x="370" y="60" width="90" height="34"/><text class="fig" x="415" y="77">map 5</text>
        <rect class="box" x="370" y="112" width="90" height="34"/><text class="fig" x="415" y="129">map 6</text>
        <rect class="box" x="370" y="164" width="90" height="34"/><text class="fig" x="415" y="181">map 7</text>

        <rect class="box" x="490" y="60" width="90" height="34"/><text class="fig" x="535" y="77">map 9</text>
        <rect class="box" x="490" y="112" width="90" height="34"/><text class="fig" x="535" y="129">map 10</text>
      </g>
      <text class="small" x="415" y="290">max_concurrency = 4, so four map calls per round</text>

      <path class="edge e-6" d="M592 60 V250"/>
      <path class="edge e-6" d="M592 156 H617" marker-end="url(#ah-mapreduce)"/>
      <g class="n-6">
        <rect class="box" x="620" y="128" width="90" height="56"/>

        <rect class="doc" x="732" y="128" width="60" height="56"/>
        <path class="line" d="M740 142 H784"/>
        <path class="hit-line" d="M740 156 H780 M740 170 H770"/>
        <text class="small" x="762" y="204">summary</text>
      </g>
    </svg>
  </div>
  <div class="anim__controls" hidden>
    <button class="anim__btn" type="button" data-act="prev">Previous</button>
    <button class="anim__btn" type="button" data-act="play" aria-pressed="false">Play</button>
    <button class="anim__btn" type="button" data-act="next">Next</button>
  </div>
  <ol class="anim__steps" id="anim-mapreduce-cap">
    <li><button type="button">Document</button><span>The whole Larkspur handbook, 2,746 characters, is too long for the lab’s 1,500-character limit.</span></li>
    <li><button type="button">Split</button><span>RecursiveCharacterTextSplitter with chunk_size=400 and chunk_overlap=20 cuts it into 10 chunks.</span></li>
    <li><button type="button">Round 1</button><span>map_chain.batch() starts the first four map calls at once.</span></li>
    <li><button type="button">Round 2</button><span>When a slot frees, the next four chunks go out.</span></li>
    <li><button type="button">Round 3</button><span>The last two chunks run. Ten map calls took three waits on the model.</span></li>
    <li><button type="button">Reduce</button><span>One more call reads the ten summaries joined together.</span></li>
    <li><button type="button">Summary</button><span>Eleven calls in four rounds. Refine would need ten rounds, one per chunk.</span></li>
  </ol>
</figure>
