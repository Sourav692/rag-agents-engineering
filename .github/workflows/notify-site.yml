name: Notify site

# Tells forwarddeployedprep.com that main moved, so its course-sync.yml re-imports the course at once
# instead of at its next hourly run. Needs SITE_DISPATCH_TOKEN: a fine-grained token with
# Contents read and write on Sourav692/Forward-Deployed-Engineer-Interview-Prep. Without it this
# job is skipped and the hourly run still publishes.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send course-updated
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; the site picks this up on its hourly run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Sourav692/Forward-Deployed-Engineer-Interview-Prep/dispatches \
            -d '{"event_type":"course-updated"}'
