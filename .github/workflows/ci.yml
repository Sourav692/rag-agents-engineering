name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The checks only need PyYAML and pytest; the full course environment is not installed here.
      - name: Offline tests
        run: uv run --no-project --with pyyaml --with markdown --with pytest pytest -q
      - name: Generated files are up to date
        run: |
          uv run --no-project --with pyyaml --with markdown python scripts/build_curriculum.py
          git diff --exit-code -- CURRICULUM.md NOTICE.md course capstones docs/site docs/agentic-architecture-coverage.md docs/combined-repo.md theory/README.md 'theory/**/index.html'
