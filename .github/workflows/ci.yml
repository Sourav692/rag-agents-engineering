name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The checks need PyYAML and pytest, plus scikit-learn, langchain-text-splitters and nbformat for
      # src/lab_kit.py and the lab tests; the full course environment is not installed here.
      - name: Offline tests
        run: uv run --no-project --with pyyaml --with markdown --with pytest --with scikit-learn --with langchain-text-splitters --with nbformat pytest -q
      - name: Generated files are up to date
        run: |
          uv run --no-project --with pyyaml --with markdown python scripts/build_curriculum.py
          # every generated file (part and module READMEs, index.html pages, THEORY.md, docs) is committed and current
          git diff --exit-code
          test -z "$(git status --porcelain)"
